<script>var C={"META": {"loesungswort": "PROBEN", "id": "mpg_c11_praktikum_lmnachweise_v1", "kapitel": "Praktikum", "titel": "Lebensmittelnachweise", "untertitel": "Alltagslebensmittel", "rahmen": "Prüflabor Lebensmittel · Praktikumstag", "stand": "Oktober 2026", "fassung": "visuell", "datei": "Praktikum_Lebensmittelnachweise_App", "scorm_titel": "Praktikum Lebensmittelnachweise", "zirkel": ["s2", "s3", "s4", "s5"], "ton": true, "labels": {"introGo": "Praktikum starten", "karte": "Laborplan", "zirkelHint": "<b>Lernzirkel:</b> Nach dem Laborbriefing (Station 1) sind die Versuchsstationen 2–5 gleichzeitig frei. Starte dort, wo deine Lehrkraft dich einteilt, und arbeite danach die übrigen in beliebiger Reihenfolge ab. Station 6 öffnet sich, sobald alle Versuchsstationen geschafft sind."}, "badges": {"ziel": {"name": "Prüfbericht fertig", "desc": "Alle Stationen des Praktikumstags abgeschlossen"}, "adler": {"name": "Sicherheitsprofi", "desc": "Den Laborplatz ohne Fehlgriff überprüft"}, "schloss": {"name": "Schlossknacker", "desc": "Ein Codeschloss im Prüflabor geöffnet"}}}, "INTRO": {"scene": "fig_sc_annahme", "title": "Praktikumstag im Prüflabor", "story": "Beim Prüflabor Lebensmittel ist eine Anfrage der Verbraucherberatung eingegangen. Eine Familie hat drei Fragen zu Lebensmitteln aus ihrem Einkaufskorb: Woher hat die vegetarische Wurst ihre rosa „Fleischfarbe“? Wie viel Nitrit steckt in der gepökelten Wurst? Wie sauer ist das gefüllte Fruchtbonbon – und welche Zucker und wie viel Vitamin C stecken darin? Heute bist du Praktikantin bzw. Praktikant im Labor. Du untersuchst drei Proben mit vier Versuchen und schreibst am Ende den Prüfbericht. Die Versuche führst du <b>wirklich durch</b> – die App leitet dich Schritt für Schritt, dein Arbeitsblatt ist dein Laborprotokoll.", "hinweis": "Bei jeder Übung gilt: 1. Versuch 10 Punkte, 2. Versuch 6 Punkte, danach 3 Punkte. Nach zwei Fehlversuchen kannst du dir die Lösung zeigen lassen (0 Punkte). Nach jeder Station wartet eine freiwillige <b>Bonus-Runde</b> mit Sternen; deine <b>Abzeichen</b> findest du oben beim Pokal.", "anim": {"fig": "fig_intro", "title": "Alltagslebensmittel", "kicker": "Praktikum · Prüflabor Lebensmittel", "textAt": 3.6, "sounds": [[0.4, "click"], [0.9, "click"], [1.4, "click"], [2.4, "flip"], [3.2, "stamp"]]}}, "STATIONS": [{"id": "s1", "nr": 1, "ort": "Probenannahme", "title": "Laborbriefing", "icon": "door", "min": 12, "stempel": "P", "scene": "fig_sc_annahme", "story": "Die Laborleiterin begrüßt dich bei der Probenannahme: „Bevor du an die Proben darfst, klären wir drei Dinge: Wie erkennt man, ob ein Nachweis überhaupt funktioniert? Mit welchen Gefahrstoffen arbeitest du? Und wie sieht ein sicherer Laborplatz aus?“ Zum Schluss bereitest du die Bonbon-Probe vor – du brauchst sie an zwei Stationen.", "blocks": [{"t": "info", "title": "Drei Proben, vier Versuche", "fig": "fig_proben", "lead": "Jede Probe wird in <b>zwei</b> Versuchen untersucht. So braucht das Labor nur drei Lebensmittel.", "text": ["Der <b>Nachweis</b> eines Stoffes gelingt mit einer <b>Nachweisreaktion</b>: Der gesuchte Stoff verrät sich durch ein sichtbares Zeichen, z. B. eine Farbänderung oder einen Niederschlag. Ein <b>Schnelltest</b> (Teststreifen) zeigt zusätzlich ungefähr, <b>wie viel</b> enthalten ist (halbquantitativ)."]}, {"t": "info", "title": "Blindproben: Funktioniert der Nachweis?", "fig": "fig_blindprobe", "lead": "Bevor man einer Beobachtung traut, prüft man das Nachweisverfahren mit <b>Blindproben</b>.", "text": ["<b>Positive Blindprobe:</b> Man führt den Nachweis mit einer Probe durch, die den gesuchten Stoff <b>sicher enthält</b>. Es muss das typische Nachweis-Zeichen auftreten – sonst funktioniert die Nachweisreaktion nicht (z. B. altes Reagenz).", "<b>Negative Blindprobe:</b> Man führt den Nachweis mit einer Probe durch, die den gesuchten Stoff <b>sicher nicht enthält</b>, meist destilliertes Wasser. Das Nachweis-Zeichen darf <b>nicht</b> auftreten – sonst sind Reagenz oder Gefäße verunreinigt oder das Zeichen wird durch etwas anderes ausgelöst.", "Beispiele für Stoffe, die bekanntlich enthalten sind: <b>Rotkohlsaft</b> enthält Anthocyan-Farbstoffe, <b>Glucose-Lösung</b> gibt die Fehling-Probe, <b>Natriumnitrit-Lösung</b> enthält Nitrit-Ionen."]}, {"t": "ex", "id": "1a", "type": "sort", "op": "Ordne", "task": "Ordne jeden Ansatz der positiven oder der negativen Blindprobe zu.", "bins": [{"id": "pos", "label": "positive Blindprobe"}, {"id": "neg", "label": "negative Blindprobe"}], "items": [{"id": "a", "label": "Fehling-Probe mit Glucose-Lösung", "bin": "pos"}, {"id": "b", "label": "Fehling-Probe mit destilliertem Wasser", "bin": "neg"}, {"id": "c", "label": "Rotkohlsaft mit Salzsäure und mit Natronlauge", "bin": "pos"}, {"id": "d", "label": "destilliertes Wasser mit Salzsäure und mit Natronlauge", "bin": "neg"}, {"id": "e", "label": "Nitrit-Teststreifen in Natriumnitrit-Lösung", "bin": "pos"}, {"id": "f", "label": "Nitrit-Teststreifen in destilliertem Wasser", "bin": "neg"}]}, {"t": "ex", "id": "1b", "type": "mc", "multi": false, "op": "Erkläre", "task": "Bei der Fehling-Probe färbt sich auch die negative Blindprobe mit destilliertem Wasser rotbraun. Erkläre, was daraus folgt.", "options": [{"text": "Reagenz oder Gefäße sind verunreinigt – Beobachtungen an den Lebensmittelproben sind so nicht aussagekräftig.", "ok": true, "fb": "Richtig: Die negative Blindprobe darf kein Nachweis-Zeichen zeigen. Erst sauber wiederholen, dann die Proben deuten."}, {"text": "Destilliertes Wasser enthält Glucose.", "ok": false, "fb": "Destilliertes Wasser ist gerade deshalb die negative Blindprobe, weil es den gesuchten Stoff sicher nicht enthält."}, {"text": "Die Nachweisreaktion funktioniert besonders gut.", "ok": false, "fb": "Ob sie funktioniert, zeigt die positive Blindprobe. Die negative Blindprobe prüft, ob das Zeichen ohne den Stoff auftritt."}, {"text": "Alle Lebensmittelproben enthalten Glucose.", "ok": false, "fb": "Wenn schon Wasser das Zeichen zeigt, lässt sich über die Proben nichts sagen."}]}, {"t": "info", "title": "Gefahrstoffe im Praktikum", "stoffe": ["hcl", "naoh", "feh1", "feh2"], "showGhs": false, "showP": true, "legend": true, "lead": "Glucose, Fructose, Saccharose, Ascorbinsäure und die Teststreifen sind nicht als Gefahrstoffe eingestuft. Für die vier Lösungen gilt:", "text": []}, {"t": "ex", "id": "1c", "type": "matrix", "op": "Ordne", "task": "Ordne den vier Lösungen mithilfe der H-Sätze und der Legende alle passenden Gefahrenpiktogramme zu.", "cols": ["GHS05", "GHS07", "GHS09"], "rows": [{"label": "Salzsäure (c = 1 mol/L)", "sol": ["GHS05"]}, {"label": "Natronlauge (c = 1 mol/L)", "sol": ["GHS05"]}, {"label": "Fehling-Lösung I", "sol": ["GHS09"]}, {"label": "Fehling-Lösung II", "sol": ["GHS05"]}]}, {"t": "info", "title": "Laborregeln für den Praktikumstag", "fig": "fig_regeln", "lead": "Lebensmittel sind im Labor <b>Proben</b> – keine Pausensnacks.", "text": ["<b>Schutzbrille</b> tragen, solange an einem Platz experimentiert wird; beim Umgang mit Natronlauge und Fehling-Lösung II zusätzlich <b>Schutzhandschuhe</b>. Im Labor wird <b>nichts gegessen, getrunken oder probiert</b> – auch nicht die Lebensmittelproben.", "Jedes Gefäß wird <b>beschriftet</b>, Chemikalienflaschen sofort wieder <b>verschließen</b>. <b>Brennbares</b> (Papier, Küchentücher) hält Abstand zu jeder Flamme, auch zum Teelicht; lange Haare zusammenbinden, Teelicht nach Gebrauch löschen.", "Das <b>Tablet</b> liegt außerhalb des Arbeitsbereichs, nie neben Tropfflaschen oder offenen Lösungen. Reste kommen in die angegebenen <b>Entsorgungsgefäße</b>."]}, {"t": "ex", "id": "1d", "type": "hunt", "op": "Ermittle", "task": "Bevor es losgeht, kontrollierst du einen Gruppenplatz. Ermittle die <b>vier Verstöße gegen die Laborregeln</b> und tippe sie im Bild an.", "fig": "fig_wb_platz", "hint": "Denk an die Laborregeln. Ein Fehlgriff kostet Punkte – überlege erst, dann tippe.", "targets": [{"id": "snack", "x": 468, "y": 263, "r": 34, "label": "Angebissenes Wurststück neben den Proben", "fb": "Im Labor wird nichts gegessen – auch keine Probe."}, {"id": "tab", "x": 588, "y": 252, "r": 38, "label": "Tablet direkt neben den Tropfflaschen", "fb": "Das Tablet gehört außerhalb des Arbeitsbereichs."}, {"id": "offen", "x": 312, "y": 236, "r": 30, "label": "Offene Natronlauge-Flasche, Deckel daneben", "fb": "Chemikalienflaschen sofort wieder verschließen."}, {"id": "papier", "x": 170, "y": 247, "r": 32, "label": "Küchentücher direkt am brennenden Teelicht", "fb": "Brennbares hält Abstand zur Flamme."}], "decoys": [{"x": 92, "y": 110, "r": 44, "label": "Schutzbrillen am Haken", "fb": "Schutzbrillen bereit zum Aufsetzen – in Ordnung."}, {"x": 386, "y": 240, "r": 28, "label": "Beschriftetes Becherglas „Bonbon“", "fb": "Beschriftet – genau so soll es sein."}, {"x": 652, "y": 330, "r": 40, "label": "Entsorgungsgefäß „Fehling-Reste“", "fb": "Fehling-Reste gehören in dieses Gefäß – richtig."}, {"x": 640, "y": 100, "r": 40, "label": "Augendusche", "fb": "Die Augendusche gehört an die Wand."}, {"x": 240, "y": 240, "r": 26, "label": "Geschlossene Salzsäure-Flasche", "fb": "Verschlossen und beschriftet – in Ordnung."}], "doneMsg": "Alle vier Verstöße gefunden – der Platz ist bereit!"}, {"t": "info", "title": "Im Labor: Bonbon-Lösung vorbereiten", "fig": "fig_bonbonloesung", "lead": "Die Bonbon-Lösung brauchst du an den Stationen 4 und 5. Stelle sie jetzt her und notiere die Masse im Protokoll.", "text": ["1. Ein Bonbon auspacken, auf der Waage wiegen und die Masse notieren. 2. Das Bonbon im Mörser mit dem Pistill zerkleinern. 3. <b>20 mL destilliertes Wasser</b> mit dem Messzylinder abmessen und die Stücke darin im Becherglas unter Umrühren lösen. 4. Das Becherglas mit „Bonbon-Lösung“ und dem Gruppennamen beschriften."]}, {"t": "merke", "title": "Merke", "bullets": ["Eine <b>Nachweisreaktion</b> macht einen Stoff durch ein sichtbares Zeichen erkennbar; <b>Teststreifen</b> zeigen zusätzlich ungefähr die Menge (halbquantitativ).", "<b>Positive Blindprobe</b> (Stoff sicher enthalten): Das Zeichen muss auftreten. <b>Negative Blindprobe</b> (Stoff sicher nicht enthalten, z. B. dest. Wasser): Das Zeichen darf nicht auftreten.", "Natronlauge (c = 1 mol/L) und Fehling-Lösung II sind ätzend (GHS05): Schutzbrille und Handschuhe, bei Hautkontakt sofort mit Wasser abspülen. Fehling-Lösung I ist umweltgefährlich (GHS09): Reste ins Entsorgungsgefäß.", "Im Labor wird nichts gegessen – auch keine Lebensmittelprobe."]}, {"t": "game", "id": "1g", "kind": "memory", "title": "Memory: Briefing", "lead": "Ordne die Karten paarweise zu.", "pairs": [["Fehling-Probe mit Glucose", "positive Blind­probe"], ["Fehling-Probe mit dest. Wasser", "negative Blind­probe"], ["GHS05", "Ätz­wirkung (Haut, Augen, Metalle)"], ["GHS07", "Reizung, gesundheits­schädlich"], ["GHS09", "giftig für Wasser­organismen"], ["Teststreifen", "halb­quantitativ"]]}]}, {"id": "s2", "nr": 2, "ort": "Farbstofflabor", "title": "Woher kommt die Fleischfarbe?", "icon": "eye", "min": 17, "stempel": "R", "scene": "fig_sc_farbe", "story": "Die vegetarische Wurst ist rosa wie Fleischwurst – aber ohne Fleisch. In manchen Ersatzprodukten erzeugen pflanzliche <b>Anthocyan-Farbstoffe</b> wie <b>Cyanidin</b> die „Fleischfarbe“. Ob das auch für eure Probe gilt, findest du mit Salzsäure und Natronlauge heraus. Die Farbe der Fleischwurst stammt dagegen vom roten Muskelfarbstoff des Fleisches, nicht von Anthocyanen – sie dient im Versuch als <b>Vergleichsprobe</b>.", "blocks": [{"t": "info", "title": "Cyanidin – ein Farbstoff mit Indikator-Eigenschaften", "fig": "fig_cyanidin", "lead": "Farbstoffe absorbieren bestimmte Wellenlängen des Lichts; wir sehen die <b>Komplementärfarbe</b>. Welches Licht absorbiert wird, hängt von der <b>Struktur der Farbstoff-Moleküle</b> ab.", "text": ["In stark saurer Lösung liegt Cyanidin als <b>Kation</b> vor (Abbildung). Steigt der pH-Wert, geben die Teilchen nacheinander <b>Protonen ab</b>; sinkt er, <b>nehmen sie Protonen wieder auf</b>. Mit jeder Protonenabgabe ändert sich die Struktur – und damit die Farbe: <b>rot</b> (stark sauer) → <b>violett</b> (neutral) → <b>blau</b> (schwach basisch) → <b>grün bis gelb</b> (stark basisch). Teilchen, die je nach Lösung Protonen abgeben oder aufnehmen können, nennt man <b>Ampholyte</b>; Farbstoffe, deren Farbe vom pH-Wert abhängt, heißen <b>Säure-Base-Indikatoren</b>.", "Die Abbildung zeigt außerdem: Das Teilchen trägt <b>viele Hydroxy-Gruppen</b> und ein Sauerstoff-Atom im Ring – polare Molekülteile, die mit Wasser-Molekülen Wasserstoffbrücken bilden können.", "<b>Achtung:</b> Viele vegetarische Würste sind mit Rote-Bete-Farbstoff (Betanin) gefärbt. Er ist <b>kein Anthocyan</b>: Mit Salzsäure bleibt er rot, mit Natronlauge wird er ohne Grünstufe gelb bis braun. Anthocyane dagegen werden mit Natronlauge zunächst blau bis grün, erst bei viel Lauge gelb – <b>entscheidend ist die Grünfärbung</b>."]}, {"t": "ex", "id": "2a", "type": "sort", "op": "Ordne", "task": "Beim Erklären trennt man Stoff- und Teilchenebene. Ordne jede Aussage der richtigen Ebene zu.", "bins": [{"id": "st", "label": "Stoffebene (beobachtbar)"}, {"id": "te", "label": "Teilchenebene (Erklärung)"}], "items": [{"id": "a", "label": "Cyanidin färbt saure Lösungen rot und stark basische grün bis gelb.", "bin": "st"}, {"id": "b", "label": "Cyanidin löst sich gut in Wasser.", "bin": "st"}, {"id": "c", "label": "Cyanidin-Teilchen nehmen Protonen auf oder geben sie ab.", "bin": "te"}, {"id": "d", "label": "Bei der Protonenabgabe ändert sich die Struktur der Teilchen.", "bin": "te"}, {"id": "e", "label": "Cyanidin-Teilchen tragen viele polare Hydroxy-Gruppen.", "bin": "te"}, {"id": "f", "label": "Eine Cyanidin-Lösung ändert ihre Farbe, wenn man Lauge zutropft.", "bin": "st"}]}, {"t": "ex", "id": "2b", "type": "sort", "op": "Erkläre", "task": "Erkläre die drei Tatsachen auf der Teilchenebene: Ordne jeder Tatsache die zwei passenden Erklärungsbausteine zu.", "bins": [{"id": "ind", "label": "Cyanidin ist ein Säure-Base-Indikator."}, {"id": "amp", "label": "Cyanidin-Teilchen sind Ampholyte."}, {"id": "hyd", "label": "Cyanidin ist hydrophil."}], "items": [{"id": "a", "label": "Bei Protonenabgabe oder -aufnahme ändert sich die Struktur der Teilchen.", "bin": "ind"}, {"id": "b", "label": "Jede Struktur absorbiert Licht anderer Wellenlänge – die Farbe ändert sich.", "bin": "ind"}, {"id": "c", "label": "Die Teilchen können Protonen abgeben (Protonendonator).", "bin": "amp"}, {"id": "d", "label": "Die Teilchen können Protonen aufnehmen (Protonenakzeptor).", "bin": "amp"}, {"id": "e", "label": "Die Teilchen tragen viele polare Hydroxy-Gruppen.", "bin": "hyd"}, {"id": "f", "label": "Sie bilden Wasserstoffbrücken zu Wasser-Molekülen.", "bin": "hyd"}]}, {"t": "ex", "id": "2c", "type": "mc", "multi": false, "op": "Leite ab", "task": "Leite aus den Informationen eine Hypothese zur Frage ab: Enthält die vegetarische Wurst Anthocyan-Farbstoffe?", "options": [{"text": "Enthält die vegetarische Wurst Anthocyan-Farbstoffe, färbt sie sich mit Salzsäure kräftiger rot und mit Natronlauge grün bis blau; die Fleischwurst ändert ihre Farbe nicht.", "ok": true, "fb": "Richtig: Eine Hypothese sagt eine prüfbare Beobachtung voraus."}, {"text": "Die vegetarische Wurst ist rosa, also enthält sie Anthocyan-Farbstoffe.", "ok": false, "fb": "Die Farbe allein beweist nichts – auch andere Farbstoffe sind rosa. Eine Hypothese muss eine prüfbare Vorhersage machen."}, {"text": "Anthocyan-Farbstoffe lösen sich in Natronlauge auf und verschwinden.", "ok": false, "fb": "In basischer Lösung ändern Anthocyan-Farbstoffe ihre Farbe – sie verschwinden nicht."}, {"text": "Fleischwurst und vegetarische Wurst reagieren mit Salzsäure gleich.", "ok": false, "fb": "Dann ließe sich mit dem Versuch nichts unterscheiden. Welche Probe sollte sich anders verhalten?"}]}, {"t": "ex", "id": "2d", "type": "sim", "vessel": "watch", "op": "Führe durch", "task": "Führe den Versuch als Trockenübung in der Simulation durch und beschreibe die Beobachtungen.", "note": "Die Simulation zeigt ein Beispielprodukt mit Anthocyan-Farbstoff. Eure echte Probe kann sich anders verhalten – genau das prüfst du danach im Labor.", "tubes": [{"id": "w1", "label": "Uhrglas 1", "sub": "Fleischwurst + Salzsäure"}, {"id": "w2", "label": "Uhrglas 2", "sub": "Fleischwurst + Natronlauge"}, {"id": "v1", "label": "Uhrglas 3", "sub": "veg. Wurst + Salzsäure"}, {"id": "v2", "label": "Uhrglas 4", "sub": "veg. Wurst + Natronlauge"}], "steps": [{"text": "Von beiden Würsten je zwei kleine Stücke abschneiden und mit der Pinzette auf je ein Uhrglas legen.", "anim": "fill", "state": {"w1": {"piece": "#E9A8A0"}, "w2": {"piece": "#E9A8A0"}, "v1": {"piece": "#E6A2B4"}, "v2": {"piece": "#E6A2B4"}}}, {"text": "Auf je ein Stück jeder Wurst zwei Tropfen Salzsäure geben.", "anim": "drop", "state": {"w1": {"piece": "#E9A8A0", "drop": "#E9A8A0"}, "v1": {"piece": "#E6A2B4", "drop": "#D0245E"}}}, {"text": "Auf das jeweils zweite Stück zwei Tropfen Natronlauge geben.", "anim": "drop", "state": {"w2": {"piece": "#E9A8A0", "drop": "#E9A8A0"}, "v2": {"piece": "#E6A2B4", "drop": "#6FA544"}}}], "wrong": [{"text": "Ein Stück jeder Wurst probieren, um den Geschmack zu vergleichen.", "fb": "Im Labor wird nichts gegessen – auch keine Lebensmittelprobe."}, {"text": "Die Stücke mit Fehling-Lösung über dem Teelicht erwärmen.", "fb": "Die Fehling-Probe weist reduzierende Stoffe nach, keine Farbstoffe."}], "cols": ["Farbe nach dem Auftropfen"], "colOpts": [["keine Farbänderung", "kräftig rot bis pink", "grün", "farblos"]], "rows": [{"label": "Uhrglas 1: Fleischwurst + Salzsäure", "sol": ["keine Farbänderung"]}, {"label": "Uhrglas 2: Fleischwurst + Natronlauge", "sol": ["keine Farbänderung"]}, {"label": "Uhrglas 3: veg. Wurst + Salzsäure", "sol": ["kräftig rot bis pink"]}, {"label": "Uhrglas 4: veg. Wurst + Natronlauge", "sol": ["grün"]}]}, {"t": "info", "title": "Im Labor: Farbstoff-Test durchführen", "fig": "fig_material_farbe", "lead": "Jetzt führst du den Versuch wirklich durch. <b>Schutzbrille und Schutzhandschuhe</b> (Natronlauge)!", "text": ["1. Von der Fleischwurst und der vegetarischen Wurst je zwei kleine Stücke abschneiden und auf vier beschriftete Uhrgläser legen. 2. Auf je ein Stück zwei Tropfen Salzsäure, auf das zweite zwei Tropfen Natronlauge geben. 3. Nach etwa einer Minute die Farben vergleichen und im Protokoll (Tabelle zu Station 2) notieren.", "<b>Entsorgung:</b> Wurststücke in Küchenpapier einwickeln und in den Restmüll geben, Uhrgläser mit Wasser spülen."]}, {"t": "ex", "id": "2e", "type": "mc", "multi": true, "op": "Deute", "task": "In eurem Versuch färbt sich die vegetarische Wurst mit Salzsäure kräftig rot und mit Natronlauge grün; die Fleischwurst bleibt unverändert. Deute die Beobachtungen. Wähle alle zutreffenden Aussagen.", "options": [{"text": "Die vegetarische Wurst enthält einen Farbstoff, der seine Farbe mit dem pH-Wert ändert – das stützt die Hypothese.", "ok": true, "fb": "Richtig."}, {"text": "Die Fleischwurst zeigt als Vergleichsprobe, dass die Farbänderung nicht von Salzsäure oder Natronlauge allein kommt.", "ok": true, "fb": "Richtig: Die Fleischwurst reagiert nicht – die Farbänderung hängt also an der vegetarischen Wurst."}, {"text": "Damit ist bewiesen, dass der Farbstoff genau Cyanidin ist.", "ok": false, "fb": "Der Test zeigt nur einen Farbstoff mit Indikator-Eigenschaften. Welcher genau, bleibt offen."}, {"text": "Die Fleischwurst enthält Anthocyan-Farbstoffe.", "ok": false, "fb": "Sie zeigt keine Farbänderung."}]}, {"t": "merke", "title": "Merke", "bullets": ["<b>Stoffebene:</b> Anthocyan-Farbstoffe wie Cyanidin färben saure Lösungen rot, neutrale violett, schwach basische blau und stark basische grün bis gelb; sie sind wasserlöslich.", "<b>Teilchenebene:</b> Cyanidin-Teilchen sind <b>Ampholyte</b> – sie geben Protonen ab oder nehmen sie auf. Dabei ändert sich ihre Struktur und damit die Farbe (Säure-Base-Indikator). Viele polare Hydroxy-Gruppen machen den Stoff <b>hydrophil</b>.", "Eine Farbänderung mit Säure und Lauge zeigt einen Farbstoff mit Indikator-Eigenschaften – welcher es genau ist, zeigt der Test nicht. Unterscheidung von Rote-Bete-Farbstoff (Betanin): Anthocyane durchlaufen mit Natronlauge eine Blau- bis Grünstufe (erst bei viel Lauge gelb), Betanin wird ohne Grünstufe gelb bis braun – entscheidend ist die Grünfärbung."]}, {"t": "ex", "id": "2p", "profi": true, "type": "mc", "op": "Beurteile", "task": "Eine Gruppe beobachtet bei ihrer veganen Wurst mit Salzsäure und mit Natronlauge <b>keine</b> Farbänderung. Beurteile.", "options": [{"text": "Die vegane Wurst enthält wahrscheinlich keinen Anthocyan-Farbstoff; ihre Farbe stammt aus einer anderen Quelle.", "ok": true, "fb": "Richtig – nicht jedes Ersatzprodukt wird mit Anthocyanen gefärbt. Sicherer wird die Aussage mit einer positiven Blindprobe (z. B. Rotkohlsaft), die zeigt, dass der Test funktioniert."}, {"text": "Die Salzsäure war zu verdünnt; vegane Wurst enthält immer Anthocyane.", "ok": false, "fb": "Ob der Test funktioniert, zeigt eine positive Blindprobe. „Immer“ stimmt nicht – Hersteller färben unterschiedlich."}, {"text": "Die vegane Wurst enthält besonders viel Cyanidin.", "ok": false, "fb": "Dann müsste die Farbe sich deutlich ändern."}]}]}, {"id": "s3", "nr": 3, "ort": "Rückstandslabor", "title": "Wie viel Nitrit steckt in der Wurst?", "icon": "magnifier", "min": 17, "stempel": "O", "scene": "fig_sc_nitrit", "story": "Gepökelte Wurst bleibt länger haltbar und behält ihre rosa Farbe. Dafür sorgt Nitritpökelsalz. Die Familie möchte wissen: Wie viel Nitrit steckt in der gepökelten Wurst – und in der vegetarischen? Du bestimmst den Gehalt mit Teststreifen und vergleichst mit den gesetzlichen Werten.", "blocks": [{"t": "info", "title": "Nitrat und Nitrit in Lebensmitteln", "lead": "Nitrate (Salze mit NO<sub>3</sub><sup>−</sup>-Ionen) stecken vor allem in Gemüse und Trinkwasser. Im Körper (Speichel, Magen) können sie zu Nitrit-Ionen (NO<sub>2</sub><sup>−</sup>) umgewandelt werden.", "text": ["<b>Nitritpökelsalz</b> ist Kochsalz mit einem kleinen Anteil Natriumnitrit (NaNO<sub>2</sub>). Es macht Wurst haltbar und verhindert das „Vergrauen“. Beim starken Erhitzen nitrithaltiger Wurst (Grillen, Braten) können <b>Nitrosamine</b> entstehen, die als krebserregend gelten. Viel Nitrit stört außerdem den Sauerstofftransport im Blut (Methämoglobin-Bildung).", "Der <b>ADI-Wert</b> (acceptable daily intake) ist die Menge, die ein Mensch täglich pro Kilogramm Körpermasse ein Leben lang ohne erkennbares Gesundheitsrisiko aufnehmen kann."], "table": {"head": ["Wert", "Nitrit-Ionen (NO<sub>2</sub><sup>−</sup>)", "Nitrat-Ionen (NO<sub>3</sub><sup>−</sup>)"], "rows": [["ADI-Wert (EFSA 2017)", "0,07 mg pro kg Körpermasse und Tag", "3,7 mg pro kg Körpermasse und Tag"], ["Höchstmenge zugesetzt (Brühwurst, Kochschinken)", "80 mg pro kg Wurst", "–"], ["Höchstmenge Rückstand im Produkt", "45 mg pro kg Wurst", "–"]], "caption": "Höchstmengen für erhitzte, nicht sterilisierte Fleischerzeugnisse, gültig seit 9. Oktober 2025 (VO (EU) 2023/2108)"}}, {"t": "info", "title": "Vom Wurststück zum Messwert", "fig": "fig_nitrit_ablauf", "lead": "Teststreifen funktionieren nur in einer klaren Lösung. Die Nitritsalze der Wurst sind <b>wasserlöslich</b>.", "text": ["Man zerkleinert deshalb eine genau gewogene Masse Wurst in einem genau abgemessenen Volumen Wasser (Suspension), damit sich die Salze lösen. Feste Wurstreste würden das Testfeld verschmieren – sie werden <b>abfiltriert</b>. Das klare <b>Filtrat</b> prüft man mit dem Teststreifen: kurz eintauchen, die vorgeschriebene Zeit warten, dann die Farbe des Testfelds mit der Farbskala vergleichen."]}, {"t": "ex", "id": "3a", "type": "sort", "op": "Ordne", "task": "Ordne die Arbeitsschritte in die richtige Reihenfolge.", "bins": [{"id": "s1", "label": "Schritt 1"}, {"id": "s2", "label": "Schritt 2"}, {"id": "s3", "label": "Schritt 3"}, {"id": "s4", "label": "Schritt 4"}, {"id": "s5", "label": "Schritt 5"}, {"id": "s6", "label": "Schritt 6"}], "items": [{"id": "a", "label": "25 g Wurst abwiegen und klein schneiden", "bin": "s1"}, {"id": "b", "label": "mit 50 mL dest. Wasser im Becherglas pürieren", "bin": "s2"}, {"id": "c", "label": "die Suspension filtrieren", "bin": "s3"}, {"id": "d", "label": "den Teststreifen 1 s ins Filtrat tauchen", "bin": "s4"}, {"id": "e", "label": "60 s warten", "bin": "s5"}, {"id": "f", "label": "das Testfeld mit der Farbskala vergleichen", "bin": "s6"}]}, {"t": "info", "title": "Teststreifen auswerten", "fig": "fig_nitrit_skala", "lead": "Die Farbskala liefert die <b>Massenkonzentration</b> β der Nitrit-Ionen im Filtrat in mg/L.", "text": ["Daraus berechnet man die Masse der Nitrit-Ionen im Wasser: m = β · V. Diese Masse stammt aus der eingewogenen Wurst. Rechnet man auf 1 kg Wurst hoch, erhält man den <b>Gehalt</b> in mg/kg und kann ihn mit den Werten der Tabelle vergleichen. Weil die Farbskala nur Stufen hat, ist das Ergebnis ein <b>ungefährer</b> Wert."]}, {"t": "ex", "id": "3b", "type": "lock", "op": "Berechne", "task": "Der Probenkühlschrank öffnet sich nur mit dem Nitrit-Gehalt der Beispielprobe in <b>mg pro kg Wurst</b>. Berechne ihn und stelle den Code ein.", "object": "Probenkühlschrank", "code": "20", "clues": ["Einwaage: 25 g Wurst in 50 mL dest. Wasser", "Teststreifen: Farbe wie die Stufe 10 mg/L", "m = β · V; danach von 25 g auf 1000 g hochrechnen"], "reward": "Rechenweg: m = 10 mg/L · 0,050 L = 0,5 mg in 25 g Wurst → 0,5 mg · 1000 g / 25 g = 20 mg/kg. Im Kühlschrank liegen die Proben für den echten Versuch."}, {"t": "info", "title": "Im Labor: Nitrit-Gehalt bestimmen", "fig": "fig_material_nitrit", "lead": "Untersuche beide Würste. Notiere Einwaage, Volumen und Messwert im Protokoll.", "text": ["1. 25 g Wurst auf der Waage abwiegen und klein schneiden. 2. 50 mL destilliertes Wasser mit dem Messzylinder abmessen und die Wurst damit in einem hohen 150-mL-Becherglas pürieren. 3. Die Suspension durch einen Faltenfilter in den Erlenmeyerkolben filtrieren. 4. Den Teststreifen 1 s ins Filtrat tauchen, abschütteln, 60 s warten und das Nitrit-Feld mit der Farbskala vergleichen. 5. Dasselbe mit der vegetarischen Wurst wiederholen (Pürierstab vorher abspülen).", "<b>Entsorgung:</b> Filtrat in den Ausguss und mit Wasser nachspülen, Filterrückstand und Teststreifen in den Restmüll."]}, {"t": "ex", "id": "3c", "type": "mc", "multi": true, "op": "Beurteile", "task": "Beurteile den Beispielwert von 20 mg Nitrit-Ionen pro kg Wurst. Wähle alle zutreffenden Aussagen.", "options": [{"text": "Der Wert liegt unter der Höchstmenge für den Rückstand von 45 mg/kg.", "ok": true, "fb": "Richtig."}, {"text": "Der Wert ist ungefähr, weil die Farbskala nur Stufen hat.", "ok": true, "fb": "Richtig – die echte Konzentration liegt zwischen zwei Stufen."}, {"text": "Der Wert überschreitet die Höchstmenge, die zugesetzt werden darf.", "ok": false, "fb": "Zugesetzt werden dürfen bis zu 80 mg/kg – 20 mg/kg liegt darunter."}, {"text": "Die Wurst enthält kein Nitrit.", "ok": false, "fb": "Der Teststreifen zeigt 10 mg/L im Filtrat – es ist Nitrit enthalten."}]}, {"t": "info", "title": "So bewertest du", "fig": "fig_bewerten", "lead": "Eine Bewertung verbindet <b>Fakten</b> mit <b>Werten</b> und endet mit einer begründeten <b>Schlussfolgerung</b>.", "text": ["<b>Fakten</b> sind überprüfbare Aussagen (z. B. Messwerte, Wirkungen). <b>Werte</b> sind das, was Menschen wichtig ist, z. B. Gesundheit, Genuss, Haltbarkeit, Wirtschaftlichkeit. Bei der <b>Abwägung</b> entscheidest du, welcher Wert in diesem Fall schwerer wiegt, und formulierst daraus eine Schlussfolgerung."]}, {"t": "ex", "id": "3d", "type": "free", "op": "Bewerte", "task": "Bewerte den Konsum gepökelter Wurst im Hinblick auf die Grenz- und Höchstwerte. Nutze mindestens zwei Fakten und zwei Werte.", "model": "Fakten: Nitritpökelsalz macht Wurst haltbar und verhindert das Vergrauen. Der Beispielwert (20 mg/kg) liegt unter der Höchstmenge für den Rückstand (45 mg/kg). Beim Grillen oder Braten können krebserregende Nitrosamine entstehen; viel Nitrit stört den Sauerstofftransport im Blut. Der ADI-Wert beträgt 0,07 mg pro kg Körpermasse und Tag. Werte: Gesundheit, Genuss, Haltbarkeit. Abwägung: Die Haltbarkeit schützt vor verdorbenen Lebensmitteln, die Gesundheit wiegt aber schwerer als der Genuss. Schlussfolgerung: Gepökelte Wurst in Maßen essen und nicht stark erhitzen (nicht grillen).", "check": ["Mindestens zwei Fakten (z. B. Messwert und Höchstmenge, Nitrosamine, ADI-Wert)", "Mindestens zwei Werte (z. B. Gesundheit, Genuss, Haltbarkeit)", "Eine Abwägung: Welcher Wert wiegt schwerer – und warum?", "Eine begründete Schlussfolgerung (Empfehlung)"]}, {"t": "merke", "title": "Merke", "bullets": ["Nitritpökelsalz enthält Natriumnitrit (NaNO<sub>2</sub>); es macht Wurst haltbar und rosa. Beim starken Erhitzen können krebserregende Nitrosamine entstehen.", "Für Teststreifen braucht man eine klare Lösung: Probe wiegen, in Wasser zerkleinern, filtrieren, Filtrat testen.", "Gehalt berechnen: m = β · V, dann auf 1 kg Probe hochrechnen. Teststreifen liefern einen <b>ungefähren</b> Wert."]}, {"t": "ex", "id": "3p", "profi": true, "type": "mc", "op": "Berechne", "task": "Berechne, wie viel Wurst mit 20 mg Nitrit-Ionen pro kg eine Person mit 60 kg Körpermasse täglich essen könnte, bis sie den ADI-Wert erreicht (andere Nitritquellen nicht berücksichtigt).", "options": [{"text": "etwa 210 g", "ok": true, "fb": "Richtig: 0,07 mg/kg · 60 kg = 4,2 mg; 4,2 mg : 20 mg/kg = 0,21 kg."}, {"text": "etwa 21 g", "ok": false, "fb": "Prüfe die Einheiten: 4,2 mg : 20 mg/kg ergibt Kilogramm."}, {"text": "etwa 2,1 kg", "ok": false, "fb": "Erst den ADI-Wert mit der Körpermasse multiplizieren: 0,07 · 60 = 4,2 mg."}]}]}, {"id": "s4", "nr": 4, "ort": "pH-Messplatz", "title": "Wie sauer ist das Bonbon?", "icon": "target", "min": 17, "stempel": "B", "scene": "fig_sc_ph", "story": "Fruchtbonbons schmecken säuerlich-frisch. Das liegt an <b>Säuerungsmitteln</b>: Sie senken den pH-Wert, sorgen für den Geschmack und machen Lebensmittel länger haltbar. Laut Zutatenliste steckt im Bonbon <b>Citronensäure</b>. Wie sauer ist die Bonbon-Lösung wirklich?", "blocks": [{"t": "info", "title": "Citronensäure – das Säuerungsmittel im Bonbon", "fig": "fig_citronensaeure", "lead": "Citronensäure (C<sub>6</sub>H<sub>8</sub>O<sub>7</sub>) heißt nach IUPAC <b>2-Hydroxypropan-1,2,3-tricarbonsäure</b>.", "text": ["Der Name verrät den Bau: An einer Kette aus drei C-Atomen (Propan) sitzen <b>drei Carboxy-Gruppen</b> (–COOH, „tricarbonsäure“) und am mittleren C-Atom eine <b>Hydroxy-Gruppe</b> (–OH, „2-Hydroxy“). Die Ziffern 1 bis 4 in der Abbildung markieren die vier funktionellen Gruppen.", "Jede Carboxy-Gruppe kann als <b>Brønsted-Säure</b> ein Proton an ein Wasser-Molekül abgeben; dabei entstehen Oxonium-Ionen (H<sub>3</sub>O<sup>+</sup>). Gibt ein Citronensäure-Molekül alle drei Protonen ab, entsteht das <b>Citrat-Ion</b> C<sub>6</sub>H<sub>5</sub>O<sub>7</sub><sup>3−</sup>. Das geschieht in drei Schritten nacheinander."]}, {"t": "ex", "id": "4a", "type": "sort", "op": "Ordne", "task": "Ordne jede markierte Stelle der Abbildung der passenden funktionellen Gruppe zu.", "fig": "fig_citronensaeure", "bins": [{"id": "cx", "label": "Carboxy-Gruppe"}, {"id": "hx", "label": "Hydroxy-Gruppe"}], "items": [{"id": "m1", "label": "Markierung 1", "bin": "cx"}, {"id": "m2", "label": "Markierung 2", "bin": "hx"}, {"id": "m3", "label": "Markierung 3", "bin": "cx"}, {"id": "m4", "label": "Markierung 4", "bin": "cx"}]}, {"t": "ex", "id": "4b", "type": "equation", "op": "Formuliere", "arrow": "⇌", "task": "Formuliere die Gesamtgleichung für die vollständige Deprotonierung von Citronensäure-Molekülen mit Wasser-Molekülen. Tippe die Bausteine an und stelle die Anzahl ein.", "tiles": [{"id": "cit", "f": "C<sub>6</sub>H<sub>8</sub>O<sub>7</sub>", "q": 0, "at": {"C": 6, "H": 8, "O": 7}}, {"id": "w", "f": "H<sub>2</sub>O", "q": 0, "at": {"H": 2, "O": 1}}, {"id": "ct3", "f": "C<sub>6</sub>H<sub>5</sub>O<sub>7</sub><sup>3−</sup>", "q": -3, "at": {"C": 6, "H": 5, "O": 7}}, {"id": "ox", "f": "H<sub>3</sub>O<sup>+</sup>", "q": 1, "at": {"H": 3, "O": 1}}, {"id": "oh", "f": "OH<sup>−</sup>", "q": -1, "at": {"O": 1, "H": 1}, "why": "entsteht nicht – die Wasser-Moleküle nehmen die Protonen auf."}, {"id": "ct1", "f": "C<sub>6</sub>H<sub>7</sub>O<sub>7</sub><sup>−</sup>", "q": -1, "at": {"C": 6, "H": 7, "O": 7}, "why": "entsteht nur bei der Abgabe eines einzigen Protons – gefragt ist die vollständige Deprotonierung."}], "sol": {"L": {"cit": 1, "w": 3}, "R": {"ct3": 1, "ox": 3}}, "solText": "C<sub>6</sub>H<sub>8</sub>O<sub>7</sub> + 3 H<sub>2</sub>O ⇌ C<sub>6</sub>H<sub>5</sub>O<sub>7</sub><sup>3−</sup> + 3 H<sub>3</sub>O<sup>+</sup>", "hintAtom": "Wie viele Protonen gibt ein Molekül ab – und wie viele Wasser-Moleküle nehmen sie auf?", "hintFull": "Atome und Ladungen stimmen, aber die Koeffizienten sind nicht im kleinsten ganzzahligen Verhältnis."}, {"t": "ex", "id": "4c", "type": "sort", "op": "Ordne", "task": "Ordne allen Teilchen der Gleichung die Begriffe Brønsted-Säure und Brønsted-Base zu (Hin- und Rückreaktion).", "bins": [{"id": "sa", "label": "Brønsted-Säure (Protonendonator)"}, {"id": "ba", "label": "Brønsted-Base (Protonenakzeptor)"}], "items": [{"id": "a", "label": "C<sub>6</sub>H<sub>8</sub>O<sub>7</sub> (Citronensäure-Molekül)", "bin": "sa"}, {"id": "b", "label": "H<sub>2</sub>O (Wasser-Molekül)", "bin": "ba"}, {"id": "c", "label": "C<sub>6</sub>H<sub>5</sub>O<sub>7</sub><sup>3−</sup> (Citrat-Ion)", "bin": "ba"}, {"id": "d", "label": "H<sub>3</sub>O<sup>+</sup> (Oxonium-Ion)", "bin": "sa"}]}, {"t": "info", "title": "pH-Wert und pOH-Wert", "fig": "fig_ph", "lead": "Der <b>pH-Wert</b> ist der negative dekadische Logarithmus der Oxonium-Ionen-Konzentration: pH = −lg(c(H<sub>3</sub>O<sup>+</sup>) · L/mol). Umgekehrt gilt c(H<sub>3</sub>O<sup>+</sup>) = 10<sup>−pH</sup> mol/L.", "text": ["Entsprechend ist der <b>pOH-Wert</b> der negative dekadische Logarithmus der Hydroxid-Ionen-Konzentration: c(OH<sup>−</sup>) = 10<sup>−pOH</sup> mol/L. In wässrigen Lösungen gilt bei <b>25 °C</b>: pH + pOH = 14.", "<b>Universalindikator-Papier</b> zeigt den pH-Wert über einen Farbvergleich in ganzen Stufen an. Ein <b>pH-Messgerät</b> misst elektrisch und zeigt den Wert mit zwei Nachkommastellen an; es muss vorher kalibriert werden."]}, {"t": "info", "title": "Im Labor: pH-Wert der Bonbon-Lösung bestimmen", "fig": "fig_material_ph", "lead": "Verwende die Bonbon-Lösung aus Station 1. <b>Das pH-Messgerät nur gemeinsam mit der Lehrkraft benutzen!</b>", "text": ["1. Mit einem Glasstab einen Tropfen Bonbon-Lösung auf ein Stück Universalindikator-Papier geben, die Farbe mit der Skala vergleichen und den pH-Wert notieren. 2. Mit der Lehrkraft den pH-Wert mit dem pH-Messgerät bestimmen und notieren. 3. Die Elektrode danach mit destilliertem Wasser abspülen.", "Die Bonbon-Lösung wird auch an Station 5 gebraucht – Reste erst entsorgen, wenn Station 4 und 5 erledigt sind. <b>Entsorgung:</b> Indikatorpapier in den Restmüll."]}, {"t": "ex", "id": "4d", "type": "select", "op": "Berechne", "task": "Ein pH-Messgerät zeigt für eine Bonbon-Lösung pH = 2,86 (25 °C). Berechne pOH-Wert, Oxonium- und Hydroxid-Ionen-Konzentration und wähle die richtigen Ergebnisse.", "cols": ["Ergebnis"], "colOpts": [["11,14", "2,86", "16,86", "1,38 · 10⁻³ mol/L", "2,86 · 10⁻³ mol/L", "7,24 · 10⁻¹² mol/L", "1,38 · 10⁻¹¹ mol/L"]], "rows": [{"label": "pOH", "sol": ["11,14"]}, {"label": "c(H<sub>3</sub>O<sup>+</sup>)", "sol": ["1,38 · 10⁻³ mol/L"]}, {"label": "c(OH<sup>−</sup>)", "sol": ["7,24 · 10⁻¹² mol/L"]}]}, {"t": "ex", "id": "4e", "type": "mc", "multi": false, "op": "Erkläre", "task": "Erkläre, weshalb für die Berechnung der Konzentrationen der Wert des pH-Messgeräts besser geeignet ist als der des Indikatorpapiers.", "options": [{"text": "Das Messgerät liefert den pH-Wert auf zwei Nachkommastellen; das Papier nur ganze Stufen per Farbvergleich. Schon 0,5 pH-Einheiten ändern c(H<sub>3</sub>O<sup>+</sup>) um etwa den Faktor 3.", "ok": true, "fb": "Richtig: Wegen der logarithmischen Skala wirkt sich jede Ungenauigkeit beim pH-Wert stark auf die Konzentration aus."}, {"text": "Das Indikatorpapier reagiert nicht mit Citronensäure.", "ok": false, "fb": "Das Papier zeigt auch für die Bonbon-Lösung eine Farbe – nur ungenau."}, {"text": "Das Messgerät misst die Konzentration der Citronensäure direkt.", "ok": false, "fb": "Es misst den pH-Wert; die Konzentrationen der Oxonium- und Hydroxid-Ionen berechnest du daraus."}, {"text": "Das Indikatorpapier verbraucht die Oxonium-Ionen.", "ok": false, "fb": "Der Farbvergleich ist das Problem, nicht ein Verbrauch."}]}, {"t": "merke", "title": "Merke", "bullets": ["Citronensäure-Moleküle tragen drei Carboxy-Gruppen und eine Hydroxy-Gruppe; als Brønsted-Säure geben sie bis zu drei Protonen an Wasser-Moleküle ab: C<sub>6</sub>H<sub>8</sub>O<sub>7</sub> + 3 H<sub>2</sub>O ⇌ C<sub>6</sub>H<sub>5</sub>O<sub>7</sub><sup>3−</sup> + 3 H<sub>3</sub>O<sup>+</sup>.", "c(H<sub>3</sub>O<sup>+</sup>) = 10<sup>−pH</sup> mol/L, c(OH<sup>−</sup>) = 10<sup>−pOH</sup> mol/L, bei 25 °C gilt pH + pOH = 14.", "Für Berechnungen braucht man einen genauen pH-Wert: pH-Messgerät statt Indikatorpapier."]}, {"t": "game", "id": "4g", "kind": "blitz", "title": "Blitzrunde", "lead": "Beurteile, ob die Aussage zutrifft.", "zeit": 8, "items": [{"text": "Eine negative Blindprobe enthält den gesuchten Stoff sicher nicht.", "ok": true}, {"text": "Natronlauge (c = 1 mol/L) ist ätzend.", "ok": true}, {"text": "Citronensäure-Moleküle tragen zwei Carboxy-Gruppen.", "ok": false, "fb": "Es sind drei: „tricarbonsäure“."}, {"text": "Bei pH = 3 ist c(H<sub>3</sub>O<sup>+</sup>) = 10⁻³ mol/L.", "ok": true}, {"text": "pH + pOH = 14 gilt bei jeder Temperatur.", "ok": false, "fb": "Das gilt bei 25 °C."}, {"text": "Ein Wasser-Molekül, das ein Proton aufnimmt, ist eine Brønsted-Base.", "ok": true}, {"text": "Indikatorpapier zeigt den pH-Wert auf zwei Nachkommastellen.", "ok": false, "fb": "Das kann nur das pH-Messgerät."}, {"text": "Lebensmittelproben darf man im Labor kurz probieren.", "ok": false, "fb": "Im Labor wird nichts gegessen."}]}]}, {"id": "s5", "nr": 5, "ort": "Zuckerlabor", "title": "Was steckt im Bonbon?", "icon": "flame", "min": 17, "stempel": "E", "scene": "fig_sc_zucker", "story": "Laut Etikett stecken im Bonbon Zucker, Glukosesirup und Vitamin C (Ascorbinsäure). Die Fehling-Probe gilt als Nachweis für Glucose – aber reagiert sie wirklich nur mit Glucose? Du prüfst das mit Vergleichsproben und bestimmst danach die Gehalte mit Teststreifen.", "blocks": [{"t": "info", "title": "Was bei der Fehling-Probe passiert", "fig": "fig_fehling", "lead": "Fehling-Lösung I enthält blaue Kupfer(II)-Ionen (Cu<sup>2+</sup>), Fehling-Lösung II ist stark basisch. Gemischt ergeben sie eine tiefblaue Lösung. Ein <b>reduzierender Stoff</b> reduziert beim Erwärmen die Cu<sup>2+</sup>-Ionen zu rotbraunem Kupfer(I)-oxid (Cu<sub>2</sub>O).", "text": ["Lange dachte man, dabei werde die <b>Aldehyd-Gruppe</b> des offenkettigen Glucose-Moleküls oxidiert. Heute nimmt man an: In basischer Lösung <b>lagern sich die Moleküle zuerst um</b> (Keto-Enol-Tautomerie). Es entsteht ein <b>Endiolat-Ion</b> mit der Gruppe –C(O⁻)=C(OH)– – und dieses wird oxidiert.", "Die Umlagerung gelingt bei allen Molekülen, deren offenkettige Form eine <b>Carbonyl-Gruppe</b> (Aldehyd- oder Keto-Gruppe) <b>neben einer Hydroxy-Gruppe</b> trägt – beim Glucose-Molekül die Aldehyd-Gruppe an C-1 mit der Hydroxy-Gruppe an C-2. Fructose-Moleküle besitzen keine Aldehyd-Gruppe: Im offenkettigen Fructose-Molekül sitzt eine Keto-Gruppe an C-2, C-1 und C-3 tragen je eine Hydroxy-Gruppe. Im <b>Saccharose-Molekül</b> sind die Carbonyl-C-Atome beider Bausteine an der Bindung zwischen Glucose- und Fructose-Baustein beteiligt – es kann keine offenkettige Form bilden."]}, {"t": "info", "title": "Vitamin C: ein Endiol im Ring", "fig": "fig_ascorbin", "lead": "Das Ascorbinsäure-Molekül trägt im Ring eine <b>Endiol-Gruppe</b> HO–C=C–OH – sehr ähnlich wie das Endiolat-Ion.", "text": []}, {"t": "ex", "id": "5a", "type": "mc", "multi": false, "op": "Leite ab", "task": "Leite aus den Informationen eine Hypothese zur Frage ab: Kann Glucose mithilfe der Fehling-Probe eindeutig nachgewiesen werden?", "options": [{"text": "Nein: Auch Stoffe ohne Aldehyd-Gruppe, die ein Endiolat-Ion bilden oder eine Endiol-Gruppe tragen (z. B. Fructose, Ascorbinsäure), zeigen eine positive Fehling-Probe.", "ok": true, "fb": "Richtig – diese Hypothese prüfst du gleich mit Vergleichsproben."}, {"text": "Ja: Nur Glucose-Moleküle besitzen eine Aldehyd-Gruppe, deshalb reagiert nur Glucose.", "ok": false, "fb": "Oxidiert wird nach heutiger Vorstellung das Endiolat-Ion – nicht die Aldehyd-Gruppe."}, {"text": "Nein: Die Fehling-Probe reagiert mit allen Zuckern, auch mit Saccharose.", "ok": false, "fb": "Schau nach, was über das Saccharose-Molekül gesagt wird."}]}, {"t": "ex", "id": "5b", "type": "sim", "vessel": "spoon", "op": "Führe durch", "task": "Führe den Versuch als Trockenübung in der Simulation durch und beschreibe die Beobachtungen.", "tubes": [{"id": "w", "label": "Löffel 1", "sub": "dest. Wasser"}, {"id": "g", "label": "Löffel 2", "sub": "Glucose"}, {"id": "f", "label": "Löffel 3", "sub": "Fructose"}, {"id": "s", "label": "Löffel 4", "sub": "Saccharose"}, {"id": "a", "label": "Löffel 5", "sub": "Ascorbin­säure"}, {"id": "b", "label": "Löffel 6", "sub": "Bonbon-Lösung"}], "steps": [{"text": "Auf jeden Löffel je 5 Tropfen Fehling-Lösung I und Fehling-Lösung II geben.", "anim": "fill", "state": {"w": {"liq": 1, "col": "#4F86C6"}, "g": {"liq": 1, "col": "#4F86C6"}, "f": {"liq": 1, "col": "#4F86C6"}, "s": {"liq": 1, "col": "#4F86C6"}, "a": {"liq": 1, "col": "#4F86C6"}, "b": {"liq": 1, "col": "#4F86C6"}}}, {"text": "Auf jeden Löffel 3 Tropfen der jeweiligen Probe geben (Feststoffe vorher in wenig dest. Wasser lösen).", "anim": "drop", "state": {"w": {"liq": 1, "col": "#4F86C6"}, "g": {"liq": 1, "col": "#4F86C6"}, "f": {"liq": 1, "col": "#4F86C6"}, "s": {"liq": 1, "col": "#4F86C6"}, "a": {"liq": 1, "col": "#4F86C6"}, "b": {"liq": 1, "col": "#4F86C6"}}}, {"text": "Jeden Löffel kurz über das Teelicht halten und vorsichtig erwärmen, nicht kochen.", "anim": "drop", "state": {"w": {"liq": 1, "col": "#4F86C6", "heat": 1}, "s": {"liq": 1, "col": "#4F86C6", "heat": 1}, "g": {"liq": 1, "col": "#B5541F", "ppt": "#A3431A", "heat": 1}, "f": {"liq": 1, "col": "#B5541F", "ppt": "#A3431A", "heat": 1}, "a": {"liq": 1, "col": "#B5541F", "ppt": "#A3431A", "heat": 1}, "b": {"liq": 1, "col": "#B5541F", "ppt": "#A3431A", "heat": 1}}}], "wrong": [{"text": "Salzsäure zugeben, damit die Reaktion schneller abläuft.", "fb": "Die Fehling-Probe braucht eine basische Lösung – Säure würde sie stören."}, {"text": "Den Löffel bis zum Sieden erhitzen und von oben hineinschauen.", "fb": "Stark basische Lösung kann beim Sieden herausspritzen – nur vorsichtig erwärmen und Abstand halten."}], "cols": ["Farbe nach dem Erwärmen"], "colOpts": [["blau", "rotbraun", "farblos", "grün"]], "rows": [{"label": "Löffel 1: dest. Wasser", "sol": ["blau"]}, {"label": "Löffel 2: Glucose", "sol": ["rotbraun"]}, {"label": "Löffel 3: Fructose", "sol": ["rotbraun"]}, {"label": "Löffel 4: Saccharose", "sol": ["blau"]}, {"label": "Löffel 5: Ascorbinsäure", "sol": ["rotbraun"]}, {"label": "Löffel 6: Bonbon-Lösung", "sol": ["rotbraun"]}]}, {"t": "info", "title": "Im Labor: Fehling-Probe und Teststreifen", "fig": "fig_material_fehling", "lead": "<b>Schutzbrille und Schutzhandschuhe!</b> Fehling-Lösung II ist ätzend. Edelstahl-Laborlöffel mit einer Holzklammer und ausgestrecktem Arm halten.", "text": ["1. Sechs Edelstahl-Laborlöffel (kein Aluminium, kein Essbesteck) auf ein beschriftetes Papier legen (Wasser, Glucose, Fructose, Saccharose, Ascorbinsäure, Bonbon-Lösung). 2. Auf jeden Löffel je 5 Tropfen Fehling-Lösung I und II geben, dann 3 Tropfen Probe (Feststoffe: eine kleine Spatelspitze in 1 mL dest. Wasser lösen). 3. Jeden Löffel kurz über das Teelicht halten, bis eine Veränderung sichtbar ist – nicht kochen. Beobachtungen notieren.", "4. <b>Teststreifen:</b> Glucose- und Ascorbinsäure-Teststreifen kurz in die Bonbon-Lösung tauchen, die angegebene Zeit warten, mit der Farbskala vergleichen und notieren. Liegt die Farbe des Glucose-Streifens über der höchsten Stufe, 1 mL Bonbon-Lösung mit 9 mL dest. Wasser verdünnen und erneut messen (Ergebnis · 10).", "<b>Entsorgung:</b> Fehling-Reste und das erste Spülwasser der Löffel in das bereitgestellte Entsorgungsgefäß, <b>nicht</b> in den Ausguss; Teststreifen in den Restmüll; Reste der Bonbon-Lösung erst nach Station 4 und 5 in den Ausguss geben und nachspülen. Teelicht löschen."]}, {"t": "ex", "id": "5c", "type": "mc", "multi": false, "op": "Beurteile", "task": "Beurteile mithilfe der Beobachtungen die Eindeutigkeit der Fehling-Probe als Glucose-Nachweis.", "options": [{"text": "Nicht eindeutig: Glucose, Fructose und Ascorbinsäure zeigen alle einen rotbraunen Niederschlag. Die Hypothese wird gestützt.", "ok": true, "fb": "Richtig: Ein positives Ergebnis beim Bonbon zeigt nur „reduzierender Stoff enthalten“ – nicht, welcher."}, {"text": "Eindeutig: Saccharose reagiert nicht, also reagiert nur Glucose.", "ok": false, "fb": "Auch Fructose und Ascorbinsäure geben einen Niederschlag."}, {"text": "Nicht eindeutig, weil auch destilliertes Wasser reagiert.", "ok": false, "fb": "Die negative Blindprobe blieb blau – das Reagenz ist in Ordnung."}, {"text": "Eindeutig, weil das Bonbon einen Niederschlag zeigt.", "ok": false, "fb": "Das Bonbon enthält Glukosesirup und Ascorbinsäure – welcher Stoff reagiert hat, bleibt offen."}]}, {"t": "ex", "id": "5d", "type": "mc", "multi": false, "op": "Erkläre", "task": "Erkläre knapp, warum auch Fructose eine positive Fehling-Probe zeigt, obwohl ihre Moleküle keine Aldehyd-Gruppe besitzen.", "options": [{"text": "Das offenkettige Fructose-Molekül trägt eine Keto-Gruppe neben einer Hydroxy-Gruppe; in basischer Lösung lagert es sich zum Endiolat-Ion um, das die Cu<sup>2+</sup>-Ionen reduziert.", "ok": true, "fb": "Richtig."}, {"text": "Fructose-Moleküle enthalten Kupfer-Atome.", "ok": false, "fb": "Das Kupfer stammt aus Fehling-Lösung I."}, {"text": "Fructose ist eine Säure und färbt die Lösung rot.", "ok": false, "fb": "Der rotbraune Feststoff ist Kupfer(I)-oxid."}, {"text": "Die Keto-Gruppe wird direkt zur Carboxy-Gruppe oxidiert.", "ok": false, "fb": "Oxidiert wird das Endiolat-Ion, das nach der Umlagerung entsteht."}]}, {"t": "info", "title": "Vitamin C reduziert Fehling-Lösung", "fig": "fig_redox", "lead": "Ascorbinsäure-Moleküle (C<sub>6</sub>H<sub>8</sub>O<sub>6</sub>) werden zu Dehydroascorbinsäure-Molekülen (C<sub>6</sub>H<sub>6</sub>O<sub>6</sub>) oxidiert, die Kupfer(II)-Ionen werden zu Kupfer(I)-oxid (Cu<sub>2</sub>O) reduziert.", "text": ["Die Reaktion läuft in <b>basischer Lösung</b> ab: Ausgeglichen wird deshalb mit Hydroxid-Ionen (OH<sup>−</sup>) und Wasser-Molekülen. Die Seitenkette ist in der Abbildung mit R abgekürzt; sie ändert sich nicht."]}, {"t": "ex", "id": "5e", "type": "select", "op": "Ermittle", "task": "Ermittle die Oxidationszahlen der markierten Atome vor und nach der Reaktion.", "cols": ["Oxidationszahl"], "colOpts": [["+I", "+II", "0", "−I", "+III"]], "rows": [{"label": "C-2 bzw. C-3 im Ascorbinsäure-Molekül", "sol": ["+I"]}, {"label": "C-2 bzw. C-3 im Dehydroascorbinsäure-Molekül", "sol": ["+II"]}, {"label": "Cu im Cu<sup>2+</sup>-Ion", "sol": ["+II"]}, {"label": "Cu im Cu<sub>2</sub>O", "sol": ["+I"]}]}, {"t": "ex", "id": "5f", "type": "equation", "op": "Formuliere", "task": "Formuliere die Gesamtgleichung der Redoxreaktion von Ascorbinsäure-Molekülen mit Fehling-Lösung.", "tiles": [{"id": "asc", "f": "C<sub>6</sub>H<sub>8</sub>O<sub>6</sub>", "q": 0, "at": {"C": 6, "H": 8, "O": 6}}, {"id": "cu", "f": "Cu<sup>2+</sup>", "q": 2, "at": {"Cu": 1}}, {"id": "oh", "f": "OH<sup>−</sup>", "q": -1, "at": {"O": 1, "H": 1}}, {"id": "dha", "f": "C<sub>6</sub>H<sub>6</sub>O<sub>6</sub>", "q": 0, "at": {"C": 6, "H": 6, "O": 6}}, {"id": "cu2o", "f": "Cu<sub>2</sub>O", "q": 0, "at": {"Cu": 2, "O": 1}}, {"id": "w", "f": "H<sub>2</sub>O", "q": 0, "at": {"H": 2, "O": 1}}, {"id": "h3o", "f": "H<sub>3</sub>O<sup>+</sup>", "q": 1, "at": {"H": 3, "O": 1}, "why": "passt nicht zu einer stark basischen Lösung – dort gleicht man mit OH<sup>−</sup> und H<sub>2</sub>O aus."}, {"id": "cum", "f": "Cu", "q": 0, "at": {"Cu": 1}, "why": "entsteht hier nicht – der rotbraune Feststoff ist Kupfer(I)-oxid."}], "sol": {"L": {"asc": 1, "cu": 2, "oh": 4}, "R": {"dha": 1, "cu2o": 1, "w": 3}}, "solText": "C<sub>6</sub>H<sub>8</sub>O<sub>6</sub> + 2 Cu<sup>2+</sup> + 4 OH<sup>−</sup> → C<sub>6</sub>H<sub>6</sub>O<sub>6</sub> + Cu<sub>2</sub>O + 3 H<sub>2</sub>O", "hintAtom": "Zwei C-Atome geben je ein Elektron ab; jedes Cu<sup>2+</sup>-Ion nimmt eines auf.", "hintFull": "Atome und Ladungen stimmen, aber die Koeffizienten sind nicht im kleinsten ganzzahligen Verhältnis."}, {"t": "info", "title": "Teststreifen: gezielt und halbquantitativ", "fig": "fig_streifen", "lead": "Der <b>Glucose-Teststreifen</b> enthält das Enzym Glucose-Oxidase; es setzt <b>nur Glucose</b> um. Fructose, Saccharose und Ascorbinsäure zeigen hier keine Glucose an.", "text": ["Der <b>Ascorbinsäure-Teststreifen</b> zeigt die Massenkonzentration an Vitamin C an. Laut Packungsbeilage des Glucose-Teststreifens stören Ascorbinsäure-Konzentrationen <b>ab 20 mg/L</b> die Glucose-Bestimmung.", "Aus der Massenkonzentration β und dem Volumen V der Bonbon-Lösung berechnet man die Masse im Bonbon: m = β · V. Diese Masse stammt aus dem eingewogenen Bonbon; rechnet man auf 100 g Bonbons hoch, erhält man den Gehalt."]}, {"t": "ex", "id": "5g", "type": "select", "op": "Berechne", "task": "Beispielmessung: Ein Bonbon (4,0 g) wurde in 20 mL Wasser gelöst. Der Ascorbinsäure-Teststreifen zeigt 100 mg/L. Berechne die Masse an Ascorbinsäure im Bonbon und den Gehalt in 100 g Bonbons.", "cols": ["Ergebnis"], "colOpts": [["2 mg", "20 mg", "0,2 mg", "50 mg", "500 mg", "5 mg"]], "rows": [{"label": "m(Ascorbinsäure) im Bonbon", "sol": ["2 mg"]}, {"label": "Ascorbinsäure in 100 g Bonbons", "sol": ["50 mg"]}]}, {"t": "merke", "title": "Merke", "bullets": ["Fehling-Probe: Reduzierende Stoffe reduzieren Cu<sup>2+</sup>-Ionen beim Erwärmen zu rotbraunem Cu<sub>2</sub>O. Positiv reagieren Glucose, Fructose (über das Endiolat-Ion) und Ascorbinsäure (Endiol-Gruppe), nicht Saccharose.", "Die Fehling-Probe ist daher <b>kein eindeutiger</b> Glucose-Nachweis. Glucose-Teststreifen (Glucose-Oxidase) reagieren gezielt nur mit Glucose.", "C<sub>6</sub>H<sub>8</sub>O<sub>6</sub> + 2 Cu<sup>2+</sup> + 4 OH<sup>−</sup> → C<sub>6</sub>H<sub>6</sub>O<sub>6</sub> + Cu<sub>2</sub>O + 3 H<sub>2</sub>O; C-2 und C-3: +I → +II (Oxidation), Cu: +II → +I (Reduktion)."]}, {"t": "ex", "id": "5p", "profi": true, "type": "mc", "op": "Beurteile", "task": "Die unverdünnte Bonbon-Lösung enthält rund 100 mg/L Ascorbinsäure. Beurteile den Messwert des Glucose-Teststreifens.", "options": [{"text": "Unverdünnt ist der Glucose-Wert nicht verlässlich, weil mehr als 20 mg/L Ascorbinsäure die Bestimmung stören. Nach Verdünnen 1 : 10 liegen nur noch etwa 10 mg/L vor – dann ist der Messwert verwertbar.", "ok": true, "fb": "Richtig – die Verdünnung hilft doppelt: Sie bringt Glucose in den Messbereich und Ascorbinsäure unter die Störgrenze."}, {"text": "Der Wert ist immer genau, weil der Streifen nur mit Glucose reagiert.", "ok": false, "fb": "Gezielt heißt nicht störungsfrei – lies die Angabe aus der Packungsbeilage."}, {"text": "Der Streifen zeigt Glucose und Ascorbinsäure zusammen an.", "ok": false, "fb": "Er zeigt nur Glucose an – aber Ascorbinsäure verfälscht diese Anzeige."}]}]}, {"id": "s6", "nr": 6, "ort": "Laborleitung", "title": "Der Prüfbericht", "icon": "bottles", "min": 10, "stempel": "N", "scene": "fig_sc_bericht", "story": "Alle Proben sind untersucht. Die Laborleiterin wartet auf deinen Prüfbericht für die Verbraucherberatung. Fasse zusammen, welcher Nachweis welche Frage beantwortet – dann wird der Bericht unterschrieben.", "blocks": [{"t": "ex", "id": "6a", "type": "cmap", "op": "Ordne", "task": "Ordne jedem freien Feld der Concept-Map den passenden Begriff zu."}, {"t": "quiz", "id": "6b", "title": "Abschlussquiz", "qs": [{"id": "6b1", "op": "Nenne", "task": "Nenne den Ansatz, der zeigt, dass ein Nachweisreagenz überhaupt funktioniert.", "options": [{"text": "positive Blindprobe", "ok": true, "fb": "Richtig: Probe mit dem sicher enthaltenen Stoff."}, {"text": "negative Blindprobe", "ok": false, "fb": "Sie prüft, ob das Zeichen ohne den Stoff auftritt."}, {"text": "Vergleich mit der Farbskala", "ok": false, "fb": "Das ist das Ablesen eines Teststreifens."}]}, {"id": "6b2", "op": "Erkläre", "task": "Erkläre, warum man für den Teststreifen nicht die Wurst-Suspension, sondern das Filtrat verwendet.", "options": [{"text": "Feste Wurstreste würden das Testfeld verschmieren; gemessen werden die gelösten Nitrit-Ionen.", "ok": true, "fb": "Richtig."}, {"text": "Im Filterpapier bleiben die Nitrit-Ionen hängen.", "ok": false, "fb": "Gelöste Ionen gehen durch das Filterpapier."}, {"text": "Das Filtrieren erhöht den Nitrit-Gehalt.", "ok": false, "fb": "Filtrieren trennt nur den Feststoff ab."}]}, {"id": "6b3", "op": "Begründe", "task": "Begründe, warum c(H<sub>3</sub>O<sup>+</sup>) in einer Lösung mit pH = 3 zehnmal so groß ist wie bei pH = 4.", "options": [{"text": "Der pH-Wert ist ein negativer dekadischer Logarithmus: Eine pH-Einheit weniger bedeutet die zehnfache Oxonium-Ionen-Konzentration.", "ok": true, "fb": "Richtig."}, {"text": "Weil 4 − 3 = 1 und 1 · 10 = 10 ist.", "ok": false, "fb": "Die Begründung liegt in der Definition über den Logarithmus."}, {"text": "Weil bei pH = 3 mehr Hydroxid-Ionen vorliegen.", "ok": false, "fb": "Bei pH = 3 liegen weniger Hydroxid-Ionen vor."}]}]}, {"t": "ex", "id": "6c", "type": "lock", "op": "Ordne", "task": "Der Prüfbericht lässt sich nur mit den richtigen Verfahren abschließen. Ordne jedem Rad das passende Verfahren zu.", "object": "Prüfbericht", "wheels": [{"label": "Nitrit-Gehalt der Wurst bestimmen", "opts": ["Nitrit-Teststreifen", "Fehling-Probe", "pH-Messgerät"], "sol": "Nitrit-Teststreifen"}, {"label": "pH-Wert genau messen", "opts": ["pH-Messgerät", "Indikatorpapier", "Fehling-Probe"], "sol": "pH-Messgerät"}, {"label": "Glucose gezielt nachweisen", "opts": ["Glucose-Teststreifen", "Fehling-Probe", "Natronlauge"], "sol": "Glucose-Teststreifen"}, {"label": "Prüfen, ob ein Nachweis funktioniert", "opts": ["positive Blindprobe", "negative Blindprobe", "Filtrieren"], "sol": "positive Blindprobe"}], "okMsg": "Klick – der Prüfbericht ist abgeschlossen!", "reward": "Die Laborleiterin unterschreibt. Die Verbraucherberatung bekommt heute noch Antwort."}, {"t": "game", "id": "6g", "kind": "boss", "title": "Boss-Runde: Die verdächtige Probe", "name": "Verdächtige Probe", "fig": "fig_boss", "leben": 3, "winMsg": "Die verdächtige Probe ist durchschaut!", "loseMsg": "Die Probe ist entwischt – versuch es noch einmal.", "qs": [{"q": "Deute: Eine Wurst färbt sich mit Natronlauge grün.", "options": [{"text": "einen Farbstoff mit Indikator-Eigenschaften", "ok": true}, {"text": "Nitrit", "ok": false, "fb": "Nitrit weist man mit Teststreifen nach."}, {"text": "Glucose", "ok": false, "fb": "Glucose zeigt sich in der Fehling-Probe oder mit dem Glucose-Teststreifen."}]}, {"q": "Nenne den Stoff, der keine positive Fehling-Probe zeigt.", "options": [{"text": "Saccharose", "ok": true}, {"text": "Fructose", "ok": false, "fb": "Fructose bildet ein Endiolat-Ion."}, {"text": "Ascorbinsäure", "ok": false, "fb": "Ascorbinsäure trägt eine Endiol-Gruppe."}]}, {"q": "Nenne den Stoff des rotbraunen Niederschlags der Fehling-Probe.", "options": [{"text": "Kupfer(I)-oxid", "ok": true}, {"text": "Kupfer(II)-sulfat", "ok": false, "fb": "Das ist in F     if (!api) { try { if (window.opener) api = findAPI(window.opener); } catch (e) { } }
    if (!api) return;
    try {
      if (String(api.LMSInitialize("")) !== "true") return;
      scorm = api;
      var st = api.LMSGetValue("cmi.core.lesson_status");
      if (!st || st === "not attempted") api.LMSSetValue("cmi.core.lesson_status", "incomplete");
      var nm = api.LMSGetValue("cmi.core.student_name") || "";
      if (nm.indexOf(",") > -1) { var p = nm.split(","); nm = (p[1] || "").trim() + " " + p[0].trim(); }
      var sd = api.LMSGetValue("cmi.suspend_data");
      if (sd) { try { var o = JSON.parse(sd); if (o && o.ex) S = normS(o); } catch (e) { } }
      if (nm && !S.name) S.name = nm.trim();
    } catch (e) { scorm = null; }
  }
  function load() {
    initScorm();
    if (!scorm) {
      try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); if (o && o.ex) S = normS(o); } } catch (e) { }
    }
    try { preview = sessionStorage.getItem(KEY + "_pv") === "1"; } catch (e) { }
  }
  function save() {
    var js = JSON.stringify(S);
    if (scorm) {
      try {
        scorm.LMSSetValue("cmi.suspend_data", js.slice(0, 3900));
        scorm.LMSSetValue("cmi.core.score.min", "0");
        scorm.LMSSetValue("cmi.core.score.max", "100");
        scorm.LMSSetValue("cmi.core.score.raw", String(Math.round(100 * points() / maxPoints())));
        scorm.LMSSetValue("cmi.core.lesson_location", S.loc || "");
        if (allDone()) scorm.LMSSetValue("cmi.core.lesson_status", "completed");
        scorm.LMSCommit("");
      } catch (e) { }
    } else {
      try { localStorage.setItem(KEY, js); } catch (e) { }
    }
  }
  window.addEventListener("pagehide", function () {
    if (scorm) { try { save(); scorm.LMSSetValue("cmi.core.exit", allDone() ? "" : "suspend"); scorm.LMSCommit(""); scorm.LMSFinish(""); scorm = null; } catch (e) { } }
  });

  // ---------------------------------------------------------------- Übungsliste
  var EXLIST = [], PXLIST = [], GMLIST = [];
  function isBonus(b) { return b.t === "game" || (b.t === "ex" && b.profi); }
  ST.forEach(function (st, si) {
    st.blocks.forEach(function (b) {
      if (b.t === "ex" && b.profi) { PXLIST.push({ id: b.id, si: si, type: b.type }); return; }
      if (b.t === "game") { GMLIST.push({ id: b.id, si: si, kind: b.kind }); return; }
      if (b.t === "ex") EXLIST.push({ id: b.id, si: si, type: b.type });
      if (b.t === "quiz") b.qs.forEach(function (q) { EXLIST.push({ id: q.id, si: si, type: "mc" }); });
    });
  });
  function maxPoints() { return EXLIST.length * MAXP; }
  function points() { var p = 0; for (var k in S.ex) p += S.ex[k][0] || 0; return p; }
  function exDone(id) { return !!(S.ex[id] && S.ex[id][2]); }
  function stationDone(si) { return EXLIST.filter(function (e) { return e.si === si; }).every(function (e) { return exDone(e.id); }); }
  function allDone() { return ST.every(function (s, i) { return stationDone(i); }); }
  // Lernzirkel (META.zirkel = Stations-IDs): Diese Stationen sind frei wählbar, sobald alle Stationen davor geschafft sind;
  // Stationen danach öffnen erst, wenn alle vorherigen (auch alle Zirkel-Stationen) geschafft sind.
  var ZI = (C.META.zirkel || []).map(function (id) { return ST.map(function (s) { return s.id; }).indexOf(id); }).filter(function (i) { return i > -1; });
  function allBefore(si) { for (var i = 0; i < si; i++) if (!stationDone(i)) return false; return true; }
  function unlocked(si) {
    if (preview || si === 0) return true;
    if (ZI.length) { var first = Math.min.apply(null, ZI); if (ZI.indexOf(si) > -1) return allBefore(first); return allBefore(si); }
    return stationDone(si - 1);
  }
  function nextOpen(si) {
    if (!ZI.length) return si + 1 < ST.length ? si + 1 : -1;
    for (var i = 0; i < ST.length; i++) { var j = (si + 1 + i) % ST.length; if (unlocked(j) && !stationDone(j)) return j; }
    return -1;
  }

  // ---------------------------------------------------------------- Kopfzeile
  function renderHead() {
    var p = points(), mx = maxPoints();
    $("#pts").textContent = "Punkte: " + p + " / " + mx;
    $("#bar").style.width = Math.round(100 * EXLIST.filter(function (e) { return exDone(e.id); }).length / EXLIST.length) + "%";
    var sh = "";
    ST.forEach(function (s, i) { sh += '<span class="' + (stationDone(i) ? "on" : "") + '" title="Station ' + s.nr + '">' + s.stempel + "</span>"; });
    $("#stamps").innerHTML = sh;
    $("#btnKartei").hidden = !C.KARTEI || !unlocked(1);
    var sp = $("#stars"); if (sp) { sp.hidden = !(PXLIST.length || GMLIST.length); sp.innerHTML = I.star + "<b>" + stars() + "</b>"; sp.title = LB.sterne + ": " + stars() + " von " + maxStars(); }
    var bb = $("#btnBadges"); if (bb) { var nb = badgeList().filter(function (b) { return hasBadge(b.id); }).length; bb.querySelector(".cnt").textContent = nb; bb.title = LB.badges + ": " + nb + " von " + badgeList().length; }
    var sn = $("#btnSound"); if (sn) { sn.innerHTML = I[FX.on ? "sound" : "mute"]; sn.title = LB.ton + (FX.on ? " an – zum Ausschalten tippen" : " aus – zum Einschalten tippen"); sn.setAttribute("aria-pressed", FX.on ? "true" : "false"); }
  }

  // ---------------------------------------------------------------- Seiten
  var app;
  function home() {
    S.loc = ""; save();
    app.innerHTML = "";
    var intro = el("div", "card story blk intro");
    intro.innerHTML = '<div class="badge">' + I.flask + '</div><div class="bd">' + sceneHtml(C.INTRO.scene) + '<div class="kicker" style="color:var(--navy)">' + LB.auftrag + '</div><h2>' + C.INTRO.title + "</h2><p>" + C.INTRO.story + '</p><p class="note">' + C.INTRO.hinweis + "</p></div>";
    if (C.INTRO.anim && F[C.INTRO.anim.fig]) {
      var rb = el("button", "btn ghost intro-replay", "↺ " + LB.introReplay); rb.type = "button"; rb.onclick = introAnim;
      intro.querySelector(".bd").appendChild(el("div", "btns")).appendChild(rb);
    }
    app.appendChild(intro);
    // Legende der Feldtypen (Startseite)
    var lg = el("div", "flegend");
    lg.innerHTML = '<span class="fl-t">' + (LB.felder || "So erkennst du die Felder:") + "</span>" +
      [["bgr", "book", "Hintergrund"], ["info", "info", "Info"], ["ex", "pencil", "Übung"], ["merke", "star", "Merke"]].map(function (f) {
        return '<span class="fl ' + f[0] + '"><span class="badge">' + I[f[1]] + '</span><span class="kicker">' + f[2] + "</span></span>";
      }).join("");
    app.appendChild(lg);
    var h = el("h3", null, LB.karte); h.style.marginTop = "18px"; app.appendChild(h);
    var lwn = el("p", "note lwhint", LB.lwHint + " <b class=\"lw\">" + wordSoFar() + "</b>"); app.appendChild(lwn);
    if (ZI.length && LB.zirkelHint) app.appendChild(el("p", "note zhint", LB.zirkelHint));
    var map = el("div", "map");
    ST.forEach(function (s, i) {
      var u = unlocked(i), d = stationDone(i);
      var b = el("button", "stc" + (u ? "" : " lock") + (d ? " done" : ""));
      var ms = maxStars(i);
      b.innerHTML = '<div class="badge">' + I[u ? s.icon : "lock"] + '</div><div><div class="t1">Station ' + s.nr + " · " + s.ort + '</div><div class="t2">' + s.title + '</div><div class="t3">ca. ' + s.min + " min" + (ms ? ' · <span class="tstar" title="' + LB.sterne + ' in der Bonus-Runde">★ ' + stars(i) + "/" + ms + "</span>" : "") + '</div></div><div class="stamp">' + s.stempel + "</div>";
      b.setAttribute("data-st", s.id);
      if (u) b.onclick = function () { openStation(i); };
      else b.title = ZI.length ? (ZI.indexOf(i) > -1 ? "Erst die Stationen davor abschließen" : "Erst alle Stationen davor abschließen") : "Erst die vorherige Station abschließen";
      map.appendChild(b);
    });
    app.appendChild(map);
    renderHead();
    window.scrollTo(0, 0);
  }

  var cur = -1, wasDone = {};
  function openStation(si, keepScroll) {
    cur = si; S.loc = ST[si].id; save();
    wasDone[si] = stationDone(si);
    var s = ST[si];
    app.innerHTML = "";
    var back = el("button", "back", "← " + LB.karte); back.onclick = home; app.appendChild(back);
    var hd = el("div", "sthead");
    hd.innerHTML = '<div class="badge">' + I[s.icon] + '</div><div><div class="t1">Station ' + s.nr + " · " + s.ort + "</div><h2>" + s.title + "</h2></div>";
    app.appendChild(hd);
    var sto = el("div", "card story blk");
    sto.innerHTML = '<div class="badge">' + I.flask + '</div><div class="bd">' + sceneHtml(s.scene) + '<div class="kicker" style="color:var(--navy)">' + LB.stationAuftrag + '</div><p>' + s.story + "</p></div>";
    app.appendChild(sto);
    var host = el("div"); app.appendChild(host);
    renderBlocks(si, host);
    renderHead();
    if (!keepScroll) window.scrollTo(0, 0);
  }

  function renderBlocks(si, host) {
    var s = ST[si];
    host.innerHTML = "";
    var stop = false;
    for (var bi = 0; bi < s.blocks.length && !stop; bi++) {
      var b = s.blocks[bi];
      if (isBonus(b)) continue;
      if (b.t === "ex") {
        host.appendChild(exCard(b, si));
        if (!exDone(b.id)) stop = true;
      } else if (b.t === "quiz") {
        var qh = el("h3", null, b.title); qh.style.marginTop = "18px"; host.appendChild(qh);
        for (var qi = 0; qi < b.qs.length; qi++) {
          var q = b.qs[qi];
          var qx = { id: q.id, type: "mc", op: q.op, task: q.task, options: q.options, multi: false };
          host.appendChild(exCard(qx, si));
          if (!exDone(q.id)) { stop = true; break; }
        }
      } else if (b.t === "cert") {
        host.appendChild(certCard());
      } else {
        host.appendChild(infoCard(b));
      }
    }
    if (!stop && stationDone(si)) {
      var celebrate = !wasDone[si]; wasDone[si] = true;
      host.appendChild(doneCard(si, celebrate));
      var bon = bonusSection(si); if (bon) host.appendChild(bon);
      if (celebrate) setTimeout(function () { FX.stationDone($("#done-" + s.id)); checkBadges(); }, 60);
    }
  }

  function refreshStation(afterId) {
    if (cur < 0) return;
    var host = app.lastChild;
    var y = window.scrollY;
    renderBlocks(cur, host);
    renderHead();
    window.scrollTo(0, y);
    if (afterId) {
      var c = document.getElementById("ex-" + afterId);
      var t = c && c.nextElementSibling;
      if (t && t.tagName === "H3") t = t.nextElementSibling || t;
      if (t && t.scrollIntoView) setTimeout(function () { t.scrollIntoView({ behavior: "smooth", block: "start" }); }, 80);
    }
  }

  // Lösungswort aus den Stempeln: bisher freigespielte Buchstaben, sonst Unterstrich
  function wordSoFar() { return ST.map(function (s, i) { return stationDone(i) ? s.stempel : "_"; }).join(" "); }
  function doneCard(si, celebrate) {
    var s = ST[si];
    var d = el("div", "card done-card" + (celebrate ? " slam" : ""));
    d.id = "done-" + s.id;
    var nx = nextOpen(si), nxt = nx > -1;
    d.innerHTML = '<div class="kicker" style="color:var(--ok)">Station geschafft</div><div class="big">' + s.stempel + "</div><p>Du hast den " + LB.stempel + " <b>„" + s.stempel + "“</b> erhalten.</p><p>" + LB.lw + " bisher: <b class=\"lw\">" + wordSoFar() + "</b></p>";
    var bt = el("div", "btns"); bt.style.justifyContent = "center";
    if (nxt) { var b1 = el("button", "btn", "Weiter zu Station " + ST[nx].nr + " →"); b1.onclick = function () { openStation(nx); }; bt.appendChild(b1); }
    var b2 = el("button", "btn ghost", "← " + LB.karte); b2.onclick = home; bt.appendChild(b2);
    d.appendChild(bt);
    return d;
  }

  // ---------------------------------------------------------------- Infokarten
  // Szenenbild (optional) oben in der Auftragskarte: C.INTRO.scene bzw. Station.scene = Schlüssel aus FIGS
  function sceneHtml(key) { return key && F[key] ? '<div class="scene">' + F[key].svg + "</div>" : ""; }
  function figHtml(key) {
    var f = F[key]; if (!f) return "";
    return '<div class="figwrap" data-fig="' + key + '">' + f.svg + '</div><div class="swipe">↔ Abbildung seitlich wischen</div>';
  }
  function fixFigs(root) {
    root.querySelectorAll(".figwrap").forEach(function (w) {
      var sv = w.querySelector("svg.fig"); if (!sv) return;
      var nat = +sv.getAttribute("width");
      sv.style.setProperty("--fw", nat + "px");
      sv.style.minWidth = Math.round(nat * 0.62) + "px";
      setTimeout(function () { if (w.scrollWidth > w.clientWidth + 2) w.classList.add("scroll"); }, 0);
      // Animierte Abbildung (Klasse "anim" oder SMIL): Knopf zum Neustarten
      if (!w.dataset.rp && sv.querySelector(ANIM_SEL)) {
        w.dataset.rp = "1";
        var sw = w.nextElementSibling, anchor = sw && sw.classList.contains("swipe") ? sw : w;
        anchor.insertAdjacentElement("afterend", replayBar(LB.replay, function () { restartNode(w.querySelector("svg.fig")); }));
      }
    });
  }

  // ---------------------------------------------------------------- Animationen wiederholen
  // Jede Animation bekommt einen Knopf, der sie auf den Anfang zurücksetzt, damit man sie neu
  // durchspielen kann. Zurückgesetzt wird nur die Darstellung – nie Punkte, Antworten oder Fortschritt.
  // Neue animierte Übungstypen: replayBar(label, fn) in den Übungskörper hängen, fn zeichnet den Anfangszustand neu.
  var ANIM_SEL = ".anim, animate, animateTransform, animateMotion, set";
  function replayBar(label, onClick) {
    var bar = el("div", "replaybar");
    var b = el("button", "btn ghost replay", "↺ " + (label || LB.replay));
    b.type = "button";
    b.onclick = function (e) { e.preventDefault(); onClick(); };
    bar.appendChild(b);
    return bar;
  }
  // Startet CSS-Animationen und SMIL-Zeitleiste eines Knotens neu (Klon ersetzt das Original).
  function restartNode(node) {
    if (!node || !node.parentNode) return node;
    var n = node.cloneNode(true);
    node.parentNode.replaceChild(n, node);
    return n;
  }
  function stoffTable(keys, showGhs, showP) {
    var h = '<div class="tscroll"><table class="t"><tr><th>Chemikalie</th>' + (showGhs ? "<th>Piktogramme</th><th>Signalwort</th>" : "") + "<th>H-Sätze</th>" + (showP ? "<th>P-Sätze (Auswahl)</th>" : "") + "</tr>";
    keys.forEach(function (k) {
      var s = C.STOFFE[k];
      h += "<tr><td>" + s.name + "</td>" + (showGhs ? '<td><div class="ghsrow">' + (s.ghs.length ? s.ghs.map(function (g) { return G[g]; }).join("") : "–") + "</div></td><td>" + s.sw + "</td>" : "") + "<td>" + s.h.join("<br>") + "</td>" + (showP ? "<td class=\"psz\">" + ((s.p && s.p.length) ? s.p.join("<br>") : "–") + "</td>" : "") + "</tr>";
    });
    return h + "</table></div>";
  }
  function ghsLegend() {
    var h = '<div class="legend">';
    ["GHS05", "GHS07", "GHS08", "GHS09"].forEach(function (g) { h += "<span>" + G[g] + "<b>" + g + "</b>&nbsp;" + C.GHS_TXT[g] + "</span>"; });
    return h + "</div>";
  }
  function karteiHtml() {
    return '<div class="kartei"><div class="col gut"><h4>gut löslich in Wasser</h4><ul>' + C.KARTEI.gut.map(function (x) { return "<li>" + x + "</li>"; }).join("") +
      '</ul></div><div class="col schwer"><h4>schwer löslich in Wasser</h4><ul>' + C.KARTEI.schwer.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul></div></div>";
  }
  // Foto: free=true bei freier Lizenz (Quelle/Lizenz stehen in cap), sonst Buchabbildung mit Hinweis; small=true für Porträts
  function photo(key, cap, free, small, url) { return '<figure class="photo' + (small ? " small" : "") + '"><img alt="' + esc(cap.replace(/<[^>]+>/g, "")) + '" src="' + IMG[key] + '"><figcaption>' + cap + (url ? ' · <a href="' + esc(url) + '" target="_blank" rel="noopener">Bildquelle</a>' : "") + (free ? "" : " · nur für den geschlossenen mebis-Kurs") + "</figcaption></figure>"; }

  function infoCard(b) {
    var map = { info: ["info", "info", "Info"], merke: ["merke", "star", "Merke"], bg: ["bgr", "book", "Hintergrund"] };
    var m = map[b.t];
    var c = el("div", "card blk " + m[0]);
    var h = '<div class="badge">' + I[m[1]] + '</div><div class="bd"><div class="kicker">' + m[2] + "</div><h3>" + b.title + "</h3>";
    if (b.lead) h += '<p class="lead">' + b.lead + "</p>";
    if (b.fig) h += figHtml(b.fig);
    if (b.kartei) h += karteiHtml();
    (b.text || []).forEach(function (t) { h += "<p>" + t + "</p>"; });
    if (b.table) {
      h += '<div class="tscroll"><table class="t"><tr>' + b.table.head.map(function (x) { return "<th>" + x + "</th>"; }).join("") + "</tr>" +
        b.table.rows.map(function (r) { return "<tr>" + r.map(function (x) { return "<td>" + x + "</td>"; }).join("") + "</tr>"; }).join("") + "</table></div>";
      if (b.table.caption) h += '<div class="cap">' + b.table.caption + "</div>";
    }
    if (b.stoffe) h += stoffTable(b.stoffe, b.showGhs, b.showP);
    if (b.legend) h += ghsLegend();
    if (b.stoffe) h += '<div class="legend"><span>' + GB.brille + "Schutzbrille tragen</span><span>" + GB.hand + "Schutzhandschuhe tragen</span></div>";
    if (b.bullets) h += "<ul>" + b.bullets.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>";
    if (b.img) h += photo(b.img, b.imgcap, b.imgfree, b.imgsmall, b.imgurl);
    h += "</div>";
    c.innerHTML = h;
    fixFigs(c);
    return c;
  }

  // ---------------------------------------------------------------- Übungskarte (Rahmen)
  function exCard(ex, si) {
    var PRO = !!ex.profi, store = PRO ? S.px : S.ex;
    var c = el("div", "card blk ex" + (PRO ? " profi" : ""));
    c.id = "ex-" + ex.id;
    c.innerHTML = '<div class="badge">' + I[PRO ? "crown" : "pencil"] + '</div><div class="bd"><div class="kicker">' + (PRO ? LB.profi + " (freiwillig) · " + ex.id : "Übung " + ex.id) + '</div><p class="task"><span class="op">' + ex.op + "</span>" + ex.task + "</p></div>";
    var bd = c.querySelector(".bd");
    if (ex.fig && !TYPES[ex.type].ownFig) { var fw = el("div", null, figHtml(ex.fig)); bd.appendChild(fw); fixFigs(fw); }
    if (ex.img) bd.appendChild(el("div", null, photo(ex.img, ex.imgcap, ex.imgfree, ex.imgsmall, ex.imgurl)));
    if (ex.note) bd.appendChild(el("p", "note", ex.note));
    var body = el("div", "exbody"); bd.appendChild(body);
    var fb = el("div", "fb exfb"); var btns = el("div", "btns exbtns");
    var bCheck = el("button", "btn", "Prüfen"); var bSol = el("button", "btn ghost", "Lösung zeigen"); bSol.hidden = true;
    var stat = el("span", "status");
    btns.appendChild(bCheck); btns.appendChild(bSol); btns.appendChild(stat);
    bd.appendChild(btns); bd.appendChild(fb);
    var rec = store[ex.id] || [0, 0, 0];
    var ctl = {
      setCheck: function (v) { bCheck.hidden = !v; },
      label: function (t) { bCheck.textContent = t; },
      fb: function (cls, html) { fb.className = "fb exfb " + cls; fb.innerHTML = html; },
      // Übungstypen ohne Prüfen-Knopf (z. B. Wimmelbild): Fehlgriff zählen bzw. fertig melden
      miss: function () { rec[1]++; store[ex.id] = [0, rec[1], 0]; save(); if (rec[1] >= (ex.solAfter || 3)) bSol.hidden = false; },
      award: function (msg) { rec[1] = Math.max(rec[1], 0) + 1; win(msg); },
      done: function (pts, msg) { finish(pts, msg); },
      id: ex.id
    };
    var R = TYPES[ex.type](body, ex, ctl);
    c._R = R;
    function finish(pts, msg) {
      store[ex.id] = [pts, rec[1], pts > 0 || rec[2] === 2 ? 1 : 2];
      if (rec[2] === 2) store[ex.id][2] = 2;
      save();
      lockDone(msg);
      renderHead();
      if (pts > 0) FX.ok(bd, "+" + pts);
      checkBadges();
      setTimeout(function () { refreshStation(ex.id); }, 350);
    }
    function lockDone(msg) {
      R.showSolution(); R.lock && R.lock();
      bCheck.hidden = true; bSol.hidden = true;
      var r = store[ex.id];
      stat.textContent = r[2] === 2 ? "Lösung angezeigt – " + (PRO ? "keine Sterne" : "0 Punkte") : PRO ? "gelöst – " + "★".repeat(r[0]) : "gelöst – " + r[0] + " von " + MAXP + " Punkten";
      if (msg) ctl.fb(r[2] === 2 ? "sol" : "ok", msg);
    }
    function win(msg) {
      var pts = PRO ? (rec[1] === 1 ? 3 : rec[1] === 2 ? 2 : 1) : (rec[1] === 1 ? MAXP : rec[1] === 2 ? Math.round(MAXP * 0.6) : Math.round(MAXP * 0.3));
      store[ex.id] = [pts, rec[1], 1];
      save();
      lockDone(msg || "Richtig!");
      renderHead();
      FX.ok(bd, PRO ? "+" + pts + " ★" : "+" + pts);
      checkBadges();
      setTimeout(function () { refreshStation(ex.id); }, R.delay || 900);
    }
    bCheck.onclick = function () {
      var res = R.check();
      if (!res) return;
      if (res.incomplete) { ctl.fb("no", res.msg); return; }
      rec[1]++;
      store[ex.id] = [0, rec[1], 0];
      if (res.ok) win(res.msg);
      else {
        save();
        FX.no();
        ctl.fb("no", res.msg || "Noch nicht ganz richtig. Versuche es noch einmal.");
        if (rec[1] >= 2) bSol.hidden = false;
      }
    };
    bSol.onclick = function () {
      store[ex.id] = [0, rec[1], 2]; rec[2] = 2; save();
      lockDone("Hier ist die Lösung. Schau sie dir genau an – dann geht es weiter.");
      renderHead();
      setTimeout(function () { refreshStation(ex.id); }, 1200);
    };

      });

    });
    wrap.innerHTML = h + "</table>";
    body.appendChild(wrap);
    function cells() { return Array.prototype.slice.call(wrap.querySelectorAll("td[data-r]")); }
    function val(sel) { var o = sel.options[sel.selectedIndex]; return o && o.value ? o.getAttribute("data-h") : ""; }
    return {
      check: function () {

        if (!wrong) return { ok: true };
        return { ok: false, msg: wrong + " Feld(er) stimmen noch nicht. Schau dir " + ({ spoon: "die Löffel", watch: "die Uhrgläser" }[ex.vessel] || "die Reagenzgläser") + " noch einmal genau an." };
      },
      solve: function () { cells().forEach(function (td) { var sel = td.querySelector("select"), want = ex.rows[+td.dataset.r].sol[+td.dataset.c]; for (var i = 0; i < sel.options.length; i++) if (sel.options[i].getAttribute("data-h") === want) sel.selectedIndex = i; td.classList.remove("bad"); td.classList.add("good"); }); },
      wrongFill: function () { cells().forEach(function (td) { var sel = td.querySelector("select"), want = ex.rows[+td.dataset.r].sol[+td.dataset.c]; for (var i = 1; i < sel.options.length; i++) if (sel.options[i].getAttribute("data-h") !== want) { sel.selectedIndex = i; break; } }); },

    stepBox.appendChild(el("p", null, "<b>Versuchsablauf</b>")); stepBox.appendChild(log); stepBox.appendChild(el("p", "note", "Wähle den nächsten Schritt:")); stepBox.appendChild(opts); stepBox.appendChild(sfb);
    var k = 0, tb = null, obsWrap = el("div");
    var note = stepBox.querySelector(".note");
    var rpBar = replayBar(LB.replaySim, replay); rpBar.hidden = true; stepBox.appendChild(rpBar);
    body.appendChild(obsWrap);
    ctl.setCheck(false);
    function showOpts() {
      opts.innerHTML = "";

      rpBar.hidden = true; note.textContent = "Wähle den nächsten Schritt:";
      var cand = [{ text: ex.steps[k].text, ok: true }];

      if (k + 1 < ex.steps.length) cand.push({ text: ex.steps[k + 1].text, fb: "Dieser Schritt kommt später. Was muss vorher passieren?" });
      shuffle(cand, ex.id + "s" + k, function (a) { return a[0].ok; }).forEach(function (c) {
        var b = el("button", null, c.text);

    function doStep(i, animate) {

      showSolution: function () { while (k < ex.steps.length) { doStep(k, false); k++; } showOpts(); tb.solve(); },
      lock: function () { if (tb) tb.lock(); if (k >= ex.steps.length) note.textContent = ""; },

      stepWrong: function () { var b = Array.prototype.slice.call(opts.querySelectorAll("button")).filter(function (b) { return b.textContent !== ex.steps[k].text.replace(/<[^>]+>/g, ""); })[0]; if (b) b.click(); return sfb.className; }
    };

  // ---------------------------------------------------------------- Lehrkraft-Bereich
  function sha256(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var mp = Math.pow, maxWord = mp(2, 32), res = "", words = [], bl = ascii.length * 8, hash = [], k = [], pc = 0, isC = {};
    for (var cand = 2; pc < 64; cand++) { if (!isC[cand]) { for (var i = 0; i < 313; i += cand) isC[i] = cand; hash[pc] = (mp(cand, .5) * maxWord) | 0; k[pc++] = (mp(cand, 1 / 3) * maxWord) | 0; } }
    hash = hash.slice(0, 8);
    ascii = unescape(encodeURIComponent(ascii)); bl = ascii.length * 8;
    ascii += "\x80"; while (ascii.length % 64 - 56) ascii += "\x00";
    for (i = 0; i < ascii.length; i++) { var j = ascii.charCodeAt(i); words[i >> 2] |= j << ((3 - i) % 4) * 8; }
    words[words.length] = ((bl / maxWord) | 0); words[words.length] = (bl);
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), oh = hash; hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oh[i]) | 0;
    }
    for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; res += ((b < 16) ? 0 : "") + b.toString(16); }
    return res;
  }
  function teacher() {

      } else { $("#tmsg").textContent = "Falsches Passwort."; }
    };
  }

:root{
  /* Farbpalette Chemie (Skill chemie-lerneinheit, Abschnitt 5) */
  --navy:#1F3A5F; --ink:#22313F; --muted:#5B6B7C; --bg:#F6F9FD; --card:#EEF4FB; --line:#C9D9EE; --badge:#2F5D8C;
  --blue:#2F5D8C; --blue2:#3D73AD; --pastel:#DDE8F5; --light:#EEF4FB;
  --signal:#E0662B; --signal-d:#B5470F; --signal-l:#FFF1E8; --ok:#1E7B4F; --ok-l:#E6F4EC; --err:#B42318; --err-l:#FDECEA;
  /* Feldtypen */
  --info:#2F5D8C; --info-bg:#FFFFFF; --info-line:#C9D9EE;
  --ex:#3D73AD; --ex-bg:#E4EFFB; --ex-line:#8DB0D8;
  --merke:#E0662B; --merke-bg:#FFF1E8;
  --bgr:#7B72BF; --bgr-bg:#EFEDF8; --bgr-line:#8F86C9;
  --head:"Cambria","Caladea",Georgia,serif; --body:"Calibri","Carlito","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--head);color:var(--navy);margin:0 0 .4em;line-height:1.2}
button,select,input,textarea{font-family:var(--body);font-size:16px}
sub,sup{font-size:.72em;line-height:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#1F3A5F,#2F5D8C);color:#fff;box-shadow:0 2px 8px rgba(20,40,70,.25)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}
.brand .logo{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand .logo .ico{width:24px;height:24px}
.brand b{font-family:var(--head);font-size:19px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{opacity:.85;font-size:13.5px;display:block}
.brand > div{min-width:0}
.nav{display:flex;gap:6px;align-items:center}
.nav button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.nav button:hover{background:rgba(255,255,255,.26)}
.nav button[hidden]{display:none}
.score{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:150px}
.score .pts{font-weight:700}
.bar{width:150px;height:8px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:#F6B08C;width:0;transition:width .6s}
.stamps{display:flex;gap:3px}
.stamps span{width:19px;height:19px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.6);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:transparent}
.stamps span.on{background:#F6B08C;border:1.5px solid #fff;color:#1F3A5F}
main{padding:18px 0 40px}
/* Karten */
.card{background:#fff;border-radius:16px;padding:16px 18px;margin:14px 0;box-shadow:0 1px 3px rgba(31,58,95,.08);position:relative}
.blk{display:flex;gap:12px;align-items:flex-start}
.badge{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.badge .ico{width:22px;height:22px}
.blk .bd{flex:1;min-width:0}
.kicker{font-size:13px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.info{background:var(--info-bg);border:1px solid var(--info-line)}
.info .badge{background:var(--info)} .info .kicker{color:var(--info)}
.ex{background:var(--ex-bg);border:1px solid var(--ex-line)}
.ex .badge{background:var(--ex)} .ex .kicker{color:var(--ex)}
.merke{background:var(--merke-bg);border:2px solid var(--merke);box-shadow:4px 4px 0 rgba(224,102,43,.2)}
.merke .badge{background:var(--merke)} .merke .kicker{color:var(--merke)}
.bgr{background:var(--bgr-bg);border:2px dashed var(--bgr-line)}
.bgr .badge{background:var(--bgr)} .bgr .kicker{color:var(--bgr)}
.story{background:var(--card);border:1px solid var(--line)}
.story .badge{background:var(--navy)}
.scene{margin:2px 0 10px}
.scene svg{width:100%;height:auto;display:block;max-width:720px}
.lead{font-size:18px;margin:.2em 0 .5em}
.bd p{margin:.45em 0}
.bd ul{margin:.4em 0;padding-left:1.25em}
.bd li{margin:.3em 0}
.op{display:inline-block;background:var(--ex);color:#fff;border-radius:10px;padding:0 8px;font-size:13.5px;font-weight:700;margin-right:6px}
.task{font-weight:700;margin:.2em 0 .7em}
.figwrap{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.figwrap svg.fig{width:100%;height:auto;display:block;max-width:var(--fw)}
.swipe{display:none;font-size:13px;color:var(--muted);margin-top:-4px}
.figwrap.scroll + .swipe{display:block}
.photo{margin:10px 0}
.photo img{max-width:min(100%,430px);height:auto;border-radius:10px;display:block}
.photo.small img{max-width:min(100%,220px)}
.photo figcaption a{color:inherit}
.photo figcaption,.cap{font-size:13.5px;color:var(--muted);margin-top:4px}
table.t{border-collapse:collapse;width:100%;margin:8px 0;background:#fff;font-size:16px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
table.t th{background:var(--pastel);font-weight:700}
.tscroll{overflow-x:auto}
.ghsrow{display:flex;gap:4px;flex-wrap:wrap}
.ghsrow svg{width:40px;height:40px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0;font-size:15px}
.legend span{display:flex;align-items:center;gap:6px}
.legend svg{width:38px;height:38px}
/* Buttons */
.btn{background:var(--blue);color:#fff;border:none;border-radius:22px;padding:8px 18px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.signal{background:var(--signal)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
/* Animation neu abspielen */
.replaybar{display:flex;margin:6px 0 10px}
.replaybar[hidden]{display:none}
.btn.replay{padding:5px 14px;font-size:14.5px;font-weight:600}
.fb{margin-top:10px;padding:8px 12px;border-radius:10px;display:none}
.fb.ok{display:block;background:var(--ok-l);border:1px solid #9BD3B3;color:#1B5E3E}
.fb.no{display:block;background:var(--err-l);border:1px solid #EBB0A8;color:#8E2A1F}
.fb.sol{display:block;background:#FFF8E6;border:1px solid #F0D48A;color:#6B4E00}

<script>var C={"META": {"loesungswort": "REIF", "id": "c9sg_aggregatzustaende_visuell_v1", "kapitel": "2.1", "titel": "Aggregatzustände im Teilchenmodell", "untertitel": "Teilchen-Detektei, Akte 2", "rahmen": "Teilchen-Detektei · Akte 2: Die gefrorene Wäsche", "stand": "Oktober 2026", "fassung": "visuell", "datei": "Teilchen-Detektei_Aggregatzustaende", "scorm_titel": "Aggregatzustände im Teilchenmodell – Teilchen-Detektei, Akte 2", "labels": {"auftrag": "Neue Akte", "karte": "Ermittlungskarte", "stempel": "Detektiv-Stempel", "zertKopf": "Teilchen-Detektei", "lwHint": "Jede Station bringt einen Detektiv-Stempel mit einem Buchstaben. Zusammen ergeben sie das Lösungswort:"}}, "INTRO": {"scene": "fig_sc_garten", "title": "Akte 2: Die gefrorene Wäsche", "story": "Ein Anruf in der Teilchen-Detektei: Ein Nachbar hat an einem eiskalten Januartag nasse Wäsche aufgehängt. Das Thermometer zeigte die ganze Zeit −5 °C. Nach einer Stunde war die Wäsche steif gefroren – zwei Tage später war sie trocken, obwohl es nie wärmer als 0 °C wurde. Wohin ist das Wasser verschwunden? Durchlaufe vier Stationen, sammle Spuren und löse den Fall mit dem Teilchenmodell.", "hinweis": "Die Stationen werden nacheinander freigeschaltet. Bei jeder Übung gilt: 1. Versuch 10 Punkte, 2. Versuch 6 Punkte, danach 3 Punkte. Nach zwei Fehlversuchen kannst du dir die Lösung zeigen lassen (0 Punkte)."}, "STATIONS": [{"id": "s1", "nr": 1, "ort": "Detektivbüro", "title": "Drei Zustände unter der Superlupe", "icon": "lupe", "min": 4, "stempel": "R", "scene": "fig_sc_buero", "story": "Bevor du den Fall lösen kannst, brauchst du das wichtigste Werkzeug der Detektei: die Superlupe. Mit ihr siehst du, was auf der Teilchenebene los ist, wenn Wasser fest, flüssig oder gasförmig ist.", "blocks": [{"t": "info", "title": "Stoffebene: ein Stoff – drei Aggregatzustände", "lead": "Wasser kennst du als festes Eis, als flüssiges Wasser und gasförmig. Diese Zustände heißen <b>Aggregatzustände</b>. Kurzzeichen: (s) fest, (l) flüssig, (g) gasförmig.", "fig": "fig_stoffebene", "text": ["Ein <b>Feststoff</b> hat eine feste Form. Eine <b>Flüssigkeit</b> passt ihre Form dem Gefäß an. Ein <b>Gas</b> verteilt sich im ganzen Raum, der ihm zur Verfügung steht.", "Gasförmiges Wasser ist unsichtbar. Auch die Luft um dich herum enthält immer etwas gasförmiges Wasser. Die weißen „Dampfwolken“ über einem Kochtopf bestehen dagegen schon wieder aus winzigen Tröpfchen flüssigen Wassers."]}, {"t": "info", "title": "Teilchen-Zoom: Wasser in drei Zuständen", "lead": "Die Superlupe zeigt Wasserteilchen als blaue Dreiecke; die orangen Pfeile zeigen, wie sie sich bewegen. Beobachte genau: Wie sind die Teilchen angeordnet? Wie weit sind sie voneinander entfernt? Wie bewegen sie sich?", "fig": "fig_zoom3", "text": ["Wichtig: Die Teilchen selbst bleiben in allen drei Zuständen gleich – gleiche Größe, gleiche Masse, gleiche Form. Es ändern sich nur ihre <b>Anordnung</b>, ihre <b>Abstände</b> und ihre <b>Bewegung</b>."]}, {"t": "ex", "id": "1a", "type": "sort", "op": "Ordne", "task": "Ordne jede Beobachtung aus dem Teilchen-Zoom dem passenden Aggregatzustand zu.", "bins": [{"id": "s", "label": "fest (s)"}, {"id": "l", "label": "flüssig (l)"}, {"id": "g", "label": "gasförmig (g)"}], "items": [{"id": "a", "label": "Die Teilchen sind regelmäßig angeordnet.", "bin": "s"}, {"id": "b", "label": "Die Teilchen schwingen nur an ihrem Platz hin und her.", "bin": "s"}, {"id": "c", "label": "Die Teilchen liegen dicht beieinander, aber ungeordnet.", "bin": "l"}, {"id": "d", "label": "Die Teilchen gleiten aneinander vorbei.", "bin": "l"}, {"id": "e", "label": "Die Teilchen sind weit voneinander entfernt.", "bin": "g"}, {"id": "f", "label": "Die Teilchen fliegen schnell und frei durch den Raum.", "bin": "g"}]}, {"t": "merke", "title": "Aggregatzustände im Teilchenmodell", "bullets": ["<b>fest:</b> Die Teilchen sind regelmäßig angeordnet und schwingen nur an ihrem Platz. Starke Anziehungskräfte halten sie dort fest.", "<b>flüssig:</b> Die Teilchen liegen dicht, aber ungeordnet und gleiten aneinander vorbei. Die Anziehungskräfte halten sie noch zusammen, aber nicht mehr an festen Plätzen.", "<b>gasförmig:</b> Die Teilchen sind weit voneinander entfernt und fliegen schnell und frei umher. Die Anziehungskräfte wirken kaum noch.", "Von fest über flüssig zu gasförmig nimmt die <b>Bewegung</b> der Teilchen zu und die Wirkung der <b>Anziehungskräfte</b> ab. Beim Übergang zum Gas werden die <b>Abstände</b> sehr viel größer.", "Die Teilchen selbst verändern sich dabei nicht."]}, {"t": "ex", "id": "1b", "type": "mc", "multi": false, "op": "Beurteile", "task": "Eine Mitschülerin behauptet: „Beim Abkühlen ziehen sich die Teilchen eines Stoffes zusammen.“ Beurteile diese Aussage mithilfe des Teilchenmodells.", "options": [{"text": "Die Aussage ist falsch: Die Teilchen selbst bleiben gleich groß. Beim Abkühlen bewegen sie sich langsamer – kleiner werden höchstens die Abstände zwischen ihnen.", "ok": true, "fb": "Richtig: Nicht die Teilchen schrumpfen. Es ändern sich nur Bewegung, Anordnung und Abstände."}, {"text": "Die Aussage ist richtig: Kalte Teilchen sind kleiner als warme Teilchen.", "ok": false, "fb": "In der Superlupe sind die Teilchen in allen Zuständen gleich groß. Beim Abkühlen bewegen sie sich nur langsamer."}, {"text": "Die Aussage ist richtig: Im Feststoff sind die Teilchen kleiner als in der Flüssigkeit.", "ok": false, "fb": "Schau noch einmal in die Superlupe: Die Dreiecke sind im Eis genauso groß wie im flüssigen Wasser."}, {"text": "Die Aussage ist falsch: Beim Abkühlen entfernen sich die Teilchen immer weiter voneinander.", "ok": false, "fb": "Beim Abkühlen werden die Teilchen langsamer – die Anziehungskräfte halten sie dann eher stärker zusammen."}]}]}, {"id": "s2", "nr": 2, "ort": "Am Weiher", "title": "Zustandsänderungen und Energie", "icon": "snow", "min": 4, "stempel": "E", "scene": "fig_sc_weiher", "story": "Ein Winterspaziergang am zugefrorenen Weiher: Überall ändert Wasser seinen Aggregatzustand. Sammle Spuren für deine Akte – welcher Übergang steckt jeweils dahinter, und was hat Energie damit zu tun?", "blocks": [{"t": "info", "title": "Sechs Übergänge", "lead": "Zwischen den drei Aggregatzuständen gibt es sechs Übergänge. Manche Feststoffe werden sogar direkt gasförmig (<b>Sublimieren</b>); umgekehrt kann aus einem Gas direkt ein Feststoff entstehen (<b>Resublimieren</b>).", "fig": "fig_uebergaenge", "text": ["<b>Energie zuführen</b> (z. B. durch Erwärmen): Die Teilchen bewegen sich stärker und können die Anziehungskräfte überwinden – beim Schmelzen, Verdampfen und Sublimieren.", "<b>Energie abgeben</b> (Abkühlen): Die Teilchen werden langsamer, und die Anziehungskräfte halten sie wieder stärker zusammen – beim Erstarren, Kondensieren und Resublimieren."]}, {"t": "ex", "id": "2a", "type": "select", "op": "Ordne", "task": "Ordne jeder Spur den passenden Übergang zu und gib an, ob dabei Energie zugeführt oder abgegeben wird.", "cols": ["Übergang", "Energie wird …"], "colOpts": [["schmelzen", "erstarren", "verdampfen", "kondensieren", "sublimieren", "resublimieren"], ["zugeführt", "abgegeben"]], "rows": [{"label": "Eiszapfen tropfen in der Mittagssonne.", "sol": ["schmelzen", "zugeführt"]}, {"label": "Eine Pfütze überzieht sich nachts mit einer Eisschicht.", "sol": ["erstarren", "abgegeben"]}, {"label": "Das Teewasser siedet im Wasserkocher.", "sol": ["verdampfen", "zugeführt"]}, {"label": "In der warmen Hütte beschlägt die kalte Brille mit winzigen Wassertröpfchen.", "sol": ["kondensieren", "abgegeben"]}, {"label": "In einer eiskalten Nacht wachsen Eiskristalle (Raureif) an trockenen Zweigen – ohne flüssiges Wasser.", "sol": ["resublimieren", "abgegeben"]}, {"label": "Trockeneis (festes Kohlenstoffdioxid) wird an der Luft immer kleiner, ohne dass eine Flüssigkeit entsteht.", "sol": ["sublimieren", "zugeführt"]}]}, {"t": "info", "title": "Schmelztemperatur und Siedetemperatur", "lead": "Bei seiner <b>Schmelztemperatur</b> schmilzt ein Feststoff, bei seiner <b>Siedetemperatur</b> siedet eine Flüssigkeit. Bei normalem Luftdruck gilt: Unterhalb der Schmelztemperatur ist ein Stoff fest, zwischen den beiden Temperaturen flüssig, oberhalb der Siedetemperatur gasförmig.", "table": {"head": ["Stoff", "Schmelztemperatur", "Siedetemperatur"], "rows": [["Sauerstoff", "−219 °C", "−183 °C"], ["Ethanol", "−114 °C", "78 °C"], ["Wasser", "0 °C", "100 °C"], ["Iod", "114 °C", "184 °C"], ["Eisen", "1538 °C", "2861 °C"]], "caption": "Werte bei normalem Luftdruck, gerundet"}, "text": ["Auch unterhalb dieser Temperaturen können sich einzelne Teilchen lösen und in die Luft gelangen – so trocknet eine Pfütze, ohne zu sieden.", "Jeder Stoff hat seine eigenen Werte. Erinnere dich an Regel 4 des Teilchenmodells: Zwischen den Teilchen gibt es Anziehungskräfte, die bei verschiedenen Stoffen unterschiedlich stark sind."]}, {"t": "ex", "id": "2b", "type": "mc", "multi": false, "op": "Erkläre", "task": "Erkläre mithilfe des Teilchenmodells, warum Eisen erst bei 1538 °C schmilzt, Wasser dagegen schon bei 0 °C.", "options": [{"text": "Zwischen den Eisenteilchen wirken viel stärkere Anziehungskräfte. Um sie zu überwinden, muss mehr Energie zugeführt werden – also eine höhere Temperatur erreicht sein.", "ok": true, "fb": "Richtig: Je stärker die Anziehungskräfte, desto höher die Schmelztemperatur."}, {"text": "Eisenteilchen sind selbst fest und hart, Wasserteilchen nicht.", "ok": false, "fb": "Einzelne Teilchen haben keine Stoffeigenschaften wie „fest“ oder „hart“ – das kennst du aus der letzten Akte."}, {"text": "Eisenteilchen bewegen sich bei gleicher Temperatur schneller als Wasserteilchen.", "ok": false, "fb": "Schnellere Bewegung würde das Schmelzen erleichtern, nicht erschweren. Entscheidend sind die Anziehungskräfte."}, {"text": "Eisenteilchen sind größer, deshalb können sie nicht aneinander vorbeigleiten.", "ok": false, "fb": "Die Größe der Teilchen erklärt die Schmelztemperatur nicht. Denk an Regel 4: Anziehungskräfte."}]}, {"t": "ex", "id": "2c", "type": "select", "op": "Leite ab", "task": "Leite aus der Tabelle ab, in welchem Aggregatzustand die Stoffe bei Zimmertemperatur (20 °C) vorliegen.", "cols": ["Aggregatzustand bei 20 °C"], "colOpts": [["fest", "flüssig", "gasförmig"]], "rows": [{"label": "Sauerstoff", "sol": ["gasförmig"]}, {"label": "Ethanol", "sol": ["flüssig"]}, {"label": "Iod", "sol": ["fest"]}, {"label": "Eisen", "sol": ["fest"]}]}]}, {"id": "s3", "nr": 3, "ort": "Labor", "title": "Iod: vom Feststoff direkt zum Gas", "icon": "flask", "min": 4, "stempel": "I", "scene": "fig_sc_labor", "story": "Gibt es den direkten Weg vom Feststoff zum Gas wirklich? Im Labor der Detektei liegt ein Beweisstück bereit: Iod, ein grauschwarzer, glänzender Feststoff. Den Versuch habt ihr im Unterricht gesehen – spiele ihn hier noch einmal Schritt für Schritt durch.", "blocks": [{"t": "info", "title": "Gefahrstoff Iod", "lead": "Iod ist gesundheitsschädlich, reizt Haut, Augen und Atemwege, schädigt bei längerer Aufnahme die Schilddrüse und ist sehr giftig für Wasserorganismen. Deshalb arbeitet man im <b>Abzug</b>, mit <b>Schutzbrille</b> und <b>Schutzhandschuhen</b> (Nitril). Iodreste kommen nie in den Ausguss, sondern in den Sammelbehälter.", "stoffe": ["iod"], "showGhs": true, "showP": true, "text": []}, {"t": "ex", "id": "3a", "type": "sim", "op": "Untersuche", "task": "Untersuche in der Simulation, was beim Erwärmen von Iod geschieht: Wähle die Schritte in der richtigen Reihenfolge und beschreibe danach deine Beobachtungen.", "stage0": "fig_iod_s0", "steps": [{"text": "Schutzbrille und Schutzhandschuhe anziehen; nur im Abzug arbeiten.", "fig": "fig_iod_s1"}, {"text": "Mit dem Spatel einige Iodkristalle in das trockene Becherglas geben.", "fig": "fig_iod_s2"}, {"text": "Ein Uhrglas mit Eiswürfeln auf das Becherglas legen.", "fig": "fig_iod_s3"}, {"text": "Das Becherglas auf der Heizplatte schwach erwärmen.", "fig": "fig_iod_s4"}], "wrong": [{"text": "Die Iodkristalle mit den Fingern in das Becherglas legen.", "fb": "Iod ist gesundheitsschädlich bei Hautkontakt (H312) – immer mit Spatel und Schutzhandschuhen arbeiten."}, {"text": "Am Becherglas riechen, ob schon gasförmiges Iod entsteht.", "fb": "Gasförmiges Iod ist gesundheitsschädlich beim Einatmen und kann die Atemwege reizen (H332, H335). An Chemikalien riecht man nie – der Abzug saugt das Gas ab."}], "cols": ["Beobachtung beim Erwärmen"], "colOpts": [["violettes Gas", "farbloses Gas", "werden kleiner, ohne flüssig zu werden", "schmelzen zu einer Flüssigkeit", "dunkle Kristalle", "Wassertropfen"]], "rows": [{"label": "Raum im Becherglas", "sol": ["violettes Gas"]}, {"label": "Iodkristalle am Boden", "sol": ["werden kleiner, ohne flüssig zu werden"]}, {"label": "Unterseite des Uhrglases", "sol": ["dunkle Kristalle"]}]}, {"t": "ex", "id": "3b", "type": "select", "op": "Deute", "task": "Deute deine Beobachtungen: Ordne jedem Ort den Übergang zu und gib an, ob den Iodteilchen dort Energie zugeführt wird oder ob sie Energie abgeben.", "cols": ["Übergang", "Energie wird …"], "colOpts": [["schmelzen", "erstarren", "verdampfen", "kondensieren", "sublimieren", "resublimieren"], ["zugeführt", "abgegeben"]], "rows": [{"label": "Boden des Becherglases (Heizplatte)", "sol": ["sublimieren", "zugeführt"]}, {"label": "Unterseite des Uhrglases (Eiswürfel)", "sol": ["resublimieren", "abgegeben"]}]}, {"t": "merke", "title": "Sublimieren und Resublimieren", "bullets": ["Iod <b>sublimiert</b> beim schwachen Erwärmen (unterhalb seiner Schmelztemperatur von 114 °C): Aus dem Feststoff entsteht direkt violettes, gasförmiges Iod, ohne dass es vorher flüssig wird.", "Am kalten Uhrglas geben die Iodteilchen Energie ab, werden langsamer und lagern sich wieder zu einem Feststoff zusammen: Iod <b>resublimiert</b>. Die Eiswürfel halten das Uhrglas kalt."]}]}, {"id": "s4", "nr": 4, "ort": "Detektivzentrale", "title": "Fall gelöst", "icon": "star", "min": 3, "stempel": "F", "scene": "fig_sc_zentrale", "story": "Zurück in der Zentrale hängen alle Spuren an der Pinnwand. Ordne sie in deiner Concept-Map, beantworte die letzten Fragen – und löse den Fall der gefrorenen Wäsche.", "blocks": [{"t": "ex", "id": "4a", "type": "cmap", "op": "Ordne", "task": "Ordne jedem freien Feld der Concept-Map den passenden Begriff zu. Die Pfeile zeigen, von welchem Aggregatzustand zu welchem es geht."}, {"t": "quiz", "id": "4b", "title": "Abschlussfragen", "qs": [{"id": "4b1", "op": "Deute", "task": "Zurück zum Fall: Die gefrorene Wäsche wurde bei −5 °C trocken, obwohl das Eis nie geschmolzen ist. Deute diese Beobachtung.", "options": [{"text": "Das Eis ist sublimiert: Wasserteilchen haben sich direkt aus dem Eis gelöst und sind als gasförmiges Wasser in die Luft gelangt.", "ok": true, "fb": "Fall gelöst! Wie das Iod im Labor kann auch Eis sublimieren – langsam, aber auch unter 0 °C."}, {"text": "Das Eis ist unbemerkt geschmolzen, und das flüssige Wasser ist danach verdampft.", "ok": false, "fb": "Die Schmelztemperatur von Wasser liegt bei 0 °C. Bei −5 °C schmilzt Eis nicht."}, {"text": "Die Wasserteilchen sind durch die Kälte so klein geworden, dass man sie nicht mehr sieht.", "ok": false, "fb": "Teilchen ändern ihre Größe nicht – weder durch Kälte noch durch Wärme."}, {"text": "Das Eis ist in die Fasern der Wäsche eingezogen und steckt noch darin.", "ok": false, "fb": "Dann wäre die Wäsche nicht trocken. Das Wasser muss die Wäsche verlassen haben."}]}, {"id": "4b2", "op": "Beschreibe", "task": "Beschreibe, was beim Sieden von Wasser auf der Teilchenebene geschieht.", "options": [{"text": "Die Wasserteilchen bewegen sich so stark, dass sie die Anziehungskräfte überwinden und sich weit voneinander entfernen.", "ok": true, "fb": "Richtig."}, {"text": "Die Wasserteilchen werden heiß und dehnen sich aus.", "ok": false, "fb": "Einzelne Teilchen dehnen sich nicht aus – nur ihre Abstände werden größer."}, {"text": "Die Wasserteilchen zerfallen in kleinere Teilchen.", "ok": false, "fb": "Die Teilchen bleiben beim Sieden unverändert – gasförmiges Wasser besteht aus denselben Teilchen."}, {"text": "Zwischen den Wasserteilchen entsteht Luft.", "ok": false, "fb": "Zwischen den Teilchen ist leerer Raum (Regel 1) – keine Luft."}]}]}, {"t": "cert"}]}], "STOFFE": {"iod": {"name": "Iod (fest)", "ghs": ["GHS07", "GHS08", "GHS09"], "sw": "Gefahr", "h": ["H302+H312+H332 Gesundheitsschädlich bei Verschlucken, Hautkontakt oder Einatmen.", "H315 Verursacht Hautreizungen.", "H319 Verursacht schwere Augenreizung.", "H335 Kann die Atemwege reizen.", "H372 Schädigt die Schilddrüse bei längerer oder wiederholter Exposition durch Verschlucken.", "H400 Sehr giftig für Wasserorganismen."], "p": ["P260 Dampf nicht einatmen.", "P273 Freisetzung in die Umwelt vermeiden.", "P280 Schutzhandschuhe und Augenschutz tragen.", "P305+P351+P338 Bei Kontakt mit den Augen: einige Minuten behutsam mit Wasser spülen."]}}, "CMAP": {"w": 760, "h": 420, "nodes": [{"id": "fe", "x": 110, "y": 50, "text": "fest"}, {"id": "fl", "x": 650, "y": 50, "text": "flüssig"}, {"id": "ga", "x": 380, "y": 375, "text": "gasförmig"}, {"id": "sch", "x": 380, "y": 50, "blank": true, "sol": "schmelzen"}, {"id": "ver", "x": 650, "y": 215, "blank": true, "sol": "verdampfen"}, {"id": "sub", "x": 110, "y": 215, "blank": true, "sol": "sublimieren"}, {"id": "en", "x": 380, "y": 215, "blank": true, "sol": "Energie zuführen"}], "edges": [{"a": "fe", "b": "sch", "t": ""}, {"a": "sch", "b": "fl", "t": ""}, {"a": "fl", "b": "ver", "t": ""}, {"a": "ver", "b": "ga", "t": ""}, {"a": "fe", "b": "sub", "t": ""}, {"a": "sub", "b": "ga", "t": ""}, {"a": "en", "b": "sch", "t": "nötig für"}, {"a": "en", "b": "ver", "t": "nötig für"}, {"a": "en", "b": "sub", "t": "nötig für"}], "options": ["schmelzen", "verdampfen", "sublimieren", "Energie zuführen", "erstarren", "kondensieren", "resublimieren", "Energie abgeben"]}, "CERT": {"title": "Detektivausweis – Akte 2", "text": "hat in der Teilchen-Detektei die Aggregatzustände im Teilchenmodell untersucht und den Fall der g <script>/* Lern-Engine: Stationen, Übungstypen, Punkte, Speicherung (localStorage / SCORM 1.2) */
(function () {
  "use strict";
  var M = C.META, ST = C.STATIONS;
  // Beschriftungen des Spielrahmens (in content.py META["labels"] überschreibbar)
  var LB = Object.assign({ auftrag: "Dein Auftrag", karte: "Stationskarte", stationAuftrag: "Auftrag", stempel: "Stempel", lw: "Lösungswort", lwHint: "Jede Station bringt einen Stempel mit einem Buchstaben. Zusammen ergeben sie das Lösungswort:",
    zertKopf: "Abschluss", kartei: "Kartei", karteiNotiz: "", replay: "Animation neu abspielen",
    replaySim: "Versuch neu durchspielen" }, M.labels || {});
  var KEY = M.id;
  var MAXP = 10;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var el = function (tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var MINUS = "−";

  // ---------------------------------------------------------------- Formeln richtig darstellen (Indizes und Ladungen)
  // Im HTML stehen echte <sub>/<sup>. Auswahllisten können kein HTML zeigen -> Unicode (CO₂, SO₄²⁻).
  // SVG kennt kein <sub>/<sup> -> svgRich() setzt versetzte tspans. Verglichen wird über den Inhalt, nie über die Anzeige.
  var SUBC = { "0": "₀", "1": "₁", "2": "₂", "3": "₃", "4": "₄", "5": "₅", "6": "₆", "7": "₇", "8": "₈", "9": "₉", "+": "₊", "−": "₋", "-": "₋", "(": "₍", ")": "₎" };
  var SUPC = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "+": "⁺", "−": "⁻", "-": "⁻", "(": "⁽", ")": "⁾" };
  function plain(h) { var d = document.createElement("div"); d.innerHTML = h; return d.textContent; }
  function uni(h) {
    var m = function (map) { return function (_, x) { return x.split("").map(function (c) { return map[c] || c; }).join(""); }; };
    return plain(String(h).replace(/<sub>(.*?)<\/sub>/g, m(SUBC)).replace(/<sup>(.*?)<\/sup>/g, m(SUPC)));
  }
  function svgRich(h, fs) {
    var out = "", cur = 0, mode = "", bold = false, ital = false, re = /<(\/?)(sub|sup|b|i)>|<[^>]*>|([^<]+)/g, m;
    while ((m = re.exec(String(h)))) {
      if (m[3] != null) {
        var want = mode === "sup" ? -0.42 * fs : mode === "sub" ? 0.24 * fs : 0, dy = want - cur; cur = want;
        out += '<tspan dy="' + dy.toFixed(1) + '"' + (mode ? ' font-size="' + (0.68 * fs).toFixed(1) + '"' : "") + (bold ? ' font-weight="700"' : "") + (ital ? ' font-style="italic"' : "") + ">" + m[3] + "</tspan>";
      } else if (m[2]) { var on = !m[1]; if (m[2] === "sub" || m[2] === "sup") mode = on ? m[2] : ""; else if (m[2] === "b") bold = on; else ital = on; }
    }
    if (cur) out += '<tspan dy="' + (-cur).toFixed(1) + '"></tspan>';
    return out;
  }
  function optHtml(o) { return '<option value="' + esc(plain(o)) + '" data-h="' + esc(o) + '">' + esc(uni(o)) + "</option>"; }

  // ---------------------------------------------------------------- Zufall (deterministisch pro Übung)
  function rng(seedStr) {
    var h = 2166136261;
    for (var i = 0; i < seedStr.length; i++) { h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
    return function () { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; };
  }
  var LOADSALT = String(Math.random());
  function shuffle(arr, seed, notEqual) {
    var a = arr.slice(), r = rng(seed + LOADSALT), tries = 0;
    do {
      for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
      tries++;
    } while (tries < 30 && ((notEqual && notEqual(a)) || (a.length > 2 && sameOrder(a, arr))));
    return a;
  }
  function sameOrder(a, b) { if (a.length !== b.length) return false; for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }

  // ---------------------------------------------------------------- Formeln
  function fmt(s) { return String(s).replace(/([A-Za-z\)])(\d+)/g, "$1<sub>$2</sub>"); }
  function qstr(q) { var a = Math.abs(q); return (a > 1 ? a : "") + (q > 0 ? "+" : MINUS); }
  function ionHtml(sym, q) { return fmt(sym) + "<sup>" + qstr(q) + "</sup>"; }

  // ---------------------------------------------------------------- Zustand / Speicher
  var S = { ex: {}, name: "", loc: "" };
  var preview = false;
  var scorm = null;
  function findAPI(win) {
    var n = 0;
    while (win && n < 12) {
      try { if (win.API) return win.API; } catch (e) { }
      if (win.parent && win.parent !== win) { win = win.parent; n++; } else break;
    }
    return null;
  }
  function initScorm() {
    var api = findAPI(window);
    if (!api) { try { if (window.opener) api = findAPI(window.opener); } catch (e) { } }
    if (!api) return;
    try {
      if (String(api.LMSInitialize("")) !== "true") return;
      scorm = api;
      var st = api.LMSGetValue("cmi.core.lesson_status");
      if (!st || st === "not attempted") api.LMSSetValue("cmi.core.lesson_status", "incomplete");
      var nm = api.LMSGetValue("cmi.core.student_name") || "";
      if (nm.indexOf(",") > -1) { var p = nm.split(","); nm = (p[1] || "").trim() + " " + p[0].trim(); }
      var sd = api.LMSGetValue("cmi.suspend_data");
      if (sd) { try { var o = JSON.parse(sd); if (o && o.ex) S = o; } catch (e) { } }
      if (nm && !S.name) S.name = nm.trim();
    } catch (e) { scorm = null; }
  }
  function load() {
    initScorm();
    if (!scorm) {
      try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); if (o && o.ex) S = o; } } catch (e) { }
    }
    try { preview = sessionStorage.getItem(KEY + "_pv") === "1"; } catch (e) { }
  }
  function save() {
    var js = JSON.stringify(S);
    if (scorm) {
      try {
        scorm.LMSSetValue("cmi.suspend_data", js.slice(0, 3900));
        scorm.LMSSetValue("cmi.core.score.min", "0");
        scorm.LMSSetValue("cmi.core.score.max", "100");
        scorm.LMSSetValue("cmi.core.score.raw", String(Math.round(100 * points() / maxPoints())));
        scorm.LMSSetValue("cmi.core.lesson_location", S.loc || "");
        if (allDone()) scorm.LMSSetValue("cmi.core.lesson_status", "completed");
        scorm.LMSCommit("");
      } catch (e) { }
    } else {
      try { localStorage.setItem(KEY, js); } catch (e) { }
    }
  }
  window.addEventListener("pagehide", function () {
    if (scorm) { try { save(); scorm.LMSSetValue("cmi.core.exit", allDone() ? "" : "suspend"); scorm.LMSCommit(""); scorm.LMSFinish(""); scorm = null; } catch (e) { } }
  });

  // ---------------------------------------------------------------- Übungsliste
  var EXLIST = [];
  ST.forEach(function (st, si) {
    st.blocks.forEach(function (b) {
      if (b.t === "ex") EXLIST.push({ id: b.id, si: si });
      if (b.t === "quiz") b.qs.forEach(function (q) { EXLIST.push({ id: q.id, si: si }); });
    });
  });
  function maxPoints() { return EXLIST.length * MAXP; }
  function points() { var p = 0; for (var k in S.ex) p += S.ex[k][0] || 0; return p; }
  function exDone(id) { return !!(S.ex[id] && S.ex[id][2]); }
  function stationDone(si) { return EXLIST.filter(function (e) { return e.si === si; }).every(function (e) { return exDone(e.id); }); }
  function allDone() { return ST.every(function (s, i) { return stationDone(i); }); }
  function unlocked(si) { return preview || si === 0 || stationDone(si - 1); }

  // ---------------------------------------------------------------- Kopfzeile
  function renderHead() {
    var p = points(), mx = maxPoints();
    $("#pts").textContent = "Punkte: " + p + " / " + mx;
    $("#bar").style.width = Math.round(100 * EXLIST.filter(function (e) { return exDone(e.id); }).length / EXLIST.length) + "%";
    var sh = "";
    ST.forEach(function (s, i) { sh += '<span class="' + (stationDone(i) ? "on" : "") + '" title="Station ' + s.nr + '">' + s.stempel + "</span>"; });
    $("#stamps").innerHTML = sh;
    $("#btnKartei").hidden = !C.KARTEI || !unlocked(1);
  }

  // ---------------------------------------------------------------- Seiten
  var app;
  function home() {
    S.loc = ""; save();
    app.innerHTML = "";
    var intro = el("div", "card story blk intro");
    intro.innerHTML = '<div class="badge">' + I.flask + '</div><div class="bd">' + sceneHtml(C.INTRO.scene) + '<div class="kicker" style="color:var(--navy)">' + LB.auftrag + '</div><h2>' + C.INTRO.title + "</h2><p>" + C.INTRO.story + '</p><p class="note">' + C.INTRO.hinweis + "</p></div>";
    app.appendChild(intro);
    // Legende der Feldtypen (Startseite)
    var lg = el("div", "flegend");
    lg.innerHTML = '<span class="fl-t">' + (LB.felder || "So erkennst du die Felder:") + "</span>" +
      [["bgr", "book", "Hintergrund"], ["info", "info", "Info"], ["ex", "pencil", "Übung"], ["merke", "star", "Merke"]].map(function (f) {
        return '<span class="fl ' + f[0] + '"><span class="badge">' + I[f[1]] + '</span><span class="kicker">' + f[2] + "</span></span>";
      }).join("");
    app.appendChild(lg);
    var h = el("h3", null, LB.karte); h.style.marginTop = "18px"; app.appendChild(h);
    var lwn = el("p", "note lwhint", LB.lwHint + " <b class=\"lw\">" + wordSoFar() + "</b>"); app.appendChild(lwn);
    var map = el("div", "map");
    ST.forEach(function (s, i) {
      var u = unlocked(i), d = stationDone(i);
      var b = el("button", "stc" + (u ? "" : " lock") + (d ? " done" : ""));
      b.innerHTML = '<div class="badge">' + I[u ? s.icon : "lock"] + '</div><div><div class="t1">Station ' + s.nr + " · " + s.ort + '</div><div class="t2">' + s.title + '</div><div class="t3">ca. ' + s.min + " min" + '</div></div><div class="stamp">' + s.stempel + "</div>";
      b.setAttribute("data-st", s.id);
      if (u) b.onclick = function () { openStation(i); };
      else b.title = "Erst die vorherige Station abschließen";
      map.appendChild(b);
    });
    app.appendChild(map);
    renderHead();
    window.scrollTo(0, 0);
  }

  var cur = -1;
  function openStation(si, keepScroll) {
    cur = si; S.loc = ST[si].id; save();
    var s = ST[si];
    app.innerHTML = "";
    var back = el("button", "back", "← " + LB.karte); back.onclick = home; app.appendChild(back);
    var hd = el("div", "sthead");
    hd.innerHTML = '<div class="badge">' + I[s.icon] + '</div><div><div class="t1">Station ' + s.nr + " · " + s.ort + "</div><h2>" + s.title + "</h2></div>";
    app.appendChild(hd);
    var sto = el("div", "card story blk");
    sto.innerHTML = '<div class="badge">' + I.flask + '</div><div class="bd">' + sceneHtml(s.scene) + '<div class="kicker" style="color:var(--navy)">' + LB.stationAuftrag + '</div><p>' + s.story + "</p></div>";
    app.appendChild(sto);
    var host = el("div"); app.appendChild(host);
    renderBlocks(si, host);
    renderHead();
    if (!keepScroll) window.scrollTo(0, 0);
  }

  function renderBlocks(si, host) {
    var s = ST[si];
    host.innerHTML = "";
    var stop = false;
    for (var bi = 0; bi < s.blocks.length && !stop; bi++) {
      var b = s.blocks[bi];
      if (b.t === "ex") {
        host.appendChild(exCard(b, si));
        if (!exDone(b.id)) stop = true;
      } else if (b.t === "quiz") {
        var qh = el("h3", null, b.title); qh.style.marginTop = "18px"; host.appendChild(qh);
        for (var qi = 0; qi < b.qs.length; qi++) {
          var q = b.qs[qi];
          var qx = { id: q.id, type: "mc", op: q.op, task: q.task, options: q.options, multi: false };
          host.appendChild(exCard(qx, si));
          if (!exDone(q.id)) { stop = true; break; }
        }
      } else if (b.t === "cert") {
        host.appendChild(certCard());
      } else {
        host.appendChild(infoCard(b));
      }
    }
    if (!stop && stationDone(si)) host.appendChild(doneCard(si));
  }

  function refreshStation(afterId) {
    if (cur < 0) return;
    var host = app.lastChild;
    var y = window.scrollY;
    renderBlocks(cur, host);
    renderHead();
    window.scrollTo(0, y);
    if (afterId) {
      var c = document.getElementById("ex-" + afterId);
      var t = c && c.nextElementSibling;
      if (t && t.tagName === "H3") t = t.nextElementSibling || t;
      if (t && t.scrollIntoView) setTimeout(function () { t.scrollIntoView({ behavior: "smooth", block: "start" }); }, 80);
    }
  }

  // Lösungswort aus den Stempeln: bisher freigespielte Buchstaben, sonst Unterstrich
  function wordSoFar() { return ST.map(function (s, i) { return stationDone(i) ? s.stempel : "_"; }).join(" "); }
  function doneCard(si) {
    var s = ST[si];
    var d = el("div", "card done-card");
    d.id = "done-" + s.id;
    var nxt = si + 1 < ST.length;
    d.innerHTML = '<div class="kicker" style="color:var(--ok)">Station geschafft</div><div class="big">' + s.stempel + "</div><p>Du hast den " + LB.stempel + " <b>„" + s.stempel + "“</b> erhalten.</p><p>" + LB.lw + " bisher: <b class=\"lw\">" + wordSoFar() + "</b></p>";
    var bt = el("div", "btns"); bt.style.justifyContent = "center";
    if (nxt) { var b1 = el("button", "btn", "Weiter zu Station " + (si + 2) + " →"); b1.onclick = function () { openStation(si + 1); }; bt.appendChild(b1); }
    var b2 = el("button", "btn ghost", "← " + LB.karte); b2.onclick = home; bt.appendChild(b2);
    d.appendChild(bt);
    return d;
  }

  // ---------------------------------------------------------------- Infokarten
  // Szenenbild (optional) oben in der Auftragskarte: C.INTRO.scene bzw. Station.scene = Schlüssel aus FIGS
  function sceneHtml(key) { return key && F[key] ? '<div class="scene">' + F[key].svg + "</div>" : ""; }
  function figHtml(key) {
    var f = F[key]; if (!f) return "";
    return '<div class="figwrap" data-fig="' + key + '">' + f.svg + '</div><div class="swipe">↔ Abbildung seitlich wischen</div>';
  }
  function fixFigs(root) {
    root.querySelectorAll(".figwrap").forEach(function (w) {
      var sv = w.querySelector("svg.fig"); if (!sv) return;
      var nat = +sv.getAttribute("width");

      var ly = top + h - (h - 6) * 0.38;
      var lp = "M" + (x0 + 2) + "," + ly + " L" + (x0 + 2) + "," + yb + " A" + (r - 2) + "," + (r - 2) + " 0 0 0 " + (x1 - 2) + "," + yb + " L" + (x1 - 2) + "," + ly + " Z";
      s += '<g class="liq' + (anim === "fill" ? " rise" : "") + '"><path d="' + lp + '" fill="' + WATER + '"/>';
      if (o.tu) {
        s += '<g class="fade"><path d="' + lp + '" fill="#ffffff" opacity="' + o.tu + '"/>';
        var T = rng(seed + "t");
        for (var q = 0; q < Math.round(o.tu * 40); q++) s += '<circle cx="' + (cx - r + 6 + T() * (w - 12)).toFixed(1) + '" cy="' + (ly + 4 + T() * (yb - ly)).toFixed(1) + '" r="0.9" fill="#fff"/>';
        s += "</g>";
      }
      if (o.ppt) {
        var pa = o.pa || 0.8, R = rng(seed + "p");
        s += '<g class="' + (anim ? "fade" : "") + '"><path d="' + lp + '" fill="' + o.ppt + '" opacity="' + (0.55 * pa).toFixed(2) + '"/>';
        for (var k = 0; k < Math.round(22 * pa); k++) {
          s += '<ellipse cx="' + (cx - r + 8 + R() * (w - 16)).toFixed(1) + '" cy="' + (ly + 10 + R() * (yb - 2 - ly - 10)).toFixed(1) + '" rx="' + (2.2 + R() * 2.4).toFixed(1) + '" ry="' + (1.6 + R() * 1.4).toFixed(1) + '" fill="' + o.ppt + '" stroke="#8d9aab" stroke-width="0.8"/>';
        }

        s += "</g>";
      }
      s += "</g>";
    }
    s += '<path d="' + path + '" fill="none" stroke="' + GLASS + '" stroke-width="2.2"/>';
    s += '<line x1="' + (x0 - 3) + '" y1="' + top + '" x2="' + (x1 + 3) + '" y2="' + top + '" stroke="' + GLASS + '" stroke-width="3" stroke-linecap="round"/>';
    s += '<line x1="' + (x0 + 5) + '" y1="' + (top + 12) + '" x2="' + (x0 + 5) + '" y2="' + (yb - 6) + '" stroke="#fff" stroke-width="2" opacity="0.8"/>';
    return s + "</svg>";
  }

  // ---------------------------------------------------------------- Lehrkraft-Bereich
  function sha256(ascii) {

    for (var cand = 2; pc < 64; cand++) { if (!isC[cand]) { for (var i = 0; i < 313; i += cand) isC[i] = cand; hash[pc] = (mp(cand, .5) * maxWord) | 0; k[pc++] = (mp(cand, 1 / 3) * maxWord) | 0; } }

    ascii = unescape(encodeURIComponent(ascii)); bl = ascii.length * 8;
    ascii += "\x80"; while (ascii.length % 64 - 56) ascii += "\x00";
    for (i = 0; i < ascii.length; i++) { var j = ascii.charCodeAt(i); words[i >> 2] |= j << ((3 - i) % 4) * 8; }
    words[words.length] = ((bl / maxWord) | 0); words[words.length] = (bl);
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), oh = hash; hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oh[i]) | 0;
    }
    for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; res += ((b < 16) ? 0 : "") + b.toString(16); }

<script>/* Teilchen-Simulation (Kern): fest = Schwingung am Gitterplatz mit wechselnder Richtung,
   flüssig/gasförmig = Dreiecke mit Stößen (Trennachsen-Test, keine Überlappung), periodischer Ausschnitt */
var PSIM = (function () {
  "use strict";
  var H = 10.392, BV = [[0, -H], [9, H / 2], [-9, H / 2]]; // gleichseitiges Dreieck, Seite 18, um den Schwerpunkt
  var GAP = 1.0;   // Mindestabstand zwischen Dreiecken (px)
  function tri(x, y, a) {
    var r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r), o = [];
    for (var i = 0; i < 3; i++) o.push([x + BV[i][0] * c - BV[i][1] * s, y + BV[i][0] * s + BV[i][1] * c]);
    return o;
  }
  // Trennachsen-Test: Rückgabe [Eindringtiefe, nx, ny] (n zeigt von P nach Q) oder null
  function sat(P, Q, px, py, qx, qy) {
    var best = 1e9, bx = 0, by = 0, polys = [P, Q];
    for (var k = 0; k < 2; k++) {
      var A = polys[k];
      for (var i = 0; i < 3; i++) {
        var a = A[i], b = A[(i + 1) % 3], nx = a[1] - b[1], ny = b[0] - a[0], l = Math.hypot(nx, ny);
        nx /= l; ny /= l;
        var p0 = 1e9, p1 = -1e9, q0 = 1e9, q1 = -1e9, j, d;
        for (j = 0; j < 3; j++) { d = P[j][0] * nx + P[j][1] * ny; if (d < p0) p0 = d; if (d > p1) p1 = d; }
        for (j = 0; j < 3; j++) { d = Q[j][0] * nx + Q[j][1] * ny; if (d < q0) q0 = d; if (d > q1) q1 = d; }
        var o = Math.min(p1, q1) - Math.max(p0, q0) + GAP;
        if (o <= 0) return null;
        if (o < best) { best = o; bx = nx; by = ny; }
      }
    }
    if ((qx - px) * bx + (qy - py) * by < 0) { bx = -bx; by = -by; }
    return [best, bx, by];
  }
  function rnd(s) { return function () { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; }; }
  var R = Math.random;

  function wrap(st, p) {
    var L = st.L, x0 = st.cx - L / 2, y0 = st.cy - L / 2;
    p.x = x0 + ((p.x - x0) % L + L) % L; p.y = y0 + ((p.y - y0) % L + L) % L;
  }
  function collide(st) {
    var P = st.p, n = P.length, L = st.L, i, j, polys = [];
    for (i = 0; i < n; i++) polys.push(tri(P[i].x, P[i].y, P[i].a));
    for (i = 0; i < n; i++) for (j = i + 1; j < n; j++) {
      var a = P[i], b = P[j], dx = b.x - a.x, dy = b.y - a.y;
      dx -= L * Math.round(dx / L); dy -= L * Math.round(dy / L);
      if (dx * dx + dy * dy > 22 * 22) continue;
      var bx = a.x + dx, by = a.y + dy, sx = bx - b.x, sy = by - b.y;
      var Q = polys[j].map(function (v) { return [v[0] + sx, v[1] + sy]; });
      var r = sat(polys[i], Q, a.x, a.y, bx, by);
      if (!r) continue;
      var d = r[0] / 2, nx = r[1], ny = r[2];

/* Teilchen-Simulation (Anzeige): startet jede Gruppe mit data-psim, sobald sie im Dokument erscheint.

(function () {

:root{
  --navy:#16385C; --ink:#1E2B3A; --muted:#5A6B7E;
  --bg:#EEF5FC; --card:#E3EFFA; --card2:#F6FAFE; --line:#C5DAEE;
  --info:#3B8BD0; --ex:#24588C; --merke:#EE6A1F; --hist:#6A5FB2; --warn:#EE6A1F;
  --ok:#2E8B57; --bad:#C0392B;
  --water:#7FC4F0; --eth:#C9B8EE;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3,h4{font-family:Cambria,Caladea,Georgia,serif;color:var(--navy);line-height:1.2;margin:0 0 .4em}
h1{font-size:1.55rem} h2{font-size:1.35rem} h3{font-size:1.12rem}
p{margin:.35em 0 .6em}
button{font-family:inherit;font-size:1rem;cursor:pointer}
sub,sup{font-size:.72em;line-height:0}
svg{max-width:100%;height:auto}

/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.top-in{max-width:960px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:Cambria,Caladea,Georgia,serif;font-weight:700;font-size:1.08rem;cursor:pointer;background:none;border:0;color:#fff;padding:0}
.brand svg{width:30px;height:30px}
.top .sp{flex:1}
.pts{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 12px;font-weight:700;white-space:nowrap}
.prog{flex-basis:100%;height:7px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7FC4F0,#fff);transition:width .5s}

main{max-width:960px;margin:0 auto;padding:16px 14px 40px}

/* Startseite / Karte */
.hero{background:linear-gradient(135deg,#DCEBFA,#F4F9FE);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .txt{flex:1 1 300px}
.hero svg{flex:0 0 150px;width:150px}
.kicker{font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--info);font-weight:700}
.map{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;position:relative}
.map-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.map svg{display:block;min-width:620px;width:100%}
.swipe{display:none;font-size:.85rem;color:var(--muted);text-align:center;margin-top:4px}
@media (max-width:640px){.swipe{display:block}}
.pin{cursor:pointer}
.pin.locked{cursor:not-allowed}
.pin:focus{outline:none}
.pin:focus-visible circle.ring{stroke:var(--merke);stroke-width:4}
.stlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:14px}
.stbtn{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink)}
.stbtn:hover:not([disabled]){background:#d5e7f8}
.stbtn[disabled]{opacity:.55;cursor:not-allowed}
.stbtn .num{flex:0 0 38px;height:38px;border-radius:50%;background:var(--ex);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:Cambria,Caladea,serif;font-size:1.1rem}
.stbtn.done .num{background:var(--ok)}
.stbtn small{display:block;color:var(--muted)}
.cta{display:inline-block;background:var(--merke);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:700;box-shadow:0 2px 0 #b9500f}
.cta:hover{filter:brightness(1.05)}
.btn{background:var(--ex);color:#fff;border:0;border-radius:999px;padding:8px 16px;font-weight:700}
.btn:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ex);border:2px solid var(--ex)}
.btn.small{padding:5px 12px;font-size:.92rem}
.btn.warn{background:var(--merke)}

/* Station */
.st-head{display:flex;gap:12px;align-items:center;margin:4px 0 14px}
.st-head .num{flex:0 0 52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Cambria,Caladea,serif;font-size:1.5rem;font-weight:700}
.st-head .place{color:var(--info);font-weight:700;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase}
.st-head h1{margin:0}
.back{background:none;border:0;color:var(--ex);font-weight:700;padding:4px 0;margin-bottom:6px}

.blk{position:relative;border-radius:var(--r);padding:14px 16px 14px 62px;margin:0 0 14px;border:1px solid var(--line);background:var(--card);animation:fadein .45s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.blk>.badge{position:absolute;left:12px;top:12px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.blk>.badge svg{width:22px;height:22px}
.blk .lbl{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.blk.info{border-left:6px solid var(--info)} .blk.info>.badge{background:var(--info)} .blk.info .lbl{color:var(--info)}
.blk.ex{background:#fff;border-left:6px solid var(--ex)} .blk.ex>.badge{background:var(--ex)} .blk.ex .lbl{color:var(--ex)}
.blk.merke{background:#FFF6EF;border:2px solid var(--merke);box-shadow:0 3px 0 rgba(238,106,31,.25)} .blk.merke>.badge{background:var(--merke)} .blk.merke .lbl{color:#C4501A}
.blk.hist{background:#F1EFFA;border:1.5px dashed var(--hist)} .blk.hist>.badge{background:var(--hist)} .blk.hist .lbl{color:var(--hist)}
.blk.safety{background:#fff;border:2px solid var(--warn)} .blk.safety>.badge{background:#fff;color:var(--warn)} .blk.safety>.badge svg{width:36px;height:36px} .blk.safety .lbl{color:#C4501A}
.blk.story{background:linear-gradient(135deg,#DDEBFA,#F3F8FE);border:1px solid var(--line);padding-left:16px}
.story-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.story-row .ic{flex:0 0 92px;width:92px}
.story-row .tx{flex:1 1 240px}
.howto{background:#EEF1F4;border-radius:10px;padding:6px 10px;font-size:.9rem;color:#4A5664;margin:6px 0 10px}
.howto b{color:#333}
.locked-note{border:2px dashed var(--line);border-radius:var(--r);padding:12px 16px;color:var(--muted);text-align:center;background:rgba(255,255,255,.5)}
@media (max-width:520px){.blk{padding:12px 12px 12px 12px}.blk>.badge{position:static;margin-bottom:6px;width:32px;height:32px}.blk>.badge svg{width:18px;height:18px}.blk.safety>.badge svg{width:30px;height:30px}}

.fig{margin:8px 0;text-align:center}
.fig figcaption,.cap{font-size:.85rem;color:var(--muted);text-align:center}
.wide{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wide>svg{min-width:520px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.two{grid-template-columns:1fr}}

/* Übungen */
.q{font-weight:700;margin-bottom:6px}
.opts{display:grid;gap:8px;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card2);border:2px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);width:100%}
.opt:hover:not([disabled]){border-color:var(--info)}
.opt .box{flex:0 0 22px;height:22px;border:2px solid var(--ex);border-radius:50%;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.opt.multi .box{border-radius:5px}
.opt.sel{border-color:var(--ex);background:#E0ECF8}
.opt.sel .box{background:var(--ex)}
.opt.right{border-color:var(--ok);background:#E7F5EC}
.opt.right .box{background:var(--ok);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:#FBEAEA}
.opt[disabled]{cursor:default}
.imgopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}
.imgopt{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center;color:var(--ink)}
.imgopt.sel{border-color:var(--ex);box-shadow:0 0 0 3px #CFE2F5}
.imgopt.right{border-color:var(--ok);background:#E7F5EC}
.imgopt.wrong{border-color:var(--bad);background:#FBEAEA}
.imgopt b{display:block;font-size:.95rem}
.fb{margin-top:8px;border-radius:10px;padding:8px 12px;font-size:.96rem}
.fb.ok{background:#E7F5EC;border:1px solid #9FD3B1;color:#1F5E3A}
.fb.no{background:#FBEAEA;border:1px solid #E7A9A2;color:#7A231A}
.fb.neutral{background:#EEF4FB;border:1px solid var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.earned{font-weight:700;color:var(--ok);font-size:.92rem}

/* Sortieren */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border:2px dashed var(--line);border-radius:12px;background:var(--card2)}
.chip{background:#fff;border:2px solid var(--ex);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:.95rem;text-align:left;max-width:100%}
.chip.sel{background:var(--ex);color:#fff}
.chip.right{border-color:var(--ok);background:#E7F5EC;color:var(--ink)}
.chip.wrong{border-color:var(--bad);background:#FBEAEA;color:var(--ink)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.bucket{border:2px solid var(--line);border-radius:12px;padding:8px;min-height:90px;background:#F8FBFE}
.bucket.target{border-color:var(--info);background:#EAF3FC;cursor:pointer}
.bucket h4{margin:0 0 6px;font-size:1rem;display:flex;align-items:center;gap:6px}
.bucket .in{display:flex;flex-wrap:wrap;gap:6px}

/* Auswahllisten */
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr minmax(170px,1fr);gap:8px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
select{font-family:inherit;font-size:.98rem;padding:6px 8px;border-radius:8px;border:2px solid var(--ex);background:#fff;color:var(--ink);max-width:100%}
select.right{border-color:var(--ok);background:#E7F5EC}
select.wrong{border-color:var(--bad);background:#FBEAEA}
.cloze{line-height:2.1}
.cloze select{margin:0 3px}

/* Reihenfolge */
.order{display:grid;gap:8px}
.oitem{display:flex;align-items:center;gap:8px;background:var(--card2);border:2px solid var(--line);border-radius:10px;padding:6px 8px}
.oitem .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--ex);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.oitem .t{flex:1}
.oitem .mv{display:flex;flex-direction:column;gap:2px}
.oitem .mv button{background:#fff;border:1px solid var(--ex);color:var(--ex);border-radius:6px;width:34px;height:24px;line-height:1;padding:0}
.oitem.right{border-color:var(--ok);background:#E7F5EC}
.oitem.wrong{border-color:var(--bad);background:#FBEAEA}

/* Regler, Zahl, Freitext */
.slider{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.slider input[type=range]{flex:1 1 220px;accent-color:var(--ex)}
.slider output{font-weight:700;font-size:1.2rem;min-width:84px;color:var(--navy)}
.numin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numin input{width:110px;font-size:1.1rem;padding:6px 8px;border:2px solid var(--ex);border-radius:8px;font-family:inherit}
textarea{width:100%;min-height:96px;font-family:inherit;font-size:1rem;border:2px solid var(--ex);border-radius:10px;padding:8px}
.model{background:#F1F7FD;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px}
.check{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok)}

/* Simulationen */
.sim{background:#F7FBFF;border:1px solid var(--line);border-radius:12px;padding:10px}
.sim .stage{display:flex;justify-content:center}
.sim .ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.steps{display:grid;gap:6px;margin:8px 0}
.step{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:.95rem}
.step .dot{flex:0 0 24px;height:24px;border-radius:50%;background:#C9D9EA;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.step.cur{border-color:var(--merke);box-shadow:0 0 0 2px #FBD3BC}
.step.cur .dot{background:var(--merke)}
.step.done .dot{background:var(--ok)}
canvas{max-width:100%;display:block;margin:0 auto;border-radius:10px;background:#fff;border:1px solid var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:.88rem;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.seg{display:inline-flex;border:2px solid var(--ex);border-radius:999px;overflow:hidden}
.seg button{background:#fff;color:var(--ex);border:0;padding:5px 12px;font-weight:700}
.seg button.on{background:var(--ex);color:#fff}

/* Baukasten */
.kit{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;justify-content:center}
.palette{display:flex;flex-direction:column;gap:8px}
.palette button{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--ink)}
.palette button.on{border-color:var(--ex);box-shadow:0 0 0 3px #CFE2F5}
.grid-box{display:grid;gap:3px;background:#fff;border:3px solid var(--navy);border-top:0;border-radius:0 0 12px 12px;padding:6px}
.cell{width:34px;height:34px;border:1px dashed #D3E1EF;border-radius:6px;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.cell svg{width:30px;height:30px}

/* Konzeptkarte */
.cmap{display:grid;gap:8px}
.cnode{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.cnode .rule{font-size:.78rem;font-weight:700;color:var(--info);text-transform:uppercase;letter-spacing:.05em}
.slot{display:inline-block;min-width:120px;border-bottom:2px solid var(--ex);padding:1px 6px;margin:0 3px;background:#EAF3FC;border-radius:6px 6px 0 0;cursor:pointer;text-align:center;font-weight:700;color:var(--ex)}
.slot.empty{color:#97AFC6;font-weight:400}
.slot.right{background:#E7F5EC;border-color:var(--ok);color:#1F5E3A}
.slot.wrong{background:#FBEAEA;border-color:var(--bad);color:#7A231A}
.cmap-center{text-align:center;margin:4px 0}
.cmap-center span{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;padding:6px 18px;font-family:Cambria,Caladea,serif;font-weight:700}

/* GHS */
.ghs{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}
.ghs svg{width:58px;height:58px}
.hz{font-size:.92rem}
.hz b{color:#C4501A}
.sig{display:inline-block;background:#C0392B;color:#fff;font-weight:700;border-radius:6px;padding:1px 8px;font-size:.9rem}

/* Fußzeile, Lehrkraft */
footer{max-width:960px;margin:0 auto;padding:12px 14px 30px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
footer button{background:none;border:0;color:var(--ex);text-decoration:underline;padding:0;font-size:.85rem}
.modal{position:fixed;inset:0;background:rgba(10,25,45,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal .card{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.modal input[type=password],.modal input[type=text]{font-size:1.05rem;padding:8px 10px;border:2px solid var(--ex);border-radius:8px;width:100%;max-width:320px;font-family:inherit}
.soltab{width:100%;border-collapse:collapse;font-size:.9rem}
.soltab td,.soltab th{border:1px solid var(--line);padding:5px 7px;vertical-align:top;text-align:left}
.soltab th{background:var(--card)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 18px;border-radius:999px;z-index:60;box-shadow:0 3px 12px rgba(0,0,0,.25);font-weight:700}

/* Ausweis */
.idcard{max-width:520px;margin:10px auto;background:linear-gradient(135deg,#16385C,#24588C);color:#fff;border-radius:18px;padding:18px;display:flex;gap:16px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.idcard h3{color:#fff;margin:0}
.idcard .nm{font-family:Cambria,Caladea,serif;font-size:1.5rem;font-weight:700;border-bottom:2px solid rgba(255,255,255,.5);min-height:1.6em}
.idcard svg{flex:0 0 96px;width:96px}
.idcard small{opacity:.85}
@media print{

.globe svg{width:150px}
.story-row .ic svg{width:92px;height:92px}

.cmap{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}

      '<p><b>Stoffebene:</b> Hier <b>beobachten</b> wir mit unseren Sinnen, z. B. Farbe, Geruch, Geschmack oder Volumen eines Stoffes.</p>'+
      '<p><b>Teilchenebene:</b> Alle Stoffe bestehen aus unvorstellbar kleinen, unsichtbaren Teilchen. Mithilfe dieser Teilchen <b>erklären</b> wir, was wir beobachten.</p>'},
    {type:'ex', kind:'sort', id:'1a', title:'Aussagen ordnen',
      task:'Ordne die Aussagen der Stoffebene oder der Teilchenebene zu.',
      howto:'Tippe eine Karte an und dann das passende Feld. Am Computer kannst du die Karten auch ziehen.',
      buckets:['Stoffebene','Teilchenebene'],
      items:[
        {t:'Der Tee färbt sich rot.', b:0},
        {t:'Das Parfüm riecht nach Rosen.', b:0},
        {t:'Wasser ist farblos.', b:0},
        {t:'Der Zucker ist im Tee nicht mehr zu sehen.', b:0},
        {t:'Die Zuckerteilchen verteilen sich zwischen den Wasserteilchen.', b:1},
        {t:'Duftteilchen gelangen in unsere Nase.', b:1},
        {t:'Kochsalz besteht aus winzigen Teilchen.', b:1},
        {t:'Farbstoffteilchen lösen sich aus dem Teebeutel.', b:1}
      ]},
    {type:'hist', title:'Demokrit und die Idee vom „Unteilbaren“', html:
      '<p>Schon vor fast 2500 Jahren überlegte der griechische Philosoph <b>Demokrit</b> (ca. 460–370 v. Chr.): Teilt man einen Stoff immer weiter, kommt man irgendwann zu kleinsten Teilchen, die sich nicht mehr teilen lassen. Er nannte sie <i>átomos</i>, „unteilbar“.</p><p>Beweisen konnte Demokrit seine Idee nicht. Belege aus Experimenten fand man erst über 2000 Jahre später.</p>'},
    {type:'info', title:'Was ist ein Modell?', html:
      '<div class="two"><div><p>Teilchen kann niemand mit bloßem Auge oder einem Schulmikroskop sehen. Deshalb arbeiten Chemikerinnen und Chemiker mit <b>Modellen</b>.</p><p>Modelle sind Hilfen, um Dinge und Vorgänge aus der Wirklichkeit darzustellen und zu veranschaulichen – so wie ein <b>Globus</b> die Erde darstellt.</p></div><div class="globe">'+sceneGlobe()+'</div></div>'},
    {type:'ex', kind:'mc', id:'1b', title:'Modell und Wirklichkeit',
      task:'Vergleiche den Globus mit der echten Erde und beurteile, welche Aussage über Modelle zutrifft.', howto:'Wähle eine Antwort.',
      options:[
        {t:'Ein Modell stellt die Wirklichkeit vereinfacht dar: Wichtiges wird gezeigt, vieles wird weggelassen.', ok:true, fb:'Genau! Auf dem Globus fehlen z. B. Städte, Wolken und Bäume. Die Lage der Kontinente zeigt er trotzdem sehr gut.'},
        {t:'Ein Modell ist eine exakte Kopie der Wirklichkeit, nur kleiner.', fb:'Auf dem Globus fehlen Städte, Wolken und Berge. Ein Modell ist keine exakte Kopie.'},
        {t:'Ein Modell zeigt immer alle Eigenschaften des Originals.', fb:'Gibt es auf dem Globus echtes Meerwasser? Viele Eigenschaften der Erde fehlen.'},
        {t:'Modelle sind ungenau und deshalb in den Naturwissenschaften nutzlos.', fb:'Modelle sind vereinfacht – gerade deshalb sind sie sehr nützlich, um etwas zu veranschaulichen und zu erklären.'}
      ]},
    {type:'merke', title:'Das Stoff-Teilchen-Konzept', html:
      '<p><b>Beobachtung</b> = Wahrnehmung eines Phänomens mit den Sinnen → <b>Stoffebene</b><br><b>Erklärung</b> = Deutung der Beobachtung mithilfe von Teilchen → <b>Teilchenebene</b></p><p>Beide Ebenen werden immer streng getrennt.</p><p><b>Modelle</b> veranschaulichen die Wirklichkeit, bilden sie aber nie vollständig ab.</p>'}
  ]},

    {type:'info', title:'Teilchen-Steckbrief', html:

    {type:'hist', title:'Warum Apotheken lieber wiegen', html:

    {type:'info', title:'So zeichnest du Teilchenbilder', html:

  { id:'s4', num:4, place:'Teeküche', title:'Der Fall der wandernden Farbe', icon:'s4', minutes:8, blocks:[
    {type:'story', html:'<p>Montagmorgen in der Detektei: Jemand hat einen Früchteteebeutel in eine Tasse Wasser gehängt und ihn vergessen. Niemand hat umgerührt – trotzdem ist der Tee nach einiger Zeit überall rot. Wer hat die Farbe bewegt?</p>'},
    {type:'info', title:'Versuch V2', html:
      '<p>Wir untersuchen das Phänomen mit einem Stoff, der Wasser kräftig violett färbt: <b>Kaliumpermanganat</b>. Seine Teilchen nennen wir hier kurz <b>Farbstoffteilchen</b>. Je ein kleiner Kristall wird in ein Becherglas mit <b>kaltem</b> und in eines mit <b>heißem</b> Wasser gegeben. Es wird <b>nicht</b> umgerührt.</p>'},
    {type:'safety', title:'Sicherheit: Kaliumpermanganat (Lehrerversuch)', ghs:['GHS03','GHS07','GHS08','GHS09'], signal:'Gefahr', html:
      '<p class="hz"><b>H272</b> Kann Brand verstärken; Oxidationsmittel.<br><b>H302</b> Gesundheitsschädlich bei Verschlucken.<br><b>H361d</b> Kann vermutlich das Kind im Mutterleib schädigen.<br><b>H410</b> Sehr giftig für Wasserorganismen mit langfristiger Wirkung.</p>'},
    {type:'ex', kind:'mc', id:'4a', title:'Gefahrenhinweise nutzen',

        {t:'Kaliumpermanganat ist leicht entzündbar.', fb:'Kaliumpermanganat ist brandfördernd (H272, Flamme über Kreis), aber nicht selbst leicht entzündbar. Und das ist nicht der Grund.'},
        {t:'Die violette Farbe verfärbt das Waschbecken.', fb:'Das kann sein – entscheidend ist aber die Gefahr für die Umwelt.'},
        {t:'Kaliumpermanganat verstopft den Abfluss.', fb:'Ein kleiner Kristall verstopft nichts. Schau dir die H-Sätze an.'}
      ]},
    {type:'ex', kind:'choice', id:'4b', title:'Hypothese',
      task:'Stelle eine Hypothese auf: In welchem Becherglas verteilt sich die Farbe schneller?',
      howto:'Hier gibt es kein Richtig oder Falsch – du prüfst deine Hypothese gleich.',

    {type:'ex', kind:'sim', sim:'v2', id:'4c', title:'Versuch V2 als Simulation',

      howto:'Gib zuerst die Kristalle hinein. Ziehe dann den Zeitregler bis 10 Minuten und beobachte die beiden Bechergläser.'},
    {type:'hypcheck', ref:'4b', actual:'im heißen Wasser', html:''},
    {type:'ex', kind:'mc', id:'4d', title:'Beobachtung formulieren',
      task:'Beschreibe die Beobachtung.', howto:'Wähle die passende Formulierung.',
      options:[
        {t:'In beiden Bechergläsern verteilt sich die violette Farbe ohne Umrühren – im heißen Wasser deutlich schneller.', ok:true, fb:'Genau – eine saubere Beobachtung auf der Stoffebene.'},
        {t:'Die Farbstoffteilchen bewegen sich im heißen Wasser schneller.', fb:'Das ist schon die Erklärung auf der Teilchenebene. Gefragt ist die Beobachtung.'},
        {t:'Im kalten Wasser verteilt sich die Farbe überhaupt nicht.', fb:'Schau genau hin: Auch im kalten Wasser verteilt sich die Farbe, nur langsamer.'},
        {t:'Die Farbe verteilt sich, weil das Wasser umgerührt wurde.', fb:'Es wurde gar nicht umgerührt!'}
      ]},
    {type:'ex', kind:'sim', sim:'zoom', id:'4e', title:'Blick auf die Teilchenebene',
      task:'Untersuche im Teilchenmodell, wie sich die Temperatur auf die Bewegung der Teilchen auswirkt.',
      howto:'Stelle die Temperatur auf „kalt“ und auf „heiß“ und beobachte die Teilchen. Mit „Neu starten“ beginnen die Farbstoffteilchen wieder links.'},
    {type:'ex', kind:'cloze', id:'4f', title:'Erklärung auf der Teilchenebene',
      task:'Erkläre die Beobachtung auf der Teilchenebene.', howto:'Wähle in jeder Lücke den passenden Begriff.',
      text:'Die Farbstoffteilchen verteilen sich [[von selbst|nur durch Umrühren]] zwischen den Wasserteilchen, weil alle Teilchen ständig [[in Bewegung|in Ruhe]] sind. Im heißen Wasser bewegen sich die Teilchen [[schneller|langsamer|genauso schnell]] als im kalten Wasser. Deshalb verteilt sich die Farbe im heißen Wasser [[schneller|langsamer]].'},
    {type:'merke', title:'Teilchenmodell – Regel 3 und Diffusion', html:
      '<p><b>Regel 3:</b> Alle Teilchen sind ständig in Bewegung. Je höher die Temperatur, desto schneller bewegen sich die Teilchen.</p>'+
      '<p><b>Diffusion</b> = selbstständige Durchmischung von Stoffen aufgrund der Eigenbewegung der Teilchen. Je höher die Temperatur, desto schneller verläuft die Diffusion.</p>'},
    {type:'hist', title:'Zitternde Körnchen – ein Beweis für Teilchen', html:
      '<div class="two"><div><p>1827 beobachtete der schottische Botaniker <b>Robert Brown</b> unter dem Mikroskop winzige Körnchen aus Pollen, die im Wasser ständig unregelmäßig hin und her zitterten.</p><p>1905 erklärte <b>Albert Einstein</b> diese „Brownsche Bewegung“: Unsichtbare Wasserteilchen stoßen ständig von allen Seiten gegen die Körnchen. <b>Jean Perrin</b> bestätigte das ab 1908 mit genauen Messungen – ein wichtiger Beweis, dass es Teilchen wirklich gibt. Er erhielt dafür 1926 den Nobelpreis für Physik.</p></div><div class="fig">@@BROWN@@<div class="cap">Modellhafte Bahn eines Körnchens</div></div></div>'}
  ]},

    {type:'hist', title:'Akte „fehlende Milliliter“ – neu aufgerollt', html:
      '<p>Das Erbsen-Linsen-Modell erklärt die Volumenabnahme beim Mischen von Ethanol und Wasser nur zum Teil. Heute weiß man: Ethanol- und Wasserteilchen <b>ziehen sich gegenseitig besonders stark an</b>. Auch deshalb rücken sie beim Mischen enger zusammen.</p><p>So arbeitet die Naturwissenschaft: Ein Modell wird erweitert, wenn es eine Beobachtung nicht vollständig erklären kann.</p>'}

<script>/* Engine der Lerneinheit – Rendering, Übungen, Simulationen, Speicherung, SCORM 1.2, Lehrkraft-Bereich */
(function(){
'use strict';
const U = UNIT, MAXP = 10;
const $ = (s,el=document)=>el.querySelector(s);
function el(tag, cls, html){const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e;}
function btn(label, cls, fn){const b=el('button',cls||'btn',label); b.type='button'; if(fn) b.onclick=fn; return b;}
function shuffle(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function shuffleIdx(n){ // Permutation, die nie der Ausgangsreihenfolge entspricht
  const base=[...Array(n).keys()]; if(n<2) return base; let p; do{p=shuffle(base);}while(p.every((v,i)=>v===i)); return p;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function tween(ms, fn){return new Promise(res=>{const t0=performance.now(); function f(t){const k=Math.min(1,(t-t0)/ms); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; fn(e); if(k<1) requestAnimationFrame(f); else res();} requestAnimationFrame(f);});}
const SVGNS='http://www.w3.org/2000/svg';

/* ───── Übungsverzeichnis ───── */
const EX = []; const EXBYID = {};
U.stations.forEach((st,si)=>st.blocks.forEach((b,bi)=>{ if(b.type==='ex'){ b._st=st; b._si=si; EX.push(b); EXBYID[b.id]=b; }}));
function isScored(ex){ return ['mc','mcimg','sort','select','cloze','order','number','free','cmap'].includes(ex.kind) || !!ex.scored; }
const MAXPTS = EX.filter(isScored).length * MAXP;

/* ───── Zustand ───── */
let S = {ex:{}, name:'', loc:''};
let preview = false;
function rec(id){ return S.ex[id] || (S.ex[id] = {}); }
function isDone(id){ return !!(S.ex[id] && S.ex[id].d); }
function points(){ return EX.reduce((s,e)=>s+((S.ex[e.id]&&S.ex[e.id].p)||0),0); }
function stDone(st){ return st.blocks.every(b=>b.type!=='ex'||isDone(b.id)); }
function stUnlocked(i){ return preview || i===0 || stDone(U.stations[i-1]); }
function allDone(){ return U.stations.every(stDone); }
function encode(){ const e={}; for(const k in S.ex){const r=S.ex[k]; if(!r.d && !r.t) continue; const a=[r.d?1:0, r.p||0, r.t||0]; if(r.v!==undefined) a.push(r.v); e[k]=a;} return JSON.stringify({e, n:S.name||'', l:S.loc||''}); }
function decode(str){ const o=JSON.parse(str); const ex={}; for(const k in (o.e||{})){const a=o.e[k]; ex[k]={d:a[0], p:a[1], t:a[2]}; if(a.length>3) ex[k].v=a[3];} return {ex, name:o.n||'', loc:o.l||''}; }

/* ───── SCORM 1.2 ───── */
const SC = {api:null};
function findAPI(w){ let n=0; while(w && !w.API && w.parent && w.parent!==w && n<12){ n++; w=w.parent; } return (w && w.API) || null; }
function scGet(k){ try{ return SC.api ? SC.api.LMSGetValue(k) : ''; }catch(e){ return ''; } }
function scSet(k,v){ try{ if(SC.api) SC.api.LMSSetValue(k, String(v)); }catch(e){} }
function flipName(n){ if(n.indexOf(',')>-1){ const p=n.split(','); return (p[1].trim()+' '+p[0].trim()).trim(); } return n.trim(); }
function scormInit(){
  try{
    let api = findAPI(window);
    if(!api && window.opener) api = findAPI(window.opener);
    if(!api) return;
    api.LMSInitialize('');
    SC.api = api;
    const st = scGet('cmi.core.lesson_status');
    if(!st || st==='not attempted' || st==='unknown') scSet('cmi.core.lesson_status','incomplete');
    const sd = scGet('cmi.suspend_data');
    if(sd){ try{ const d=decode(sd); S.ex=d.ex; S.name=d.name||S.name; S.loc=d.loc||''; }catch(e){} }
    const nm = scGet('cmi.core.student_name');
    if(nm && !S.name) S.name = flipName(nm);
    window.addEventListener('pagehide', ()=>{ scSet('cmi.core.exit','suspend'); try{ SC.api.LMSCommit(''); SC.api.LMSFinish(''); }catch(e){} });
  }catch(e){}
}
function save(){
  const data = encode();
  try{ localStorage.setItem(U.key, data); }catch(e){}
  if(SC.api){
    scSet('cmi.suspend_data', data.length<3900 ? data : data.slice(0,3900));
    scSet('cmi.core.score.min',0); scSet('cmi.core.score.max',100);
    scSet('cmi.core.score.raw', Math.round(100*points()/MAXPTS));
    scSet('cmi.core.lesson_location', S.loc||'');
    scSet('cmi.core.lesson_status', allDone() ? 'completed' : 'incomplete');
    try{ SC.api.LMSCommit(''); }catch(e){}
  }
  updateTop();
}
function load(){
  try{ const s = localStorage.getItem(U.key); if(s){ const d=decode(s); S.ex=d.ex; S.name=d.name; S.loc=d.loc; } }catch(e){}
  scormInit();
}

/* ───── Kopfzeile ───── */
function updateTop(){
  const p = $('#pts'); if(p) p.textContent = points()+' / '+MAXPTS+' Punkte';
  const done = EX.filter(e=>isDone(e.id)).length;
  const bar = $('#progbar'); if(bar) bar.style.width = Math.round(100*done/EX.length)+'%';
}
function toast(msg){ const t=el('div','toast',msg); document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ───── Startseite ───── */
function renderHome(){
  S.loc=''; save();
  const m = $('#main'); m.innerHTML='';
  const hero = el('section','hero');
  hero.innerHTML = heroArt()+`<div class="txt"><div class="kicker">${esc(U.chapter)}</div><h1>${esc(U.title)}</h1><p><b>${esc(U.subtitle)}</b></p><p>${U.intro}</p></div>`;
  const next = U.stations.find((st,i)=>stUnlocked(i) && !stDone(st));
  const cta = btn(next ? (EX.some(e=>isDone(e.id)) ? 'Weiter mit Station '+next.num : 'Los geht’s: Station 1') : 'Zum Detektivausweis', 'cta', ()=>openStation(next ? next.id : 's7'));
  hero.querySelector('.txt').appendChild(cta);
  m.appendChild(hero);
  const map = el('div','map'); map.innerHTML = `<h2 style="margin:4px 6px 6px">Stationskarte</h2><div class="map-scroll">${mapSvg()}</div><div class="swipe">↔ Karte seitlich wischen</div>`;
  m.appendChild(map);
  map.querySelectorAll('.pin').forEach(g=>{ const id=g.dataset.id, i=+g.dataset.i;
    const go=()=>{ if(stUnlocked(i)) openStation(id); else toast('Diese Station ist noch gesperrt.'); };
    g.addEventListener('click',go); g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} }); });
  const list = el('div','stlist');
  U.stations.forEach((st,i)=>{
    const b = btn(`<span class="num">${stDone(st)?ICON.check.replace('viewBox','width="22" height="22" viewBox'):st.num}</span><span><b>${esc(st.place)}</b><small>${esc(st.title)} · ca. ${st.minutes} min</small></span>`, 'stbtn'+(stDone(st)?' done':''), ()=>openStation(st.id));
    if(!stUnlocked(i)){ b.disabled=true; b.title='Noch gesperrt'; }
    list.appendChild(b);
  });
  m.appendChild(list);
  window.scrollTo(0,0);
}
function mapSvg(){
  const pts=[[62,168],[160,78],[262,160],[360,70],[462,160],[562,78],[648,150]];
  let d=`M${pts[0][0]} ${pts[0][1]}`; for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; const mx=(x0+x1)/2; d+=` C${mx} ${y0} ${mx} ${y1} ${x1} ${y1}`;}
  let s=`<svg viewBox="0 0 710 236" role="group" aria-label="Stationskarte"><rect x="0" y="0" width="710" height="236" rx="12" fill="#F2F8FE"/>`;
  // Dekoration: Häuserblöcke
  [[20,20,70,40],[110,150,60,50],[300,190,90,34],[400,16,80,36],[600,180,90,42],[630,14,60,40],[210,14,60,34]].forEach(r=>s+=`<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="6" fill="#E1ECF8"/>`);
  s+=`<path d="${d}" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#9DBBD8" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>`;
  U.stations.forEach((st,i)=>{ const [x,y]=pts[i]; const un=stUnlocked(i), dn=stDone(st);
    const fill = dn?'#2E8B57':(un?'#24588C':'#A9B8C8');
    const inner = dn?`<path d="M${x-9} ${y+1}l6 6 13-13" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
      : un?`<text x="${x}" y="${y+7}" text-anchor="middle" font-family="Cambria,Caladea,serif" font-weight="700" font-size="21" fill="#fff">${st.num}</text>`
      : `<rect x="${x-8}" y="${y-2}" width="16" height="12" rx="2" fill="#fff"/><path d="M${x-5} ${y-2}v-4a5 5 0 0 1 10 0v4" stroke="#fff" stroke-width="2.6" fill="none"/>`;
    const ly = y<120 ? y-36 : y+46;
    s+=`<g class="pin${un?'':' locked'}" data-id="${st.id}" data-i="${i}" tabindex="0" role="button" aria-label="Station ${st.num}: ${esc(st.place)}${un?'':' (gesperrt)'}">
      <circle class="ring" cx="${x}" cy="${y}" r="27" fill="#fff" stroke="${fill}" stroke-width="3"/><circle cx="${x}" cy="${y}" r="21" fill="${fill}"/>${inner}

  });
  return s+'</svg>';
}

function revealNext(){
  const c = CUR; if(!c) return;
  if(c.lockNote){ c.lockNote.remove(); c.lockNote=null; }
  const bl = c.st.blocks; let first=null;
  while(c.idx < bl.length){
    const b = bl[c.idx]; const node = renderBlock(b, c.st); c.wrap.appendChild(node); if(!first) first=node; c.idx++;

const CTX = {};

function exBlock(ex){
  const d = blockShell('ex','Übung '+ex.id, ex.title, ICON.pen);
  d.dataset.ex = ex.id;
  d.insertAdjacentHTML('beforeend', `<p class="q">${ex.task}</p>${ex.howto?`<div class="howto"><b>In der App:</b> ${ex.howto}</div>`:''}`);
  const body = el('div','exbody'), fb = el('div','fbwrap'), act = el('div','actions');
  d.append(body, fb, act);
  const r = rec(ex.id); const scored = isScored(ex);
  let solBtn=null; const locks=[];
  const ctx = { ex, d, body, act, rec:r, scored, solve:null, fill:null,
    onLock(fn){ locks.push(fn); },
    setFb(html, cls){ fb.innerHTML = html ? `<div class="fb ${cls||'neutral'}">${html}</div>` : ''; },
    addBtn(label, fn, cls){ const b=btn(label, cls||'btn', fn); b.dataset.role=label; act.appendChild(b); return b; },
    lock(){ act.innerHTML=''; locks.forEach(f=>f()); },
    finish(pts, html, val, cls){ if(r.d) return; r.d=1; r.p=pts; if(val!==undefined) r.v=val; save(); ctx.setFb(html + (scored?` <span class="earned">+${pts} Punkte</span>`:''), cls||'ok'); ctx.lock(); after(); },
    right(html, val){ ctx.finish(scored?ptsFor(r.t||0):0, html, val); },
    wrong(html){ r.t=(r.t||0)+1; save(); ctx.setFb(html + (r.t>=2 && ctx.solve ? '<br><i>Du kannst es noch einmal versuchen oder dir die Lösung zeigen lassen (0 Punkte).</i>':''),'no');
      if(r.t>=2 && ctx.solve && !solBtn){ solBtn = ctx.addBtn('Lösung zeigen', ()=>{ ctx.solve(); ctx.finish(0,'Hier siehst du die Lösung.',undefined,'neutral'); }, 'btn ghost'); } },
    complete(val, html){ ctx.finish(0, html||'Erledigt!', val, 'neutral'); }
  };
  function after(){ updateTop(); if(CUR && CUR.wrap.contains(d)){ const n = revealNext(); if(n) setTimeout(()=>n.scrollIntoView({behavior:'smooth',block:'start'}),250); } }
  CTX[ex.id] = ctx;
  if(ex.hint) ctx.addBtn('Tipp', ()=>{ ctx.setFb('<b>Tipp:</b> '+ex.hint,'neutral'); }, 'btn ghost small');
  (R[ex.kind])(ex, ctx);

    if(ctx.solve) ctx.solve(true);
    ctx.lock();

R.sort = function(ex, ctx){

    slots.forEach(s=>{ s.el.textContent=s.val||'…'; s.el.classList.toggle('empty',!s.val); s.el.classList.remove('right','wrong'); }); }
  ctx.body.append(el('div','cap','Begriffe'), bank, center, map);

    let bad=0; slots.forEach(s=>{ const ok=s.val===s.ans; s.el.classList.add(ok?'right':'wrong'); if(!ok) bad++; });

function cyl(o){ // o: x, yb (Boden), w, ppm (px pro mL), max, tick, lab, id
  const top = o.yb - o.max*o.ppm - 12; let s='';
  s+=`<rect x="${o.x-10}" y="${o.yb}" width="${o.w+20}" height="7" rx="3" fill="#fff" stroke="${K}" stroke-width="2"/>`;
  s+=`<path d="M${o.x} ${top} V${o.yb} H${o.x+o.w} V${top}" fill="#fff" stroke="${K}" stroke-width="2.5"/>`;
  s+=`<path d="M${o.x+o.w} ${top} q4 -2 6 -6" fill="none" stroke="${K}" stroke-width="2"/>`;
  s+=`<g id="${o.id}-liq"></g>`;
  for(let v=o.tick; v<=o.max; v+=o.tick){ const y=o.yb-v*o.ppm; const big=v%o.lab===0; s+=`<path d="M${o.x} ${y}h${big?o.w*.45:o.w*.25}" stroke="${K}" stroke-width="${big?1.4:.8}"/>`; if(big) s+=`<text x="${o.out?o.x+o.w+5:o.x+o.w*.5}" y="${y+4}" font-size="${o.out?12:10}" fill="${K}">${v}</text>`; }
  return s;
}

  const y=v=>292-(v-178)*9.4; const X0=60, X1=230; let s=`<svg viewBox="0 0 300 310" role="img" aria-label="Vergrößerte Skala des Messzylinders"><defs><clipPath id="sclip"><rect x="${X0}" y="10" width="${X1-X0}" height="290"/></clipPath></defs>`;
  s+=`<rect x="${X0}" y="10" width="${X1-X0}" height="290" fill="#fff"/>`;
  const yl=y(val), ye=y(val+1.7), yc=2*yl-ye; // Meniskus: tiefster Punkt bei val
  s+=`<g clip-path="url(#sclip)"><path d="M${X0} ${ye} Q${(X0+X1)/2} ${yc} ${X1} ${ye} V310 H${X0}Z" fill="#D9E3F4"/><path d="M${X0} ${ye} Q${(X0+X1)/2} ${yc} ${X1} ${ye}" fill="none" stroke="#6C86A8" stroke-width="2.2"/></g>`;
  for(let v=180; v<=204; v+=2){ const big=v%10===0; s+=`<path d="M${X0} ${y(v)}h${big?62:30}" stroke="${K}" stroke-width="${big?2:1.2}"/>`; if(big) s+=`<text x="${X0+68}" y="${y(v)+6}" font-size="17" font-weight="700" fill="${K}">${v}</text>`; }
  s+=`<path d="M${X0} 10V300M${X1} 10V300" stroke="${K}" stroke-width="3"/>`;
  s+=`<path d="M246 ${yl}h-10" stroke="#EE6A1F" stroke-width="2.5"/><text x="248" y="${yl+5}" font-size="13" fill="#C4501A" font-weight="700">?</text>`;

function stepsUI(ctx, steps, onStep){

  rg.oninput=()=>{ const t=+rg.value; setT(Math.max(0.3,t)); if(t>=10 && !ctx.rec.d) ctx.complete(undefined,'Versuch beendet. Vergleiche die beiden Bechergläser genau.'); };
  ctx.solve=()=>{ drop.disabled=true; q('k40').setAttribute('opacity',1); q('k270').setAttribute('opacity',1); q('k40').setAttribute('transform','translate(0,206)'); q('k270').setAttribute('transform','translate(0,206)'); rg.disabled=false; rg.value=10; setT(10); };
  ctx.drive=async()=>{ drop.click(); await sleep(1100); rg.value=10; rg.dispatchEvent(new Event('input')); };
};
SIM.zoom = function(ex, ctx){
  const W=560,H=260; const box=el('div','sim');
  const cv=el('canvas'); cv.width=W*2; cv.height=H*2; cv.style.width='100%'; cv.style.maxWidth=W+'px'; cv.setAttribute('role','img'); cv.setAttribute('aria-label','Teilchenmodell: Wasser- und Farbstoffteilchen in Bewegung');
  const ctrl=el('div','ctrl'); const seg=el('div','seg'); const temps=[['kalt',.45],['warm',1.0],['heiß',1.9]]; let base=.45;
  const visited=new Set(['kalt']); let tSince=0, completed=false;
  const SB=temps.map(([n,v],i)=>{ const b=btn(n,i===0?'on':''); b.onclick=()=>{ SB.forEach(x=>x.classList.toggle('on',x===b)); const f=v/base; base=v; parts.forEach(p=>{p.vx*=f;p.vy*=f;}); visited.add(n); tSince=0; }; seg.appendChild(b); return b; });
  const rs=btn('Neu starten','btn ghost small',()=>init());
  ctrl.append(el('span','', '<b>Temperatur:</b>'), seg, rs);
  box.append(cv, ctrl); box.insertAdjacentHTML('beforeend',`<div class="legend"><span>${pSvg('water',18)} Wasserteilchen</span><span>${pSvg('dye',18)} Farbstoffteilchen</span><span>Modell, nicht maßstabsgetreu</span></div>`);
  ctx.body.appendChild(box);
  const c2=cv.getContext('2d'); let parts=[];
  function init(){ parts=[]; const tryPlace=(r,x0,x1,type)=>{ for(let k=0;k<400;k++){ const x=x0+r+Math.random()*(x1-x0-2*r), y=r+4+Math.random()*(H-2*r-8); if(parts.every(p=>Math.hypot(p.x-x,p.y-y)>p.r+r+2)){ const a=Math.random()*6.283, s=base*(.6+Math.random()*.8); parts.push({x,y,r,type,vx:Math.cos(a)*s,vy:Math.sin(a)*s}); return; } } };
    for(let i=0;i<10;i++) tryPlace(10,6,130,'dye'); for(let i=0;i<52;i++) tryPlace(9,0,W,'w'); }
  function step(){ for(const p of parts){ p.x+=p.vx; p.y+=p.vy; if(p.x<p.r){p.x=p.r;p.vx=Math.abs(p.vx);} if(p.x>W-p.r){p.x=W-p.r;p.vx=-Math.abs(p.vx);} if(p.y<p.r){p.y=p.r;p.vy=Math.abs(p.vy);} if(p.y>H-p.r){p.y=H-p.r;p.vy=-Math.abs(p.vy);} }
    for(let i=0;i<parts.length;i++) for(let j=i+1;j<parts.length;j++){ const a=parts[i],b=parts[j]; const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), md=a.r+b.r; if(d<md && d>0){ const nx=dx/d, ny=dy/d; const rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny; if(rel>0){ a.vx-=rel*nx; a.vy-=rel*ny; b.vx+=rel*nx; b.vy+=rel*ny; } const o=(md-d)/2; a.x-=nx*o; a.y-=ny*o; b.x+=nx*o; b.y+=ny*o; } } }
  function draw(){ c2.setTransform(2,0,0,2,0,0); c2.clearRect(0,0,W,H); c2.fillStyle='#fff'; c2.fillRect(0,0,W,H);
    for(const p of parts){ c2.beginPath(); if(p.type==='w'){ c2.arc(p.x,p.y,p.r,0,6.283); c2.fillStyle='#7FC4F0'; c2.strokeStyle='#24588C'; } else { c2.moveTo(p.x,p.y-p.r); c2.lineTo(p.x+p.r,p.y); c2.lineTo(p.x,p.y+p.r); c2.lineTo(p.x-p.r,p.y); c2.closePath(); c2.fillStyle='#9B4DB0'; c2.strokeStyle='#4E1A5A'; } c2.lineWidth=1.5; c2.fill(); c2.stroke(); } }
  init(); let last=performance.now();
  function loop(t){ if(!cv.isConnected) return; const dt=Math.min(50,t-last); last=t; step(); draw(); tSince+=dt;
    if(!completed && !ctx.rec.d && visited.has('kalt') && visited.has('heiß') && tSince>3000){ completed=true; ctx.complete(undefined,'Untersuchung abgeschlossen. Halte im Kopf fest, was du bei „kalt“ und „heiß“ beobachtet hast.'); }
    requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
  ctx.solve=()=>{};
  ctx.drive=async()=>{ SB[2].click(); await sleep(3300); };
};

  function draw(){ const hw=ov.w?44:Math.min(48, 3+N.w*3.6); svg.querySelector('#cw').innerHTML = N.w? `<path d="${shape(120,hw,1)}" fill="#BFE3F8" stroke="#24588C" stroke-width="1.6"/>`+(ov.w?`<path d="M50 202 q-6 14 -2 20 M190 202 q6 14 2 22" stroke="#7FC4F0" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="120" cy="232" rx="98" ry="6" fill="#BFE3F8" opacity=".9"/>`:'') : '';
    const he=ov.e?2:Math.min(5,1.5+N.e*1.5); svg.querySelector('#ce').innerHTML = N.e? `<path d="${shape(340,he,1)}" fill="#E6E0F5" stroke="#6E5BB0" stroke-width="1.4"/>`+(ov.e?`<path d="M270 202 q-6 14 -2 20 M410 202 q6 14 2 22" stroke="#C9B8EE" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="340" cy="232" rx="104" ry="6" fill="#E6E0F5"/>`:'') : ''; }
  async function dropIt(k){ const b=k==='w'?bw:be; if(ov[k]) return; b.disabled=true; const d=svg.querySelector('#c'+k+'d'); d.setAttribute('fill',k==='w'?'#7FC4F0':'#C9B8EE'); d.setAttribute('opacity',1);
    const target = k==='w' ? 200-Math.min(48,3+N.w*3.6)*0.95 : 196; await tween(320,t=>d.setAttribute('transform',`translate(0,${(target-86)*t})`)); d.setAttribute('opacity',0); d.removeAttribute('transform');
    N[k]++; if(N[k]>=OVER[k]) ov[k]=true; draw(); if(ov[k]){ b.textContent = (k==='w'?'Wasser':'Ethanol')+' übergelaufen'; } else b.disabled=false;
    if(ov.w && ov.e && !ctx.rec.d) ctx.complete(undefined,'Beide Münzen sind übergelaufen. Vergleiche, wie hoch sich die Flüssigkeiten vorher gewölbt haben.'); }
  bw.onclick=()=>dropIt('w'); be.onclick=()=>dropIt('e');
  ctx.solve=()=>{ N.w=12;N.e=2;ov.w=false;ov.e=true; draw(); svg.querySelector('#cw').insertAdjacentHTML('beforeend',`<text x="120" y="135" text-anchor="middle" font-size="11" fill="#5A6B7E">kurz vor dem Überlaufen</text>`); bw.disabled=true; be.disabled=true; };

};
function brownSvg(){ let x=80,y=60,pts=[]; for(let i=0;i<70;i++){ x=Math.max(14,Math.min(146,x+(Math.random()-.5)*26)); y=Math.max(14,Math.min(106,y+(Math.random()-.5)*26)); pts.push([x,y]); }
  const d='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
  const rel='M0 0 L'+pts.slice(1).map(p=>(p[0]-pts[0][0]).toFixed(1)+' '+(p[1]-pts[0][1]).toFixed(1)).join(' L');
  return `<svg viewBox="0 0 160 120" style="max-width:220px" role="img" aria-label="Zickzack-Bahn eines Körnchens"><rect x="2" y="2" width="156" height="116" rx="10" fill="#fff" stroke="#6A5FB2" stroke-width="2"/><path d="${d}" fill="none" stroke="#B7AEE0" stroke-width="1.3"/><g transform="translate(${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)})"><circle r="7" fill="#E8C66A" stroke="#16385C" stroke-width="1.5"><animateMotion dur="24s" repeatCount="indefinite" path="${rel}"/></circle></g></svg>`; }

async function sha256hex(t){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function b64(s){ return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); }
async function decryptSol(pw){ const km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(SOL.salt), iterations:SOL.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(SOL.iv)}, key, b64(SOL.ct)); return new TextDecoder().decode(pt); }
function openTeacher(){
  const m=el('div','modal'); const c=el('div','card'); m.appendChild(c); document.body.appendChild(m);
  m.addEventListener('click',e=>{ if(e.target===m) m.remove(); });
  c.innerHTML=`<h2>Lehrkraft-Bereich</h2><p>Bitte Passwort eingeben.</p>`;
  const inp=el('input'); inp.type='password'; inp.setAttribute('aria-label','Passwort'); inp.autocomplete='off';
  const msg=el('div'); const a=el('div','actions');
  const go=async()=>{ msg.innerHTML='';
    if(!(window.crypto && crypto.subtle)){ msg.innerHTML='<div class="fb no">Der Browser erlaubt hier keine Entschlüsselung (nur über https oder als lokale Datei möglich).</div>'; return; }
    const h=await sha256hex(inp.value); if(h!==PWHASH){ msg.innerHTML='<div class="fb no">Falsches Passwort.</div>'; return; }
    let html=''; try{ html=await decryptSol(inp.value); }catch(e){ msg.innerHTML='<div class="fb no">Entschlüsselung fehlgeschlagen.</div>'; return; }
    c.innerHTML=`<h2>Lehrkraft-Bereich</h2>`; const a2=el('div','actions');
    a2.append(btn(preview?'Vorschau beenden':'Alle Stationen freischalten (Vorschau)','btn',()=>{ preview=!preview; m.remove(); toast(preview?'Vorschau: alle Stationen offen':'Vorschau beendet'); renderHome(); }),
      btn('Fortschritt auf diesem Gerät zurücksetzen','btn warn',()=>{ const ok=c.querySelector('#rsconf'); if(!ok){ const p=el('div','fb no','Wirklich alles zurücksetzen? <button type="button" class="btn small" id="rsconf">Ja, zurücksetzen</button>'); a2.after(p); p.querySelector('#rsconf').onclick=()=>{ S={ex:{},name:'',loc:''}; preview=false; save(); m.remove(); toast('Fortschritt zurückgesetzt'); renderHome(); }; } }),
      btn('Sperren','btn ghost',()=>{ preview=false; m.remove(); renderHome(); }));
    c.appendChild(a2); c.insertAdjacentHTML('beforeend', html); };
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  a.append(btn('Entsperren','btn',go), btn('Abbrechen','btn ghost',()=>m.remove()));
  c.append(inp, msg, a); inp.focus();
}

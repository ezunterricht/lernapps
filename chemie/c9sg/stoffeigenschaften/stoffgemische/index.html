  // ---------------------------------------------------------------- Infokarten
  // Szenenbild (optional) oben in der Auftragskarte: C.INTRO.scene bzw. Station.scene = Schlüssel aus FIGS
  function sceneHtml(key) { return key && F[key] ? '<div class="scene">' + F[key].svg + "</div>" : ""; }
  function figHtml(key) {
    var f = F[key]; if (!f) return "";
    return '<div class="figwrap" data-fig="' + key + '">' + f.svg + '</div><div class="swipe">↔ Abbildung seitlich wischen</div>';
  }
  function fixFigs(root) {
    root.querySelectorAll(".figwrap").forEach(function (w) {
      var sv = w.querySelector("svg.fig"); if (!sv) return;
      var nat = +sv.getAttribute("width");
      sv.style.setProperty("--fw", nat + "px");
      sv.style.minWidth = Math.round(nat * 0.62) + "px";
      setTimeout(function () { if (w.scrollWidth > w.clientWidth + 2) w.classList.add("scroll"); }, 0);
      // Animierte Abbildung (Klasse "anim" oder SMIL): Knopf zum Neustarten
      if (!w.dataset.rp && sv.querySelector(ANIM_SEL)) {
        w.dataset.rp = "1";
        var sw = w.nextElementSibling, anchor = sw && sw.classList.contains("swipe") ? sw : w;
        anchor.insertAdjacentElement("afterend", replayBar(LB.replay, function () { restartNode(w.querySelector("svg.fig")); }));
      }
    });
  }

  // ---------------------------------------------------------------- Animationen wiederholen
  // Jede Animation bekommt einen Knopf, der sie auf den Anfang zurücksetzt, damit man sie neu
  // durchspielen kann. Zurückgesetzt wird nur die Darstellung – nie Punkte, Antworten oder Fortschritt.
  // Neue animierte Übungstypen: replayBar(label, fn) in den Übungskörper hängen, fn zeichnet den Anfangszustand neu.
  var ANIM_SEL = ".anim, animate, animateTransform, animateMotion, set";
  function replayBar(label, onClick) {
    var bar = el("div", "replaybar");
    var b = el("button", "btn ghost replay", "↺ " + (label || LB.replay));
    b.type = "button";
    b.onclick = function (e) { e.preventDefault(); onClick(); };
    bar.appendChild(b);
    return bar;
  }
  // Startet CSS-Animationen und SMIL-Zeitleiste eines Knotens neu (Klon ersetzt das Original).
  function restartNode(node) {
    if (!node || !node.parentNode) return node;
    var n = node.cloneNode(true);
    node.parentNode.replaceChild(n, node);
    return n;

    var bPrev = el("button", "btn ghost", "‹ zurück"), bPlay = el("button", "btn", "▶ Abspielen"), bNext = el("button", "btn ghost", "weiter ›");
    var dots = el("div", "dots", b.frames.map(function () { return "<i></i>"; }).join("")), pos = el("span", "pos");
    [bPrev, bPlay, bNext, dots, pos].forEach(function (x) { ctl.appendChild(x); });
    pl.appendChild(fr); pl.appendChild(cap); pl.appendChild(ctl);
    pl.appendChild(replayBar(LB.replayAnim, function () { show(0); play(); }));
    bd.appendChild(pl);
    var k = 0, timer = null, dur = b.dur || 3500;
    function show(i) {
      k = Math.max(0, Math.min(b.frames.length - 1, i));

      pos.textContent = (k + 1) + " / " + b.frames.length;
      bPrev.disabled = k === 0; bNext.disabled = k === b.frames.length - 1;
    }
    function stop() { if (timer) clearInterval(timer); timer = null; bPlay.textContent = "▶ Abspielen"; }
    function play() {
      stop();
      if (k >= b.frames.length - 1) show(0);
      bPlay.textContent = "❚❚ Pause";
      timer = setInterval(function () {
        if (!document.body.contains(pl)) { stop(); return; }
        if (k >= b.frames.length - 1) { stop(); return; }
        show(k + 1);
      }, dur);
    }
    bPlay.onclick = function () { if (timer) stop(); else play(); };
    bPrev.onclick = function () { stop(); show(k - 1); };
    bNext.onclick = function () { stop(); show(k + 1); };

      miss: function () { rec[1]++; store[ex.id] = [0, rec[1], 0]; save(); if (rec[1] >= (ex.solAfter || 3)) bSol.hidden = false; },
      award: function (msg) { rec[1] = Math.max(rec[1], 0) + 1; win(msg); },

    };

      save();

      if (msg) ctl.fb(r[2] === 2 ? "sol" : "ok", msg);

    function win(msg) {
      var pts = PRO ? (rec[1] === 1 ? 3 : rec[1] === 2 ? 2 : 1) : (rec[1] === 1 ? MAXP : rec[1] === 2 ? Math.round(MAXP * 0.6) : Math.round(MAXP * 0.3));

    return c;
  }

  // Diagramm-Grundgerüst (SVG): Achsen, Gitter, Beschriftungen; liefert Umrechnung Daten <-> Bildkoordinaten

    else for (var x = o.xmin; x <= o.xmax + 1e-9; x += o.xstep) {

      s += '<text x="' + X(x) + '" y="' + (H - B + 20) + '" text-anchor="middle" font-size="14" fill="#22313F">' + fmtNum(x) + "</text>";
    }
    s += '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R + 4) + '" y2="' + (H - B) + '" stroke="#1F3A5F" stroke-width="2"/>';
    s += '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + L + '" y2="' + (T - 4) + '" stroke="#1F3A5F" stroke-width="2"/>';

  }

  // Reihenfolge bilden (items[] in richtiger Reihenfolge; Pfeile oder Drag & Drop)

  // Punkte einzeichnen: Messwerte als Punkte in ein Diagramm setzen (cats[] als x-Kategorien, sol[] Sollwerte, tol Toleranz)
  TYPES.plot = function (body, ex) {
    var A = axes(ex), n = ex.cats.length, vals = ex.cats.map(function () { return null; }), lk = false, marks = null;

      body.appendChild(el("div", "tscroll", '<table class="t"><tr><th>' + ex.table.head[0] + "</th>" + ex.cats.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "</tr><tr><td><b>" + ex.table.head[1] + "</b></td>" + ex.table.vals.map(function (v) { return "<td>" + v + "</td>"; }).join("") + "</tr></table>"));
    }
    body.appendChild(el("p", "note", "Tippe in jeder Spalte auf die passende Höhe, um einen Punkt zu setzen; zum Verschieben ziehen."));

  // Ionen-Werkstatt: Elektronen im Energiestufenmodell abgeben (−) oder aufnehmen (+), bis die Edelgaskonfiguration erreicht ist.

  TYPES.ionbuild = function (body, ex) {

        H = ys[L - 1] + 54;
        var s = '<svg viewBox="0 0 330 ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Energiestufenmodell">';
        s += '<line x1="18" y1="' + (H - 8) + '" x2="18" y2="10" stroke="#1F3A5F" stroke-width="2"/><polygon points="18,4 13,14 23,14" fill="#1F3A5F"/>';
        s += '<text x="26" y="16" font-size="12" fill="#5B6B7C" font-family="Calibri, Carlito, sans-serif">Energie</text>';
        for (k = 0; k < L; k++) {

          s += '<line x1="30" y1="' + ly + '" x2="262" y2="' + ly + '" stroke="#8DB0D8" stroke-width="3" stroke-linecap="round"/>';
          s += '<text x="270" y="' + (ly + 4) + '" font-size="13" font-style="italic" fill="#1F3A5F" class="twn" font-family="Calibri, Carlito, sans-serif">n = ' + (k + 1) + "</text>";
          var n = st.e[k] || 0, x0 = 146 - (n - 1) * 9;
          for (var j = 0; j < n; j++) {
            var last = change === "+" && k === trim(st.e).length - 1 && j === n - 1;
            s += '<circle class="' + (last ? "ein" : "") + '" cx="' + (x0 + j * 18) + '" cy="' + (ly - 8) + '" r="5.5" fill="#2F5D8C"/>';
          }
          if (change && change.k === k) s += '<circle class="eout" cx="' + (x0 + n * 18) + '" cy="' + (ly - 8) + '" r="5.5" fill="#E0662B"/>';

          (q === 0 ? "ungeladenes Atom: " + fmt(String(a.sym)) : "Ion: " + ionHtml(String(a.sym), q) + " (Ladung " + Math.abs(q) + (q > 0 ? "+" : MINUS) + ")") + "</span>";
        r.classList.remove("good", "bad");

  GAMES.memory = function (body, b, finish, result) {

  // fig: Abbildung mit ia()-Bausteinen (figs_base), title/kicker: Text unter dem Bild (Standard: Untertitel/Spielrahmen),

  // Läuft beim ersten Start (S.iv), danach über „↺ Intro abspielen“ auf der Startseite. Überspringen jederzeit (Knopf, Esc).
  var introTimers = [];
  function introAnim() {
    var A = C.INTRO && C.INTRO.anim;
    if (!A || !F[A.fig]) return;
    introClose(true);
    var reduce = false; try { reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { }
    var at = reduce ? 0 : (A.textAt || 3.5);
    var ov = el("div", "intro-ov"); ov.id = "introOv";
    ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", A.title || M.untertitel || M.titel);
    ov.innerHTML = '<div class="intro-box"><button type="button" class="intro-skip">' + LB.introSkip + ' ›</button><div class="intro-fig">' + F[A.fig].svg + "</div>" +
      '<div class="intro-txt" style="animation-delay:' + at + 's"><div class="kicker">' + (A.kicker || M.rahmen || "") + "</div><h2>" + (A.title || M.untertitel || M.titel) + "</h2>" +
      '<button type="button" class="btn intro-go">' + LB.introGo + " →</button></div></div>";
    document.body.appendChild(ov);
    ov.querySelector(".intro-skip").onclick = function () { introClose(); };
    ov.querySelector(".intro-go").onclick = function () { FX.click(); introClose(); };
    if (!reduce) (A.sounds || []).forEach(function (x) { introTimers.push(setTimeout(function () { if (FX[x[1]]) FX[x[1]](); }, x[0] * 1000)); });
    introTimers.push(setTimeout(function () { var g = ov.querySelector(".intro-go"); if (g) try { g.focus({ preventScroll: true }); } catch (e) { } }, at * 1000 + 300));
    ov.querySelector(".intro-skip").focus();
  }
  function introClose(quiet) {
    introTimers.forEach(clearTimeout); introTimers = [];
    var ov = $("#introOv"); if (!ov) return;
    ov.remove();
    if (!quiet && !S.iv) { S.iv = 1; save(); }
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && $("#introOv")) introClose(); });

  // ---------------------------------------------------------------- Ausweis
  function certCard() {
    var c = el("div", "card blk info");
    var all = allDone();
    c.innerHTML = '<div class="badge">' + I.star + '</div><div class="bd"><div class="kicker">' + LB.zertKopf + "</div><h3>" + C.CERT.title + "</h3></div>";
    var bd = c.querySelector(".bd");
    if (!all && preview) bd.appendChild(previewNote("So sieht der Ausweis aus; die Lernenden erhalten ihn erst nach allen Übungen."));
    if (!all && !preview) { bd.appendChild(el("p", null, "Der Ausweis wird freigeschaltet, sobald alle Übungen aller Stationen bearbeitet sind.")); return c; }
    var row = el("div", "btns");
    var inp = el("input"); inp.placeholder = "Dein Name"; inp.value = S.name || ""; inp.style.padding = "7px 10px"; inp.style.borderRadius = "10px"; inp.style.border = "1.5px solid #9FBCDD";
    var pr = el("button", "btn", I.print + " Ausweis drucken");
    row.appendChild(inp); row.appendChild(pr); bd.appendChild(row);
    var cert = el("div", "cert"); cert.id = "certPrint"; bd.appendChild(cert);
    function draw() {
      var d = new Date();
      cert.innerHTML = '<div class="kicker" style="color:var(--blue)">' + LB.zertKopf + ' · Chemie ' + M.kapitel + " " + M.titel + "</div><h2>" + C.CERT.title + '</h2><div class="nm">' + (esc(S.name) || "&nbsp;") + "</div><p>" + C.CERT.text + '</p><p class="code">' + LB.lw + ": " + ST.map(function (s) { return s.stempel; }).join("") + "</p><p><b>" + points() + " von " + maxPoints() + " Punkten</b>" + (maxStars() ? " · ★ " + stars() + " " + LB.sterne : "") + " · " + d.toLocaleDateString("de-DE") + "</p>" + certBadges();
    }
    inp.oninput = function () { S.name = inp.value.slice(0, 60); save(); draw(); };
    pr.onclick = function () { window.print(); };
    draw();
    if (all && !S.cert) { S.cert = 1; save(); }
    return c;
  }

  // ---------------------------------------------------------------- Lehrkraft-Bereich
  function sha256(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var mp = Math.pow, maxWord = mp(2, 32), res = "", words = [], bl = ascii.length * 8, hash = [], k = [], pc = 0, isC = {};
    for (var cand = 2; pc < 64; cand++) { if (!isC[cand]) { for (var i = 0; i < 313; i += cand) isC[i] = cand; hash[pc] = (mp(cand, .5) * maxWord) | 0; k[pc++] = (mp(cand, 1 / 3) * maxWord) | 0; } }
    hash = hash.slice(0, 8);
    ascii = unescape(encodeURIComponent(ascii)); bl = ascii.length * 8;
    ascii += "\x80"; while (ascii.length % 64 - 56) ascii += "\x00";
    for (i = 0; i < ascii.length; i++) { var j = ascii.charCodeAt(i); words[i >> 2] |= j << ((3 - i) % 4) * 8; }
    words[words.length] = ((bl / maxWord) | 0); words[words.length] = (bl);
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), oh = hash; hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oh[i]) | 0;
    }
    for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; res += ((b < 16) ? 0 : "") + b.toString(16); }
    return res;
  }
  function teacher() {
    var p = $("#tpanel");
    p.classList.toggle("on");
    if (!p.classList.contains("on")) return;
    p.innerHTML = '<div class="tl"><input type="password" id="tpw" placeholder="Passwort" autocomplete="off" aria-label="Passwort"> <button class="btn" id="tgo">Anmelden</button> <span id="tmsg" class="note"></span></div>';
    $("#tgo").onclick = function () {
      if (sha256($("#tpw").value) === PWHASH) {
        p.innerHTML = '<p><b>Lehrkraft-Bereich</b></p><div class="btns"><button class="btn" id="tprev">Alle Stationen und Aufgaben anzeigen (Vorschau)</button><button class="btn ghost" id="treset">Fortschritt auf diesem Gerät zurücksetzen</button><button class="btn ghost" id="tlock">Bereich sperren</button></div><p class="note">Die Vorschau zeigt jede Station vollständig – alle Aufgaben, Merke-Kästen und die Bonus-Runde –, ohne dass vorher etwas gelöst werden muss. Sie gilt nur für diese Sitzung; Punkte gibt es nur für tatsächlich bearbeitete Aufgaben.</p>' + codeTable();
        $("#tprev").onclick = function () { preview = true; try { sessionStorage.setItem(KEY + "_pv", "1"); } catch (e) { } home(); };
        $("#treset").onclick = function () { S = normS({}); save(); try { localStorage.removeItem(KEY); } catch (e) { } home(); $("#tmsg") && ($("#tmsg").textContent = ""); };
        $("#tlock").onclick = function () { preview = false; try { sessionStorage.removeItem(KEY + "_pv"); } catch (e) { } p.classList.remove("on"); p.innerHTML = ""; home(); };
      } else { $("#tmsg").textContent = "Falsches Passwort."; }
    };
  }

  // ---------------------------------------------------------------- Start
  function modalGloss() {
    $("#mbody").innerHTML = "<h3>" + LB.glossar + '</h3><dl class="gloss">' + (C.GLOSSAR || []).map(function (g) { return "<dt>" + g[0] + "</dt><dd>" + g[1] + "</dd>"; }).join("") + "</dl>";
    $("#modal").classList.add("on");
  }
  function modalKartei() { $("#mbody").innerHTML = "<h3>" + LB.kartei + "</h3>" + (LB.karteiNotiz ? "<p class=\"note\">" + LB.karteiNotiz + "</p>" : "") + karteiHtml(); $("#modal").classList.add("on"); }
  document.addEventListener("DOMContentLoaded", function () {
    app = $("#app");
    load();
    $("#btnHome").onclick = home;
    $("#btnKartei").onclick = modalKartei;
    if ($("#btnGloss")) $("#btnGloss").onclick = modalGloss;
    $("#mclose").onclick = function () { $("#modal").classList.remove("on"); };
    $("#modal").onclick = function (e) { if (e.target.id === "modal") $("#modal").classList.remove("on"); };
    $("#btnTeacher").onclick = teacher;
    if ($("#btnBadges")) $("#btnBadges").onclick = modalBadges;
    if ($("#btnSound")) $("#btnSound").onclick = function () { FX.toggle(); renderHead(); };
    FX.init();
    var li = ST.map(function (s) { return s.id; }).indexOf(S.loc);
    if (li > -1 && unlocked(li)) openStation(li); else home();
    if (!S.iv) introAnim();
    if (window.__TEST__) {
      window.__T = {
        S: function () { return S; }, points: points, maxPoints: maxPoints, EX: EXLIST, open: openStation, home: home, sha: sha256,
        card: function (id) { return document.getElementById("ex-" + id); },
        fill: function (id, ok) { var c = document.getElementById("ex-" + id); c._R.fill(ok); },
        check: function (id) { var c = document.getElementById("ex-" + id); var b = c.querySelector(".exbtns .btn"); b.click(); return c.querySelector(".exfb").className; },
        R: function (id) { return document.getElementById("ex-" + id)._R; },
        PX: PXLIST, GM: GMLIST, stars: stars, maxStars: maxStars, badges: function () { return badgeList().map(function (b) { return [b.id, hasBadge(b.id)]; }); },
        game: function (id) { var g = document.getElementById("gm-" + id); return g && g._G; }, FX: function () { return FX; },
        codes: function () { return checkpoints(); }, plan: function (n) { var cp = checkpoints().filter(function (p) { return p.n === normCode(n); })[0]; return cp ? cpPlan(cp) : null; },
        scormOn: function () { return !!scorm; }, preview: function () { return preview; }, intro: introAnim, introClose: introClose
      };
    }
  });
})();

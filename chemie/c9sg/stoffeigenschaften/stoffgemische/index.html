:root{
  /* Farbpalette Chemie (Skill chemie-lerneinheit, Abschnitt 5) */
  --navy:#1F3A5F; --ink:#22313F; --muted:#5B6B7C; --bg:#F6F9FD; --card:#EEF4FB; --line:#C9D9EE; --badge:#2F5D8C;
  --blue:#2F5D8C; --blue2:#3D73AD; --pastel:#DDE8F5; --light:#EEF4FB;
  --signal:#E0662B; --signal-d:#B5470F; --signal-l:#FFF1E8; --ok:#1E7B4F; --ok-l:#E6F4EC; --err:#B42318; --err-l:#FDECEA;
  /* Feldtypen */
  --info:#2F5D8C; --info-bg:#FFFFFF; --info-line:#C9D9EE;
  --ex:#3D73AD; --ex-bg:#E4EFFB; --ex-line:#8DB0D8;
  --merke:#E0662B; --merke-bg:#FFF1E8;
  --bgr:#7B72BF; --bgr-bg:#EFEDF8; --bgr-line:#8F86C9;
  --head:"Cambria","Caladea",Georgia,serif; --body:"Calibri","Carlito","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--head);color:var(--navy);margin:0 0 .4em;line-height:1.2}
button,select,input,textarea{font-family:var(--body);font-size:16px}
sub,sup{font-size:.72em;line-height:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#1F3A5F,#2F5D8C);color:#fff;box-shadow:0 2px 8px rgba(20,40,70,.25)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}
.brand .logo{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand .logo .ico{width:24px;height:24px}
.brand b{font-family:var(--head);font-size:19px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{opacity:.85;font-size:13.5px;display:block}
.nav{display:flex;gap:6px;align-items:center}
.nav button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.nav button:hover{background:rgba(255,255,255,.26)}
.nav button[hidden]{display:none}
.score{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:150px}
.score .pts{font-weight:700}
.bar{width:150px;height:8px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:#F6B08C;width:0;transition:width .6s}
.stamps{display:flex;gap:3px}
.stamps span{width:19px;height:19px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.6);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:transparent}
.stamps span.on{background:#F6B08C;border:1.5px solid #fff;color:#1F3A5F}
main{padding:18px 0 40px}
/* Karten */
.card{background:#fff;border-radius:16px;padding:16px 18px;margin:14px 0;box-shadow:0 1px 3px rgba(31,58,95,.08);position:relative}
.blk{display:flex;gap:12px;align-items:flex-start}
.badge{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.badge .ico{width:22px;height:22px}
.blk .bd{flex:1;min-width:0}
.kicker{font-size:13px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.info{background:var(--info-bg);border:1px solid var(--info-line)}
.info .badge{background:var(--info)} .info .kicker{color:var(--info)}
.ex{background:var(--ex-bg);border:1px solid var(--ex-line)}
.ex .badge{background:var(--ex)} .ex .kicker{color:var(--blue)}
.merke{background:var(--merke-bg);border:2px solid var(--merke);box-shadow:4px 4px 0 rgba(224,102,43,.2)}
.merke .badge{background:var(--merke)} .merke .kicker{color:var(--signal-d)}
.bgr{background:var(--bgr-bg);border:2px dashed var(--bgr-line)}
.bgr .badge{background:var(--bgr)} .bgr .kicker{color:#5B52A3}  /* Kicker-Text dunkler als der Badge: Kontrast mindestens 4,5 : 1 */
.story{background:var(--card);border:1px solid var(--line)}
.story .badge{background:var(--navy)}
.scene{margin:2px 0 10px}
.scene svg{width:100%;height:auto;display:block;max-width:720px}
.lead{font-size:18px;margin:.2em 0 .5em}
.bd p{margin:.45em 0}
.bd ul{margin:.4em 0;padding-left:1.25em}
.bd li{margin:.3em 0}
.op{display:inline-block;background:var(--ex);color:#fff;border-radius:10px;padding:0 8px;font-size:13.5px;font-weight:700;margin-right:6px}
.task{font-weight:700;margin:.2em 0 .7em}
.figwrap{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.figwrap svg.fig{width:100%;height:auto;display:block;max-width:var(--fw)}
.swipe{display:none;font-size:13px;color:var(--muted);margin-top:-4px}
.figwrap.scroll + .swipe{display:block}
.photo{margin:10px 0}
.photo img{max-width:min(100%,430px);height:auto;border-radius:10px;display:block}
.photo.small img{max-width:min(100%,220px)}
.photo figcaption a{color:inherit}
.photo figcaption,.cap{font-size:13.5px;color:var(--muted);margin-top:4px}
table.t{border-collapse:collapse;width:100%;margin:8px 0;background:#fff;font-size:16px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
table.t th{background:var(--pastel);font-weight:700}
.tscroll{overflow-x:auto}
.ghsrow{display:flex;gap:4px;flex-wrap:wrap}
.ghsrow svg{width:40px;height:40px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0;font-size:15px}
.legend span{display:flex;align-items:center;gap:6px}
.legend svg{width:38px;height:38px}
/* Buttons */
.btn{background:var(--blue);color:#fff;border:none;border-radius:22px;padding:8px 18px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.signal{background:var(--signal-d)}   /* weiße Schrift: Signal dunkel für 4,5 : 1 */
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
/* Animation neu abspielen */
.replaybar{display:flex;margin:6px 0 10px}
.replaybar[hidden]{display:none}
.btn.replay{padding:5px 14px;font-size:14.5px;font-weight:600}
.fb{margin-top:10px;padding:8px 12px;border-radius:10px;display:none}
.fb.ok{display:block;background:var(--ok-l);border:1px solid #9BD3B3;color:#1B5E3E}
.fb.no{display:block;background:var(--err-l);border:1px solid #EBB0A8;color:#8E2A1F}
.fb.sol{display:block;background:#FFF8E6;border:1px solid #F0D48A;color:#6B4E00}
.status{font-size:14px;color:var(--ok);font-weight:700}
/* Sortieren */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:8px;border-radius:12px;background:rgba(255,255,255,.6);border:1.5px dashed var(--ex-line)}
.chip{background:#fff;border:1.5px solid var(--ex-line);border-radius:12px;padding:6px 10px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;font-size:16px;max-width:100%}
.chip.sel{border-color:var(--signal);box-shadow:0 0 0 3px rgba(224,102,43,.25)}
.chip.bad{border-color:var(--err);background:var(--err-l)}
.chip.good{border-color:var(--ok);background:var(--ok-l)}
.chip .ionico{width:40px;height:auto;flex:none}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.bin{background:#fff;border:2px solid var(--ex-line);border-radius:14px;min-height:90px;padding:6px;cursor:pointer}
.bin.hot{border-color:var(--signal);background:#FFF9F4}
.bin h4{font-family:var(--body);font-size:15.5px;margin:2px 4px 6px;color:var(--navy);display:flex;align-items:center;gap:8px}
.bin h4 svg{width:42px;height:42px}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
/* MC */
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.opt input{margin-top:4px;transform:scale(1.2)}
.opt.good{border-color:var(--ok);background:var(--ok-l)}
.opt.bad{border-color:var(--err);background:var(--err-l)}
.opt .ofb{display:block;font-size:14.5px;margin-top:3px;color:var(--muted)}
/* Formel-Baukasten */
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:#fff;border-radius:12px;padding:8px 12px;margin:8px 0;border:1.5px solid var(--line)}
.frow .nm{font-weight:700;min-width:150px}
.cnt{display:flex;align-items:center;gap:5px}
.cnt button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;cursor:pointer}
.cnt .ionbox{min-width:62px;text-align:center;padding:3px 8px;border-radius:8px;background:var(--pastel);font-weight:700}
.cnt .n{font-weight:700;min-width:20px;text-align:center}
.fprev{font-size:20px;font-weight:700;color:var(--navy);min-width:90px}
.frow.good{border-color:var(--ok);background:var(--ok-l)} .frow.bad{border-color:var(--err);background:var(--err-l)}
/* Gleichung */
.eqsides{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.eqside{background:#fff;border:2px solid var(--ex-line);border-radius:12px;min-height:70px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;cursor:pointer}
.eqside.act{border-color:var(--signal);background:#FFF9F4}
.eqside .lbl{width:100%;font-size:13px;color:var(--muted);font-weight:700}
.eqarrow{align-self:center;font-size:28px;color:var(--navy)}
.term{display:flex;align-items:center;gap:2px;background:var(--pastel);border-radius:9px;padding:2px 4px;font-size:16px}
.term button{border:none;background:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:700;color:var(--blue);padding:0}
.term .k{font-weight:700;min-width:12px;text-align:center}
.plus{color:var(--muted)}
.eqtiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.eqout{margin-top:8px;font-size:17px;background:#fff;border-radius:10px;padding:6px 10px;border:1px solid var(--line);min-height:36px}
/* Simulation */
.rack{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;background:linear-gradient(#2F5D90,#23466F);border-radius:14px;padding:14px 8px 6px;overflow-x:auto;position:relative}
.rack .tb{display:flex;flex-direction:column;align-items:center;min-width:76px;position:relative}
.rack .tb svg{width:74px;height:auto}
.rack .tb .tl{font-weight:700;font-size:14px;color:#fff}
.rack .tb .ts{font-size:13px;color:#D6E6F7;text-align:center;line-height:1.15;min-height:30px}
.drip{position:absolute;top:-4px;left:50%;margin-left:-8px;width:16px;opacity:0}
.drip.go{animation:drip 1s ease}
@keyframes drip{0%{opacity:0;transform:translateY(-14px)}20%{opacity:1}80%{opacity:1;transform:translateY(8px)}100%{opacity:0;transform:translateY(8px)}}
.liq{transform-box:fill-box;transform-origin:50% 100%}
.liq.rise{animation:rise .9s ease}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.fade{animation:fadein 1.1s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.bub circle{animation:bub 1.6s linear infinite}
@keyframes bub{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-28px);opacity:0}}
.steps{margin-top:12px}
.steplog{margin:8px 0 0;padding-left:1.2em;font-size:15.5px;color:var(--muted)}
.steplog li.done{color:var(--ink)}
.stepopts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.stepopts button{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.stepopts button:hover{border-color:var(--blue)}
.obs select{width:100%;min-width:150px;padding:4px;border-radius:8px;border:1.5px solid var(--ex-line);background:#fff}
.obs td.good select{border-color:var(--ok);background:var(--ok-l)}
.obs td.bad select{border-color:var(--err);background:var(--err-l)}
.note{font-size:14px;color:var(--muted)}
/* Regler */
.sl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.sl input[type=range]{flex:1;min-width:200px;accent-color:var(--signal)}
.sl .val{font-size:22px;font-weight:700;color:var(--navy);min-width:110px}
.slref{display:inline-flex;gap:16px;align-items:flex-end;flex-wrap:wrap;background:linear-gradient(#2F5D90,#23466F);border-radius:14px;padding:12px 16px 8px;color:#fff}
.slref .tb{text-align:center;font-size:14px}
.slref svg{width:70px}
/* Fließdiagramm */
.flow{display:grid;grid-template-columns:minmax(150px,1fr) minmax(150px,1fr);gap:8px 14px;align-items:center;margin-top:10px}
.fbox{background:#fff;border:2px solid var(--navy);border-radius:10px;padding:6px 10px;text-align:center;font-weight:700}
.fq{background:var(--pastel);border:2px solid var(--blue);border-radius:30px;padding:6px 10px;text-align:center;font-size:15px}
.slot{background:#fff;border:2px dashed var(--signal);border-radius:10px;min-height:40px;padding:6px 8px;text-align:center;cursor:pointer;font-size:15.5px;display:flex;align-items:center;justify-content:center}
.slot.filled{border-style:solid;border-color:var(--blue)}
.slot.good{border-color:var(--ok);background:var(--ok-l)}.slot.bad{border-color:var(--err);background:var(--err-l)}
.slot.res{border-radius:30px}
.farr{text-align:center;color:var(--navy);font-size:15px;font-weight:700}
.farr .a{font-size:22px;line-height:1}
.flow .full{grid-column:1/-1}
.flow .lab{font-size:13px;color:var(--muted);text-align:center}
/* Matrix */
.matrix td{text-align:center}.matrix td:first-child{text-align:left;font-weight:700}
.matrix th svg{width:44px;height:44px;display:block;margin:auto}
.matrix input{transform:scale(1.5)}
.matrix td.good{background:var(--ok-l)}.matrix td.bad{background:var(--err-l)}
/* Labor */
.bench{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bench>div{min-width:0}
.bottles{display:flex;gap:8px;flex-wrap:wrap}
.bottle{background:#fff;border:2px solid var(--ex-line);border-radius:12px;padding:4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-weight:700}
.bottle.sel{border-color:var(--signal);box-shadow:0 0 0 3px rgba(224,102,43,.2)}
.bottle svg{width:34px;height:46px}
.tests{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.tests button{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:7px 11px;cursor:pointer}
.tests button.sel{border-color:var(--signal);background:#FFF9F4}
.labres{display:flex;gap:12px;align-items:center;background:linear-gradient(#2F5D90,#23466F);color:#fff;border-radius:12px;padding:10px;min-height:140px}
.labres .note{color:#D6E6F7}
.labres svg{width:60px;flex:none}
.journal td,.journal th{font-size:14.5px}
/* Concept-Map */
.cmapw{position:relative;width:100%;min-width:640px}
.cmapw svg{width:100%;height:auto;display:block}
.cmapw select{position:absolute;transform:translate(-50%,-50%);width:23%;padding:5px;border-radius:10px;border:2px dashed var(--signal);background:#fff;font-weight:700;font-size:15px}
.cmapw select.good{border:2px solid var(--ok);background:var(--ok-l)}.cmapw select.bad{border:2px solid var(--err);background:var(--err-l)}
/* Freitext */
textarea{width:100%;min-height:110px;border-radius:12px;border:1.5px solid var(--ex-line);padding:8px 10px;resize:vertical}
.model{background:#fff;border-left:4px solid var(--blue);padding:8px 12px;border-radius:8px;margin:10px 0}
.checklist label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
.checklist input{margin-top:4px;transform:scale(1.2)}
/* Laborplan */
.intro .bd p{margin:.3em 0}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:6px}
.stc{background:#fff;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;border:2px solid var(--line);text-align:left;width:100%;color:var(--ink)}
.stc:hover{border-color:var(--blue)}
.stc .badge{width:52px;height:52px;background:var(--blue)}
.stc .badge .ico{width:30px;height:30px}
.stc .t1{font-size:13.5px;color:var(--muted);font-weight:700}
.stc .t2{font-family:var(--head);font-size:18px;color:var(--navy)}
.stc .t3{font-size:13.5px;color:var(--muted)}
.stc.lock{opacity:.55;cursor:not-allowed}
.stc.lock .badge{background:#8FA3BA}
.stc.done .badge{background:var(--ok)}
.stc .stamp{margin-left:auto;width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:transparent;flex:none}
.stc.done .stamp{background:#F6B08C;border:2px solid var(--signal);color:var(--navy);transform:rotate(-12deg)}
.sthead{display:flex;gap:12px;align-items:center;margin-top:6px}
.sthead .badge{width:56px;height:56px;background:var(--navy)}
.sthead .badge .ico{width:32px;height:32px}
.sthead .t1{font-size:14px;color:var(--muted);font-weight:700}
.sthead h2{margin:0}
.back{background:none;border:none;color:var(--blue);cursor:pointer;font-weight:700;padding:0;font-size:16px}
.done-card{text-align:center;background:#fff;border:2px solid var(--ok)}
.done-card .big{font-size:44px;width:76px;height:76px;margin:6px auto;border-radius:50%;background:#F6B08C;border:3px solid var(--signal);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;color:var(--navy);transform:rotate(-12deg)}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(20,35,55,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;max-width:720px;width:100%;padding:18px;position:relative}
.modal .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:26px;cursor:pointer;color:var(--muted)}
.kartei{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kartei .col{border-radius:12px;padding:8px 10px}
.kartei .gut{background:#EAF6EF;border:1.5px solid #9BD3B3}
.kartei .schwer{background:#FFF3EA;border:1.5px solid #F0B48C}
.kartei h4{font-family:var(--body);margin:0 0 6px}
.kartei ul{list-style:none;padding:0;margin:0}
.kartei li{padding:3px 0;border-bottom:1px dotted #ccd}
/* Fußzeile */
footer{background:#fff;border-top:1px solid var(--line);padding:14px 0;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
footer button{background:none;border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer;color:var(--muted)}
.tpanel{display:none;margin-top:10px}
.tpanel.on{display:block}
.tpanel input{padding:6px 10px;border-radius:10px;border:1.5px solid var(--ex-line)}
/* Ausweis */
.cert{border:3px solid var(--navy);border-radius:18px;padding:22px;background:linear-gradient(135deg,#fff,#EAF2FB);text-align:center}
.cert h2{font-size:30px}
.cert .nm{font-size:28px;font-family:var(--head);color:var(--signal);border-bottom:2px solid var(--pastel);display:inline-block;min-width:60%;margin:8px 0}
.cert .code{letter-spacing:.3em;font-weight:700;font-size:22px;color:var(--navy)}
@media print{
  body *{visibility:hidden}
  #certPrint,#certPrint *{visibility:visible}
  #certPrint{position:absolute;left:0;top:0;width:100%}
  .top,footer{display:none}
}

td.psz{font-size:14px;color:var(--muted)}

/* Legende der Feldtypen auf der Startseite */
.flegend{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin:16px 0 6px;font-size:15px;color:var(--muted,#5B6B7C)}
.flegend .fl{display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:999px}
.flegend .fl .badge{width:30px;height:30px}.flegend .fl .badge .ico{width:17px;height:17px}
.flegend .fl .kicker{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;margin:0}
.flegend .merke{box-shadow:2px 2px 0 rgba(0,0,0,.12)}

/* Lösungswort */
.lw{letter-spacing:.18em;font-size:1.1em;white-space:nowrap}
.lwhint{margin:-4px 0 10px}

/* ================= Spielelemente (Codeschloss, Wimmelbild, Abzeichen, Minispiele, Effekte, Profi-Pfad) ================= */
/* --gold-d: Flächen (Badges, Knöpfe); --gold-t: Gold-Text (Bonus-Runde, Profi-/Minispiel-Kicker, Sterne), mind. 5,4 : 1 auf den Gold-Hintergründen */
:root{--gold:#E8B931;--gold-d:#7F5F0A;--gold-t:#7F5F0A;--gold-l:#FFF7DC;--gold-line:#E2C46A}
/* Kopfzeile: Sterne, Abzeichen, Ton */
.ptsrow{display:flex;gap:10px;align-items:center}
.hstars{display:inline-flex;align-items:center;gap:3px;font-weight:700;color:#FFE7A3}
.hstars[hidden]{display:none}
.hstars .ico{width:17px;height:17px}
.hstars .ico polygon{fill:#FFD45C}
.nav .cnt{font-weight:700;font-size:14px;min-width:12px}
#btnSound{padding:5px 8px}
/* Profi-Pfad und Bonus-Runde */
.bonus{margin:18px 0 6px;padding:12px 14px 4px;border-radius:18px;background:repeating-linear-gradient(135deg,#FFFBEC,#FFFBEC 14px,#FFF6D9 14px,#FFF6D9 28px);border:2px solid var(--gold-line)}
.bonushead{display:flex;gap:10px;align-items:center}
.bonushead .badge{background:var(--gold)}
.bonushead h3{margin:0;color:var(--gold-t)}
.bonushead .note{margin:2px 0 0}
.ex.profi{background:var(--gold-l);border:2px solid var(--gold)}
.ex.profi .badge{background:var(--gold)} .ex.profi .kicker{color:var(--gold-t)}
.ex.profi .op{background:var(--gold-d)}
.st{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.st .st0{color:#5B6B7C}   /* noch nicht erreichte Sterne, Kontrast mind. 4,5 : 1 */
.st.big{font-size:20px}
.tstar{color:var(--gold-t);font-weight:700;white-space:nowrap}
/* Minispiele */
.game{background:#fff;border:2px solid var(--gold-line)}
.game .badge{background:var(--gold-d)} .game .kicker{color:var(--gold-t)}
.gres{text-align:center;padding:8px 6px;background:var(--gold-l);border-radius:14px;margin-top:10px}
.gres .gst .st{font-size:34px;letter-spacing:4px}
.gres p{margin:.3em 0 .6em}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.mcard{position:relative;overflow-wrap:anywhere;hyphens:auto;min-height:86px;border-radius:12px;border:2px solid var(--navy);background:var(--blue);color:#fff;cursor:pointer;padding:6px;font-size:15px;line-height:1.25;transition:transform .25s,background .25s}
.mcard .mface{display:none}
.mcard .mback{font-family:var(--head);font-size:30px;font-weight:700;opacity:.85}
.mcard.open,.mcard.done{background:#fff;color:var(--ink);transform:rotateY(180deg)}
.mcard.open>span,.mcard.done>span{transform:rotateY(180deg)}
.mcard.open .mface,.mcard.done .mface{display:block}
.mcard.open .mback,.mcard.done .mback{display:none}
.mcard.b.open,.mcard.b.done{background:var(--card)}
.mcard.a .mface{font-weight:700;color:var(--navy)}
.mcard.ghs .mface svg{width:64px;height:64px;display:block;margin:0 auto}
.mcard.ghs.open,.mcard.ghs.done{padding:4px}
.mcard.done{border-color:var(--ok);box-shadow:0 0 0 3px rgba(30,123,79,.2);cursor:default}
.blitz .bq{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.blitz .bpos{font-size:13.5px;color:var(--muted);font-weight:700}
.blitz .btxt{font-size:19px;font-weight:700;margin:8px 0 12px;min-height:2.6em}
.blitz .bbtn{display:flex;gap:10px;flex-wrap:wrap}
.blitz .bbtn .btn{flex:1 1 140px;padding:12px;font-size:17px}
.blitz .btn.no{background:var(--signal-d)}
.blitz .btn.good{background:var(--ok)!important;opacity:1}.blitz .btn.bad{background:var(--err)!important;opacity:1}
.btime{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:10px}
.btime i{display:block;height:100%;background:var(--signal);animation:shrink linear forwards;transform-origin:left}
.btime.stop i{animation-play-state:paused}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.tchk{font-size:15px;display:flex;gap:6px;align-items:center;cursor:pointer}
.bhud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bname{font-family:var(--head);font-weight:700;color:var(--navy)}
.hp{flex:1;min-width:120px;height:12px;border-radius:7px;background:#F1DCD8;overflow:hidden;border:1px solid #E3B6AE}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#B42318,#E0662B);transition:width .5s}
.lives{display:flex;gap:2px}
.lives span .ico{width:22px;height:22px}
.lives span .ico path{fill:#D6CFC0}
.lives span.on .ico path{fill:#C8352B}
.bossw{display:flex;justify-content:center;margin:6px 0}
.bossw svg{width:150px;height:auto}
.bossw.hit svg{animation:bhit .45s}
.bossw.beaten svg{animation:beaten 1s forwards}
@keyframes bhit{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-6deg);filter:brightness(1.6)}50%{transform:translateX(9px) rotate(5deg)}75%{transform:translateX(-5px)}}
@keyframes beaten{to{transform:scale(.4) rotate(200deg);opacity:.15}}
.bopts{display:flex;flex-direction:column;gap:7px}
.bopt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;font-size:16px;color:var(--ink)}
.bopt:hover:not(:disabled){border-color:var(--navy)}
.bopt.good{border-color:var(--ok);background:var(--ok-l)}.bopt.bad{border-color:var(--err);background:var(--err-l)}
/* Codeschloss */
.clues{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 12px}
.clue{flex:1 1 230px;display:flex;gap:8px;align-items:flex-start;background:#FFFDF2;border:1px solid #E8DDB0;border-radius:4px;padding:9px 11px;box-shadow:2px 3px 0 rgba(120,100,40,.12);transform:rotate(-.6deg);font-size:15.5px}
.clue:nth-child(2n){transform:rotate(.7deg)}
.clue .ico{width:20px;height:20px;flex:none}
.clue .ico circle,.clue .ico path{stroke:var(--signal-d)}
.lockw{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,#F2F5F9,#E1E8F0);border:2px solid #B9C7D8;border-radius:16px;padding:12px}
.padw{text-align:center;flex:none}
.pl{width:84px;height:auto;display:block;margin:0 auto}
.pl .shackle{transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.lockw.open .pl .shackle{transform:translateY(-14px) translateX(24px) rotate(18deg);transform-origin:84px 62px}
.lobj{font-size:13px;font-weight:700;color:#4B5B6C;max-width:110px}
.wheels{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}

/* Ribosom-Simulator (TYPES.ribo) */

.rbact{font-size:15px;padding:7px 12px;text-align:left}

.rblog li{margin:2px 0}
@keyframes rbFrom{from{transform:translate(var(--dx,0px),var(--dy,0px));opacity:var(--o,0)}to{transform:none;opacity:1}}

.lpath path.lseg{fill:none}

/* ---- Spiegel-Check (TYPES.mirror): Bild und Spiegelbild, Drehknöpfe ---- */
.mirw{margin:12px 0 4px;padding:10px 12px;border:1px solid #C9D9EE;border-radius:12px;background:#fff}
.mirw.solved.achiral{border-color:#9BD3B3}
.mirw.solved.chiral{border-color:#F0B9A3}

.mirfig{margin:0}
.mirbtns{flex-wrap:wrap;gap:8px;margin-top:8px}
.mirbtns .mirop{font-size:14.5px;padding:7px 13px}
.mirbtns .mirno{font-size:14.5px;padding:7px 13px}
.mirstat{margin:8px 0 0;font-size:15px}
.mirstat .mres{display:inline-block;padding:2px 10px;border-radius:12px;font-weight:700;margin-right:6px}
.mirstat .mres.chi{background:var(--signal-l);color:var(--signal-d)}
.mirstat .mres.achi{background:var(--ok-l);color:#1B5E3E}

/* Antippen in Abbildungen: kein Doppeltipp-Zoom, Zeiger als Hand (iOS wertet nur „klickbare“ Elemente) */
.figwrap.hunt svg,.mirsvg{touch-action:manipulation;cursor:pointer}
.mirbtns button,.exbtns button{touch-action:manipulation}

/* ---- Faltungs-Werkbank (Typ fold, vereinfachtes Gittermodell) ---- */
.foldleg{display:flex;gap:18px;flex-wrap:wrap;font-size:15px;margin:6px 0 8px}
.foldleg i{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-3px;margin-right:6px}
.foldleg .fh{background:#8C6A3F;border:2px solid #4E3A20}
.foldleg .fp{background:#fff;border:2px solid #4F7A2A}
.foldleg .fc{border-radius:0;height:0;width:24px;border-top:4px dashed #6FA544;vertical-align:4px}
.foldmeter{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;font-size:15.5px;min-height:38px}
.foldmeter .fbar i{display:inline-block;width:20px;height:12px;border-radius:3px;border:1.5px solid var(--navy);margin-right:3px;vertical-align:-1px}
.foldmeter .fbar i.on{background:var(--blue2)}
.foldmeter .fwarn{color:var(--err)}
.foldw{max-width:520px;margin:8px auto}
.foldw svg{touch-action:manipulation;width:100%;height:auto;display:block}
.foldw .fcon{stroke:#6FA544;stroke-width:5;stroke-dasharray:6 5;stroke-linecap:round}
.foldw g.tap{cursor:pointer}
.foldw g.tap:hover circle:nth-child(2){stroke-width:4}
.foldtools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 2px;padding:6px 8px;background:#fff;border:1.5px solid var(--line);border-radius:12px}
.foldtools .fsel{flex:1 1 100%;font-size:15px;color:var(--muted)}
.foldtools .fsel b{color:var(--navy)}
.foldtools .btn{padding:6px 12px;font-size:15.5px}
.foldtools .btn:disabled{opacity:.42;cursor:default}
.foldtools .fsep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.foldtools.off{display:none}
.foldmeter .fbest{color:var(--muted);font-size:14.5px}
.foldw:focus-visible{outline:3px solid var(--blue2);outline-offset:3px;border-radius:16px}
.foldw .fpiv{fill:none;stroke:#D9782D;stroke-width:3;stroke-dasharray:5 4}
.foldw g.on circle:nth-child(2){stroke:#A9541A;stroke-width:4}
.fkeys{font-size:13.5px}
.foldw svg.foldsvg{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.foldw .fghost line{stroke:#D9782D;stroke-width:3;stroke-dasharray:4 4}
.foldw .fghost circle{fill:#FCEEE2;stroke:#D9782D;stroke-width:2.5;stroke-dasharray:4 3}
.foldw .fghost circle.hit{fill:transparent;stroke:none}
.foldw .fghost{cursor:pointer}
.foldw .fghost.risk circle{fill:#FDECEA;stroke:#B42318}
.foldw .fghost.risk line{stroke:#B42318}
.foldw.dragging .fghost{opacity:.35}

/* ---------------------------------------------------------------- Fertigungsstraße (Typ band, Einheit 1.7 Genwirkketten) */
.bdstep{margin:12px 0 6px}
.bdtabs{display:flex;flex-wrap:wrap;gap:8px}
.bdtab{font:inherit;font-weight:700;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.bdtab.sel{border-color:var(--navy);background:var(--card)}
.bdtab.done::after{content:" ✓";color:var(--ok)}
.bdlab{display:grid;grid-template-columns:minmax(300px,330px) 1fr;gap:14px;align-items:start}
.bdrackbox{border:2px solid var(--line);border-radius:12px;background:#fff;padding:8px 10px 10px;text-align:center}
.bdrackt{font-weight:700;color:var(--navy);margin-bottom:2px}
.bdtubes{display:flex;justify-content:center;gap:4px}
.bdtube{display:flex;flex-direction:column;align-items:center;width:72px}
.bdtube svg{width:56px;height:auto}
.bdtube span{font-size:13px;line-height:1.15;min-height:30px}
.bdgo{margin-top:6px}
.bdprot table{font-size:14px}
.bdprot caption{text-align:left;font-weight:700;color:var(--navy);padding-bottom:4px}
.bdprot td.yes{background:var(--ok-l);color:var(--ok);font-weight:700}
.bdprot td.no{background:var(--err-l);color:var(--err);font-weight:700}
.bdprot tr.cur td:first-child{box-shadow:inset 4px 0 0 var(--signal)}
.bdstage .bdhit{cursor:pointer;touch-action:manipulation}
.bdstage .bdhit:hover{fill:rgba(217,120,45,.10)}
.bdnone{margin-top:6px}
@media (max-width:900px){.bdlab{grid-template-columns:1fr}}

/* ---- Stationscodes (Wiedereinstieg ohne gespeicherten Fortschritt) ---- */
.codebox{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;border:1.5px dashed var(--navy);padding:12px 16px}
.codebox .cbt{display:flex;gap:10px;align-items:center;flex:1 1 340px}
.codebox .cbt .badge{position:static;flex:none;width:36px;height:36px;border-radius:50%;background:var(--pastel);display:flex;align-items:center;justify-content:center}
.codebox .cbt .badge .ico{width:20px;height:20px}
.codebox .cbt b{font-family:var(--head);color:var(--navy);font-size:17.5px}
.codebox .cbt .note{margin:2px 0 0}
.codebox .cbf{display:flex;gap:8px;align-items:center;flex:0 1 auto}
.codebox .cbin{font:inherit;font-size:18px;letter-spacing:.06em;text-transform:uppercase;width:200px;padding:7px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.codebox .cbin:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--pastel)}
.codebox .cbin::placeholder{text-transform:none;letter-spacing:normal;color:var(--muted);opacity:.7}
.codebox .cbmsg{flex:1 1 100%}
.codebox .cbmsg:empty{display:none}
.codebox .cbmsg.no{color:var(--err);font-weight:700}
.codebox .cbmsg.warn{background:var(--err-l);border-radius:10px;padding:8px 12px}
.codebox .cbmsg.warn p{margin:0 0 6px}
.codebox .cbmsg .btns{margin:0}
.stcode{display:inline-flex;flex-direction:column;align-items:center;gap:2px;margin:4px auto 10px;padding:8px 22px;border:2px dashed var(--signal);border-radius:12px;background:#fff}
.stcode .kicker{color:var(--signal-d)}
.code{font-family:"Consolas","Courier New",monospace;letter-spacing:.08em;font-weight:700;color:var(--ink)}
.stcode .code{font-size:26px}
.stcode .note{font-size:14px;max-width:420px}
.lcode{display:flex;gap:8px;align-items:center;margin:8px 0 0}
.lcode .ico{width:20px;height:20px;flex:none}
.lcode .code{font-size:17px}
.tcodes{margin-top:10px}
.tcodes summary{cursor:pointer;font-weight:700;color:var(--navy)}
.tcodes table{border-collapse:collapse;margin:8px 0 4px;font-size:15px;background:#fff}
.tcodes th,.tcodes td{border:1px solid var(--line);padding:4px 10px;text-align:left}
.tcodes td b{font-family:"Consolas","Courier New",monospace;letter-spacing:.05em}
.codebox .cbt .badge .ico circle,.codebox .cbt .badge .ico path,.lcode .ico circle,.lcode .ico path{stroke:var(--navy)}
.tcodes td:first-child,.tcodes td:last-child{white-space:nowrap}
/* ---- Statusmeldung (Block self) und Auswertung (Block selfeval) ---- */
.selfc{background:#fff;border:1.5px dashed var(--blue2)}
.selfc .badge{background:var(--blue2)} .selfc .kicker{color:#2C5C8F}
.selfc .selfq{margin:.2em 0 .5em}
.selfopts{display:flex;flex-wrap:wrap;gap:8px}

.selft .selfcmp{font-size:14.5px;color:var(--muted);margin-top:3px}
.selfst{display:inline-block;border-radius:12px;padding:2px 10px;font-weight:700;font-size:14.5px;white-space:nowrap}
.selfst.s0{background:var(--ok-l);color:var(--ok);border:1.5px solid var(--ok)}
.selfst.s1{background:var(--signal-l);color:var(--signal-d);border:1.5px solid var(--signal)}
.selfst.s2{background:var(--err-l);color:var(--err);border:1.5px solid var(--err)}
.selfst.pv{background:var(--light);color:var(--navy);border:1.5px solid var(--line)}
.selft .selfgo{display:block;margin-top:6px;padding:4px 10px;font-size:14px}
/* ---- Startturm-Baukasten (Typ tower) ---- */
.twtabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.twtab{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;text-align:left}
.twtab small{font-size:13.5px;color:var(--muted);font-weight:400}

.twtab.good{background:var(--ok-l);border-color:var(--ok)} .twtab.bad{background:var(--err-l);border-color:var(--err)}
.twstage{background:linear-gradient(#EAF2FB,#F6F9FD);border:1.5px solid var(--line);border-radius:14px;padding:6px;max-width:520px}

.twlv{cursor:pointer;outline:none}

.twlv .twe{cursor:pointer}

.twinfo{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:15.5px;color:var(--ink)}

<script>var C={"META": {"id": "c9sg_stoffgemische_visuell_v1", "codes": true, "loesungswort": "RAUCH", "kapitel": "", "titel": "Reinstoffe und Stoffgemische", "untertitel": "Expedition Gemischland", "rahmen": "Expedition Gemischland", "stand": "November 2026", "fassung": "visuell", "datei": "Expedition-Gemischland_Stoffgemische", "scorm_titel": "Reinstoffe und Stoffgemische – Expedition Gemischland", "icon": "map", "ton": true, "labels": {"introGo": "Expedition starten"}, "badges": {"erst": {"name": "Erster Gipfelstempel", "desc": "Die erste Station der Expedition geschafft"}, "schloss": {"name": "Etikettenretter", "desc": "Den Gasschrank der Wetterstation geöffnet"}, "adler": {"name": "Adlerauge", "desc": "Den Proviant ohne Fehlgriff geprüft"}, "boss": {"name": "Nebelbezwinger", "desc": "Den Nebelgeist vom Gipfel vertrieben"}, "ziel": {"name": "Gipfel erreicht", "desc": "Alle Stationen der Expedition Gemischland abgeschlossen"}}}, "INTRO": {"title": "Expedition Gemischland", "story": "Euer Expeditionsteam bricht ins <b>Gemischland</b> auf – ein Tal voller Stoffe: ein schlammiger Fluss, das salzige Meer, Wolken über den Gipfeln und oben eine Wetterstation. Auf dem Weg vom Basislager zum Gipfelkreuz lernst du, welche Stoffe <b>Reinstoffe</b> und welche <b>Stoffgemische</b> sind, wie man Gemische benennt und wie man unsichtbare Gase nachweist. Für jede Station gibt es einen Gipfelstempel mit einem Buchstaben – zusammen ergeben sie das Lösungswort.", "hinweis": "Die Stationen werden nacheinander freigeschaltet. Bei jeder Übung gilt: 1. Versuch 10 Punkte, 2. Versuch 6 Punkte, danach 3 Punkte. Nach zwei Fehlversuchen kannst du dir die Lösung zeigen lassen (0 Punkte). Nach jeder Station wartet eine freiwillige <b>Bonus-Runde</b> mit Sternen; deine <b>Abzeichen</b> findest du oben beim Pokal. Notiere dir am Ende jeder Station den <b>Stationscode</b> – damit kannst du später direkt weitermachen.", "anim": {"fig": "fig_intro", "title": "Expedition Gemischland", "kicker": "Reinstoffe und Stoffgemische", "textAt": 3.6, "sounds": [[0.3, "flip"], [1.3, "click"], [1.9, "click"], [2.5, "click"], [3.1, "stamp"]]}}, "STATIONS": [{"id": "st1", "nr": 1, "ort": "Basislager", "title": "Reinstoff oder Stoffgemisch?", "icon": "home", "min": 6, "stempel": "R", "scene": "fig_sc_basis", "story": "Im Basislager im Tal packt das Team die Ausrüstung. Bevor es losgeht, wird der Proviant geprüft: Was davon ist ein <b>Reinstoff</b>, was ein <b>Stoffgemisch</b>?", "blocks": [{"t": "info", "title": "Wasser oder Salzwasser?", "side": true, "fig": "fig_wasser_salz", "lead": "Zwei Gläser mit klarer, farbloser Flüssigkeit – mit bloßem Auge sieht man keinen Unterschied.", "text": ["Lässt man beide Flüssigkeiten in einer Abdampfschale eindampfen, bleibt nur beim Salzwasser ein <b>weißer Rückstand</b>: Kochsalz. Salzwasser besteht also aus zwei Stoffen, aus Wasser und Kochsalz.", "<b>Wasser</b> ist ein <b>Reinstoff</b>: Es besteht nur aus einem einzigen Stoff. <b>Salzwasser</b> ist ein <b>Stoffgemisch</b>: Es ist aus mehreren Reinstoffen zusammengesetzt."]}, {"t": "info", "title": "Woran erkennt man ein Stoffgemisch?", "lead": "Manche Stoffgemische erkennt man sofort, andere erst bei genauerem Hinsehen.", "bullets": ["<b>Mit bloßem Auge:</b> Man sieht verschiedene Bestandteile, z. B. Körner in unterschiedlichen Farben.", "<b>Unter dem Mikroskop:</b> Milch sieht weiß und einheitlich aus. Im Mikroskop erkennt man winzige Fetttröpfchen im Wasser.", "<b>Über die Angaben auf der Packung:</b> Eine Zutatenliste oder eine Zusammensetzung aus mehreren Stoffen verrät ein Gemisch.", "Auf dem Etikett eines <b>Reinstoffs</b> steht dagegen nur ein Stoff, oft mit dem Hinweis „rein“ oder einem Reinheitsgrad, z. B. 99,9 %."]}, {"t": "ex", "id": "1a", "type": "hunt", "op": "Ermittle", "task": "Im Proviantzelt liegt die Ausrüstung bereit. Ermittle die <b>vier Reinstoffe</b> und tippe sie im Bild an.", "fig": "fig_wb_proviant", "hint": "Lies die Etiketten genau. Ein Fehlgriff kostet Punkte – überlege erst, dann tippe.", "targets": [{"id": "o2", "x": 104, "y": 222, "r": 40, "label": "Sauerstoffflasche", "fb": "Reinstoff: Auf dem Etikett steht nur ein Stoff, Sauerstoff."}, {"id": "cu", "x": 572, "y": 384, "r": 34, "label": "Kupferdraht (Kupfer 99,9 %)", "fb": "Reinstoff: Der Draht besteht aus reinem Kupfer."}, {"id": "aq", "x": 248, "y": 362, "r": 42, "label": "Kanister mit destilliertem Wasser", "fb": "Reinstoff: Destilliertes Wasser ist reines Wasser."}, {"id": "co2", "x": 430, "y": 240, "r": 30, "label": "Kohlenstoffdioxid-Kartusche", "fb": "Reinstoff: In der Kartusche ist nur Kohlenstoffdioxid."}], "decoys": [{"x": 314, "y": 236, "r": 40, "label": "Schokolade", "fb": "Die Zutatenliste nennt viele Stoffe – Schokolade ist ein Stoffgemisch."}, {"x": 652, "y": 240, "r": 26, "label": "Kompass aus Messing", "fb": "Messing besteht aus Kupfer und Zink – also ein Stoffgemisch."}, {"x": 412, "y": 384, "r": 36, "label": "Granitbrocken", "fb": "Im Granit sieht man helle, rosa und schwarze Körner – ein Stoffgemisch."}, {"x": 540, "y": 234, "r": 36, "label": "Tütensuppe", "fb": "Nudeln, Salz, Gewürze … – die Tütensuppe ist ein Stoffgemisch."}], "doneMsg": "Alle vier Reinstoffe gefunden – der Proviant ist geprüft!"}, {"t": "info", "title": "Blick auf die Teilchenebene", "fig": "fig_rein_gemisch", "lead": "Im Teilchenmodell bekommt jede Teilchensorte eine eigene Form.", "text": ["Ein <b>Reinstoff</b> enthält nur <b>eine Teilchensorte</b>, z. B. Wasser nur Wasserteilchen. Ein <b>Stoffgemisch</b> enthält <b>verschiedene Teilchensorten</b>, z. B. Salzwasser Wasserteilchen und Kochsalzteilchen. Das gilt in jedem Aggregatzustand: Ob die Teilchen dicht gepackt (fest, flüssig) oder weit voneinander entfernt sind (gasförmig), spielt dafür keine Rolle."]}, {"t": "ex", "id": "1b", "type": "sort", "op": "Ordne", "task": "Ordne die Teilchenbilder zu: Zeigen sie einen Reinstoff oder ein Stoffgemisch?", "bins": [{"id": "r", "label": "Reinstoff"}, {"id": "g", "label": "Stoffgemisch"}], "items": [{"id": "a", "label": "Bild A", "bin": "r", "pic": "fig_tb_a"}, {"id": "b", "label": "Bild B", "bin": "g", "pic": "fig_tb_b"}, {"id": "c", "label": "Bild C", "bin": "r", "pic": "fig_tb_c"}, {"id": "d", "label": "Bild D", "bin": "g", "pic": "fig_tb_d"}, {"id": "e", "label": "Bild E", "bin": "g", "pic": "fig_tb_e"}]}, {"t": "merke", "title": "Reinstoff und Stoffgemisch", "bullets": ["<b>Reinstoffe</b> bestehen nur aus einem Stoff und enthalten nur <b>eine Teilchensorte</b>. Sie haben feste <b>Kenneigenschaften</b>: Wasser siedet bei Normaldruck (1013 hPa) immer bei 100 °C.", "<b>Stoffgemische</b> sind aus mehreren Reinstoffen zusammengesetzt und enthalten <b>verschiedene Teilchensorten</b>. Ihre Eigenschaften hängen von der <b>Zusammensetzung</b> ab: Je mehr Alkohol (Ethanol) Wodka enthält, desto niedriger ist seine Dichte."]}, {"t": "ex", "id": "1p", "profi": true, "type": "mc", "op": "Beurteile", "task": "Eine klare, farblose Flüssigkeit beginnt bei 80 °C zu sieden. Während des Siedens steigt die Temperatur langsam bis auf 100 °C. Beurteile, ob die Flüssigkeit ein Reinstoff ist.", "options": [{"text": "Sie ist ein Stoffgemisch: Ein Reinstoff hätte eine feste Siedetemperatur.", "ok": true, "fb": "Richtig: Die Siedetemperatur ändert sich, weil sich die Zusammensetzung beim Sieden ändert – typisch für ein Gemisch."}, {"text": "Sie ist ein Reinstoff, weil sie klar und farblos ist.", "ok": false, "fb": "Auch Salzwasser ist klar und farblos. Aussehen allein reicht nicht."}, {"text": "Sie ist reines Wasser, weil sie am Ende bei 100 °C siedet.", "ok": false, "fb": "Reines Wasser siedet die ganze Zeit bei 100 °C, nicht schon ab 80 °C."}]}]}, {"id": "st2", "nr": 2, "ort": "Flussküche", "title": "Lösung, Suspension, Emulsion", "icon": "drop", "min": 7, "stempel": "A", "scene": "fig_sc_fluss", "story": "Am Fluss baut das Team die Feldküche auf. Zucker für den Tee, Aktivkohle aus dem Wasserfilter, Öl für die Salatsoße: Was passiert, wenn man diese Stoffe mit Wasser mischt?", "blocks": [{"t": "ex", "id": "2a", "type": "sim", "op": "Untersuche", "task": "Untersuche in der Simulation, wie sich Zucker, Aktivkohle-Pulver und Speiseöl mit Wasser mischen. Beschreibe deine Beobachtungen.", "note": "Schutzbrille tragen – auch bei harmlosen Stoffen. Im Labor wird nie probiert.", "start": "fig_mk0", "steps": [{"text": "Drei Reagenzgläser A, B und C zu einem Drittel mit Wasser füllen.", "fig": "fig_mk1"}, {"text": "In A eine Spatelspitze Zucker, in B eine Spatelspitze Aktivkohle-Pulver und in C etwa 1 mL Speiseöl geben.", "fig": "fig_mk2"}, {"text": "Die Reagenzgläser mit Stopfen verschließen und kräftig schütteln.", "fig": "fig_mk3"}, {"text": "Die Reagenzgläser fünf Minuten im Ständer stehen lassen.", "fig": "fig_mk4"}], "wrong": [{"text": "Einen Schluck aus Reagenzglas A probieren, um den Zucker zu schmecken.", "fb": "Im Labor wird nie probiert – auch nicht bei Lebensmitteln. Gefäße könnten verunreinigt sein."}, {"text": "Alle Reagenzgläser mit dem Brenner zum Sieden erhitzen.", "fb": "Für diesen Versuch ist kein Erhitzen nötig."}], "obsTitle": "Beobachtungen", "corner": "Reagenzglas", "cols": ["Beobachtung"], "colOpts": [["klar und durchsichtig", "gleichmäßig grau-schwarz und trüb", "schwarze Körnchen setzen sich unten ab", "milchig-trüb", "zwei Schichten, Öl oben", "Zucker bleibt als Häufchen liegen"]], "rows": [{"label": "A (Zucker) nach dem Schütteln", "sol": ["klar und durchsichtig"]}, {"label": "B (Aktivkohle) nach dem Schütteln", "sol": ["gleichmäßig grau-schwarz und trüb"]}, {"label": "B (Aktivkohle) nach fünf Minuten", "sol": ["schwarze Körnchen setzen sich unten ab"]}, {"label": "C (Öl) nach dem Schütteln", "sol": ["milchig-trüb"]}, {"label": "C (Öl) nach fünf Minuten", "sol": ["zwei Schichten, Öl oben"]}]}, {"t": "info", "title": "Drei Gemische mit Wasser", "lead": "Wie ein Gemisch aussieht, hängt davon ab, wie fein der eine Stoff im anderen verteilt ist. Danach richtet sich auch sein Name.", "bullets": ["<b>Lösung:</b> Der Stoff verteilt sich so fein, dass das Gemisch völlig <b>einheitlich und durchsichtig</b> aussieht – auch nach langem Stehen.", "<b>Suspension:</b> Kleine <b>Körnchen eines Feststoffs</b> schweben in der Flüssigkeit. Das Gemisch ist trüb; beim Stehen setzen sich die Körnchen langsam ab.", "<b>Emulsion:</b> Winzige <b>Tröpfchen einer Flüssigkeit</b> sind in einer anderen Flüssigkeit verteilt. Das Gemisch sieht milchig-trüb aus; beim Stehen trennen sich die Flüssigkeiten oft wieder."], "text": ["Ein Gemisch beschreibt man mit den Aggregatzuständen seiner Bestandteile: zuerst der Stoff in kleiner Menge (<b>Nebenbestandteil</b>), dann der Stoff, von dem am meisten da ist (<b>Hauptbestandteil</b>). Sand in Wasser ist zum Beispiel ein Gemisch „<b>fest in flüssig</b>“."]}, {"t": "ex", "id": "2b", "type": "select", "op": "Ordne", "task": "Ordne jedem Gemisch aus der Simulation den Fachbegriff und die Aggregatzustände seiner Bestandteile zu.", "corner": "Gemisch", "cols": ["Fachbegriff", "Aggregatzustände"], "colOpts": [["Lösung", "Suspension", "Emulsion"], ["fest in flüssig", "flüssig in flüssig", "gasförmig in flüssig"]], "rows": [{"label": "A: Zucker in Wasser", "sol": ["Lösung", "fest in flüssig"]}, {"label": "B: Aktivkohle in Wasser", "sol": ["Suspension", "fest in flüssig"]}, {"label": "C: Speiseöl in Wasser", "sol": ["Emulsion", "flüssig in flüssig"]}]}, {"t": "info", "title": "Die drei Gemische im Teilchenmodell", "fig": "fig_tm_drei", "lead": "So kann man sich die drei Gemische auf der Teilchenebene vorstellen.", "text": ["In der <b>Lösung</b> liegen die Zuckerteilchen <b>einzeln</b> zwischen den Wasserteilchen. In der <b>Suspension</b> bilden viele Kohleteilchen zusammen ein <b>Körnchen</b>. In der <b>Emulsion</b> bilden viele Ölteilchen zusammen ein <b>Tröpfchen</b>."]}, {"t": "ex", "id": "2c", "type": "mc", "op": "Deute", "task": "Die Zuckerlösung ist durchsichtig, die Suspension mit Aktivkohle dagegen trüb. Deute diesen Unterschied mithilfe des Teilchenmodells.", "options": [{"text": "Einzelne Zuckerteilchen sind viel zu klein, um sie zu sehen. Körnchen aus vielen Kohleteilchen sind so groß, dass sie das Gemisch trüb machen.", "ok": true, "fb": "Richtig: Erst viele Teilchen zusammen bilden ein Körnchen, das man als Trübung sieht."}, {"text": "Die Zuckerteilchen lösen sich beim Schütteln auf und verschwinden.", "ok": false, "fb": "Teilchen verschwinden nicht – die Zuckerteilchen sind nur einzeln zwischen den Wasserteilchen verteilt."}, {"text": "Zuckerteilchen sind durchsichtig, Kohleteilchen sind schwarz.", "ok": false, "fb": "Einzelne Teilchen haben keine Stoffeigenschaften wie Farbe – Farbe ist eine Eigenschaft auf der Stoffebene."}, {"text": "In der Suspension gibt es keine Wasserteilchen mehr.", "ok": false, "fb": "Wasser ist der Hauptbestandteil – zwischen den Körnchen sind überall Wasserteilchen."}]}, {"t": "ex", "id": "2p", "profi": true, "type": "mc", "op": "Ordne", "task": "Klarer Apfelsaft ist durchsichtig. Trüber Apfelsaft enthält feine Fruchtfleisch-Stückchen, die sich beim Stehen unten absetzen. Ordne beiden Säften den passenden Fachbegriff zu.", "options": [{"text": "klarer Apfelsaft: Lösung · trüber Apfelsaft: Suspension", "ok": true, "fb": "Richtig: Die festen Fruchtfleisch-Stückchen schweben im Saft und setzen sich ab – eine Suspension."}, {"text": "klarer Apfelsaft: Lösung · trüber Apfelsaft: Emulsion", "ok": false, "fb": "Fruchtfleisch ist ein Feststoff, keine Flüssigkeit – Emulsionen enthalten Tröpfchen."}, {"text": "klarer Apfelsaft: Reinstoff · trüber Apfelsaft: Suspension", "ok": false, "fb": "Auch klarer Apfelsaft enthält neben Wasser gelösten Zucker und weitere Stoffe."}]}]}, {"id": "st3", "nr": 3, "ort": "Aussichtspunkt", "title": "Gemische benennen", "icon": "eye", "min": 7, "stempel": "U", "scene": "fig_sc_aussicht", "story": "Vom Aussichtspunkt überblickt das Team das ganze Tal: Fluss, Meer, Lagerfeuer, Almhütte und Berge. Für die Karte der Expedition soll jedes Gemisch seinen richtigen Namen bekommen.", "blocks": [{"t": "info", "title": "Gemische nach Aggregatzuständen benennen", "lead": "Der Name eines Gemischs hängt davon ab, in welchem Aggregatzustand <b>Hauptbestandteil</b> und <b>Nebenbestandteil</b> vorliegen.", "table": {"head": ["Nebenbestandteil", "Hauptbestandteil flüssig", "Hauptbestandteil gasförmig"], "rows": [["fest in …", "<b>Lösung</b> (fein verteilt, durchsichtig) oder <b>Suspension</b> (Körnchen, trüb)", "<b>Rauch</b>"], ["flüssig in …", "<b>Lösung</b> (fein verteilt, durchsichtig) oder <b>Emulsion</b> (Tröpfchen, milchig-trüb)", "<b>Nebel</b>"], ["gasförmig in …", "<b>Lösung</b> (Gas gelöst, durchsichtig)", "<b>Gasgemisch</b>"]]}, "text": ["Auch Gase können sich in Flüssigkeiten lösen: Sprudelwasser ist eine Lösung von Kohlenstoffdioxid in Wasser. Gase mischen sich untereinander immer vollständig – deshalb gibt es bei „gasförmig in gasförmig“ nur das Gasgemisch.", "Auch feste Stoffe bilden Gemische, z. B. Granit oder Messing. Für sie gibt es in dieser Übersicht keinen eigenen Namen."]}, {"t": "ex", "id": "3a", "type": "label", "op": "Ordne", "task": "Ordne den Gemischen im Tal den passenden Fachbegriff zu.", "scheme": "fig_gemischland", "slots": [{"id": "rauch", "x": 316, "y": 166, "sol": "Rauch"}, {"id": "nebel", "x": 400, "y": 221, "sol": "Nebel"}, {"id": "luft", "x": 590, "y": 92, "sol": "Gasgemisch"}, {"id": "fluss", "x": 410, "y": 412, "sol": "Suspension"}, {"id": "meer", "x": 626, "y": 386, "sol": "Lösung"}, {"id": "milch", "x": 96, "y": 408, "sol": "Emulsion"}], "extra": ["Reinstoff"]}, {"t": "ex", "id": "3b", "type": "select", "op": "Ordne", "task": "Ordne den Gemischen aus dem Alltag den Fachbegriff zu und begründe mit den Aggregatzuständen der Bestandteile.", "corner": "Gemisch", "cols": ["Fachbegriff", "Begründung"], "colOpts": [["Lösung", "Suspension", "Emulsion", "Rauch", "Nebel", "Gasgemisch"], ["fest in flüssig", "flüssig in flüssig", "fest in gasförmig", "flüssig in gasförmig", "gasförmig in gasförmig"]], "rows": [{"label": "klares Bier: vor allem Alkohol (Ethanol) in Wasser", "sol": ["Lösung", "flüssig in flüssig"]}, {"label": "Zuckerwasser: klar", "sol": ["Lösung", "fest in flüssig"]}, {"label": "Autoabgase: verschiedene Gase aus dem Auspuff", "sol": ["Gasgemisch", "gasförmig in gasförmig"]}, {"label": "Feuchtigkeitscreme: Wassertröpfchen in Öl", "sol": ["Emulsion", "flüssig in flüssig"]}, {"label": "Mehlstaubwolke: Mehl wirbelt in der Luft", "sol": ["Rauch", "fest in gasförmig"]}, {"label": "Mörtel: Sand und Zement in Wasser, körnig-trüb", "sol": ["Suspension", "fest in flüssig"]}]}, {"t": "info", "title": "Rauch, Nebel und Gasgemisch im Teilchenmodell", "lead": "Ist der Hauptbestandteil ein Gas, sind seine Teilchen <b>weit voneinander entfernt</b>.", "bullets": ["<b>Rauch:</b> Zwischen den Gasteilchen schweben <b>Körnchen</b> aus vielen dicht gepackten Feststoffteilchen.", "<b>Nebel:</b> Zwischen den Gasteilchen schweben <b>Tröpfchen</b> aus vielen Flüssigkeitsteilchen.", "<b>Gasgemisch:</b> Teilchen verschiedener Gase sind <b>einzeln</b> und weit voneinander entfernt verteilt."]}, {"t": "video", "kind": "uebung", "ratio": 0.78, "title": "Teilchenbilder zuordnen", "lead": "Ordne in der Übung des Verlags jedem Gemisch sein Teilchenbild zu: Ziehe jede Karte links auf das passende Bild rechts.", "src": "https://h5p.ccbuchner.net/wp-admin/admin-ajax.php?action=h5p_embed&id=465", "credit": "Übung: C.C.Buchner Verlag, Bamberg (H5P)."}, {"t": "game", "id": "3g", "kind": "memory", "title": "Memory: Gemisch und Zusammensetzung", "lead": "Finde zu jedem Gemisch die passende Beschreibung.", "pairs": [["Rauch", "fest in gasförmig"], ["Nebel", "flüssig in gas­förmig"], ["Gasgemisch", "gasförmig in gas­förmig"], ["Suspension", "Feststoff­körnchen in Flüssigkeit"], ["Emulsion", "Tröpfchen in Flüssigkeit"], ["Lösung", "einheitlich und durchsichtig"]]}]}, {"id": "st4", "nr": 4, "ort": "Wetterstation", "title": "Luft – ein Gasgemisch", "icon": "magnifier", "min": 8, "stempel": "C", "scene": "fig_sc_gipfel", "story": "Unterhalb des Gipfels steht eine Wetterstation. Das Team dort untersucht die Luft – und braucht Hilfe: Bei drei Gasdosen hat sich das Etikett gelöst. Bevor sie wieder benutzt werden dürfen, muss sicher geklärt werden, welches Gas darin ist.", "blocks": [{"t": "info", "title": "Luft ist ein Gasgemisch", "lead": "Luft ist kein Reinstoff, sondern ein <b>Gemisch aus verschiedenen Gasen</b>.", "table": {"head": ["Bestandteil trockener Luft", "Volumenanteil"], "rows": [["Stickstoff", "78,08 %"], ["Sauerstoff", "20,95 %"], ["Argon", "0,93 %"], ["Kohlenstoffdioxid", "ca. 0,04 %"], ["Spurengase (Neon, Helium, Methan u. a.)", "zusammen unter 0,01 %"]], "caption": "Zusammensetzung trockener Luft in Meereshöhe (Kohlenstoffdioxid: Stand 2026)."}, "text": ["„Frische“ und „verbrauchte“ Luft unterscheiden sich vor allem im Anteil an Sauerstoff und Kohlenstoffdioxid: Beim Einatmen nimmt der Körper Sauerstoff auf, beim Ausatmen gibt er Kohlenstoffdioxid ab. <b>Ausatemluft</b> enthält etwa <b>4 %</b> Kohlenstoffdioxid.", "Der Kohlenstoffdioxidanteil der Luft ist seit Beginn der Industrialisierung stark gestiegen: von etwa 0,028 % auf heute über 0,042 %."]}, {"t": "ex", "id": "4a", "type": "label", "op": "Ordne", "task": "Die Wetterstation zeigt die Zusammensetzung der Luft als Kreisdiagramm. Ordne den Teilen des Diagramms die Gase zu.", "scheme": "fig_kreis", "slots": [{"id": "n2", "x": 170, "y": 230, "sol": "Stickstoff"}, {"id": "o2", "x": 540, "y": 60, "sol": "Sauerstoff"}, {"id": "ar", "x": 540, "y": 168, "sol": "Argon"}, {"id": "co2", "x": 566, "y": 262, "sol": "Kohlenstoffdioxid und Spurengase"}], "extra": ["Wasserstoff"]}, {"t": "ex", "id": "4b", "type": "mc", "op": "Beurteile", "fig": "fig_luft_tb", "task": "Beurteile, welches Teilchenbild die Luft am besten darstellt.", "options": [{"text": "Bild 2", "ok": true, "fb": "Richtig: verschiedene Teilchensorten, weit voneinander entfernt, etwa viermal so viele Stickstoff- wie Sauerstoffteilchen. Argon und Kohlenstoffdioxid sind in Wirklichkeit noch viel seltener, als es ein Bild mit so wenigen Teilchen zeigen kann."}, {"text": "Bild 1", "ok": false, "fb": "Bild 1 zeigt nur eine Teilchensorte – das wäre ein Reinstoff."}, {"text": "Bild 3", "ok": false, "fb": "Die Teilchensorten stimmen, aber die Anteile nicht: Stickstoff ist viel häufiger als die anderen Gase."}, {"text": "Bild 4", "ok": false, "fb": "Die Teilchen liegen dicht gepackt wie in einer Flüssigkeit – in einem Gas sind sie weit voneinander entfernt."}]}, {"t": "info", "title": "Gase nachweisen", "lead": "Die meisten Gase sind farblos. Mit einfachen Nachweisen kann man sie trotzdem erkennen.", "fig": "fig_nachweise", "bullets": ["<b>Glimmspanprobe</b> – Nachweis für <b>Sauerstoff</b>: Ein glimmender Holzspan flammt in reinem Sauerstoff hell auf.", "<b>Kalkwasserprobe</b> – Nachweis für <b>Kohlenstoffdioxid</b>: Klares Kalkwasser wird milchig-trüb.", "<b>Knallgasprobe</b> – Nachweis für <b>Wasserstoff</b>: Wasserstoff ist viel leichter als Luft. Man hält das Reagenzglas deshalb mit der Öffnung nach unten, zieht den Stopfen ab und hält die Öffnung sofort an eine Flamme. Dabei mischt sich der Wasserstoff mit Luft zu <b>Knallgas</b>, das mit einem <b>Pfeifen oder Knall</b> verbrennt."], "text": ["Im Schullabor kommen die Gase aus kleinen, beschrifteten Druckgasdosen. <b>Sicherheit:</b> Schutzbrille tragen, lange Haare zusammenbinden, an Gasen nie direkt riechen. Kalkwasser kann die Augen schädigen. Bei der Knallgasprobe nur ein Reagenzglas voll Wasserstoff verwenden, alle Gasdosen vor dem Entzünden des Brenners verschließen und wegstellen und die Öffnung von Personen weghalten."], "stoffe": ["o2", "co2", "h2"], "showGhs": true, "gebot": ["brille"]}, {"t": "ex", "id": "4c", "type": "sim", "op": "Untersuche", "anyFrom": 1, "task": "Untersuche die Gase aus den Dosen A, B und C in der Simulation und beschreibe deine Beobachtungen.", "start": "fig_gas0", "steps": [{"text": "Drei Reagenzgläser mit Gas aus Dose A, B und C füllen und mit Stopfen verschließen; Reagenzglas C im Halter mit der Öffnung nach unten halten. Die Dosen verschließen und wegstellen.", "fig": "fig_gas1"}, {"text": "Reagenzglas A öffnen und einen glimmenden Holzspan hineinhalten.", "fig": "fig_gasA"}, {"text": "Etwas Kalkwasser in Reagenzglas B geben, verschließen und schütteln.", "fig": "fig_gasB"}, {"text": "Bei Reagenzglas C (Öffnung nach unten) den Stopfen abziehen und die Öffnung sofort an die Brennerflamme halten.", "fig": "fig_gasC"}], "wrong": [{"text": "An Dose A riechen, um das Gas zu erkennen.", "fb": "An Gasen nie direkt riechen – manche sind giftig oder verdrängen die Atemluft. Außerdem sind die meisten Gase geruchlos."}, {"text": "Reagenzglas C mit der Öffnung nach oben offen stehen lassen.", "fb": "Wasserstoff ist viel leichter als Luft und entweicht dann nach oben – Reagenzglas C mit der Öffnung nach unten halten."}], "obsTitle": "Beobachtungen", "corner": "Reagenzglas", "cols": ["Beobachtung"], "colOpts": [["der Span flammt hell auf", "der Span erlischt", "das Kalkwasser wird milchig-trüb", "das Kalkwasser bleibt klar", "Pfeifen bzw. Knall", "keine Veränderung"]], "rows": [{"label": "A: glimmender Holzspan", "sol": ["der Span flammt hell auf"]}, {"label": "B: Kalkwasser", "sol": ["das Kalkwasser wird milchig-trüb"]}, {"label": "C: Brennerflamme", "sol": ["Pfeifen bzw. Knall"]}]}, {"t": "ex", "id": "4d", "type": "lock", "op": "Werte aus", "task": "Der Gasschrank der Wetterstation öffnet sich erst, wenn jede Dose richtig beschriftet ist. Werte deine Beobachtungen aus und stelle für jede Dose das richtige Gas ein.", "object": "Gasschrank der Wetterstation", "wheels": [{"label": "Dose A", "opts": ["Sauerstoff", "Wasserstoff", "Kohlenstoffdioxid", "Stickstoff"], "sol": "Sauerstoff"}, {"label": "Dose B", "opts": ["Sauerstoff", "Wasserstoff", "Kohlenstoffdioxid", "Stickstoff"], "sol": "Kohlenstoffdioxid"}, {"label": "Dose C", "opts": ["Sauerstoff", "Wasserstoff", "Kohlenstoffdioxid", "Stickstoff"], "sol": "Wasserstoff"}], "clues": ["Schau in deine Beobachtungstabelle aus der Simulation.", "Jeder Nachweis passt zu genau einem Gas."], "okMsg": "Klick – der Gasschrank ist offen!", "reward": "Alle Dosen sind wieder beschriftet. Mit dem Wasserstoff wird gleich ein Wetterballon gefüllt: Er ist viel leichter als Luft und trägt die Messgeräte bis über 30 km hoch."}, {"t": "ex", "id": "4p", "profi": true, "type": "mc", "op": "Erkläre", "task": "Bläst man Ausatemluft durch Kalkwasser, wird es nach wenigen Sekunden trüb. Steht Kalkwasser offen an der Luft, dauert das viele Stunden. Erkläre den Unterschied.", "options": [{"text": "Ausatemluft enthält etwa 4 % Kohlenstoffdioxid, Luft nur etwa 0,04 % – also rund hundertmal weniger.", "ok": true, "fb": "Richtig: Mit der Ausatemluft gelangt in kurzer Zeit viel mehr Kohlenstoffdioxid ins Kalkwasser."}, {"text": "Luft enthält kein Kohlenstoffdioxid; das Kalkwasser trübt sich durch Staub.", "ok": false, "fb": "Luft enthält Kohlenstoffdioxid, nur sehr wenig: etwa 0,04 %."}, {"text": "Kalkwasser reagiert mit dem Sauerstoff der Ausatemluft.", "ok": false, "fb": "Ausatemluft enthält sogar weniger Sauerstoff als frische Luft. Die Kalkwasserprobe weist Kohlenstoffdioxid nach."}]}, {"t": "game", "id": "4z", "kind": "boss", "title": "Boss-Runde: Der Nebelgeist vom Gipfel", "name": "Nebelgeist", "fig": "fig_boss", "leben": 3, "winMsg": "Der Nebelgeist hat sich aufgelöst – freie Sicht zum Gipfel!", "loseMsg": "Der Nebel ist noch zu dicht. Versuch es gleich noch einmal!", "qs": [{"q": "Was gilt für einen Reinstoff?", "options": [{"text": "Er enthält nur eine Teilchensorte.", "ok": true}, {"text": "Er ist immer farblos.", "ok": false, "fb": "Auch Salzwasser ist farblos – und ein Gemisch."}, {"text": "Er ist immer flüssig.", "ok": false, "fb": "Reinstoffe gibt es in jedem Aggregatzustand."}]}, {"q": "Wie heißt ein Gemisch „fest in flüssig“, das trüb ist und sich beim Stehen absetzt?", "options": [{"text": "Suspension", "ok": true}, {"text": "Emulsion", "ok": false, "fb": "Emulsion: flüssig in flüssig."}, {"text": "Rauch", "ok": false, "fb": "Rauch: fest in gasförmig."}]}, {"q": "Milch enthält winzige Fetttröpfchen in Wasser. Sie ist eine …", "options": [{"text": "Emulsion", "ok": true}, {"text": "Lösung", "ok": false, "fb": "Unter dem Mikroskop sieht man Tröpfchen – also keine Lösung."}, {"text": "Suspension", "ok": false, "fb": "Fett liegt in Milch als Tröpfchen vor, nicht als feste Körnchen."}]}, {"q": "Welches Gas hat den größten Anteil an der Luft?", "options": [{"text": "Stickstoff", "ok": true}, {"text": "Sauerstoff", "ok": false, "fb": "Sauerstoff: etwa 21 %."}, {"text": "Kohlenstoffdioxid", "ok": false, "fb": "Kohlenstoffdioxid: nur etwa 0,04 %."}]}, {"q": "Ein glimmender Holzspan flammt hell auf. Welches Gas ist nachgewiesen?", "options": [{"text": "Sauerstoff", "ok": true}, {"text": "Wasserstoff", "ok": false, "fb": "Wasserstoff weist man mit der Knallgasprobe nach."}, {"text": "Kohlenstoffdioxid", "ok": false, "fb": "Kohlenstoffdioxid weist man mit Kalkwasser nach."}]}, {"q": "Wolken bestehen aus winzigen Wassertröpfchen in Luft. Sie sind …", "options": [{"text": "Nebel", "ok": true}, {"text": "Rauch", "ok": false, "fb": "Rauch enthält feste Körnchen, keine Tröpfchen."}, {"text": "ein Gasgemisch", "ok": false, "fb": "Die Tröpfchen sind flüssig – also „flüssig in gasförmig“."}]}]}]}, {"id": "st5", "nr": 5, "ort": "Gipfelkreuz", "title": "Expedition geschafft", "icon": "trophy", "min": 4, "stempel": "H", "scene": "fig_sc_ziel", "story": "Das Gipfelkreuz ist erreicht! Bevor du dich ins Gipfelbuch einträgst, fasst du zusammen, was du auf der Expedition gelernt hast.", "blocks": [{"t": "ex", "id": "5a", "type": "cmap", "op": "Ordne", "task": "Ordne jedem freien Feld der Concept-Map den passenden Begriff zu."}, {"t": "quiz", "id": "5b", "title": "Gipfelquiz", "qs": [{"id": "5b1", "op": "Nenne", "task": "Nenne den Nachweis für Kohlenstoffdioxid.", "options": [{"text": "Kalkwasserprobe", "ok": true, "fb": "Richtig: Kalkwasser wird milchig-trüb."}, {"text": "Glimmspanprobe", "ok": false, "fb": "Die Glimmspanprobe weist Sauerstoff nach."}, {"text": "Knallgasprobe", "ok": false, "fb": "Die Knallgasprobe weist Wasserstoff nach."}]}, {"id": "5b2", "op": "Beurteile", "task": "Auf dem Etikett eines Mineralwassers stehen gelöste Mineralstoffe (z. B. Calcium, Magnesium) und Kohlensäure. Beurteile die Aussage: „Mineralwasser ist wie destilliertes Wasser ein Reinstoff.“", "options": [{"text": "Falsch: Mineralwasser ist eine Lösung, also ein Stoffgemisch.", "ok": true, "fb": "Richtig: Im Wasser sind mehrere andere Stoffe gelöst – es ist durchsichtig, aber ein Gemisch."}, {"text": "Richtig: Mineralwasser ist klar und durchsichtig.", "ok": false, "fb": "Auch Lösungen sind klar und durchsichtig. Entscheidend ist, wie viele Stoffe enthalten sind."}, {"text": "Falsch: Mineralwasser ist eine Suspension.", "ok": false, "fb": "Es enthält keine Körnchen, die sich absetzen – die Stoffe sind gelöst."}]}, {"id": "5b3", "op": "Ordne", "task": "Ruß aus einem Kamin schwebt in der Luft. Ordne das Gemisch richtig zu.", "options": [{"text": "Rauch: fest in gasförmig", "ok": true, "fb": "Richtig: Rußkörnchen schweben im Gas."}, {"text": "Nebel: flüssig in gasförmig", "ok": false, "fb": "Ruß ist fest – Nebel enthält Tröpfchen."}, {"text": "Gasgemisch: gasförmig in gasförmig", "ok": false, "fb": "Ruß ist kein Gas, sondern ein Feststoff."}]}]}, {"t": "cert"}]}], "GLOSSAR": [["Reinstoff", "Stoff, der nur aus einem einzigen Stoff besteht; enthält nur eine Teilchensorte und hat feste Kenneigenschaften."], ["Stoffgemisch", "Gemisch aus mehreren Reinstoffen; enthält verschiedene Teilchensorten. Seine Eigenschaften hängen von der Zusammensetzung ab."], ["Hauptbestandteil", "Der Stoff, von dem in einem Gemisch am meisten enthalten ist."], ["Nebenbestandteil", "Der Stoff, der in kleinerer Menge im Hauptbestandteil verteilt ist."], ["Lösung", "Völlig einheitliches, durchsichtiges Gemisch: Die Teilchen des gelösten Stoffs sind einzeln zwischen den Teilchen der Flüssigkeit verteilt."], ["Suspension", "Gemisch „fest in flüssig“: Feststoffkörnchen schweben in einer Flüssigkeit; trüb, setzt sich beim Stehen ab."], ["Emulsion", "Gemisch „flüssig in flüssig“: Tröpfchen einer Flüssigkeit in einer anderen; milchig-trüb."], ["Rauch", "Gemisch „fest in gasförmig“: Feststoffkörnchen schweben in einem Gas."], ["Nebel", "Gemisch „flüssig in gasförmig“: winzige Flüssigkeitströpfchen schweben in einem Gas."], ["Gasgemisch", "Gemisch „gasförmig in gasförmig“, z. B. Luft."], ["Glimmspanprobe", "Nachweis für Sauerstoff: Ein glimmender Holzspan flammt hell auf."], ["Kalkwasserprobe", "Nachweis für Kohlenstoffdioxid: Klares Kalkwasser wird milchig-trüb."], ["Knallgasprobe", "Nachweis für Wasserstoff: Mit Luft gemischter Wasserstoff verbrennt an einer Flamme mit Pfeifen oder Knall."]], "STOFFE": {"h2": {"name": "Wasserstoff (Druckgasdose)", "ghs": ["GHS02", "GHS04"], "sw": "Gefahr", "h": ["H220 Extrem entzündbares Gas.", "H280 Enthält Gas unter Druck; kann bei Erwärmung explodieren."], "p": ["P210 Von Hitze, heißen Oberflächen, Funken, offenen Flammen fernhalten. Nicht rauchen.", "P377 Brand von ausströmendem Gas: nicht löschen, bis Undichtigkeit gefahrlos beseitigt werden kann.", "P381 Bei Undichtigkeit alle Zündquellen entfernen.", "P403 An einem gut belüfteten Ort aufbewahren."]}, "o2": {"name": "Sauerstoff (Druckgasdose)", "ghs": ["GHS03", "GHS04"], "sw": "Gefahr", "h": ["H270 Kann Brand verursachen oder verstärken; Oxidationsmittel.", "H280 Enthält Gas unter Druck; kann bei Erwärmung explodieren."], "p": ["P220 Von Kleidung und anderen brennbaren Materialien fernhalten.", "P244 Ventile und Ausrüstungsteile öl- und fettfrei halten.", "P370+P376 Bei Brand: Undichtigkeit beseitigen, wenn gefahrlos möglich.", "P403 An einem gut belüfteten Ort aufbewahren."]}, "co2": {"name": "Kohlenstoffdioxid (Druckgasdose)", "ghs": ["GHS04"], "sw": "Achtung", "h": ["H280 Enthält Gas unter Druck; kann bei Erwärmung explodieren."], "p": ["P403 An einem gut belüfteten Ort aufbewahren."]}}, "CMAP": {"w": 900, "h": 440, "nodes": [{"id": "st", "x": 450, "y": 40, "text": "Stoffe"}, {"id": "rein", "x": 170, "y": 130, "blank": true, "sol": "Reinstoffe"}, {"id": "gem", "x": 600, "y": 130, "blank": true, "sol": "Stoffgemische"}, {"id": "ts1", "x": 170, "y": 250, "text": "eine Teilchensorte"}, {"id": "fl", "x": 400, "y": 250, "text": "Hauptbestandteil|flüssig", "w": 170}, {"id": "gs", "x": 760, "y": 250, "text": "Hauptbestandteil|gasförmig", "w": 170}, {"id": "lsg", "x": 95, "y": 390, "text": "Lösung"}, {"id": "sus", "x": 260, "y": 390, "blank": true, "sol": "Suspension"}, {"id": "emu", "x": 425, "y": 390, "blank": true, "sol": "Emulsion"}, {"id": "rau", "x": 640, "y": 390, "blank": true, "sol": "Rauch"}, {"id": "gg", "x": 810, "y": 390, "blank": true, "sol": "Gasgemisch"}], "edges": [{"a": "st", "b": "rein", "t": "einteilen in"}, {"a": "st", "b": "gem", "t": "einteilen in"}, {"a": "rein", "b": "ts1", "t": "enthalten"}, {"a": "gem", "b": "fl", "t": "mit"}, {"a": "gem", "b": "gs", "t": "mit"}, {"a": "fl", "b": "lsg", "t": "fein verteilt, durchsichtig"}, {"a": "fl", "b": "sus", "t": "Körnchen, trüb"}, {"a": "fl", "b": "emu", "t": "Tröpfchen, milchig"}, {"a": "gs", "b": "rau", "t": "Körnchen in Gas"}, {"a": "gs", "b": "gg", "t": "gasförmig in …"}], "options": ["Reinstoffe", "Stoffgemische", "Suspension", "Emulsion", "Rauch", "Gasgemisch", "Nebel", "Kenneigenschaft"]}, "CERT": {"title": "Gipfelausweis Gemischland", "text": "hat alle fünf Stationen der Expedition Gemischland gemeistert: Reinstoffe und Stoffgemische unterschieden, Gemische nach Aggregatzuständen benannt und die Gase Sauerstoff, Kohlenstoffdioxid und Wasserstoff nachgewiesen."}, "MAP": {"fig": "fig_karte", "spots": [{"station": "st1", "x": 112, "y": 388}, {"station": "st2", "x": 268, "y": 328}, {"station": "st3", "x": 380, "y": 214}, {"station": "st4", "x": 536, "y": 146}, {"station": "st5", "x": 640, "y": 70}   function normS(o) { o = o || {}; o.ex = o.ex || {}; o.px = o.px || {}; o.mg = o.mg || {}; o.bd = o.bd || ""; o.name = o.name || ""; o.loc = o.loc || ""; o.sc = o.sc || {}; return o; }

  function normCode(s) {

  function stCode(si) { var c = checkpoints().filter(function (p) { return p.si === si && p.kind === "st"; })[0]; return c ? c.code : ""; }
  function lockCode(id) { var c = checkpoints().filter(function (p) { return p.upto === id; })[0]; return c ? c.code : ""; }
  // Was ein Code bewirkt: mark = Übungen, die als erledigt gelten; del = gespeicherte Einträge hinter dem Zwischenstand (nur chronologisch)
  function cpPlan(cp) {
    var zi = ZI.indexOf(cp.si) > -1, before = zi ? Math.min.apply(null, ZI) : cp.si;
    var up = cp.upto ? EXLIST.map(function (e) { return e.id; }).indexOf(cp.upto) : -1;
    function inCp(e, k) { return e.si < before || (e.si === cp.si && (up < 0 || k <= up)); }
    var mark = EXLIST.filter(function (e, k) { return inCp(e, k) && !exDone(e.id); });
    var del = { ex: [], px: [], mg: [] };
    if (!zi) {
      EXLIST.forEach(function (e, k) { if (!inCp(e, k) && S.ex[e.id] && (e.si > cp.si || e.si === cp.si)) del.ex.push(e.id); });
      PXLIST.forEach(function (e) { if (S.px[e.id] && (e.si > cp.si || (e.si === cp.si && up > -1))) del.px.push(e.id); });
      GMLIST.forEach(function (e) { if (S.mg[e.id] != null && (e.si > cp.si || (e.si === cp.si && up > -1))) del.mg.push(e.id); });
    }
    del.n = del.ex.filter(function (id) { return exDone(id); }).length + del.px.length + del.mg.length;
    return { mark: mark, del: del, zi: zi };
  }
  function applyCode(cp, plan) {
    plan.mark.forEach(function (e) { S.ex[e.id] = [MAXP, 0, 3]; });
    plan.del.ex.forEach(function (id) { delete S.ex[id]; });
    plan.del.px.forEach(function (id) { delete S.px[id]; });
    plan.del.mg.forEach(function (id) { delete S.mg[id]; });
    save();
    var s = ST[cp.si], done = stationDone(cp.si), nx = done ? nextOpen(cp.si) : cp.si;
    var msg = cp.kind === "lock" ? "Station " + s.nr + " bis zum Codeschloss" : "Station " + s.nr + " abgeschlossen";
    FX.toast('<div><div class="kicker">' + LB.codeOk + "</div><b>" + msg + "</b>" + (nx > -1 && nx !== cp.si ? "<br><span>Weiter mit Station " + ST[nx].nr + "</span>" : "") + "</div>");
    if (nx > -1) openStation(nx); else openStation(cp.si);
  }
  function codeBox() {
    var d = el("div", "card codebox");
    d.innerHTML = '<div class="cbt"><span class="badge">' + I.key + '</span><div><b>' + LB.codeTitle + '</b><div class="note">' + LB.codeHint + '</div></div></div>' +
      '<form class="cbf" autocomplete="off"><input type="text" class="cbin" spellcheck="false" autocapitalize="characters" aria-label="' + LB.codeTitle + ': Code" placeholder="z. B. ' + esc(stCode(0) ? stCode(0).replace(/[A-Z]/g, "X").replace(/\d/g, "0") : "XXXX-00") + '">' +
      '<button class="btn" type="submit">' + LB.codeGo + '</button></form><div class="cbmsg" aria-live="polite"></div>';
    var inp = d.querySelector(".cbin"), out = d.querySelector(".cbmsg");
    d.querySelector(".cbf").onsubmit = function (ev) {
      ev.preventDefault();
      var n = normCode(inp.value); out.innerHTML = ""; out.className = "cbmsg";
      if (!n) return;
      var cp = checkpoints().filter(function (p) { return p.n === n; })[0];
      if (!cp) { out.className = "cbmsg no"; out.textContent = LB.codeBad; FX.no(); return; }
      var plan = cpPlan(cp);
      if (!plan.del.n) { applyCode(cp, plan); return; }
      out.className = "cbmsg warn";
      var sis = [], add = function (L, id) { L.filter(function (e) { return e.id === id; }).forEach(function (e) { if (sis.indexOf(e.si) < 0) sis.push(e.si); }); };
      plan.del.ex.forEach(function (id) { add(EXLIST, id); }); plan.del.px.forEach(function (id) { add(PXLIST, id); }); plan.del.mg.forEach(function (id) { add(GMLIST, id); });
      sis.sort(function (a, b) { return a - b; });
      out.innerHTML = "<p><b>Achtung:</b> " + LB.codeWarn.replace("{st}", (sis.length > 1 ? "Stationen " : "Station ") + sis.map(function (i) { return ST[i].nr; }).join(", ")) + '</p><div class="btns"><button type="button" class="btn signal cbyes">' + LB.codeYes + '</button><button type="button" class="btn ghost cbno">Abbrechen</button></div>';
      out.querySelector(".cbyes").onclick = function () { applyCode(cp, plan); };
      out.querySelector(".cbno").onclick = function () { out.innerHTML = ""; out.className = "cbmsg"; inp.focus(); };
    };
    return d;
  }
  function stCodeHtml(si) {

    return c ? '<div class="stcode"><span class="kicker">' + LB.codeDone + '</span><b class="code">' + esc(c) + '</b><span class="note">' + LB.codeNote + "</span></div>" : "";
  }
  function codeTable() {

    return '<details class="tcodes"><summary>Codes für den Wiedereinstieg (' + L.length + ")</summary><table><thead><tr><th>Station</th><th>Code</th><th>gilt bis</th></tr></thead><tbody>" +
      L.slice().sort(function (a, b) { return a.si - b.si || (a.kind === "st") - (b.kind === "st"); }).map(function (p) {
        return "<tr><td>" + ST[p.si].nr + " · " + ST[p.si].ort + "</td><td><b>" + esc(p.code) + "</b></td><td>" + (p.kind === "st" ? "Ende der Station" : "Codeschloss " + p.upto) + "</td></tr>";
      }).join("") + '</tbody></table><p class="note">Stationscodes am Ende jeder Station; die Lösung eines Codeschlosses gilt bis einschließlich des Schlosses. ' +
      (ZI.length ? "Lernzirkel-Stationen: Codes summieren sich. Sonst: Ein Code löscht allen Fortschritt danach." : "Ein Code löscht allen Fortschritt danach.") + " Wiederhergestellte Übungen zählen mit voller Punktzahl.</p></details>";
  }

  // ---------------------------------------------------------------- Bildkarte (Startseite mit C.MAP)
  // C.MAP = {fig: Schlüssel aus FIGS, spots: [{station, x, y}] in Bildkoordinaten, path: true = Weg zwischen den Spots,
  // der sich mit dem Fortschritt einfärbt, bend: Bogenhöhe der Wegstücke in Bildpixeln, caption: Bildunterschrift}. Freischaltung, Lernzirkel und Lehrkraft-Vorschau gelten unverändert.
  function stIndex(id) { return ST.map(function (s) { return s.id; }).indexOf(id); }
  function lockTitle(i) { return ZI.length ? (ZI.indexOf(i) > -1 ? "Erst die Stationen davor abschließen" : "Erst alle Stationen davor abschließen") : "Erst die vorherige Station abschließen"; }
  function lineMap() {
    var MP = C.MAP, w = el("div", "lmap");
    w.innerHTML = '<div class="lmap-in">' + F[MP.fig].svg + "</div>";
    var inner = w.firstChild, sv = inner.querySelector("svg"), vb = sv.viewBox.baseVal, W = vb.width, H = vb.height;
    sv.removeAttribute("width"); sv.removeAttribute("height");
    var spots = MP.spots.filter(function (sp) { return stIndex(sp.station) > -1; });
    if (MP.path && spots.length > 1) {
      var g = document.createElementNS(SVGNS, "g"); g.setAttribute("class", "lpath");
      for (var k = 0; k + 1 < spots.length; k++) {
        var a = spots[k], b = spots[k + 1], ln;
        if (MP.bend) {   // geschwungenes Wegstück, abwechselnd nach oben und unten gebogen
          ln = document.createElementNS(SVGNS, "path");
          ln.setAttribute("d", "M" + a.x + "," + a.y + " Q" + ((a.x + b.x) / 2) + "," + ((a.y + b.y) / 2 + MP.bend * (k % 2 ? -1 : 1)) + " " + b.x + "," + b.y);
        } else {
          ln = document.createElementNS(SVGNS, "line");
          ln.setAttribute("x1", a.x); ln.setAttribute("y1", a.y); ln.setAttribute("x2", b.x); ln.setAttribute("y2", b.y);
        }
        ln.setAttribute("class", "lseg" + (stationDone(stIndex(a.station)) ? " on" : ""));
        g.appendChild(ln);
      }
      sv.appendChild(g);
    }
    spots.forEach(function (sp) {
      var i = stIndex(sp.station), s = ST[i], u = unlocked(i), d = stationDone(i);
      var b = el("button", "mspot" + (u ? "" : " lock") + (d ? " done" : "") + (u && !d ? " open" : ""));
      b.type = "button"; b.setAttribute("data-st", s.id); b.tabIndex = -1;   // Tastatur und Screenreader: Stationsliste darunter
      b.style.left = (100 * sp.x / W) + "%"; b.style.top = (100 * sp.y / H) + "%";
      b.innerHTML = '<span class="mdot">' + (d ? '<span class="mst">' + s.stempel + "</span>" : u ? s.nr : I.lock) + '</span><span class="mlab"><b>' + s.nr + " · " + s.ort + "</b><small>" + s.title + "</small></span>";
      b.title = "Station " + s.nr + ": " + plain(s.title) + (u ? "" : " – " + lockTitle(i));

  function stationList() {

  var cur = -1, wasDone = {};
  function openStation(si, keepScroll) {

    var s = ST[si];

    var hd = el("div", "sthead");

  function renderBlocks(si, host) {
    var s = ST[si];
    host.innerHTML = "";
    var stop = false;
    for (var bi = 0; bi < s.blocks.length && !stop; bi++) {
      var b = s.blocks[bi];
      if (isBonus(b)) continue;
      if (b.t === "ex") {
        host.appendChild(exCard(b, si));
        if (!exDone(b.id) && !preview) stop = true;
      } else if (b.t === "quiz") {
        var qh = el("h3", null, b.title); qh.style.marginTop = "18px"; host.appendChild(qh);
        for (var qi = 0; qi < b.qs.length; qi++) {
          var q = b.qs[qi];
          var qx = { id: q.id, type: "mc", op: q.op, task: q.task, options: q.options, multi: !!q.multi };
          host.appendChild(exCard(qx, si));
          if (!exDone(q.id) && !preview) { stop = true; break; }
        }
      } else if (b.t === "cert") {
        host.appendChild(certCard());
      } else if (b.t === "anim") {
        host.appendChild(animCard(b));
      } else if (b.t === "video") {
        host.appendChild(videoCard(b));
      } else if (b.t === "self") {
        host.appendChild(selfCard(b));
      } else if (b.t === "selfeval") {
        host.appendChild(selfEvalCard(b));
      } else {
        host.appendChild(infoCard(b));
      }
    }
    if (!stop && stationDone(si)) {
      var celebrate = !wasDone[si]; wasDone[si] = true;
      host.appendChild(doneCard(si, celebrate));
      var bon = bonusSection(si); if (bon) host.appendChild(bon);
      if (celebrate) setTimeout(function () { FX.stationDone($("#done-" + s.id)); checkBadges(); }, 60);
    } else if (preview) {
      host.appendChild(previewEndCard(si));
      var bp = bonusSection(si); if (bp) host.appendChild(bp);
    }
  }

:root{
  /* Farbpalette Chemie (Skill chemie-lerneinheit, Abschnitt 5) */
  --navy:#1F3A5F; --ink:#22313F; --muted:#5B6B7C; --bg:#F6F9FD; --card:#EEF4FB; --line:#C9D9EE; --badge:#2F5D8C;
  --blue:#2F5D8C; --blue2:#3D73AD; --pastel:#DDE8F5; --light:#EEF4FB;
  --signal:#E0662B; --signal-d:#B5470F; --signal-l:#FFF1E8; --ok:#1E7B4F; --ok-l:#E6F4EC; --err:#B42318; --err-l:#FDECEA;
  /* Feldtypen */
  --info:#2F5D8C; --info-bg:#FFFFFF; --info-line:#C9D9EE;
  --ex:#3D73AD; --ex-bg:#E4EFFB; --ex-line:#8DB0D8;
  --merke:#E0662B; --merke-bg:#FFF1E8;
  --bgr:#7B72BF; --bgr-bg:#EFEDF8; --bgr-line:#8F86C9;
  --head:"Cambria","Caladea",Georgia,serif; --body:"Calibri","Carlito","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--head);color:var(--navy);margin:0 0 .4em;line-height:1.2}
button,select,input,textarea{font-family:var(--body);font-size:16px}
sub,sup{font-size:.72em;line-height:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#1F3A5F,#2F5D8C);color:#fff;box-shadow:0 2px 8px rgba(20,40,70,.25)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}
.brand .logo{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand .logo .ico{width:24px;height:24px}
.brand b{font-family:var(--head);font-size:19px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{opacity:.85;font-size:13.5px;display:block}
.nav{display:flex;gap:6px;align-items:center}
.nav button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.nav button:hover{background:rgba(255,255,255,.26)}
.nav button[hidden]{display:none}
.score{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:150px}
.score .pts{font-weight:700}
.bar{width:150px;height:8px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:#F6B08C;width:0;transition:width .6s}
.stamps{display:flex;gap:3px}
.stamps span{width:19px;height:19px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.6);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:transparent}
.stamps span.on{background:#F6B08C;border:1.5px solid #fff;color:#1F3A5F}
main{padding:18px 0 40px}
/* Karten */
.card{background:#fff;border-radius:16px;padding:16px 18px;margin:14px 0;box-shadow:0 1px 3px rgba(31,58,95,.08);position:relative}
.blk{display:flex;gap:12px;align-items:flex-start}
.badge{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.badge .ico{width:22px;height:22px}
.blk .bd{flex:1;min-width:0}
.kicker{font-size:13px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.info{background:var(--info-bg);border:1px solid var(--info-line)}
.info .badge{background:var(--info)} .info .kicker{color:var(--info)}
.ex{background:var(--ex-bg);border:1px solid var(--ex-line)}
.ex .badge{background:var(--ex)} .ex .kicker{color:var(--ex)}
.merke{background:var(--merke-bg);border:2px solid var(--merke);box-shadow:4px 4px 0 rgba(224,102,43,.2)}
.merke .badge{background:var(--merke)} .merke .kicker{color:var(--merke)}
.bgr{background:var(--bgr-bg);border:2px dashed var(--bgr-line)}
.bgr .badge{background:var(--bgr)} .bgr .kicker{color:var(--bgr)}
.story{background:var(--card);border:1px solid var(--line)}
.story .badge{background:var(--navy)}
.scene{margin:2px 0 10px}
.scene svg{width:100%;height:auto;display:block;max-width:720px}
.lead{font-size:18px;margin:.2em 0 .5em}
.bd p{margin:.45em 0}
.bd ul{margin:.4em 0;padding-left:1.25em}
.bd li{margin:.3em 0}
.op{display:inline-block;background:var(--ex);color:#fff;border-radius:10px;padding:0 8px;font-size:13.5px;font-weight:700;margin-right:6px}
.task{font-weight:700;margin:.2em 0 .7em}
.figwrap{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.figwrap svg.fig{width:100%;height:auto;display:block;max-width:var(--fw)}
.swipe{display:none;font-size:13px;color:var(--muted);margin-top:-4px}
.figwrap.scroll + .swipe{display:block}
.photo{margin:10px 0}
.photo img{max-width:min(100%,430px);height:auto;border-radius:10px;display:block}
.photo.small img{max-width:min(100%,220px)}
.photo figcaption a{color:inherit}
.photo figcaption,.cap{font-size:13.5px;color:var(--muted);margin-top:4px}
table.t{border-collapse:collapse;width:100%;margin:8px 0;background:#fff;font-size:16px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
table.t th{background:var(--pastel);font-weight:700}
.tscroll{overflow-x:auto}
.ghsrow{display:flex;gap:4px;flex-wrap:wrap}
.ghsrow svg{width:40px;height:40px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0;font-size:15px}
.legend span{display:flex;align-items:center;gap:6px}
.legend svg{width:38px;height:38px}
/* Buttons */
.btn{background:var(--blue);color:#fff;border:none;border-radius:22px;padding:8px 18px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.signal{background:var(--signal)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
/* Animation neu abspielen */
.replaybar{display:flex;margin:6px 0 10px}
.replaybar[hidden]{display:none}
.btn.replay{padding:5px 14px;font-size:14.5px;font-weight:600}
.fb{margin-top:10px;padding:8px 12px;border-radius:10px;display:none}
.fb.ok{display:block;background:var(--ok-l);border:1px solid #9BD3B3;color:#1B5E3E}
.fb.no{display:block;background:var(--err-l);border:1px solid #EBB0A8;color:#8E2A1F}
.fb.sol{display:block;background:#FFF8E6;border:1px solid #F0D48A;color:#6B4E00}
.status{font-size:14px;color:var(--ok);font-weight:700}
/* Sortieren */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:8px;border-radius:12px;background:rgba(255,255,255,.6);border:1.5px dashed var(--ex-line)}
.chip{background:#fff;border:1.5px solid var(--ex-line);border-radius:12px;padding:6px 10px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;font-size:16px;max-width:100%}
.chip.sel{border-color:var(--signal);box-shadow:0 0 0 3px rgba(224,102,43,.25)}
.chip.bad{border-color:var(--err);background:var(--err-l)}
.chip.good{border-color:var(--ok);background:var(--ok-l)}
.chip .ionico{width:40px;height:auto;flex:none}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.bin{background:#fff;border:2px solid var(--ex-line);border-radius:14px;min-height:90px;padding:6px;cursor:pointer}
.bin.hot{border-color:var(--signal);background:#FFF9F4}
.bin h4{font-family:var(--body);font-size:15.5px;margin:2px 4px 6px;color:var(--navy);display:flex;align-items:center;gap:8px}
.bin h4 svg{width:42px;height:42px}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
/* MC */
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.opt input{margin-top:4px;transform:scale(1.2)}
.opt.good{border-color:var(--ok);background:var(--ok-l)}
.opt.bad{border-color:var(--err);background:var(--err-l)}
.opt .ofb{display:block;font-size:14.5px;margin-top:3px;color:var(--muted)}
/* Formel-Baukasten */
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:#fff;border-radius:12px;padding:8px 12px;margin:8px 0;border:1.5px solid var(--line)}
.frow .nm{font-weight:700;min-width:150px}
.cnt{display:flex;align-items:center;gap:5px}
.cnt button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;cursor:pointer}
.cnt .ionbox{min-width:62px;text-align:center;padding:3px 8px;border-radius:8px;background:var(--pastel);font-weight:700}
.cnt .n{font-weight:700;min-width:20px;text-align:center}
.fprev{font-size:20px;font-weight:700;color:var(--navy);min-width:90px}
.frow.good{border-color:var(--ok);background:var(--ok-l)} .frow.bad{border-color:var(--err);background:var(--err-l)}
/* Gleichung */
.eqsides{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.eqside{background:#fff;border:2px solid var(--ex-line);border-radius:12px;min-height:70px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;cursor:pointer}
.eqside.act{border-color:var(--signal);background:#FFF9F4}
.eqside .lbl{width:100%;font-size:13px;color:var(--muted);font-weight:700}
.eqarrow{align-self:center;font-size:28px;color:var(--navy)}
.term{display:flex;align-items:center;gap:2px;background:var(--pastel);border-radius:9px;padding:2px 4px;font-size:16px}
.term button{border:none;background:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:700;color:var(--blue);padding:0}
.term .k{font-weight:700;min-width:12px;text-align:center}
.plus{color:var(--muted)}
.eqtiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.eqout{margin-top:8px;font-size:17px;background:#fff;border-radius:10px;padding:6px 10px;border:1px solid var(--line);min-height:36px}
/* Simulation */
.rack{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;background:linear-gradient(#2F5D90,#23466F);border-radius:14px;padding:14px 8px 6px;overflow-x:auto;position:relative}
.rack .tb{display:flex;flex-direction:column;align-items:center;min-width:76px;position:relative}
.rack .tb svg{width:74px;height:auto}
.rack .tb .tl{font-weight:700;font-size:14px;color:#fff}
.rack .tb .ts{font-size:13px;color:#D6E6F7;text-align:center;line-height:1.15;min-height:30px}
.drip{position:absolute;top:-4px;left:50%;margin-left:-8px;width:16px;opacity:0}
.drip.go{animation:drip 1s ease}
@keyframes drip{0%{opacity:0;transform:translateY(-14px)}20%{opacity:1}80%{opacity:1;transform:translateY(8px)}100%{opacity:0;transform:translateY(8px)}}
.liq{transform-box:fill-box;transform-origin:50% 100%}
.liq.rise{animation:rise .9s ease}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.fade{animation:fadein 1.1s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.bub circle{animation:bub 1.6s linear infinite}
@keyframes bub{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-28px);opacity:0}}
.steps{margin-top:12px}
.steplog{margin:8px 0 0;padding-left:1.2em;font-size:15.5px;color:var(--muted)}
.steplog li.done{color:var(--ink)}
.stepopts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.stepopts button{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.stepopts button:hover{border-color:var(--blue)}
.obs select{width:100%;min-width:150px;padding:4px;border-radius:8px;border:1.5px solid var(--ex-line);background:#fff}
.obs td.good select{border-color:var(--ok);background:var(--ok-l)}
.obs td.bad select{border-color:var(--err);background:var(--err-l)}
.note{font-size:14px;color:var(--muted)}
/* Regler */
.sl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.sl input[type=range]{flex:1;min-width:200px;accent-color:var(--signal)}
.sl .val{font-size:22px;font-weight:700;color:var(--navy);min-width:110px}
.slref{display:inline-flex;gap:16px;align-items:flex-end;flex-wrap:wrap;background:linear-gradient(#2F5D90,#23466F);border-radius:14px;padding:12px 16px 8px;color:#fff}
.slref .tb{text-align:center;font-size:14px}
.slref svg{width:70px}
/* Fließdiagramm */
.flow{display:grid;grid-template-columns:minmax(150px,1fr) minmax(150px,1fr);gap:8px 14px;align-items:center;margin-top:10px}
.fbox{background:#fff;border:2px solid var(--navy);border-radius:10px;padding:6px 10px;text-align:center;font-weight:700}
.fq{background:var(--pastel);border:2px solid var(--blue);border-radius:30px;padding:6px 10px;text-align:center;font-size:15px}
.slot{background:#fff;border:2px dashed var(--signal);border-radius:10px;min-height:40px;padding:6px 8px;text-align:center;cursor:pointer;font-size:15.5px;display:flex;align-items:center;justify-content:center}
.slot.filled{border-style:solid;border-color:var(--blue)}
.slot.good{border-color:var(--ok);background:var(--ok-l)}.slot.bad{border-color:var(--err);background:var(--err-l)}
.slot.res{border-radius:30px}
.farr{text-align:center;color:var(--navy);font-size:15px;font-weight:700}
.farr .a{font-size:22px;line-height:1}
.flow .full{grid-column:1/-1}
.flow .lab{font-size:13px;color:var(--muted);text-align:center}
/* Matrix */
.matrix td{text-align:center}.matrix td:first-child{text-align:left;font-weight:700}
.matrix th svg{width:44px;height:44px;display:block;margin:auto}
.matrix input{transform:scale(1.5)}
.matrix td.good{background:var(--ok-l)}.matrix td.bad{background:var(--err-l)}
/* Labor */
.bench{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bench>div{min-width:0}
.bottles{display:flex;gap:8px;flex-wrap:wrap}
.bottle{background:#fff;border:2px solid var(--ex-line);border-radius:12px;padding:4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-weight:700}
.bottle.sel{border-color:var(--signal);box-shadow:0 0 0 3px rgba(224,102,43,.2)}
.bottle svg{width:34px;height:46px}
.tests{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.tests button{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:7px 11px;cursor:pointer}
.tests button.sel{border-color:var(--signal);background:#FFF9F4}
.labres{display:flex;gap:12px;align-items:center;background:linear-gradient(#2F5D90,#23466F);color:#fff;border-radius:12px;padding:10px;min-height:140px}
.labres .note{color:#D6E6F7}
.labres svg{width:60px;flex:none}
.journal td,.journal th{font-size:14.5px}
/* Concept-Map */
.cmapw{position:relative;width:100%;min-width:640px}
.cmapw svg{width:100%;height:auto;display:block}
.cmapw select{position:absolute;transform:translate(-50%,-50%);width:23%;padding:5px;border-radius:10px;border:2px dashed var(--signal);background:#fff;font-weight:700;font-size:15px}
.cmapw select.good{border:2px solid var(--ok);background:var(--ok-l)}.cmapw select.bad{border:2px solid var(--err);background:var(--err-l)}
/* Freitext */
textarea{width:100%;min-height:110px;border-radius:12px;border:1.5px solid var(--ex-line);padding:8px 10px;resize:vertical}
.model{background:#fff;border-left:4px solid var(--blue);padding:8px 12px;border-radius:8px;margin:10px 0}
.checklist label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
.checklist input{margin-top:4px;transform:scale(1.2)}
/* Laborplan */
.intro .bd p{margin:.3em 0}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:6px}
.stc{background:#fff;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;border:2px solid var(--line);text-align:left;width:100%;color:var(--ink)}
.stc:hover{border-color:var(--blue)}
.stc .badge{width:52px;height:52px;background:var(--blue)}
.stc .badge .ico{width:30px;height:30px}
.stc .t1{font-size:13.5px;color:var(--muted);font-weight:700}
.stc .t2{font-family:var(--head);font-size:18px;color:var(--navy)}
.stc .t3{font-size:13.5px;color:var(--muted)}
.stc.lock{opacity:.55;cursor:not-allowed}
.stc.lock .badge{background:#8FA3BA}
.stc.done .badge{background:var(--ok)}
.stc .stamp{margin-left:auto;width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:transparent;flex:none}
.stc.done .stamp{background:#F6B08C;border:2px solid var(--signal);color:var(--navy);transform:rotate(-12deg)}
.sthead{display:flex;gap:12px;align-items:center;margin-top:6px}
.sthead .badge{width:56px;height:56px;background:var(--navy)}
.sthead .badge .ico{width:32px;height:32px}
.sthead .t1{font-size:14px;color:var(--muted);font-weight:700}
.sthead h2{margin:0}
.back{background:none;border:none;color:var(--blue);cursor:pointer;font-weight:700;padding:0;font-size:16px}
.done-card{text-align:center;background:#fff;border:2px solid var(--ok)}
.done-card .big{font-size:44px;width:76px;height:76px;margin:6px auto;border-radius:50%;background:#F6B08C;border:3px solid var(--signal);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;color:var(--navy);transform:rotate(-12deg)}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(20,35,55,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;max-width:720px;width:100%;padding:18px;position:relative}
.modal .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:26px;cursor:pointer;color:var(--muted)}
.kartei{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kartei .col{border-radius:12px;padding:8px 10px}
.kartei .gut{background:#EAF6EF;border:1.5px solid #9BD3B3}
.kartei .schwer{background:#FFF3EA;border:1.5px solid #F0B48C}
.kartei h4{font-family:var(--body);margin:0 0 6px}
.kartei ul{list-style:none;padding:0;margin:0}
.kartei li{padding:3px 0;border-bottom:1px dotted #ccd}
/* Fußzeile */
footer{background:#fff;border-top:1px solid var(--line);padding:14px 0;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
footer button{background:none;border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer;color:var(--muted)}
.tpanel{display:none;margin-top:10px}
.tpanel.on{display:block}
.tpanel input{padding:6px 10px;border-radius:10px;border:1.5px solid var(--ex-line)}
/* Ausweis */
.cert{border:3px solid var(--navy);border-radius:18px;padding:22px;background:linear-gradient(135deg,#fff,#EAF2FB);text-align:center}
.cert h2{font-size:30px}
.cert .nm{font-size:28px;font-family:var(--head);color:var(--signal);border-bottom:2px solid var(--pastel);display:inline-block;min-width:60%;margin:8px 0}
.cert .code{letter-spacing:.3em;font-weight:700;font-size:22px;color:var(--navy)}
@media print{
  body *{visibility:hidden}
  #certPrint,#certPrint *{visibility:visible}
  #certPrint{position:absolute;left:0;top:0;width:100%}
  .top,footer{display:none}
}

td.psz{font-size:14px;color:var(--muted)}

/* Legende der Feldtypen auf der Startseite */
.flegend{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin:16px 0 6px;font-size:15px;color:var(--muted,#5B6B7C)}
.flegend .fl{display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:999px}
.flegend .fl .badge{width:30px;height:30px}.flegend .fl .badge .ico{width:17px;height:17px}
.flegend .fl .kicker{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;margin:0}
.flegend .merke{box-shadow:2px 2px 0 rgba(0,0,0,.12)}

/* Lösungswort */
.lw{letter-spacing:.18em;font-size:1.1em;white-space:nowrap}
.lwhint{margin:-4px 0 10px}

/* ================= Spielelemente (Codeschloss, Wimmelbild, Abzeichen, Minispiele, Effekte, Profi-Pfad) ================= */
:root{--gold:#E8B931;--gold-d:#9A7410;--gold-l:#FFF7DC;--gold-line:#E2C46A}
/* Kopfzeile: Sterne, Abzeichen, Ton */
.ptsrow{display:flex;gap:10px;align-items:center}
.hstars{display:inline-flex;align-items:center;gap:3px;font-weight:700;color:#FFE7A3}
.hstars[hidden]{display:none}
.hstars .ico{width:17px;height:17px}
.hstars .ico polygon{fill:#FFD45C}
.nav .cnt{font-weight:700;font-size:14px;min-width:12px}
#btnSound{padding:5px 8px}
/* Profi-Pfad und Bonus-Runde */
.bonus{margin:18px 0 6px;padding:12px 14px 4px;border-radius:18px;background:repeating-linear-gradient(135deg,#FFFBEC,#FFFBEC 14px,#FFF6D9 14px,#FFF6D9 28px);border:2px solid var(--gold-line)}
.bonushead{display:flex;gap:10px;align-items:center}
.bonushead .badge{background:var(--gold)}
.bonushead h3{margin:0;color:var(--gold-d)}
.bonushead .note{margin:2px 0 0}
.ex.profi{background:var(--gold-l);border:2px solid var(--gold)}
.ex.profi .badge{background:var(--gold)} .ex.profi .kicker{color:var(--gold-d)}
.ex.profi .op{background:var(--gold-d)}
.st{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.st .st0{color:#D8D2BF}
.st.big{font-size:20px}
.tstar{color:var(--gold-d);font-weight:700;white-space:nowrap}
/* Minispiele */
.game{background:#fff;border:2px solid var(--gold-line)}
.game .badge{background:var(--gold-d)} .game .kicker{color:var(--gold-d)}
.gres{text-align:center;padding:8px 6px;background:var(--gold-l);border-radius:14px;margin-top:10px}
.gres .gst .st{font-size:34px;letter-spacing:4px}
.gres p{margin:.3em 0 .6em}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.mcard{position:relative;overflow-wrap:anywhere;hyphens:auto;min-height:86px;border-radius:12px;border:2px solid var(--navy);background:var(--blue);color:#fff;cursor:pointer;padding:6px;font-size:15px;line-height:1.25;transition:transform .25s,background .25s}
.mcard .mface{display:none}
.mcard .mback{font-family:var(--head);font-size:30px;font-weight:700;opacity:.85}
.mcard.open,.mcard.done{background:#fff;color:var(--ink);transform:rotateY(180deg)}
.mcard.open>span,.mcard.done>span{transform:rotateY(180deg)}
.mcard.open .mface,.mcard.done .mface{display:block}
.mcard.open .mback,.mcard.done .mback{display:none}
.mcard.b.open,.mcard.b.done{background:var(--card)}
.mcard.a .mface{font-weight:700;color:var(--navy)}
.mcard.ghs .mface svg{width:64px;height:64px;display:block;margin:0 auto}
.mcard.ghs.open,.mcard.ghs.done{padding:4px}
.mcard.done{border-color:var(--ok);box-shadow:0 0 0 3px rgba(30,123,79,.2);cursor:default}
.blitz .bq{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.blitz .bpos{font-size:13.5px;color:var(--muted);font-weight:700}
.blitz .btxt{font-size:19px;font-weight:700;margin:8px 0 12px;min-height:2.6em}
.blitz .bbtn{display:flex;gap:10px;flex-wrap:wrap}
.blitz .bbtn .btn{flex:1 1 140px;padding:12px;font-size:17px}
.blitz .btn.no{background:var(--signal-d)}
.blitz .btn.good{background:var(--ok)!important;opacity:1}.blitz .btn.bad{background:var(--err)!important;opacity:1}
.btime{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:10px}
.btime i{display:block;height:100%;background:var(--signal);animation:shrink linear forwards;transform-origin:left}
.btime.stop i{animation-play-state:paused}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.tchk{font-size:15px;display:flex;gap:6px;align-items:center;cursor:pointer}
.bhud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bname{font-family:var(--head);font-weight:700;color:var(--navy)}
.hp{flex:1;min-width:120px;height:12px;border-radius:7px;background:#F1DCD8;overflow:hidden;border:1px solid #E3B6AE}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#B42318,#E0662B);transition:width .5s}
.lives{display:flex;gap:2px}
.lives span .ico{width:22px;height:22px}
.lives span .ico path{fill:#D6CFC0}
.lives span.on .ico path{fill:#C8352B}
.bossw{display:flex;justify-content:center;margin:6px 0}
.bossw svg{width:150px;height:auto}
.bossw.hit svg{animation:bhit .45s}
.bossw.beaten svg{animation:beaten 1s forwards}
@keyframes bhit{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-6deg);filter:brightness(1.6)}50%{transform:translateX(9px) rotate(5deg)}75%{transform:translateX(-5px)}}
@keyframes beaten{to{transform:scale(.4) rotate(200deg);opacity:.15}}
.bopts{display:flex;flex-direction:column;gap:7px}
.bopt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;font-size:16px;color:var(--ink)}
.bopt:hover:not(:disabled){border-color:var(--navy)}
.bopt.good{border-color:var(--ok);background:var(--ok-l)}.bopt.bad{border-color:var(--err);background:var(--err-l)}
/* Codeschloss */
.clues{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 12px}
.clue{flex:1 1 230px;display:flex;gap:8px;align-items:flex-start;background:#FFFDF2;border:1px solid #E8DDB0;border-radius:4px;padding:9px 11px;box-shadow:2px 3px 0 rgba(120,100,40,.12);transform:rotate(-.6deg);font-size:15.5px}
.clue:nth-child(2n){transform:rotate(.7deg)}
.clue .ico{width:20px;height:20px;flex:none}
.clue .ico circle,.clue .ico path{stroke:var(--signal-d)}
.lockw{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,#F2F5F9,#E1E8F0);border:2px solid #B9C7D8;border-radius:16px;padding:12px}
.padw{text-align:center;flex:none}
.pl{width:84px;height:auto;display:block;margin:0 auto}
.pl .shackle{transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.lockw.open .pl .shackle{transform:translateY(-14px) translateX(24px) rotate(18deg);transform-origin:84px 62px}
.lobj{font-size:13px;font-weight:700;color:var(--muted);max-width:110px}
.wheels{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 1 auto}
.lockw.sym .wheel{flex:1 1 150px}
.wheel .wl{font-size:13.5px;font-weight:700;color:var(--navy);text-align:center;min-height:2.4em;display:flex;align-items:flex-end}
.wheel button{width:44px;height:30px;border-radius:9px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-size:15px;cursor:pointer}
.wheel button:disabled{opacity:.35;cursor:default}

on": "flask", "min": 7, "stempel": "I", "scene": "fig_sc_labor", "story": "Die Clubchefin begrüßt dich mit einem alten Test: der Kerzenprobe. Schon die Entdecker der Edelgase staunten, wie wenig diese Gase reagieren. Der Name <b>Argon</b> (entdeckt 1894) kommt vom griechischen <i>argos</i> – „träge“.", "blocks": [{"t": "info", "title": "Die Edelgase", "lead": "Die Elemente der VIII. Hauptgruppe heißen <b>Edelgase</b>: Helium, Neon, Argon, Krypton, Xenon und Radon.", "text": ["Edelgase sind farblose Gase. In Leuchtröhren leuchten sie in typischen Farben, wenn Strom hindurchfließt."], "img": "edelgase", "imgfree": true, "imgurl": "https://commons.wikimedia.org/wiki/File:Edelgase_in_Entladungsroehren.jpg", "imgcap": "Edelgase in Leuchtröhren (von links): Helium, Neon, Argon, Krypton, Xenon. Foto: Alchemist-hp (www.pse-mendelejew.de), Wikimedia Commons, Lizenz CC BY-SA 2.0 de"}, {"t": "info", "title": "Versuch: Kerze in Helium", "lead": "Eine Kerze brennt, weil das Kerzenwachs mit dem <b>Sauerstoff</b> der Luft reagiert. Brennt sie auch in Helium?", "fig": "fig_he_aufbau", "text": ["Helium hat eine viel geringere Dichte als Luft. Deshalb spannt man den Standzylinder mit der <b>Öffnung nach unten</b> ein – so bleibt das Helium darin.", "Zum Vergleich spannt man einen zweiten Standzylinder genauso ein, der nur Luft enthält (<b>Kontrollversuch</b>).", "Sicherheit: Die Heliumflasche steht unter Druck – sie wird gegen Umfallen gesichert und vor Wärme geschützt."], "stoffe": ["he"], "showGhs": true, "showP": true, "gebot": ["brille"]}, {"t": "ex", "id": "1a", "type": "sim", "vessel": "cyl", "op": "Führe durch", "task": "Führe den Versuch in der Simulation durch und beschreibe deine Beobachtungen.", "tubes": [{"id": "luft", "label": "Zylinder 1", "sub": "Luft"}, {"id": "he", "label": "Zylinder 2", "sub": "Helium"}], "steps": [{"text": "Zylinder 2 mit Helium aus der Druckgasflasche füllen; die Öffnung bleibt dabei unten.", "anim": "fill", "state": {"luft": {}, "he": {"gas": 1}}}, {"text": "Zwei Kerzen anzünden und unter die Öffnungen der Zylinder halten.", "anim": "fill", "state": {"luft": {"candle": "below"}, "he": {"gas": 1, "candle": "below"}}}, {"text": "Die brennenden Kerzen langsam von unten in die Zylinder schieben.", "anim": "fill", "state": {"luft": {"candle": "in"}, "he": {"gas": 1, "candle": "out"}}}], "wrong": [{"text": "Beide Zylinder mit Helium füllen.", "fb": "Dann fehlt der Vergleich: Ein Zylinder bleibt mit Luft gefüllt (Kontrollversuch)."}, {"text": "Zylinder 2 zum Füllen umdrehen, sodass die Öffnung nach oben zeigt.", "fb": "Helium hat eine viel geringere Dichte als Luft – es würde nach oben aus dem Zylinder entweichen."}], "cols": ["Beobachtung an der Kerze im Zylinder"], "colOpts": [["brennt weiter", "erlischt sofort", "brennt viel heller", "Gas entzündet sich mit einem Knall"]], "rows": [{"label": "Zylinder 1: Luft", "sol": ["brennt weiter"]}, {"label": "Zylinder 2: Helium", "sol": ["erlischt sofort"]}]}, {"t": "ex", "id": "1b", "type": "mc", "op": "Deute", "task": "Deute die Beobachtung im Zylinder mit Helium.", "options": [{"text": "Helium reagiert nicht mit dem Kerzenwachs. Im Helium fehlt der Sauerstoff, deshalb erlischt die Kerze.", "ok": true, "fb": "Richtig: Helium unterhält die Verbrennung nicht – es ist sehr reaktionsträge."}, {"text": "Helium ist ein brennbares Gas.", "ok": false, "fb": "Ein brennbares Gas würde sich an der Flamme entzünden. Die Kerze ist aber einfach erloschen."}, {"text": "Helium reagiert heftig mit dem Kerzenwachs und erstickt dabei die Flamme.", "ok": false, "fb": "Eine heftige Reaktion wäre zu sehen – zum Beispiel eine Stichflamme. Es passiert aber nichts außer dem Erlöschen."}, {"text": "Kerzen erlöschen in jedem Standzylinder, egal welches Gas darin ist.", "ok": false, "fb": "Der Kontrollversuch widerlegt das: In Zylinder 1 mit Luft brennt die Kerze weiter."}]}, {"t": "merke", "title": "Merke", "bullets": ["Edelgase sind <b>sehr reaktionsträge</b>: Sie gehen so gut wie keine chemischen Reaktionen ein.", "Helium unterhält die Verbrennung nicht – eine Kerze erlischt darin."]}, {"t": "ex", "id": "1c", "type": "hunt", "op": "Ermittle", "task": "Im Club hängen Schilder, die verraten, wofür Gase genutzt werden. Ermittle die <b>drei Stellen</b>, an denen man nutzt, dass Edelgase reaktionsträge sind, und tippe sie an.", "fig": "fig_wb_alltag", "hint": "Lies die Schilder genau: Geht es um ein Edelgas – und darum, dass etwas <i>nicht</i> reagiert?", "targets": [{"id": "lampe", "x": 330, "y": 110, "r": 52, "label": "Glühlampe mit Argon", "fb": "Richtig: Im Argon reagiert der glühende Draht nicht mit Sauerstoff."}, {"id": "schweiss", "x": 200, "y": 262, "r": 70, "label": "Schutzgas-Schweißen mit Argon", "fb": "Richtig: Das Argon hält die Luft von der heißen Schweißnaht fern."}, {"id": "vitrine", "x": 393, "y": 284, "r": 54, "label": "Vitrine mit Argon", "fb": "Richtig: Im Argon wird die alte Urkunde nicht vom Sauerstoff angegriffen."}], "decoys": [{"x": 600, "y": 95, "r": 52, "label": "Leuchtreklame mit Neon", "fb": "Hier nutzt man, dass Neon leuchtet, wenn Strom fließt – nicht, dass es reaktionsträge ist."}, {"x": 575, "y": 238, "r": 40, "label": "Chipstüte mit Stickstoff", "fb": "Stickstoff schützt die Chips zwar – er ist aber kein Edelgas."}, {"x": 488, "y": 335, "r": 34, "label": "Feuerlöscher mit Kohlenstoffdioxid", "fb": "Kohlenstoffdioxid ist kein Edelgas."}], "doneMsg": "Alle drei gefunden: Argon schützt Draht, Schweißnaht und Urkunde, weil es nicht reagiert."}]}, {"id": "s2", "nr": 2, "ort": "Messraum", "title": "Der Energie-Check", "icon": "bolt", "min": 6, "stempel": "O", "scene": "fig_sc_mess", "story": "Im Messraum prüft der Club, wie fest ein Atom sein äußerstes Elektron festhält. Die Messwerte stammen aus der Atom-Datenbank des US-amerikanischen Messinstituts NIST, mit der Forschende auf der ganzen Welt arbeiten.", "blocks": [{"t": "info", "title": "Die 1. Ionisierungsenergie", "lead": "Die <b>1. Ionisierungsenergie</b> ist die Energie, die man braucht, um von einem Atom das erste – am schwächsten gebundene – Elektron abzuspalten. Je größer sie ist, desto fester ist dieses Elektron gebunden.", "fig": "fig_ie_chart", "text": ["Die Einheit ist das <b>Elektronenvolt</b> (eV). Die Atomarten stehen im Diagramm in der Reihenfolge des gekürzten Periodensystems (Werte gerundet, NIST)."]}, {"t": "ex", "id": "2a", "type": "sort", "op": "Werte aus", "task": "Werte das Diagramm aus: Ordne die Atome danach, wo ihre 1. Ionisierungsenergie innerhalb ihrer Periode liegt.", "bins": [{"id": "max", "label": "höchster Wert der Periode"}, {"id": "mid", "label": "weder höchster noch niedrigster Wert"}, {"id": "min", "label": "niedrigster Wert der Periode"}], "items": [{"id": "he", "label": "Helium-Atom", "bin": "max"}, {"id": "ne", "label": "Neon-Atom", "bin": "max"}, {"id": "ar", "label": "Argon-Atom", "bin": "max"}, {"id": "kr", "label": "Krypton-Atom", "bin": "max"}, {"id": "li", "label": "Lithium-Atom", "bin": "min"}, {"id": "na", "label": "Natrium-Atom", "bin": "min"}, {"id": "k", "label": "Kalium-Atom", "bin": "min"}, {"id": "f", "label": "Fluor-Atom", "bin": "mid"}, {"id": "mg", "label": "Magnesium-Atom", "bin": "mid"}, {"id": "cl", "label": "Chlor-Atom", "bin": "mid"}]}, {"t": "info", "title": "Was ein Elektron festhält", "lead": "Ein Elektron wird vom positiv geladenen Atomkern angezogen. Zwei Dinge entscheiden, wie stark:", "fig": "fig_abschirmung", "text": ["<b>Zahl der Protonen:</b> Je mehr Protonen der Kern hat, desto stärker zieht er Elektronen auf derselben Energiestufe an.", "<b>Energiestufe:</b> Je höher die Energiestufe, desto weiter ist das Elektron vom Kern entfernt. Außerdem schirmen die Elektronen auf den niedrigeren Stufen die Anziehung des Kerns teilweise ab."]}, {"t": "ex", "id": "2b", "type": "select", "op": "Erkläre", "task": "Erkläre die beiden Trends im Diagramm: Wähle für jede Richtung im Periodensystem den Trend und die passende Begründung.", "cols": ["1. Ionisierungsenergie", "Begründung"], "colOpts": [["steigt tendenziell an", "nimmt tendenziell ab", "bleibt gleich"], ["mehr Protonen, gleiche Energiestufe", "höhere Energiestufe, weiter vom Kern", "weniger Protonen im Kern", "mehr Neutronen im Kern"]], "rows": [{"label": "innerhalb einer Periode (von links nach rechts)", "sol": ["steigt tendenziell an", "mehr Protonen, gleiche Energiestufe"]}, {"label": "innerhalb einer Hauptgruppe (von oben nach unten)", "sol": ["nimmt tendenziell ab", "höhere Energiestufe, weiter vom Kern"]}]}, {"t": "merke", "title": "Merke", "bullets": ["Die 1. Ionisierungsenergie <b>steigt innerhalb einer Periode tendenziell an</b>: mehr Protonen, gleiche Energiestufe.", "Sie <b>nimmt innerhalb einer Hauptgruppe tendenziell ab</b>: Das Valenzelektron sitzt auf einer höheren Energiestufe, weiter vom Kern.", "<b>Edelgas-Atome</b> haben die höchsten, <b>Alkalimetall-Atome</b> die niedrigsten Werte ihrer Periode.", "Kleine Ausnahmen (z. B. Beryllium → Bor, Stickstoff → Sauerstoff) erklärt erst ein genaueres Atommodell."]}, {"t": "ex", "id": "2p", "profi": true, "type": "mc", "op": "Erkläre", "task": "Die 1. Ionisierungsenergie des Wasserstoff-Atoms (13,6 eV) ist rund zweieinhalbmal so groß wie die des Lithium-Atoms (5,4 eV), obwohl beide in der I. Hauptgruppe stehen. Erkläre.", "options": [{"text": "Das Elektron des Wasserstoff-Atoms ist auf der 1. Energiestufe, ganz nah am Kern und nicht abgeschirmt. Das Valenzelektron des Lithium-Atoms ist auf der 2. Energiestufe.", "ok": true, "fb": "Richtig – das zeigt die Sonderstellung des Wasserstoffs in der I. Hauptgruppe."}, {"text": "Das Wasserstoff-Atom hat mehr Protonen als das Lithium-Atom.", "ok": false, "fb": "Umgekehrt: Wasserstoff hat ein Proton, Lithium drei."}, {"text": "Das Wasserstoff-Atom hat mehr Valenzelektronen als das Lithium-Atom.", "ok": false, "fb": "Beide haben genau ein Valenzelektron."}]}, {"t": "game", "id": "2g", "kind": "blitz", "title": "Blitzrunde: Stimmt das?", "zeit": 8, "lead": "Entscheide schnell: Stimmt die Aussage oder nicht?", "items": [{"text": "Edelgase sind sehr reaktionsträge.", "ok": true}, {"text": "In Helium brennt eine Kerze weiter.", "ok": false, "fb": "Sie erlischt – Helium unterhält die Verbrennung nicht."}, {"text": "Die 1. Ionisierungsenergie ist die Energie zum Abspalten des ersten Elektrons eines Atoms.", "ok": true}, {"text": "Innerhalb einer Hauptgruppe steigt die 1. Ionisierungsenergie von oben nach unten.", "ok": false, "fb": "Sie nimmt ab: Das Valenzelektron ist weiter vom Kern entfernt."}, {"text": "Das Helium-Atom hat die höchste 1. Ionisierungsenergie im Diagramm.", "ok": true}, {"text": "Das Kalium-Atom hat eine kleinere 1. Ionisierungsenergie als das Natrium-Atom.", "ok": true}, {"text": "Mehr Protonen halten Elektronen auf derselben Energiestufe schwächer fest.", "ok": false, "fb": "Stärker: Mehr Protonen ziehen stärker an."}, {"text": "Stickstoff ist ein Edelgas.", "ok": false, "fb": "Edelgase sind Helium, Neon, Argon, Krypton, Xenon und Radon."}]}]}, {"id": "s3", "nr": 3, "ort": "Salon", "title": "Das Geheimnis der Edlen", "icon": "star", "min": 6, "stempel": "N", "scene": "fig_sc_salon", "story": "Warum sind gerade die Edelgase so stabil? 1916 fand der Physiker Walther Kossel in München eine Antwort – im selben Jahr wie der Amerikaner Gilbert N. Lewis. Ihre Idee nutzen Chemikerinnen und Chemiker bis heute.", "blocks": [{"t": "info", "title": "Edelgaskonfiguration", "lead": "Die Atome der Edelgase haben auf ihrer höchsten besetzten Energiestufe <b>acht Valenzelektronen</b> – nur das Helium-Atom hat zwei. Diese Elektronenverteilung heißt <b>Edelgaskonfiguration</b>.", "fig": "fig_edelgas_esm", "text": ["Die Edelgaskonfiguration ist besonders stabil. Deshalb braucht man sehr viel Energie, um aus einem Edelgas-Atom ein Elektron abzuspalten."]}, {"t": "ex", "id": "3a", "type": "mc", "op": "Erkläre", "task": "Erkläre, warum die Atome der Alkalimetalle (I. Hauptgruppe) die niedrigste 1. Ionisierungsenergie ihrer Periode haben. Beispiel Natrium-Atom: 1<sup>2</sup> 2<sup>8</sup> 3<sup>1</sup>.", "fig": "fig_ie_chart", "options": [{"text": "Ihr einziges Valenzelektron sitzt allein auf einer neuen, höheren Energiestufe – weit vom Kern und durch die voll besetzten Stufen darunter abgeschirmt. Nach seiner Abgabe liegt die stabile Edelgaskonfiguration vor.", "ok": true, "fb": "Richtig: Natrium-Atom 1<sup>2</sup> 2<sup>8</sup> 3<sup>1</sup> → nach der Abgabe 1<sup>2</sup> 2<sup>8</sup> wie das Neon-Atom."}, {"text": "Sie haben schon acht Valenzelektronen.", "ok": false, "fb": "Alkalimetall-Atome haben nur ein Valenzelektron."}, {"text": "Ihr Valenzelektron sitzt auf der 1. Energiestufe, ganz nah am Kern.", "ok": false, "fb": "Beim Natrium-Atom sitzt das Valenzelektron auf der 3. Energiestufe."}, {"text": "Sie haben gar keine Elektronen, die man abspalten könnte.", "ok": false, "fb": "Jedes Atom hat Elektronen – das Natrium-Atom elf."}]}, {"t": "info", "title": "Die Edelgasregel", "lead": "Atome anderer Elemente können die stabile Edelgaskonfiguration auch erreichen – indem sie <b>Elektronen abgeben oder aufnehmen</b>. Die dafür nötige Energie muss allerdings zugeführt werden.", "fig": "fig_ionenbildung", "text": ["Gibt ein Atom Elektronen ab, entsteht ein positiv geladenes <b>Kation</b>. Nimmt es Elektronen auf, entsteht ein negativ geladenes <b>Anion</b>.", "Die <b>Ionenladungszahl</b> gibt an, wie viele Elektronen das Ion mehr oder weniger hat als das Atom.", "Dabei wird in der Regel die <b>nächstgelegene</b> Edelgaskonfiguration erreicht – also mit möglichst wenigen abgegebenen oder aufgenommenen Elektronen. Das Natrium-Atom gibt deshalb ein Elektron ab, statt sieben aufzunehmen.", "Namen der Anionen enden auf <b>-id</b>: Fluorid-Ion F<sup>−</sup>, Bromid-Ion, Iodid-Ion, Sulfid-Ion, Nitrid-Ion."]}, {"t": "ex", "id": "3b", "type": "ionbuild", "op": "Ermittle", "task": "In der Ionen-Werkstatt sollen drei Atome Edelgaskonfiguration erreichen. Ermittle im Energiestufenmodell, wie viele Elektronen jedes Atom abgibt oder aufnimmt.", "atoms": [{"sym": "Mg", "name": "Magnesium-Atom", "z": 12, "e": [2, 8, 2], "sol": [2, 8], "ion": "{Mg^2+}"}, {"sym": "O", "name": "Sauerstoff-Atom", "z": 8, "e": [2, 6], "sol": [2, 8], "ion": "{O^2-}"}, {"sym": "Cl", "name": "Chlor-Atom", "z": 17, "e": [2, 8, 7], "sol": [2, 8, 8], "ion": "{Cl-}"}]}, {"t": "merke", "title": "Merke", "bullets": ["<b>Edelgaskonfiguration:</b> acht Valenzelektronen (Helium: zwei) – besonders stabil.", "<b>Edelgasregel:</b> Atome bzw. Ionen nehmen in Verbindungen häufig die stabile Edelgaskonfiguration ein.", "Elektronenabgabe → <b>Kation</b>, Elektronenaufnahme → <b>Anion</b>.", "Die <b>Ionenladungszahl</b> entspricht der Zahl der abgegebenen oder aufgenommenen Elektronen."]}, {"t": "game", "id": "3g", "kind": "memory", "title": "Memory: Begriffe der Edlen", "lead": "Finde zu jedem Begriff die passende Erklärung.", "pairs": [["Kation", "positiv geladenes Ion"], ["Anion", "negativ geladenes Ion"], ["Edelgas­konfiguration", "acht Valenz­elektronen (Helium: zwei)"], ["1. Ionisierungs­energie", "Energie zum Abspalten des ersten Elektrons"], ["Na<sup>+</sup>", "Natrium-Ion"], ["F<sup>−</sup>", "Fluorid-Ion"]]}]}, {"id": "s4", "nr": 4, "ort": "Spielsaal", "title": "Das PSE-Spielbrett", "icon": "puzzle", "min": 5, "stempel": "E", "scene": "fig_sc_spiel", "story": "Auf jedem Mineralwasser-Etikett stehen die enthaltenen Ionen samt ihrer Ladung. Woher kennt man diese Ladungen? Im Spielsaal liegt das Periodensystem als Spielbrett – damit ermittelst du Ionenladungszahlen in Sekunden.", "blocks": [{"t": "info", "title": "So geht’s: Ionenladungszahl mit dem Periodensystem", "lead": "Die Hauptgruppe verrät die Zahl der Valenzelektronen. Daraus folgt, wie viele Elektronen das Atom bis zur Edelgaskonfiguration abgibt oder aufnimmt.", "fig": "fig_spielbrett", "text": ["<b>Metall-Atome der I. und II. Hauptgruppe sowie Aluminium-Atome</b> (links im PSE): Zähle die Schritte nach links bis zur I. Hauptgruppe und dann einen Sprung in die Edelgas-Spalte eine Periode höher. So viele Elektronen geben sie ab → Kation.", "<b>Nichtmetall-Atome der V. bis VII. Hauptgruppe</b> (rechts im PSE): Zähle die Schritte nach rechts bis zum Edelgas. So viele Elektronen nehmen sie auf → Anion.", "Für schwere Metall-Atome wie Zinn, Blei oder Bismut gilt diese Regel nicht.", "Beispiel Calciumbromid: Das Calcium-Atom (II. Hauptgruppe, 1<sup>2</sup> 2<sup>8</sup> 3<sup>8</sup> 4<sup>2</sup>) gibt 2 Elektronen ab → Ca<sup>2+</sup>. Das Brom-Atom (VII. Hauptgruppe, 7 Valenzelektronen) nimmt 1 Elektron auf → Br<sup>−</sup>."]}, {"t": "ex", "id": "4a", "type": "sort", "op": "Ordne", "task": "Ordne mithilfe des Periodensystems zu, welche Ionen die Atome nach der Edelgasregel bilden.", "fig": "fig_pse", "bins": [{"id": "p1", "label": "bilden einfach positiv geladene Ionen (1+)"}, {"id": "p2", "label": "bilden zweifach positiv geladene Ionen (2+)"}, {"id": "p3", "label": "bilden dreifach positiv geladene Ionen (3+)"}, {"id": "n1", "label": "bilden einfach negativ geladene Ionen (1−)"}, {"id": "n2", "label": "bilden zweifach negativ geladene Ionen (2−)"}, {"id": "n3", "label": "bilden dreifach negativ geladene Ionen (3−)"}], "items": [{"id": "li", "label": "Lithium-Atome (Li)", "bin": "p1"}, {"id": "na", "label": "Natrium-Atome (Na)", "bin": "p1"}, {"id": "k", "label": "Kalium-Atome (K)", "bin": "p1"}, {"id": "rb", "label": "Rubidium-Atome (Rb)", "bin": "p1"}, {"id": "be", "label": "Beryllium-Atome (Be)", "bin": "p2"}, {"id": "mg", "label": "Magnesium-Atome (Mg)", "bin": "p2"}, {"id": "ca", "label": "Calcium-Atome (Ca)", "bin": "p2"}, {"id": "sr", "label": "Strontium-Atome (Sr)", "bin": "p2"}, {"id": "ba", "label": "Barium-Atome (Ba)", "bin": "p2"}, {"id": "al", "label": "Aluminium-Atome (Al)", "bin": "p3"}, {"id": "cl", "label": "Chlor-Atome (Cl)", "bin": "n1"}, {"id": "f", "label": "Fluor-Atome (F)", "bin": "n1"}, {"id": "br", "label": "Brom-Atome (Br)", "bin": "n1"}, {"id": "i", "label": "Iod-Atome (I)", "bin": "n1"}, {"id": "o", "label": "Sauerstoff-Atome (O)", "bin": "n2"}, {"id": "s", "label": "Schwefel-Atome (S)", "bin": "n2"}, {"id": "n", "label": "Stickstoff-Atome (N)", "bin": "n3"}, {"id": "p", "label": "Phosphor-Atome (P)", "bin": "n3"}]}, {"t": "merke", "title": "Merke", "bullets": ["Metall-Atome der I. und II. Hauptgruppe sowie Aluminium-Atome geben Elektronen ab und bilden <b>Kationen</b>: I → 1+, II → 2+, Aluminium → 3+.", "Nichtmetall-Atome der V. bis VII. Hauptgruppe nehmen Elektronen auf und bilden <b>Anionen</b>: V → 3−, VI → 2−, VII → 1−.", "Atome der IV. Hauptgruppe (z. B. Kohlenstoff) bilden meist keine einfachen Ionen."]}, {"t": "ex", "id": "4p", "profi": true, "type": "mc", "multi": true, "op": "Ermittle", "task": "Ermittle alle Ionen, die genauso viele Elektronen haben wie das Argon-Atom (18).", "options": [{"text": "K<sup>+</sup>", "ok": true, "fb": "19 − 1 = 18 Elektronen."}, {"text": "Ca<sup>2+</sup>", "ok": true, "fb": "20 − 2 = 18 Elektronen."}, {"text": "Cl<sup>−</sup>", "ok": true, "fb": "17 + 1 = 18 Elektronen."}, {"text": "S<sup>2−</sup>", "ok": true, "fb": "16 + 2 = 18 Elektronen."}, {"text": "Na<sup>+</sup>", "ok": false, "fb": "11 − 1 = 10 Elektronen – wie das Neon-Atom."}, {"text": "F<sup>−</sup>", "ok": false, "fb": "9 + 1 = 10 Elektronen – wie das Neon-Atom."}]}, {"t": "game", "id": "4g", "kind": "boss", "title": "Boss-Runde: Der Türsteher", "name": "Türsteher Argon", "fig": "fig_boss", "leben": 3, "lead": "Der Türsteher lässt nur rein, wer alles über die Edlen weiß.", "winMsg": "Der Türsteher nickt: „Du darfst in den Tresorraum.“", "loseMsg": "Der Türsteher verschränkt die Arme. Versuch es noch einmal!", "qs": [{"q": "Was zeigt die Kerzenprobe mit Helium?", "options": [{"text": "Helium unterhält die Verbrennung nicht.", "ok": true}, {"text": "Helium ist brennbar.", "ok": false, "fb": "Sonst hätte es sich an der Flamme entzündet."}, {"text": "Helium enthält Sauerstoff.", "ok": false, "fb": "Dann hätte die Kerze weitergebrannt."}]}, {"q": "Welches Atom hat die niedrigste 1. Ionisierungsenergie der 3. Periode?", "options": [{"text": "Natrium-Atom", "ok": true}, {"text": "Argon-Atom", "ok": false, "fb": "Argon hat den höchsten Wert."}, {"text": "Chlor-Atom", "ok": false, "fb": "Der Wert des Chlor-Atoms ist hoch."}]}, {"q": "Wie viele Valenzelektronen hat ein Neon-Atom?", "options": [{"text": "8", "ok": true}, {"text": "2", "ok": false, "fb": "Zwei hat nur das Helium-Atom."}, {"text": "10", "ok": false, "fb": "10 Elektronen hat es insgesamt."}]}, {"q": "Welches Ion bildet ein Schwefel-Atom (VI. Hauptgruppe)?", "options": [{"text": "S<sup>2−</sup>", "ok": true}, {"text": "S<sup>6+</sup>", "ok": false, "fb": "Sechs abgeben wäre viel zu weit – zwei aufnehmen reicht."}, {"text": "S<sup>2+</sup>", "ok": false, "fb": "Nichtmetall-Atome nehmen Elektronen auf."}]}, {"q": "Was entsteht, wenn ein Atom Elektronen abgibt?", "options": [{"text": "ein Kation", "ok": true}, {"text": "ein Anion", "ok": false, "fb": "Anionen entstehen durch Aufnahme."}, {"text": "ein Edelgas-Atom", "ok": false, "fb": "Das Ion hat nur dieselbe Elektronenverteilung – die Protonenzahl bleibt."}]}, {"q": "Welche Ladung hat ein Aluminium-Ion?", "options": [{"text": "3+", "ok": true}, {"text": "3−", "ok": false, "fb": "Aluminium-Atome sind Metall-Atome."}, {"text": "5−", "ok": false, "fb": "Aluminium steht in der III. Hauptgruppe."}]}]}]}, {"id": "s5", "nr": 5, "ort": "Tresorraum", "title": "Die Gästeliste", "icon": "key", "min": 7, "stempel": "N", "scene": "fig_sc_tresor", "story": "Das violette Mineral Fluorit besteht aus Calciumfluorid. Nach ihm sind das Element Fluor und das Leuchten benannt, das man Fluoreszenz nennt. Im Tresorraum liegt die Gästeliste des Clubs: lauter Salze, deren Ionen Edelgaskonfiguration haben.", "blocks": [{"t": "info", "title": "Ionen im Salz", "lead": "In einem Salz gleichen sich die positiven und negativen Ladungen der Ionen aus. Die <b>Verhältnisformel</b> gibt das kleinste ganzzahlige Zahlenverhältnis der Ionen an.", "text": ["Beispiel Calciumfluorid: Ein Ca<sup>2+</sup> (zwei positive Ladungen) gleicht zwei F<sup>−</sup> aus → CaF<sub>2</sub>.", "Im Namen steht zuerst das Metall, dann das Nichtmetall mit der Endung -id, z. B. Calciumfluorid, Kaliumoxid."], "img": "fluorit", "imgfree": true, "imgurl": "https://commons.wikimedia.org/wiki/File:Fluorite_octahedrons.jpg", "imgcap": "Fluorit-Kristalle aus Calciumfluorid (CaF<sub>2</sub>). Foto: Amy M Lavine, Wikimedia Commons, Lizenz CC BY-SA 4.0"}, {"t": "ex", "id": "5a", "type": "formula", "op": "Ermittle", "task": "Ermittle die Verhältnisformeln für die Gästeliste. Stelle dazu die Anzahl der Ionen so ein, dass sich die Ladungen ausgleichen.", "salts": [{"name": "Berylliumfluorid", "cat": ["Be", 2], "an": ["F", -1, false], "sol": [1, 2], "f": "BeF<sub>2</sub>"}, {"name": "Kaliumoxid", "cat": ["K", 1], "an": ["O", -2, false], "sol": [2, 1], "f": "K<sub>2</sub>O"}, {"name": "Natriumsulfid", "cat": ["Na", 1], "an": ["S", -2, false], "sol": [2, 1], "f": "Na<sub>2</sub>S"}, {"name": "Aluminiumoxid", "cat": ["Al", 3], "an": ["O", -2, false], "sol": [2, 3], "f": "Al<sub>2</sub>O<sub>3</sub>"}]}, {"t": "ex", "id": "5b", "type": "lock", "op": "Ermittle", "task": "Der Tresor mit der Gästeliste ist verschlossen. Ermittle die beiden Ziffern des Codes.", "object": "Tresor", "code": "32", "clues": ["1. Ziffer: Anzahl der Magnesium-Ionen in einer Formeleinheit Magnesiumnitrid", "2. Ziffer: Anzahl der Nitrid-Ionen in einer Formeleinheit Magnesiumnitrid", "Tipp: Magnesium steht in der II., Stickstoff in der V. Hauptgruppe."], "okMsg": "Klick – der Tresor ist offen!", "reward": "Magnesiumnitrid (Mg<sub>3</sub>N<sub>2</sub>) entsteht übrigens, wenn Magnesium an der Luft verbrennt – neben viel Magnesiumoxid."}, {"t": "ex", "id": "5c", "type": "cmap", "op": "Ordne", "task": "Ordne jedem freien Feld der Concept-Map den passenden Begriff zu."}, {"t": "quiz", "id": "5d", "title": "Abschlussquiz", "qs": [{"id": "5d1", "op": "Ermittle", "task": "Ermittle das Ion, das ein Selen-Atom (VI. Hauptgruppe) nach der Edelgasregel bildet.", "options": [{"text": "Se<sup>2−</sup>", "ok": true, "fb": "Richtig: zwei Elektronen aufnehmen bis zur Edelgaskonfiguration."}, {"text": "Se<sup>6+</sup>", "ok": false, "fb": "Sechs Elektronen abgeben wäre ein viel weiterer Weg als zwei aufnehmen."}, {"text": "Se<sup>2+</sup>", "ok": false, "fb": "Selen-Atome stehen rechts im PSE und nehmen Elektronen auf."}, {"text": "Se<sup>6−</sup>", "ok": false, "fb": "Dann hätte das Ion zwölf Valenzelektronen."}]}, {"id": "5d2", "op": "Beurteile", "task": "Beurteile die Aussage: „Das Kalium-Atom hat eine höhere 1. Ionisierungsenergie als das Natrium-Atom, weil es mehr Protonen hat.“", "options": [{"text": "Die Aussage ist falsch: Das Valenzelektron des Kalium-Atoms sitzt auf einer höheren Energiestufe, weiter vom Kern – die 1. Ionisierungsenergie ist kleiner.", "ok": true, "fb": "Richtig: Innerhalb einer Hauptgruppe nimmt die 1. Ionisierungsenergie ab."}, {"text": "Die Aussage ist richtig: Mehr Protonen ziehen das Elektron stärker an.", "ok": false, "fb": "Das gilt nur für Elektronen auf derselben Energiestufe."}, {"text": "Die Aussage ist falsch: Kalium-Atome haben weniger Protonen als Natrium-Atome.", "ok": false, "fb": "Kalium hat 19, Natrium 11 Protonen."}]}]}, {"t": "cert"}]}], "STOFFE": {"he": {"name": "Helium (Druckgasflasche)", "ghs": ["GHS04"], "sw": "Achtung", "h": ["H280 Enthält Gas unter Druck; kann bei Erwärmung explodieren."], "p": ["P403 An einem gut belüfteten Ort aufbewahren."]}}, "CMAP": {"w": 760, "h": 470, "nodes": [{"id": "eg", "x": 120, "y": 60, "text": "Edelgas-Atome"}, {"id": "ek", "x": 390, "y": 60, "blank": true, "sol": "Edelgaskonfiguration"}, {"id": "ie", "x": 640, "y": 170, "blank": true, "sol": "1. Ionisierungsenergie"}, {"id": "er", "x": 390, "y": 210, "blank": true, "sol": "Edelgasregel"}, {"id": "me", "x": 120, "y": 300, "text": "Metall-Atome"}, {"id": "ka", "x": 120, "y": 420, "blank": true, "sol": "Kationen"}, {"id": "nm", "x": 65 <script>/* Lern-Engine: Stationen, Übungstypen, Punkte, Speicherung (localStorage / SCORM 1.2) */
(function () {
  "use strict";

  // Beschriftungen des Spielrahmens (in content.py META["labels"] überschreibbar)

    introGo: "Los geht’s", introSkip: "Überspringen", introReplay: "Intro abspielen" }, M.labels || {});
  var KEY = M.id;
  var MAXP = 10;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var el = function (tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var MINUS = "−";

  // ---------------------------------------------------------------- Formeln richtig darstellen (Indizes und Ladungen)
  // Im HTML stehen echte <sub>/<sup>. Auswahllisten können kein HTML zeigen -> Unicode (CO₂, SO₄²⁻).
  // SVG kennt kein <sub>/<sup> -> svgRich() setzt versetzte tspans. Verglichen wird über den Inhalt, nie über die Anzeige.
  var SUBC = { "0": "₀", "1": "₁", "2": "₂", "3": "₃", "4": "₄", "5": "₅", "6": "₆", "7": "₇", "8": "₈", "9": "₉", "+": "₊", "−": "₋", "-": "₋", "(": "₍", ")": "₎" };
  var SUPC = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "+": "⁺", "−": "⁻", "-": "⁻", "(": "⁽", ")": "⁾" };
  function plain(h) { var d = document.createElement("div"); d.innerHTML = h; return d.textContent; }
  function uni(h) {
    var m = function (map) { return function (_, x) { return x.split("").map(function (c) { return map[c] || c; }).join(""); }; };
    return plain(String(h).replace(/<sub>(.*?)<\/sub>/g, m(SUBC)).replace(/<sup>(.*?)<\/sup>/g, m(SUPC)));
  }
  function svgRich(h, fs) {
    var out = "", cur = 0, mode = "", bold = false, ital = false, re = /<(\/?)(sub|sup|b|i)>|<[^>]*>|([^<]+)/g, m;
    while ((m = re.exec(String(h)))) {
      if (m[3] != null) {
        var want = mode === "sup" ? -0.42 * fs : mode === "sub" ? 0.24 * fs : 0, dy = want - cur; cur = want;
        out += '<tspan dy="' + dy.toFixed(1) + '"' + (mode ? ' font-size="' + (0.68 * fs).toFixed(1) + '"' : "") + (bold ? ' font-weight="700"' : "") + (ital ? ' font-style="italic"' : "") + ">" + m[3] + "</tspan>";
      } else if (m[2]) { var on = !m[1]; if (m[2] === "sub" || m[2] === "sup") mode = on ? m[2] : ""; else if (m[2] === "b") bold = on; else ital = on; }
    }
    if (cur) out += '<tspan dy="' + (-cur).toFixed(1) + '"></tspan>';
    return out;
  }
  function optHtml(o) { return '<option value="' + esc(plain(o)) + '" data-h="' + esc(o) + '">' + esc(uni(o)) + "</option>"; }

  // ---------------------------------------------------------------- Zufall (deterministisch pro Übung)
  function rng(seedStr) {
    var h = 2166136261;
    for (var i = 0; i < seedStr.length; i++) { h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
    return function () { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; };

  function ionHtml(sym, q) { return fmt(sym) + "<sup>" + qstr(q) + "</sup>"; }

  // ex: Pflichtübungen [Punkte, Versuche, Status]; px: Profi-Aufgaben [Sterne, Versuche, Status]; mg: Minispiele (beste Sternzahl); bd: Abzeichen (IDs, durch Komma getrennt)
  function normS(o) { o = o || {}; o.ex = o.ex || {}; o.px = o.px || {}; o.mg = o.mg || {}; o.bd = o.bd || ""; o.name = o.name || ""; o.loc = o.loc || ""; return o; }

    }
    return null;
  }
  function initScorm() {

      if (!st || st === "not attempted") api.LMSSetValue("cmi.core.lesson_status", "incomplete");

  }

    initScorm();
    if (!scorm) {
      try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); if (o && o.ex) S = normS(o); } } catch (e) { }
    }

  }
  function save() {
    var js = JSON.stringify(S);

        scorm.LMSSetValue("cmi.core.score.max", "100");

  var EXLIST = [], PXLIST = [], GMLIST = [];

      if (b.t === "game") { GMLIST.push({ id: b.id, si: si, kind: b.kind }); return; }
      if (b.t === "ex") EXLIST.push({ id: b.id, si: si, type: b.type });
      if (b.t === "quiz") b.qs.forEach(function (q) { EXLIST.push({ id: q.id, si: si, type: "mc" }); });

  });
  function maxPoints() { return EXLIST.length * MAXP; }
  function points() { var p = 0; for (var k in S.ex) p += S.ex[k][0] || 0; return p; }
  function exDone(id) { return !!(S.ex[id] && S.ex[id][2]); }
  function stationDone(si) { return EXLIST.filter(function (e) { return e.si === si; }).every(function (e) { return exDone(e.id); }); }
  function allDone() { return ST.every(function (s, i) { return stationDone(i); }); }
  // Lernzirkel (META.zirkel = Stations-IDs): Diese Stationen sind frei wählbar, sobald alle Stationen davor geschafft sind;

  var ZI = (C.META.zirkel || []).map(function (id) { return ST.map(function (s) { return s.id; }).indexOf(id); }).filter(function (i) { return i > -1; });
  function allBefore(si) { for (var i = 0; i < si; i++) if (!stationDone(i)) return false; return true; }
  function unlocked(si) {
    if (preview || si === 0) return true;
    if (ZI.length) { var first = Math.min.apply(null, ZI); if (ZI.indexOf(si) > -1) return allBefore(first); return allBefore(si); }
    return stationDone(si - 1);
  }
  function nextOpen(si) {
    if (!ZI.length) return si + 1 < ST.length ? si + 1 : -1;
    for (var i = 0; i < ST.length; i++) { var j = (si + 1 + i) % ST.length; if (unlocked(j) && !stationDone(j)) return j; }

  var cur = -1, wasDone = {};

  function renderBlocks(si, host) {
    var s = ST[si];
    host.innerHTML = "";
    var stop = false;
    for (var bi = 0; bi < s.blocks.length && !stop; bi++) {
      var b = s.blocks[bi];
      if (isBonus(b)) continue;
      if (b.t === "ex") {
        host.appendChild(exCard(b, si));
        if (!exDone(b.id)) stop = true;
      } else if (b.t === "quiz") {
        var qh = el("h3", null, b.title); qh.style.marginTop = "18px"; host.appendChild(qh);
        for (var qi = 0; qi < b.qs.length; qi++) {
          var q = b.qs[qi];
          var qx = { id: q.id, type: "mc", op: q.op, task: q.task, options: q.options, multi: false };
          host.appendChild(exCard(qx, si));
          if (!exDone(q.id)) { stop = true; break; }
        }
      } else if (b.t === "cert") {
        host.appendChild(certCard());
      } else {
        host.appendChild(infoCard(b));
      }
    }
    if (!stop && stationDone(si)) {
      var celebrate = !wasDone[si]; wasDone[si] = true;
      host.appendChild(doneCard(si, celebrate));

    }

  // ---------------------------------------------------------------- Infokarten

  function figHtml(key) {

  }
  function fixFigs(root) {
    root.querySelectorAll(".figwrap").forEach(function (w) {

  // ---------------------------------------------------------------- Animationen wiederholen
  // Jede Animation bekommt einen Knopf, der sie auf den Anfang zurücksetzt, damit man sie neu
  // durchspielen kann. Zurückgesetzt wird nur die Darstellung – nie Punkte, Antworten oder Fortschritt.
  // Neue animierte Übungstypen: replayBar(label, fn) in den Übungskörper hängen, fn zeichnet den Anfangszustand neu.
  var ANIM_SEL = ".anim, animate, animateTransform, animateMotion, set";
  function replayBar(label, onClick) {
    var bar = el("div", "replaybar");

  }
  // Startet CSS-Animationen und SMIL-Zeitleiste eines Knotens neu (Klon ersetzt das Original).
  function restartNode(node) {

  }
  function stoffTable(keys, showGhs, showP) {
    var h = '<div class="tscroll"><table class="t"><tr><th>Chemikalie</th>' + (showGhs ? "<th>Piktogramme</th><th>Signalwort</th>" : "") + "<th>H-Sätze</th>" + (showP ? "<th>P-Sätze (Auswahl)</th>" : "") + "</tr>";
    keys.forEach(function (k) {
      var s = C.STOFFE[k];
      h += "<tr><td>" + s.name + "</td>" + (showGhs ? '<td><div class="ghsrow">' + (s.ghs.length ? s.ghs.map(function (g) { return G[g]; }).join("") : "–") + "</div></td><td>" + s.sw + "</td>" : "") + "<td>" + s.h.join("<br>") + "</td>" + (showP ? "<td class=\"psz\">" + ((s.p && s.p.length) ? s.p.join("<br>") : "–") + "</td>" : "") + "</tr>";
    });
    return h + "</table></div>";
  }
  function ghsLegend() {
    var h = '<div class="legend">';
    ["GHS05", "GHS07", "GHS08", "GHS09"].forEach(function (g) { h += "<span>" + G[g] + "<b>" + g + "</b>&nbsp;" + C.GHS_TXT[g] + "</span>"; });
    return h + "</div>";
  }
  function karteiHtml() {
    return '<div class="kartei"><div class="col gut"><h4>gut löslich in Wasser</h4><ul>' + C.KARTEI.gut.map(function (x) { return "<li>" + x + "</li>"; }).join("") +
      '</ul></div><div class="col schwer"><h4>schwer löslich in Wasser</h4><ul>' + C.KARTEI.schwer.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul></div></div>";
  }
  // Foto: free=true bei freier Lizenz (Quelle/Lizenz stehen in cap), sonst Buchabbildung mit Hinweis; small=true für Porträts
  function photo(key, cap, free, small, url) { return '<figure class="photo' + (small ? " small" : "") + '"><img alt="' + esc(cap.replace(/<[^>]+>/g, "")) + '" src="' + IMG[key] + '"><figcaption>' + cap + (url ? ' · <a href="' + esc(url) + '" target="_blank" rel="noopener">Bildquelle</a>' : "") + (free ? "" : " · nur für den geschlossenen mebis-Kurs") + "</figcaption></figure>"; }

  function infoCard(b) {
    var map = { info: ["info", "info", "Info"], merke: ["merke", "star", "Merke"], bg: ["bgr", "book", "Hintergrund"] };
    var m = map[b.t];
    var c = el("div", "card blk " + m[0]);
    var h = '<div class="badge">' + I[m[1]] + '</div><div class="bd"><div class="kicker">' + m[2] + "</div><h3>" + b.title + "</h3>";

    (b.text || []).forEach(function (t) { h += "<p>" + t + "</p>"; });
    if (b.table) {
      h += '<div class="tscroll"><table class="t"><tr>' + b.table.head.map(function (x) { return "<th>" + x + "</th>"; }).join("") + "</tr>" +
        b.table.rows.map(function (r) { return "<tr>" + r.map(function (x) { return "<td>" + x + "</td>"; }).join("") + "</tr>"; }).join("") + "</table></div>";
      if (b.table.caption) h += '<div class="cap">' + b.table.caption + "</div>";
    }
    if (b.stoffe) h += stoffTable(b.stoffe, b.showGhs, b.showP);
    if (b.legend) h += ghsLegend();
    // Gebotszeichen: Standard Schutzbrille + Handschuhe; b.gebot (z. B. ["brille"]) wählt nur die nötigen
    if (b.stoffe) h += '<div class="legend">' + (b.gebot || ["brille", "hand"]).map(function (g) { return "<span>" + GB[g] + { brille: "Schutzbrille tragen", hand: "Schutzhandschuhe tragen" }[g] + "</span>"; }).join("") + "</div>";
    if (b.bullets) h += "<ul>" + b.bullets.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>";
    if (b.img) h += photo(b.img, b.imgcap, b.imgfree, b.imgsmall, b.imgurl);
    h += "</div>";

  // ---------------------------------------------------------------- Übungskarte (Rahmen)
  function exCard(ex, si) {
    var PRO = !!ex.profi, store = PRO ? S.px : S.ex;
    var c = el("div", "card blk ex" + (PRO ? " profi" : ""));
    c.id = "ex-" + ex.id;
    c.innerHTML = '<div class="badge">' + I[PRO ? "crown" : "pencil"] + '</div><div class="bd"><div class="kicker">' + (PRO ? LB.profi + " (freiwillig) · " + ex.id : "Übung " + ex.id) + '</div><p class="task"><span class="op">' + ex.op + "</span>" + ex.task + "</p></div>";
    var bd = c.querySelector(".bd");
    if (ex.fig && !TYPES[ex.type].ownFig) { var fw = el("div", null, figHtml(ex.fig)); bd.appendChild(fw); fixFigs(fw); }
    if (ex.img) bd.appendChild(el("div", null, photo(ex.img, ex.imgcap, ex.imgfree, ex.imgsmall, ex.imgurl)));
    if (ex.note) bd.appendChild(el("p", "note", ex.note));
    var body = el("div", "exbody"); bd.appendChild(body);
    var fb = el("div", "fb exfb"); var btns = el("div", "btns exbtns");
    var bCheck = el("button", "btn", "Prüfen"); var bSol = el("button", "btn ghost", "Lösung zeigen"); bSol.hidden = true;
    var stat = el("span", "status");
    btns.appendChild(bCheck); btns.appendChild(bSol); btns.appendChild(stat);
    bd.appendChild(btns); bd.appendChild(fb);
    var rec = store[ex.id] || [0, 0, 0];
    var ctl = {
      setCheck: function (v) { bCheck.hidden = !v; },
      label: function (t) { bCheck.textContent = t; },
      fb: function (cls, html) { fb.className = "fb exfb " + cls; fb.innerHTML = html; },
      // Übungstypen ohne Prüfen-Knopf (z. B. Wimmelbild): Fehlgriff zählen bzw. fertig melden
      miss: function () { rec[1]++; store[ex.id] = [0, rec[1], 0]; save(); if (rec[1] >= (ex.solAfter || 3)) bSol.hidden = false; },
      award: function (msg) { rec[1] = Math.max(rec[1], 0) + 1; win(msg); },
      done: function (pts, msg) { finish(pts, msg); },
      id: ex.id
    };
    var R = TYPES[ex.type](body, ex, ctl);
    c._R = R;
    function finish(pts, msg) {
      store[ex.id] = [pts, rec[1], pts > 0 || rec[2] === 2 ? 1 : 2];
      if (rec[2] === 2) store[ex.id][2] = 2;
      save();
      lockDone(msg);
      renderHead();
      if (pts > 0) FX.ok(bd, "+" + pts);
      checkBadges();
      setTimeout(function () { refreshStation(ex.id); }, 350);
    }
    function lockDone(msg) {
      R.showSolution(); R.lock && R.lock();
      bCheck.hidden = true; bSol.hidden = true;
      var r = store[ex.id];
      stat.textContent = r[2] === 2 ? "Lösung angezeigt – " + (PRO ? "keine Sterne" : "0 Punkte") : PRO ? "gelöst – " + "★".repeat(r[0]) : "gelöst – " + r[0] + " von " + MAXP + " Punkten";
      if (msg) ctl.fb(r[2] === 2 ? "sol" : "ok", msg);
    }
    function win(msg) {
      var pts = PRO ? (rec[1] === 1 ? 3 : rec[1] === 2 ? 2 : 1) : (rec[1] === 1 ? MAXP : rec[1] === 2 ? Math.round(MAXP * 0.6) : Math.round(MAXP * 0.3));
      store[ex.id] = [pts, rec[1], 1];
      save();
      lockDone(msg || "Richtig!");
      renderHead();
      FX.ok(bd, PRO ? "+" + pts + " ★" : "+" + pts);
      checkBadges();
      setTimeout(function () { refreshStation(ex.id); }, R.delay || 900);
    }
    bCheck.onclick = function () {
      var res = R.check();
      if (!res) return;
      if (res.incomplete) { ctl.fb("no", res.msg); return; }
      rec[1]++;
      store[ex.id] = [0, rec[1], 0];
      if (res.ok) win(res.msg);
      else {
        save();
        FX.no();
        ctl.fb("no", res.msg || "Noch nicht ganz richtig. Versuche es noch einmal.");
        if (rec[1] >= 2) bSol.hidden = false;
      }
    };
    bSol.onclick = function () {
      store[ex.id] = [0, rec[1], 2]; rec[2] = 2; save();
      lockDone("Hier ist die Lösung. Schau sie dir genau an – dann geht es weiter.");
      renderHead();
      setTimeout(function () { refreshStation(ex.id); }, 1200);
    };
    if (rec[2]) { setTimeout(function () { lockDone(null); }, 0); }
    else if (rec[1] >= (R.auto ? (ex.solAfter || 3) : 2)) bSol.hidden = false;
    if (R.init) R.init();
    return c;
  }
  function nextAnchor(id, si) {
    var ids = EXLIST.filter(function (e) { return e.si === si; }).map(function (e) { return e.id; });
    var k = ids.indexOf(id);
    if (k > -1 && k + 1 < ids.length) return null;
    return "done-" + ST[si].id;
  }

  // ---------------------------------------------------------------- Übungstypen
  var TYPES = {};

  // Sortieren (antippen + Feld; Drag & Drop am PC)
  TYPES.sort = function (body, ex) {
    var sel = null;
    var order = shuffle(ex.items.map(function (x) { return x.id; }), ex.id, function (a) {
      var sol = ex.items.slice().sort(function (p, q) { return ex.bins.map(function (b) { return b.id; }).indexOf(p.bin) - ex.bins.map(function (b) { return b.id; }).indexOf(q.bin); }).map(function (x) { return x.id; });
      return sameOrder(a, ex.items.map(function (x) { return x.id; })) || sameOrder(a, sol);
    });
    var pool = el("div", "pool"); body.appendChild(pool);
    body.appendChild(el("p", "note", "Karte antippen, dann ein Feld antippen (am PC auch ziehen)."));
    var bins = el("div", "bins"); body.appendChild(bins);
    var chips = {};
    order.forEach(function (id) {
      var it = ex.items.filter(function (x) { return x.id === id; })[0];
      var ch = el("div", "chip", (it.ion ? IONICO[it.ion] : "") + "<span>" + it.label + "</span>");
      ch.draggable = true; ch.dataset.id = id;
      ch.onclick = function (e) { e.stopPropagation(); if (locked) return; if (sel) sel.classList.remove("sel"); sel = (sel === ch ? null : ch); if (sel) sel.classList.add("sel"); };
      ch.addEventListener("dragstart", function (e) { if (locked) return; sel = ch; e.dataTransfer.setData("text/plain", id); });
      chips[id] = ch; pool.appendChild(ch);
    });

  TYPES.ionbuild = function (body, ex) {
    body.appendChild(el("p", "note", "„− e<sup>−</sup>“ gibt ein Elektron ab, „+ e<sup>−</sup>“ nimmt eines auf. Mit ↺ startest du wieder beim Atom."));
    var rows = [], lk = false;

    function noble(a) { a = trim(a); var n = a.length; return n > 0 && a[n - 1] === (n === 1 ? 2 : 8); }

      function draw(change) {
        var L = Math.max(trim(a.e).length, trim(st.e).length, 1), H = 30, ys = [], y = 0, k;
        for (k = 0; k < L; k++) { y += k ? GAP[k] : 0; ys.push(y); }
        H = ys[L - 1] + 54;
        var s = '<svg viewBox="0 0 330 ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Energiestufenmodell">';
        s += '<line x1="18" y1="' + (H - 8) + '" x2="18" y2="10" stroke="#1F3A5F" stroke-width="2"/><polygon points="18,4 13,14 23,14" fill="#1F3A5F"/>';
        s += '<text x="26" y="16" font-size="12" fill="#5B6B7C" font-family="Calibri, Carlito, sans-serif">Energie</text>';
        for (k = 0; k < L; k++) {
          var ly = H - 22 - ys[k];
          s += '<line x1="30" y1="' + ly + '" x2="262" y2="' + ly + '" stroke="#8DB0D8" stroke-width="3" stroke-linecap="round"/>';
          s += '<text x="270" y="' + (ly + 4) + '" font-size="13" font-style="italic" fill="#1F3A5F" font-family="Calibri, Carlito, sans-serif">n = ' + (k + 1) + "</text>";
          var n = st.e[k] || 0, x0 = 146 - (n - 1) * 9;

            var last = change === "+" && k === trim(st.e).length - 1 && j === n - 1;
            s += '<circle class="' + (last ? "ein" : "") + '" cx="' + (x0 + j * 18) + '" cy="' + (ly - 8) + '" r="5.5" fill="#2F5D8C"/>';
          }
          if (change && change.k === k) s += '<circle class="eout" cx="' + (x0 + n * 18) + '" cy="' + (ly - 8) + '" r="5.5" fill="#E0662B"/>';
        }

          (q === 0 ? "ungeladenes Atom: " + fmt(String(a.sym)) : "Ion: " + ionHtml(String(a.sym), q) + " (Ladung " + Math.abs(q) + (q > 0 ? "+" : MINUS) + ")") + "</span>";
        r.classList.remove("good", "bad");

      };

    });
    return {
      check: function () {
        var msg = [], wrong = 0;
        rows.forEach(function (x) {
          if (same(x.st.e, x.a.sol)) { x.r.classList.add("good"); return; }
          wrong++; x.r.classList.add("bad");

  GAMES.memory = function (body, b, finish, result) {

  GAMES.blitz = function (body, b, finish, result) {

          a(perfect ? !!it.ok : !it.ok);

  function bossSvg() {
    return '<svg viewBox="0 0 160 120" class="fig bossfig" aria-hidden="true"><g stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round">' +
      '<path d="M30,60 q-14,-10 -24,4"/><path d="M130,60 q14,-10 24,4"/><path d="M50,96 q-6,14 -18,16"/><path d="M110,96 q6,14 18,16"/></g>' +

  GAMES.boss = function (body, b, finish, result) {

    }
    function start() { lives = maxL; hp = b.qs.length; queue = shuffle(range(b.qs.length), b.id + "q" + Math.random()); next(); }
    function next() {
      clearTimeout(tmr);

      stage.innerHTML = hud() + '<div class="bossw">' + (b.fig && F[b.fig] ? F[b.fig].svg : bossSvg()) + '</div><p class="task">' + q.q + '</p><div class="bopts"></div><div class="fb"></div>';
      var bo = stage.querySelector(".bopts"), fb = stage.querySelector(".fb"), fig = stage.querySelector(".bossw");
      var ord = shuffle(range(q.options.length), b.id + queue[0] + Math.random(), function (a) { return a[0] === 0; });
      ord.forEach(function (oi) {
        var o = q.options[oi], bt = el("button", "bopt", o.text); bt.type = "button";
        bt.onclick = function () {

          bo.querySelectorAll("button").forEach(function (x) { x.disabled = true; });
          if (o.ok) {

            fig.classList.remove("hit"); void fig.offsetWidth; fig.classList.add("hit");
            fb.className = "fb ok"; fb.innerHTML = "Treffer! " + (o.fb || "");

          } else {
            bt.classList.add("bad"); lives--; queue.push(queue.shift()); FX.no();

    }
    function win() {

    }
    function lose() {
      stage.innerHTML = '<div class="gres"><p><b>' + (b.loseMsg || "Diesmal hat der Boss gewonnen.") + "</b> Schau dir die Erklärungen noch einmal an und versuche es erneut.</p></div>";
      var bt = el("button", "btn", "↺ Neuer Versuch"); bt.type = "button"; bt.onclick = start; stage.querySelector(".gres").appendChild(bt);
    }
    function intro() {
      stage.innerHTML = '<div class="bossw">' + (b.fig && F[b.fig] ? F[b.fig].svg : bossSvg()) + '</div><p class="note">' + b.qs.length + " Fragen, " + maxL + " Leben. Jede richtige Antwort ist ein Treffer, jede falsche kostet ein Leben.</p>";
      var go = el("button", "btn", "▶ Kampf beginnen"); go.type = "button"; go.onclick = start; stage.appendChild(el("div", "btns")).appendChild(go);
    }

    return {
      play: function (perfect) {
        start();
        for (var g = 0; g < 200 && stage._q; g++) {
          var q = stage._q, bo = stage._bo; stage._q = null;
          var btn = Array.prototype.slice.call(bo.querySelectorAll("button")).filter(function (x) { var o = q.options.filter(function (o) { return plain(o.text) === x.textContent; })[0]; return o && (perfect ? o.ok : !o.ok); })[0];
          btn.click();

  };

      '<button type="button" class="btn intro-go">' + LB.introGo + " →</button></div></div>";

    introTimers.push(setTimeout(function () { var g = ov.querySelector(".intro-go"); if (g) try { g.focus({ preventScroll: true }); } catch (e) { } }, at * 1000 + 300));

  // ---------------------------------------------------------------- Lehrkraft-Bereich
  function sha256(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var mp = Math.pow, maxWord = mp(2, 32), res = "", words = [], bl = ascii.length * 8, hash = [], k = [], pc = 0, isC = {};
    for (var cand = 2; pc < 64; cand++) { if (!isC[cand]) { for (var i = 0; i < 313; i += cand) isC[i] = cand; hash[pc] = (mp(cand, .5) * maxWord) | 0; k[pc++] = (mp(cand, 1 / 3) * maxWord) | 0; } }
    hash = hash.slice(0, 8);
    ascii = unescape(encodeURIComponent(ascii)); bl = ascii.length * 8;
    ascii += "\x80"; while (ascii.length % 64 - 56) ascii += "\x00";
    for (i = 0; i < ascii.length; i++) { var j = ascii.charCodeAt(i); words[i >> 2] |= j << ((3 - i) % 4) * 8; }
    words[words.length] = ((bl / maxWord) | 0); words[words.length] = (bl);
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), oh = hash; hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oh[i]) | 0;
    }
    for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; res += ((b < 16) ? 0 : "") + b.toString(16); }
    return res;
  }

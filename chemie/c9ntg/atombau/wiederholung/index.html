:root{
  /* Farbpalette Chemie (Skill chemie-lerneinheit, Abschnitt 5) */
  --navy:#1F3A5F; --ink:#22313F; --muted:#5B6B7C; --bg:#F6F9FD; --card:#EEF4FB; --line:#C9D9EE; --badge:#2F5D8C;
  --blue:#2F5D8C; --blue2:#3D73AD; --pastel:#DDE8F5; --light:#EEF4FB;
  --signal:#E0662B; --signal-d:#B5470F; --signal-l:#FFF1E8; --ok:#1E7B4F; --ok-l:#E6F4EC; --err:#B42318; --err-l:#FDECEA;
  /* Feldtypen */
  --info:#2F5D8C; --info-bg:#FFFFFF; --info-line:#C9D9EE;
  --ex:#3D73AD; --ex-bg:#E4EFFB; --ex-line:#8DB0D8;
  --merke:#E0662B; --merke-bg:#FFF1E8;
  --bgr:#7B72BF; --bgr-bg:#EFEDF8; --bgr-line:#8F86C9;
  --head:"Cambria","Caladea",Georgia,serif; --body:"Calibri","Carlito","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--head);color:var(--navy);margin:0 0 .4em;line-height:1.2}
button,select,input,textarea{font-family:var(--body);font-size:16px}
sub,sup{font-size:.72em;line-height:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#1F3A5F,#2F5D8C);color:#fff;box-shadow:0 2px 8px rgba(20,40,70,.25)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}
.brand .logo{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand .logo .ico{width:24px;height:24px}
.brand b{font-family:var(--head);font-size:19px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{opacity:.85;font-size:13.5px;display:block}
.nav{display:flex;gap:6px;align-items:center}
.nav button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.nav button:hover{background:rgba(255,255,255,.26)}
.nav button[hidden]{display:none}
.score{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:150px}
.score .pts{font-weight:700}
.bar{width:150px;height:8px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:#F6B08C;width:0;transition:width .6s}
.stamps{display:flex;gap:3px}
.stamps span{width:19px;height:19px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.6);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:transparent}
.stamps span.on{background:#F6B08C;border:1.5px solid #fff;color:#1F3A5F}
main{padding:18px 0 40px}
/* Karten */
.card{background:#fff;border-radius:16px;padding:16px 18px;margin:14px 0;box-shadow:0 1px 3px rgba(31,58,95,.08);position:relative}
.blk{display:flex;gap:12px;align-items:flex-start}
.badge{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.badge .ico{width:22px;height:22px}
.blk .bd{flex:1;min-width:0}
.kicker{font-size:13px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.info{background:var(--info-bg);border:1px solid var(--info-line)}
.info .badge{background:var(--info)} .info .kicker{color:var(--info)}
.ex{background:var(--ex-bg);border:1px solid var(--ex-line)}
.ex .badge{background:var(--ex)} .ex .kicker{color:var(--blue)}
.merke{background:var(--merke-bg);border:2px solid var(--merke);box-shadow:4px 4px 0 rgba(224,102,43,.2)}
.merke .badge{background:var(--merke)} .merke .kicker{color:var(--signal-d)}
.bgr{background:var(--bgr-bg);border:2px dashed var(--bgr-line)}
.bgr .badge{background:var(--bgr)} .bgr .kicker{color:#5B52A3}  /* Kicker-Text dunkler als der Badge: Kontrast mindestens 4,5 : 1 */
.story{background:var(--card);border:1px solid var(--line)}
.story .badge{background:var(--navy)}
.scene{margin:2px 0 10px}
.scene svg{width:100%;height:auto;display:block;max-width:720px}
.lead{font-size:18px;margin:.2em 0 .5em}
.bd p{margin:.45em 0}
.bd ul{margin:.4em 0;padding-left:1.25em}
.bd li{margin:.3em 0}
.op{display:inline-block;background:var(--ex);color:#fff;border-radius:10px;padding:0 8px;font-size:13.5px;font-weight:700;margin-right:6px}
.task{font-weight:700;margin:.2em 0 .7em}
.figwrap{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.figwrap svg.fig{width:100%;height:auto;display:block;max-width:var(--fw)}
.swipe{display:none;font-size:13px;color:var(--muted);margin-top:-4px}
.figwrap.scroll + .swipe{display:block}
.photo{margin:10px 0}
.photo img{max-width:min(100%,430px);height:auto;border-radius:10px;display:block}
.photo.small img{max-width:min(100%,220px)}
.photo figcaption a{color:inherit}
.photo figcaption,.cap{font-size:13.5px;color:var(--muted);margin-top:4px}
table.t{border-collapse:collapse;width:100%;margin:8px 0;background:#fff;font-size:16px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
table.t th{background:var(--pastel);font-weight:700}
.tscroll{overflow-x:auto}
.ghsrow{display:flex;gap:4px;flex-wrap:wrap}
.ghsrow svg{width:40px;height:40px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0;font-size:15px}
.legend span{display:flex;align-items:center;gap:6px}
.legend svg{width:38px;height:38px}
/* Buttons */
.btn{background:var(--blue);color:#fff;border:none;border-radius:22px;padding:8px 18px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.signal{background:var(--signal-d)}   /* weiße Schrift: Signal dunkel für 4,5 : 1 */
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
/* Animation neu abspielen */
.replaybar{display:flex;margin:6px 0 10px}
.replaybar[hidden]{display:none}
.btn.replay{padding:5px 14px;font-size:14.5px;font-weight:600}
.fb{margin-top:10px;padding:8px 12px;border-radius:10px;display:none}
.fb.ok{display:block;background:var(--ok-l);border:1px solid #9BD3B3;color:#1B5E3E}
.fb.no{display:block;background:var(--err-l);border:1px solid #EBB0A8;color:#8E2A1F}
.fb.sol{display:block;background:#FFF8E6;border:1px solid #F0D48A;color:#6B4E00}
.status{font-size:14px;color:var(--ok);font-weight:700}
/* Sortieren */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:8px;border-radius:12px;background:rgba(255,255,255,.6);border:1.5px dashed var(--ex-line)}
.chip{background:#fff;border:1.5px solid var(--ex-line);border-radius:12px;padding:6px 10px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;font-size:16px;max-width:100%}
.chip.sel{border-color:var(--signal);box-shadow:0 0 0 3px rgba(224,102,43,.25)}
.chip.bad{border-color:var(--err);background:var(--err-l)}
.chip.good{border-color:var(--ok);background:var(--ok-l)}
.chip .ionico{width:40px;height:auto;flex:none}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.bin{background:#fff;border:2px solid var(--ex-line);border-radius:14px;min-height:90px;padding:6px;cursor:pointer}
.bin.hot{border-color:var(--signal);background:#FFF9F4}
.bin h4{font-family:var(--body);font-size:15.5px;margin:2px 4px 6px;color:var(--navy);display:flex;align-items:center;gap:8px}
.bin h4 svg{width:42px;height:42px}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
/* MC */
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.opt input{margin-top:4px;transform:scale(1.2)}
.opt.good{border-color:var(--ok);background:var(--ok-l)}
.opt.bad{border-color:var(--err);background:var(--err-l)}
.opt .ofb{display:block;font-size:14.5px;margin-top:3px;color:var(--muted)}
/* Formel-Baukasten */
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:#fff;border-radius:12px;padding:8px 12px;margin:8px 0;border:1.5px solid var(--line)}
.frow .nm{font-weight:700;min-width:150px}
.cnt{display:flex;align-items:center;gap:5px}
.cnt button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;cursor:pointer}
.cnt .ionbox{min-width:62px;text-align:center;padding:3px 8px;border-radius:8px;background:var(--pastel);font-weight:700}
.cnt .n{font-weight:700;min-width:20px;text-align:center}
.fprev{font-size:20px;font-weight:700;color:var(--navy);min-width:90px}
.frow.good{border-color:var(--ok);background:var(--ok-l)} .frow.bad{border-color:var(--err);background:var(--err-l)}
/* Gleichung */
.eqsides{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.eqside{background:#fff;border:2px solid var(--ex-line);border-radius:12px;min-height:70px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;cursor:pointer}
.eqside.act{border-color:var(--signal);background:#FFF9F4}
.eqside .lbl{width:100%;font-size:13px;color:var(--muted);font-weight:700}
.eqarrow{align-self:center;font-size:28px;color:var(--navy)}
.term{display:flex;align-items:center;gap:2px;background:var(--pastel);border-radius:9px;padding:2px 4px;font-size:16px}
.term button{border:none;background:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:700;color:var(--blue);padding:0}
.term .k{font-weight:700;min-width:12px;text-align:center}
.plus{color:var(--muted)}
.eqtiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.eqout{margin-top:8px;font-size:17px;background:#fff;border-radius:10px;padding:6px 10px;border:1px solid var(--line);min-height:36px}
/* Simulation */
.rack{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;background:linear-gradient(#2F5D90,#23466F);border-radius:14px;padding:14px 8px 6px;overflow-x:auto;position:relative}
.rack .tb{display:flex;flex-direction:column;align-items:center;min-width:76px;position:relative}
.rack .tb svg{width:74px;height:auto}
.rack .tb .tl{font-weight:700;font-size:14px;color:#fff}
.rack .tb .ts{font-size:13px;color:#D6E6F7;text-align:center;line-height:1.15;min-height:30px}
.drip{position:absolute;top:-4px;left:50%;margin-left:-8px;width:16px;opacity:0}
.drip.go{animation:drip 1s ease}
@keyframes drip{0%{opacity:0;transform:translateY(-14px)}20%{opacity:1}80%{opacity:1;transform:translateY(8px)}100%{opacity:0;transform:translateY(8px)}}
.liq{transform-box:fill-box;transform-origin:50% 100%}
.liq.rise{animation:rise .9s ease}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.fade{animation:fadein 1.1s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.bub circle{animation:bub 1.6s linear infinite}
@keyframes bub{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-28px);opacity:0}}
.steps{margin-top:12px}
.steplog{margin:8px 0 0;padding-left:1.2em;font-size:15.5px;color:var(--muted)}
.steplog li.done{color:var(--ink)}
.stepopts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.stepopts button{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.stepopts button:hover{border-color:var(--blue)}
.obs select{width:100%;min-width:150px;padding:4px;border-radius:8px;border:1.5px solid var(--ex-line);background:#fff}
.obs td.good select{border-color:var(--ok);background:var(--ok-l)}
.obs td.bad select{border-color:var(--err);background:var(--err-l)}
.note{font-size:14px;color:var(--muted)}
/* Regler */
.sl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.sl input[type=range]{flex:1;min-width:200px;accent-color:var(--signal)}
.sl .val{font-size:22px;font-weight:700;color:var(--navy);min-width:110px}
.slref{display:inline-flex;gap:16px;align-items:flex-end;flex-wrap:wrap;background:linear-gradient(#2F5D90,#23466F);border-radius:14px;padding:12px 16px 8px;color:#fff}
.slref .tb{text-align:center;font-size:14px}
.slref svg{width:70px}
/* Fließdiagramm */
.flow{display:grid;grid-template-columns:minmax(150px,1fr) minmax(150px,1fr);gap:8px 14px;align-items:center;margin-top:10px}
.fbox{background:#fff;border:2px solid var(--navy);border-radius:10px;padding:6px 10px;text-align:center;font-weight:700}
.fq{background:var(--pastel);border:2px solid var(--blue);border-radius:30px;padding:6px 10px;text-align:center;font-size:15px}
.slot{background:#fff;border:2px dashed var(--signal);border-radius:10px;min-height:40px;padding:6px 8px;text-align:center;cursor:pointer;font-size:15.5px;display:flex;align-items:center;justify-content:center}
.slot.filled{border-style:solid;border-color:var(--blue)}
.slot.good{border-color:var(--ok);background:var(--ok-l)}.slot.bad{border-color:var(--err);background:var(--err-l)}
.slot.res{border-radius:30px}
.farr{text-align:center;color:var(--navy);font-size:15px;font-weight:700}
.farr .a{font-size:22px;line-height:1}
.flow .full{grid-column:1/-1}
.flow .lab{font-size:13px;color:var(--muted);text-align:center}
/* Matrix */
.matrix td{text-align:center}.matrix td:first-child{text-align:left;font-weight:700}
.matrix th svg{width:44px;height:44px;display:block;margin:auto}
.matrix input{transform:scale(1.5)}
.matrix td.good{background:var(--ok-l)}.matrix td.bad{background:var(--err-l)}
/* Labor */
.bench{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bench>div{min-width:0}
.bottles{display:flex;gap:8px;flex-wrap:wrap}
.bottle{background:#fff;border:2px solid var(--ex-line);border-radius:12px;padding:4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-weight:700}
.bottle.sel{border-color:var(--signal);box-shadow:0 0 0 3px rgba(224,102,43,.2)}
.bottle svg{width:34px;height:46px}
.tests{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.tests button{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:7px 11px;cursor:pointer}
.tests button.sel{border-color:var(--signal);background:#FFF9F4}
.labres{display:flex;gap:12px;align-items:center;background:linear-gradient(#2F5D90,#23466F);color:#fff;border-radius:12px;padding:10px;min-height:140px}
.labres .note{color:#D6E6F7}
.labres svg{width:60px;flex:none}
.journal td,.journal th{font-size:14.5px}
/* Concept-Map */
.cmapw{position:relative;width:100%;min-width:640px}
.cmapw svg{width:100%;height:auto;display:block}
.cmapw select{position:absolute;transform:translate(-50%,-50%);width:23%;padding:5px;border-radius:10px;border:2px dashed var(--signal);background:#fff;font-weight:700;font-size:15px}
.cmapw select.good{border:2px solid var(--ok);background:var(--ok-l)}.cmapw select.bad{border:2px solid var(--err);background:var(--err-l)}
/* Freitext */
textarea{width:100%;min-height:110px;border-radius:12px;border:1.5px solid var(--ex-line);padding:8px 10px;resize:vertical}
.model{background:#fff;border-left:4px solid var(--blue);padding:8px 12px;border-radius:8px;margin:10px 0}
.checklist label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
.checklist input{margin-top:4px;transform:scale(1.2)}
/* Laborplan */
.intro .bd p{margin:.3em 0}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:6px}
.stc{background:#fff;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;border:2px solid var(--line);text-align:left;width:100%;color:var(--ink)}
.stc:hover{border-color:var(--blue)}
.stc .badge{width:52px;height:52px;background:var(--blue)}
.stc .badge .ico{width:30px;height:30px}
.stc .t1{font-size:13.5px;color:var(--muted);font-weight:700}
.stc .t2{font-family:var(--head);font-size:18px;color:var(--navy)}
.stc .t3{font-size:13.5px;color:var(--muted)}
.stc.lock{opacity:.55;cursor:not-allowed}
.stc.lock .badge{background:#8FA3BA}
.stc.done .badge{background:var(--ok)}
.stc .stamp{margin-left:auto;width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:transparent;flex:none}
.stc.done .stamp{background:#F6B08C;border:2px solid var(--signal);color:var(--navy);transform:rotate(-12deg)}
.sthead{display:flex;gap:12px;align-items:center;margin-top:6px}
.sthead .badge{width:56px;height:56px;background:var(--navy)}
.sthead .badge .ico{width:32px;height:32px}
.sthead .t1{font-size:14px;color:var(--muted);font-weight:700}
.sthead h2{margin:0}
.back{background:none;border:none;color:var(--blue);cursor:pointer;font-weight:700;padding:0;font-size:16px}
.done-card{text-align:center;background:#fff;border:2px solid var(--ok)}
.done-card .big{font-size:44px;width:76px;height:76px;margin:6px auto;border-radius:50%;background:#F6B08C;border:3px solid var(--signal);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;color:var(--navy);transform:rotate(-12deg)}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(20,35,55,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;max-width:720px;width:100%;padding:18px;position:relative}
.modal .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:26px;cursor:pointer;color:var(--muted)}
.kartei{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kartei .col{border-radius:12px;padding:8px 10px}
.kartei .gut{background:#EAF6EF;border:1.5px solid #9BD3B3}
.kartei .schwer{background:#FFF3EA;border:1.5px solid #F0B48C}
.kartei h4{font-family:var(--body);margin:0 0 6px}
.kartei ul{list-style:none;padding:0;margin:0}
.kartei li{padding:3px 0;border-bottom:1px dotted #ccd}
/* Fußzeile */
footer{background:#fff;border-top:1px solid var(--line);padding:14px 0;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
footer button{background:none;border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer;color:var(--muted)}
.tpanel{display:none;margin-top:10px}
.tpanel.on{display:block}
.tpanel input{padding:6px 10px;border-radius:10px;border:1.5px solid var(--ex-line)}
/* Ausweis */
.cert{border:3px solid var(--navy);border-radius:18px;padding:22px;background:linear-gradient(135deg,#fff,#EAF2FB);text-align:center}
.cert h2{font-size:30px}
.cert .nm{font-size:28px;font-family:var(--head);color:var(--signal);border-bottom:2px solid var(--pastel);display:inline-block;min-width:60%;margin:8px 0}
.cert .code{letter-spacing:.3em;font-weight:700;font-size:22px;color:var(--navy)}
@media print{
  body *{visibility:hidden}
  #certPrint,#certPrint *{visibility:visible}
  #certPrint{position:absolute;left:0;top:0;width:100%}
  .top,footer{display:none}
}

td.psz{font-size:14px;color:var(--muted)}

/* Legende der Feldtypen auf der Startseite */
.flegend{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin:16px 0 6px;font-size:15px;color:var(--muted,#5B6B7C)}
.flegend .fl{display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:999px}
.flegend .fl .badge{width:30px;height:30px}.flegend .fl .badge .ico{width:17px;height:17px}
.flegend .fl .kicker{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;margin:0}
.flegend .merke{box-shadow:2px 2px 0 rgba(0,0,0,.12)}

/* Lösungswort */
.lw{letter-spacing:.18em;font-size:1.1em;white-space:nowrap}
.lwhint{margin:-4px 0 10px}

/* ================= Spielelemente (Codeschloss, Wimmelbild, Abzeichen, Minispiele, Effekte, Profi-Pfad) ================= */
/* --gold-d: Flächen (Badges, Knöpfe); --gold-t: Gold-Text (Bonus-Runde, Profi-/Minispiel-Kicker, Sterne), mind. 5,4 : 1 auf den Gold-Hintergründen */
:root{--gold:#E8B931;--gold-d:#7F5F0A;--gold-t:#7F5F0A;--gold-l:#FFF7DC;--gold-line:#E2C46A}
/* Kopfzeile: Sterne, Abzeichen, Ton */
.ptsrow{display:flex;gap:10px;align-items:center}
.hstars{display:inline-flex;align-items:center;gap:3px;font-weight:700;color:#FFE7A3}
.hstars[hidden]{display:none}
.hstars .ico{width:17px;height:17px}
.hstars .ico polygon{fill:#FFD45C}
.nav .cnt{font-weight:700;font-size:14px;min-width:12px}
#btnSound{padding:5px 8px}
/* Profi-Pfad und Bonus-Runde */
.bonus{margin:18px 0 6px;padding:12px 14px 4px;border-radius:18px;background:repeating-linear-gradient(135deg,#FFFBEC,#FFFBEC 14px,#FFF6D9 14px,#FFF6D9 28px);border:2px solid var(--gold-line)}
.bonushead{display:flex;gap:10px;align-items:center}
.bonushead .badge{background:var(--gold)}
.bonushead h3{margin:0;color:var(--gold-t)}
.bonushead .note{margin:2px 0 0}
.ex.profi{background:var(--gold-l);border:2px solid var(--gold)}
.ex.profi .badge{background:var(--gold)} .ex.profi .kicker{color:var(--gold-t)}
.ex.profi .op{background:var(--gold-d)}
.st{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.st .st0{color:#5B6B7C}   /* noch nicht erreichte Sterne, Kontrast mind. 4,5 : 1 */
.st.big{font-size:20px}
.tstar{color:var(--gold-t);font-weight:700;white-space:nowrap}
/* Minispiele */
.game{background:#fff;border:2px solid var(--gold-line)}
.game .badge{background:var(--gold-d)} .game .kicker{color:var(--gold-t)}
.gres{text-align:center;padding:8px 6px;background:var(--gold-l);border-radius:14px;margin-top:10px}
.gres .gst .st{font-size:34px;letter-spacing:4px}
.gres p{margin:.3em 0 .6em}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.mcard{position:relative;overflow-wrap:anywhere;hyphens:auto;min-height:86px;border-radius:12px;border:2px solid var(--navy);background:var(--blue);color:#fff;cursor:pointer;padding:6px;font-size:15px;line-height:1.25;transition:transform .25s,background .25s}
.mcard .mface{display:none}
.mcard .mback{font-family:var(--head);font-size:30px;font-weight:700;opacity:.85}
.mcard.open,.mcard.done{background:#fff;color:var(--ink);transform:rotateY(180deg)}
.mcard.open>span,.mcard.done>span{transform:rotateY(180deg)}
.mcard.open .mface,.mcard.done .mface{display:block}
.mcard.open .mback,.mcard.done .mback{display:none}
.mcard.b.open,.mcard.b.done{background:var(--card)}
.mcard.a .mface{font-weight:700;color:var(--navy)}
.mcard.ghs .mface svg{width:64px;height:64px;display:block;margin:0 auto}
.mcard.ghs.open,.mcard.ghs.done{padding:4px}
.mcard.done{border-color:var(--ok);box-shadow:0 0 0 3px rgba(30,123,79,.2);cursor:default}
.blitz .bq{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.blitz .bpos{font-size:13.5px;color:var(--muted);font-weight:700}
.blitz .btxt{font-size:19px;font-weight:700;margin:8px 0 12px;min-height:2.6em}
.blitz .bbtn{display:flex;gap:10px;flex-wrap:wrap}
.blitz .bbtn .btn{flex:1 1 140px;padding:12px;font-size:17px}
.blitz .btn.no{background:var(--signal-d)}
.blitz .btn.good{background:var(--ok)!important;opacity:1}.blitz .btn.bad{background:var(--err)!important;opacity:1}
.btime{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:10px}
.btime i{display:block;height:100%;background:var(--signal);animation:shrink linear forwards;transform-origin:left}
.btime.stop i{animation-play-state:paused}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.tchk{font-size:15px;display:flex;gap:6px;align-items:center;cursor:pointer}
.bhud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bname{font-family:var(--head);font-weight:700;color:var(--navy)}
.hp{flex:1;min-width:120px;height:12px;border-radius:7px;background:#F1DCD8;overflow:hidden;border:1px solid #E3B6AE}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#B42318,#E0662B);transition:width .5s}
.lives{display:flex;gap:2px}
.lives span .ico{width:22px;height:22px}
.lives span .ico path{fill:#D6CFC0}
.lives span.on .ico path{fill:#C8352B}
.bossw{display:flex;justify-content:center;margin:6px 0}
.bossw svg{width:150px;height:auto}
.bossw.hit svg{animation:bhit .45s}
.bossw.beaten svg{animation:beaten 1s forwards}
@keyframes bhit{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-6deg);filter:brightness(1.6)}50%{transform:translateX(9px) rotate(5deg)}75%{transform:translateX(-5px)}}
@keyframes beaten{to{transform:scale(.4) rotate(200deg);opacity:.15}}
.bopts{display:flex;flex-direction:column;gap:7px}
.bopt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;font-size:16px;color:var(--ink)}
.bopt:hover:not(:disabled){border-color:var(--navy)}
.bopt.good{border-color:var(--ok);background:var(--ok-l)}.bopt.bad{border-color:var(--err);background:var(--err-l)}
/* Codeschloss */
.clues{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 12px}
.clue{flex:1 1 230px;display:flex;gap:8px;align-items:flex-start;background:#FFFDF2;border:1px solid #E8DDB0;border-radius:4px;padding:9px 11px;box-shadow:2px 3px 0 rgba(120,100,40,.12);transform:rotate(-.6deg);font-size:15.5px}
.clue:nth-child(2n){transform:rotate(.7deg)}
.clue .ico{width:20px;height:20px;flex:none}
.clue .ico circle,.clue .ico path{stroke:var(--signal-d)}
.lockw{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,#F2F5F9,#E1E8F0);border:2px solid #B9C7D8;border-radius:16px;padding:12px}
.padw{text-align:center;flex:none}
.pl{width:84px;height:auto;display:block;margin:0 auto}
.pl .shackle{transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.lockw.open .pl .shackle{transform:translateY(-14px) translateX(24px) rotate(18deg);transform-origin:84px 62px}
.lobj{font-size:13px;font-weight:700;color:#4B5B6C;max-width:110px}
.wheels{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}

.sptools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.sptools[hidden]{display:none}
.sptool.on{background:var(--signal-d);border-color:var(--signal-d);color:#fff}
.spw svg.fig{max-width:var(--fw)}
.spw.tooling .seg,.spw.tooling .endz{cursor:pointer}
.spw.tooling .seg:hover rect{filter:brightness(1.08);stroke:var(--signal);stroke-width:3}

.rbw svg.fig{max-width:760px;margin:0 auto}

.rbacts{display:flex;flex-wrap:wrap;gap:6px}

.rbt{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:4px 10px 4px 4px;cursor:pointer;font-family:var(--body);font-size:13.5px;line-height:1.25;color:var(--ink);text-align:left}

.rblog{margin:0;padding-left:22px;font-size:15px}

@keyframes rbFrom{from{transform:translate(var(--dx,0px),var(--dy,0px));opacity:var(--o,0)}to{transform:none;opacity:1}}

/* ---- Thema der Einheit (theme.css) ---- */
/* Thema „Ziel erreicht? – Die Atom-Show“: Fernsehstudio mit Scheinwerfern, Rundentafel, Moderationskarten, Filmstreifen */
body{background:
  radial-gradient(ellipse 420px 260px at 12% -40px,rgba(141,176,216,.35),transparent 70%),
  radial-gradient(ellipse 420px 260px at 88% -40px,rgba(141,176,216,.35),transparent 70%),
  radial-gradient(ellipse 520px 300px at 50% -60px,rgba(246,176,140,.22),transparent 70%),
  #F6F9FD;background-attachment:fixed}
/* Kopfzeile als Studio-Traverse mit Lichterkette */
.top{background:linear-gradient(90deg,#0F1E33,#1F3A5F 55%,#2F5D8C)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;
  background:radial-gradient(circle at 6px 2.5px,#F6B08C 2px,transparent 2.6px) 0 0/16px 5px repeat-x,#1F3A5F}
/* Rundentafel statt Stationskopf */
.sthead{background:linear-gradient(180deg,#1F3A5F,#16294A);border-radius:14px;padding:12px 16px;border-bottom:5px solid #E0662B;
  box-shadow:0 4px 12px rgba(31,58,95,.25);margin-top:10px}

.sthead .badge{background:#2F5D8C;border:2px solid #F6B08C}
/* Ansage (Story) mit Szenenbild */
.story{background:#EEF4FB;border:1px solid #C9D9EE;border-left:6px solid #E0662B;border-radius:10px 16px 16px 10px}
/* Info-Felder als Moderationskarten */
.info{background:#FFFFFF;border:1px solid #C9D9EE;border-top:7px solid #2F5D8C;border-radius:6px 6px 18px 18px;
  box-shadow:0 8px 16px -8px rgba(31,58,95,.28)}
.info .kicker::after{content:" · Moderationskarte";font-weight:400;letter-spacing:0;text-transform:none;color:#5B6B7C}

.card.bgr{border:2px dashed #8F86C9;border-radius:10px;padding-top:28px;padding-bottom:28px;background:#EFEDF8;overflow:hidden}

.exc-down{animation:excDown 4.8s ease-in-out infinite}

@keyframes eflyout{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(170px,40px)}}

.burst{transform-box:fill-box;transform-origin:50% 50%;animation:burst 2.4s ease-out infinite}
@keyframes burst{0%{opacity:0;transform:scale(.15)}12%{opacity:1}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}

t": "4 Valenzelektronen – Silicium-Atom", "ok": false, "fb": "Zwischen der 3. und 4. Ionisierungsenergie gibt es keinen großen Sprung mehr."}]}]}, {"id": "s3", "nr": 3, "ort": "Pyro-Rampe", "title": "Flammenfärbung und Linienspektrum", "icon": "flame", "min": 6, "stempel": "O", "scene": "fig_sc_pyro", "story": "Für das große Finale plant die Pyrotechnik ein buntes Feuerwerk. Bevor die Effekte gefüllt werden, musst du erklären, woher die Farben kommen – und Salze anhand ihrer Flammenfarbe auseinanderhalten.", "blocks": [{"t": "info", "title": "Flammenfärbung", "kicker": "Kurz erinnert", "bullets": ["Die Flammenfarbe ist typisch für bestimmte <b>Metall-Kationen</b> – ein Nachweis für diese Kationen. Das Licht senden die daraus in der Flamme entstehenden Metall-Atome aus."], "fig": "fig_flammen"}, {"t": "info", "title": "Woher kommt das Licht?", "kicker": "Kurz erinnert", "bullets": ["In der Flamme entstehen aus den Metall-Kationen kurzzeitig <b>Metall-Atome</b>.", "<b>Energiezufuhr</b> hebt ein Elektron auf eine höhere, unbesetzte Stufe: <b>angeregter Zustand</b> (kein Abtrennen).", "Rückfall in den <b>Grundzustand</b> (niedrigste mögliche Stufen): Die Energiedifferenz wird als <b>Licht</b> abgegeben. Die Abstände sind typisch für die Atomart.", "Energie des Lichts: violett/blau &gt; grün &gt; gelb &gt; orange &gt; rot."], "fig": "fig_anregung", "side": true}, {"t": "ex", "id": "3a", "type": "order", "op": "Ordne", "task": "Ordne die Vorgänge bei der Flammenfärbung von Natriumchlorid in die richtige Reihenfolge.", "items": ["Natriumchlorid wird in die Brennerflamme gehalten.", "In der Flamme entstehen aus Natrium-Kationen kurzzeitig Natrium-Atome.", "Das Valenzelektron nimmt Energie auf und gelangt auf eine höhere Energiestufe.", "Das Elektron fällt auf seine ursprüngliche Energiestufe zurück (Grundzustand des Atoms).", "Die Energiedifferenz wird als gelb-oranges Licht abgegeben."]}, {"t": "info", "title": "Linienspektrum", "kicker": "Kurz erinnert", "bullets": ["Das ie II. Hauptgruppe und Helium leuchten – alle Atome mit zwei Valenzelektronen!"}, {"t": "info", "title": "1. Ionisierungsenergie im Periodensystem", "kicker": "Kurz erinnert", "bullets": ["In einer <b>Periode</b> tendenziell steigend: größere Kernladung, gleiche Stufe. In einer <b>Hauptgruppe</b> tendenziell fallend: höhere Stufe, stärker abgeschirmt.", "Edelgas-Atome: höchster Wert ihrer Periode; Alkalimetall-Atome: niedrigster Wert (Perioden 2 bis 4)."], "fig": "fig_ie_hkr"}, {"t": "ex", "id": "4b", "type": "select", "op": "Ordne", "fig": "fig_esm_abc", "task": "Ordne die Energiestufenmodelle a), b) und c) jeweils einer Hauptgruppe und einer Atomart zu.", "corner": "Modell", "cols": ["Hauptgruppe", "Atomart"], "colOpts": [["I", "II", "III", "VI", "VII", "VIII"], ["Natrium-Atom", "Magnesium-Atom", "Aluminium-Atom", "Schwefel-Atom", "Chlor-Atom", "Argon-Atom"]], "rows": [{"label": "a)", "sol": ["II", "Magnesium-Atom"]}, {"label": "b)", "sol": ["VIII", "Argon-Atom"]}, {"label": "c)", "sol": ["I", "Natrium-Atom"]}]}, {"t": "ex", "id": "4c", "type": "mc", "op": "Begründe", "fig": "fig_esm_abc", "task": "Begründe, welches der drei Atome a), b) und c) die niedrigste 1. Ionisierungsenergie hat.", "options": [{"text": "Atom c): Sein einziges Valenzelektron liegt auf derselben Energiestufe wie bei a) und b), wird aber von der kleinsten Kernladung angezogen.", "ok": true, "fb": "Richtig: Alle drei haben ihre Valenzelektronen auf n = 3; das Natrium-Atom hat mit 11 Protonen die kleinste Kernladung."}, {"text": "Atom c): Sein Valenzelektron befindet sich auf einer höheren Energiestufe als bei a) und b).", "ok": false, "fb": "Das Ergebnis stimmt, die Begründung nicht: Bei allen drei Atomen ist n = 3 die höchste besetzte Energiestufe."}, {"text": "Atom b): Es hat die meisten Valenzelektronen, deshalb lässt sich eines besonders leicht abgeben.", "ok": false, "fb": "Das Argon-Atom hat Edelgaskonfiguration – es hat die höchste 1. Ionisierungsenergie seiner Periode."}, {"text": "Atom a): Seine zwei Valenzelektronen stoßen sich ab und lassen sich deshalb am leichtesten abspalten.", "ok": false, "fb": "Das Magnesium-Atom hat eine größere Kernladung als das Natrium-Atom bei gleicher Energiestufe."}]}, {"t": "ex", "id": "4d", "type": "select", "op": "Vergleiche", "task": "Vergleiche die Atompaare H und Li, F und Cl sowie K und Ge mithilfe der Lichtwand. Ordne jeder Aussage alle Paare zu, auf die sie zutrifft.", "corner": "Aussage", "cols": ["trifft zu auf"], "colOpts": [["H und Li", "F und Cl", "K und Ge", "H und Li sowie F und Cl", "F und Cl sowie K und Ge", "auf keines der Paare"]], "rows": [{"label": "Das eine Atom besitzt drei Valenzelektronen mehr als das andere.", "sol": ["K und Ge"]}, {"label": "Die Atome haben unterschiedlich viele besetzte Energiestufen.", "sol": ["H und Li sowie F und Cl"]}, {"label": "Die Ordnungszahl des einen Atoms ist um mindestens vier größer.", "sol": ["F und Cl sowie K und Ge"]}, {"label": "Die Atome unterscheiden sich um genau zwei Protonen.", "sol": ["H und Li"]}, {"label": "Die Atome besitzen gleich viele Elektronen.", "sol": ["auf keines der Paare"]}, {"label": "Die Atome besitzen gleich viele Valenzelektronen.", "sol": ["H und Li sowie F und Cl"]}]}, {"t": "game", "id": "4g", "kind": "blitz", "title": "Blitzrunde: Stimmt das?", "zeit": 8, "items": [{"text": "Die Ordnungszahl gibt die Anzahl der Protonen an.", "ok": true}, {"text": "Isotope eines Elements haben unterschiedlich viele Protonen.", "ok": false, "fb": "Sie unterscheiden sich in der Neutronenzahl."}, {"text": "Die 2. Ionisierungsenergie eines Atoms ist größer als die 1.", "ok": true}, {"text": "Atome der VII. Hauptgruppe haben sieben Valenzelektronen.", "ok": true}, {"text": "Die Nummer der Periode gibt die Anzahl der Valenzelektronen an.", "ok": false, "fb": "Sie gibt die Anzahl der besetzten Energiestufen an."}, {"text": "Helium-Atome haben acht Valenzelektronen.", "ok": false, "fb": "Helium-Atome haben nur zwei Elektronen."}, {"text": "In einer Hauptgruppe sinkt die 1. Ionisierungsenergie von oben nach unten tendenziell ab.", "ok": true}, {"text": "Neutronen sind negativ geladen.", "ok": false, "fb": "Neutronen sind ungeladen."}, {"text": "Bei der Flammenfärbung wird ein Valenzelektron abgetrennt.", "ok": false, "fb": "Es wird nur angeregt und fällt wieder in den Grundzustand zurück."}, {"text": "Ein Kalium-Atom hat vier besetzte Energiestufen.", "ok": true}]}]}, {"id": "s5", "nr": 5, "ort": "Duellpulte", "title": "Edelgaskonfiguration und Ionen", "icon": "bolt", "min": 5, "stempel": "O", "scene": "fig_sc_duell", "story": "Duell an den Pulten: Kation gegen Anion! In dieser Runde zeigst du, welche Teilchen besonders stabil sind und welche Ionen die Atome bilden.", "blocks": [{"t": "info", "title": "Edelgaskonfiguration und Edelgasregel", "kicker": "Kurz erinnert", "bullets": ["<b>Edelgaskonfiguration:</b> 8 Elektronen auf der höchsten besetzten Stufe; ist nur n = 1 besetzt, 2 Elektronen (wie beim Helium-Atom) – besonders stabil.", "<b>Metall-Atome der I.–III. Hauptgruppe</b> geben Elektronen ab → <b>Kationen</b>, Ladungszahl = Hauptgruppennummer. <b>Atome der V.–VII. Hauptgruppe</b> nehmen Elektronen auf → <b>Anionen</b>, Ladungszahl = 8 − Hauptgruppennummer, Name auf -id. Immer der kürzeste Weg; Wasserstoff ist ausgenommen.", "Bei Ionen zählt man die Elektronen der höchsten besetzten Stufe: Na<sup>+</sup> hat 8 auf n = 2."], "fig": "fig_edelgasregel"}, {"t": "ex", "id": "5a", "type": "select", "op": "Gib an", "task": "Gib für jedes Teilchen die Anzahl der Elektronen auf der höchsten besetzten Energiestufe an und entscheide, ob es Edelgaskonfiguration hat.", "corner": "Teilchen", "cols": ["Elektronen auf der höchsten besetzten Stufe", "Edelgaskonfiguration?"], "colOpts": [["1", "2", "3", "7", "8"], ["ja", "nein"]], "rows": [{"label": "Mg<sup>2+</sup>", "sol": ["8", "ja"]}, {"label": "Cl<sup>−</sup>", "sol": ["8", "ja"]}, {"label": "Ar", "sol": ["8", "ja"]}, {"label": "Al<sup>2+</sup>", "sol": ["1", "nein"]}, ht O<sup>2−</sup>."}], "doneMsg": "Die Halogene leuchten – ihre Atome bilden Anionen mit der Ladung 1−!"}, {"t": "ex", "id": "5p", "profi": true, "type": "mc", "multi": true, "op": "Ermittle", "task": "Ermittle alle Teilchen, die dieselbe Elektronenkonfiguration haben wie ein Neon-Atom.", "options": [{"text": "Na<sup>+</sup>", "ok": true, "fb": "Richtig: 1<sup>2</sup> 2<sup>8</sup>."}, {"text": "F<sup>−</sup>", "ok": true, "fb": "Richtig: 9 + 1 = 10 Elektronen, 1<sup>2</sup> 2<sup>8</sup>."}, {"text": "Mg<sup>2+</sup>", "ok": true, "fb": "Richtig: 12 − 2 = 10 Elektronen."}, {"text": "K<sup>+</sup>", "ok": false, "fb": "Kalium-Ionen haben 18 Elektronen (1<sup>2</sup> 2<sup>8</sup> 3<sup>8</sup>) wie ein Argon-Atom."}, {"text": "Cl<sup>−</sup>", "ok": false, "fb": "Chlorid-Ionen haben 18 Elektronen wie ein Argon-Atom."}, {"text": "Li<sup>+</sup>", "ok": false, "fb": "Lithium-Ionen haben nur 2 Elektronen (1<sup>2</sup>) wie ein Helium-Atom."}]}, {"t": "game", "id": "5g", "kind": "boss", "title": "Boss-Runde: Das große Fragezeichen", "name": "Das große Fragezeichen", "fig": "fig_boss", "leben": 3, "winMsg": "Das große Fragezeichen ist gelöst – alle Fragen beantwortet!", "loseMsg": "Das Fragezeichen bleibt diesmal stehen. Schau dir die Merke-Kästen an und versuch es noch einmal.", "qs": [{"q": "Wie viele Neutronen hat ein <sup>23</sup>Na-Atom?", "options": [{"text": "12", "ok": true}, {"text": "11", "ok": false, "fb": "11 ist die Protonenzahl."}, {"text": "23", "ok": false, "fb": "23 ist die Nukleonenzahl: Protonen + Neutronen."}]}, {"q": "Welche Elektronenkonfiguration hat ein Magnesium-Atom?", "options": [{"text": "1<sup>2</sup> 2<sup>8</sup> 3<sup>2</sup>", "ok": true}, {"text": "1<sup>2</sup> 2<sup>8</sup> 3<sup>1</sup>", "ok": false, "fb": "Das sind nur 11 Elektronen."}, {"text": "1<sup>2</sup> 2<sup>10</sup>", "ok": false, "fb": "n = 2 fasst höchstens 8 Elektronen."}]}, {"q": "Welche Flammenfarbe zeigt Natriumchlorid?", "options": [{"text": "gelb-orange", "ok": true}, {"text": "karminrot", "ok": false, "fb": "Lithiumchlorid färbt die Flamme karminrot."}, {"text": "grün", "ok": false, "fb": "Kupfer(II)-sulfat färbt die Flamme grün."}]}, {"q": "Welches Atom hat die höchste 1. Ionisierungsenergie der 3. Periode?", "options": [{"text": "Argon-Atom", "ok": true}, {"text": "Natrium-Atom", "ok": false, "fb": "Es hat die niedrigste."}, {"text": "Chlor-Atom", "ok": false, "fb": "Das Edelgas-Atom rechts daneben liegt noch höher."}]}, {"q": "Welches Ion bildet ein Sauerstoff-Atom nach der Edelgasregel?", "options": [{"text": "O<sup>2−</sup>", "ok": true}, {"text": "O<sup>2+</sup>", "ok": false, "fb": "Sauerstoff-Atome nehmen Elektronen auf."}, {"text": "O<sup>6+</sup>", "ok": false, "fb": "Zwei Elektronen aufnehmen ist der kürzere Weg."}]}, {"q": "Wie viele Valenzelektronen hat ein Phosphor-Atom?", "options": [{"text": "5", "ok": true}, {"text": "3", "ok": false, "fb": "Phosphor steht in der V. Hauptgruppe."}, {"text": "15", "ok": false, "fb": "15 ist die Ordnungszahl."}]}, {"q": "Welches Teilchen hat Edelgaskonfiguration?", "options": [{"text": "K<sup>+</sup>", "ok": true}, {"text": "Ca<sup>+</sup>", "ok": false, "fb": "Ein Valenzelektron ist noch übrig."}, {"text": "Al<sup>2+</sup>", "ok": false, "fb": "Ein Valenzelektron ist noch übrig."}]}]}]}, {"id": "s6", "nr": 6, "ort": "Siegertreppchen", "title": "Modelle im Vergleich – Finale", "icon": "trophy", "min": 5, "stempel": "N", "scene": "fig_sc_finale", "story": "Finale! Auf dem großen Bildschirm erscheinen zwei Darstellungen desselben Atoms. Vergleiche sie, meistere die Schlussrunde und hol dir deine Urkunde.", "blocks": [{"t": "info", "title": "Zwei Modelle – ein Atom", "kicker": "Kurz erinnert", "bullets": ["<b>Kern-Hülle-Modell:</b> positiv geladener Kern (hier mit seiner Ladung) und Hülle mit Elektronen.", "<b>Energiestufenmodell:</b> ordnet die Elektronen nach ihrer Energie; den Kern zeigt es nicht.", "Modelle vereinfachen – jedes hat Grenzen."], "fig": "fig_modelle_f"}, {"t": "ex", "id": "6a", "type": "mc", "op": "Ermittle", "task": "Ermittle, welche Atomart die beiden Modelle zeigen, und begründe deine Entscheidung.", "options": [{"text": "Fluor-Atom: Die Kernladung 9+ steht für 9 Protonen, und es sind 2 + 7 = 9 Elektronen.", "ok": true, "fb": "Richtig: Beide Modelle zeigen ein Atom mit der Ordnungszahl 9."}, {"text": "Neon-Atom: Auf n = 2 sind fast acht Elektronen.", "ok": false, "fb": "Neon-Atome haben 10 Protonen und 10 Elektronen – hier sind es 9."}, {"text": "Chlor-Atom: Es hat sieben Valenzelektronen.", "ok": false, "fb": "Sieben Valenzelektronen passen zur VII. Hauptgruppe, aber Chlor-Atome haben drei besetzte Energiestufen und 17 Protonen."}, {"text": "Sauerstoff-Atom: Die Kernladung 9+ bedeutet 8 Protonen und 1 Neutron.", "ok": false, "fb": "Neutronen sind ungeladen – die Kernladung 9+ stammt von 9 Protonen."}]}, {"t": "ex", "id": "6b", "type": "select", "op": "Beurteile", "fig": "fig_modelle_f", "task": "Beurteile für jeden Aspekt, ob die beiden hier abgebildeten Darstellungen ihn direkt zeigen.", "corner": "Aspekt", "cols": ["Kern-Hülle-Modell", "Energiestufenmodell"], "colOpts": [["ja", "nein"], ["ja", "nein"]], "rows": [{"label": "Vorhandensein von Elektronen", "sol": ["ja", "ja"]}, {"label": "Atomkern mit seiner Ladung (Anzahl der Protonen)", "sol": ["ja", "nein"]}, {"label": "Vorhandensein von Neutronen", "sol": ["nein", "nein"]}, {"label": "Energie der Elektronen", "sol": ["nein", "ja"]}, {"label": "Aufteilung in positiv geladenen Kern und negativ geladene Hülle", "sol": ["ja", "nein"]}]}, {"t": "ex", "id": "6c", "type": "cmap", "op": "Ordne", "task": "Ordne jedem freien Feld der Concept-Map den passenden Begriff zu."}, {"t": "quiz", "id": "6d", "title": "Schlussrunde", "qs": [{"id": "6d1", "op": "Beurteile", "task": "Beurteile die Aussage: „Das Energiestufenmodell zeigt, wie ein Atom wirklich aussieht.“", "options": [{"text": "Falsch: Es ist ein vereinfachtes Modell, das nur die Energie der Elektronen ordnet.", "ok": true, "fb": "Richtig: Modelle zeigen nur ausgewählte Eigenschaften."}, {"text": "Richtig: Die Elektronen sitzen tatsächlich auf Linien übereinander.", "ok": false, "fb": "Die Linien stehen für Energien, nicht für Orte im Atom."}, {"text": "Richtig: Es ist genauer als das Kern-Hülle-Modell und zeigt deshalb alles.", "ok": false, "fb": "Das Energiestufenmodell zeigt zum Beispiel den Atomkern gar nicht."}]}, {"id": "6d2", "op": "Gib an", "task": "Gib an, welches Ion ein Atom mit der Elektronenkonfiguration 1<sup>2</sup> 2<sup>8</sup> 3<sup>2</sup> nach der Edelgasregel bildet.", "options": [{"text": "Mg<sup>2+</sup>", "ok": true, "fb": "Richtig: 12 Elektronen → Magnesium-Atom; es gibt zwei Valenzelektronen ab."}, {"text": "Mg<sup>6−</sup>", "ok": false, "fb": "Zwei Elektronen abgeben ist der kürzere Weg."}, {"text": "Ne<sup>2+</sup>", "ok": false, "fb": "Das Atom hat 12 Protonen – es ist ein Magnesium-Atom."}, {"text": "Si<sup>2+</sup>", "ok": false, "fb": "Silicium-Atome haben 14 Elektronen."}]}]}, {"t": "cert"}]}], "GLOSSAR": [["Proton", "Positiv geladener Baustein im Atomkern (Ladung 1+)."], ["Neutron", "Ungeladener Baustein im Atomkern, etwa so schwer wie ein Proton."], ["Elektron", "Negativ geladener Baustein der Atomhülle (Ladung 1−), sehr viel leichter als Proton und Neutron."], ["Ordnungszahl", "Anzahl der Protonen im Atomkern; legt fest, zu welchem Element ein Atom gehört."], ["Nukleonenzahl", "Anzahl der Protonen und Neutronen im Atomkern zusammen."], ["Isotope", "Atome eines Elements mit gleicher Protonenzahl, aber unterschiedlicher Neutronenzahl."], ["Ionisierung", "Abspaltung eines Elektrons aus der Atomhülle; dabei entsteht ein positiv geladenes Ion."], ["Ionisierungsenergie", "Energie, die nötig ist, um ein Elektron aus der Atomhülle abzuspalten."], ["Angeregter Zustand", "Ein Elektron hat Energie aufgenommen und befindet sich auf einer höheren, sonst unbesetzten Energiestufe."], ["Grundzustand", "Energieärmster Zustand eines Atoms: Alle Elektronen besetzen       } else if (m[2]) { var on = !m[1]; if (m[2] === "sub" || m[2] === "sup") mode = on ? m[2] : ""; else if (m[2] === "b") bold = on; else ital = on; }

  }
  function optHtml(o) { return '<option value="' + esc(plain(o)) + '" data-h="' + esc(o) + '">' + esc(uni(o)) + "</option>"; }

  // ---------------------------------------------------------------- Zufall (deterministisch pro Übung)
  function rng(seedStr) {
    var h = 2166136261;
    for (var i = 0; i < seedStr.length; i++) { h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }

  }
  function sameOrder(a, b) { if (a.length !== b.length) return false; for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }

  // ---------------------------------------------------------------- Formeln
  function fmt(s) { return String(s).replace(/([A-Za-z\)])(\d+)/g, "$1<sub>$2</sub>"); }
  function qstr(q) { var a = Math.abs(q); return (a > 1 ? a : "") + (q > 0 ? "+" : MINUS); }
  function ionHtml(sym, q) { return fmt(sym) + "<sup>" + qstr(q) + "</sup>"; }

  // ---------------------------------------------------------------- Zustand / Speicher
  // ex: Pflichtübungen [Punkte, Versuche, Status]; px: Profi-Aufgaben [Sterne, Versuche, Status]; mg: Minispiele (beste Sternzahl); bd: Abzeichen (IDs, durch Komma getrennt)
  function normS(o) { o = o || {}; o.ex = o.ex || {}; o.px = o.px || {}; o.mg = o.mg || {}; o.bd = o.bd || ""; o.name = o.name || ""; o.loc = o.loc || ""; return o; }
  var S = normS({});
  var preview = false;
  var scorm = null;
  function findAPI(win) {
    var n = 0;
    while (win && n < 12) {
      try { if (win.API) return win.API; } catch (e) { }
      if (win.parent && win.parent !== win) { win = win.parent; n++; } else break;

  }
  function initScorm() {
    var api = findAPI(window);
    if (!api) { try { if (window.opener) api = findAPI(window.opener); } catch (e) { } }
    if (!api) return;
    try {
      if (String(api.LMSInitialize("")) !== "true") return;
      scorm = api;
      var st = api.LMSGetValue("cmi.core.lesson_status");
      if (!st || st === "not attempted") api.LMSSetValue("cmi.core.lesson_status", "incomplete");
      var nm = api.LMSGetValue("cmi.core.student_name") || "";
      if (nm.indexOf(",") > -1) { var p = nm.split(","); nm = (p[1] || "").trim() + " " + p[0].trim(); }
      var sd = api.LMSGetValue("cmi.suspend_data");
      if (sd) { try { var o = JSON.parse(sd); if (o && o.ex) S = normS(o); } catch (e) { } }
      if (nm && !S.name) S.name = nm.trim();
    } catch (e) { scorm = null; }
  }
  function load() {
    initScorm();
    if (!scorm) {
      try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); if (o && o.ex) S = normS(o); } } catch (e) { }
    }
    try { preview = sessionStorage.getItem(KEY + "_pv") === "1"; } catch (e) { }
  }
  function save() {
    var js = JSON.stringify(S);
    if (scorm) {
      try {
        scorm.LMSSetValue("cmi.suspend_data", js.slice(0, 3900));
        scorm.LMSSetValue("cmi.core.score.min", "0");
        scorm.LMSSetValue("cmi.core.score.max", "100");
        scorm.LMSSetValue("cmi.core.score.raw", String(Math.round(100 * points() / maxPoints())));
        scorm.LMSSetValue("cmi.core.lesson_location", S.loc || "");
        if (allDone()) scorm.LMSSetValue("cmi.core.lesson_status", "completed");
        scorm.LMSCommit("");
      } catch (e) { }
    } else {
      try { localStorage.setItem(KEY, js); } catch (e) { }
    }
  }
  window.addEventListener("pagehide", function () {
    if (scorm) { try { save(); scorm.LMSSetValue("cmi.core.exit", allDone() ? "" : "suspend"); scorm.LMSCommit(""); scorm.LMSFinish(""); scorm = null; } catch (e) { } }
  });

  // ---------------------------------------------------------------- Übungsliste
  var EXLIST = [], PXLIST = [], GMLIST = [];
  function isBonus(b) { return b.t === "game" || (b.t === "ex" && b.profi); }
  ST.forEach(function (st, si) {
    st.blocks.forEach(function (b) {
      if (b.t === "ex" && b.profi) { PXLIST.push({ id: b.id, si: si, type: b.type }); return; }
      if (b.t === "game") { GMLIST.push({ id: b.id, si: si, kind: b.kind }); return; }
      if (b.t === "ex") EXLIST.push({ id: b.id, si: si, type: b.type });

    });
  });
  function maxPoints() { return EXLIST.length * MAXP; }
  function points() { var p = 0; for (var k in S.ex) p += S.ex[k][0] || 0; return p; }
  function exDone(id) { return !!(S.ex[id] && S.ex[id][2]); }
  function stationDone(si) { return EXLIST.filter(function (e) { return e.si === si; }).every(function (e) { return exDone(e.id); }); }
  function allDone() { return ST.every(function (s, i) { return stationDone(i); }); }
  // Lernzirkel (META.zirkel = Stations-IDs): Diese Stationen sind frei wählbar, sobald alle Stationen davor geschafft sind;
  // Stationen danach öffnen erst, wenn alle vorherigen (auch alle Zirkel-Stationen) geschafft sind.
  var ZI = (C.META.zirkel || []).map(function (id) { return ST.map(function (s) { return s.id; }).indexOf(id); }).filter(function (i) { return i > -1; });
  function allBefore(si) { for (var i = 0; i < si; i++) if (!stationDone(i)) return false; return true; }
  function unlocked(si) {
    if (preview || si === 0) return true;
    if (ZI.length) { var first = Math.min.apply(null, ZI); if (ZI.indexOf(si) > -1) return allBefore(first); return allBefore(si); }
    return stationDone(si - 1);
  }
  function nextOpen(si) {
    if (!ZI.length) return si + 1 < ST.length ? si + 1 : -1;
    for (var i = 0; i < ST.length; i++) { var j = (si + 1 + i) % ST.length; if (unlocked(j) && !stationDone(j)) return j; }
    return -1;
  }

  // ---------------------------------------------------------------- Kopfzeile
  function renderHead() {

    $("#bar").style.width = Math.round(100 * EXLIST.filter(function (e) { return exDone(e.id); }).length / EXLIST.length) + "%";
    var sh = "";
    ST.forEach(function (s, i) { sh += '<span class="' + (stationDone(i) ? "on" : "") + '" title="Station ' + s.nr + '">' + s.stempel + "</span>"; });
    $("#stamps").innerHTML = sh;
    $("#btnKartei").hidden = !C.KARTEI || !unlocked(1);
    if ($("#btnGloss")) $("#btnGloss").hidden = !(C.GLOSSAR && C.GLOSSAR.length);
    var sp = $("#stars"); if (sp) { sp.hidden = !(PXLIST.length || GMLIST.length); sp.innerHTML = I.star + "<b>" + stars() + "</b>"; sp.title = LB.sterne + ": " + stars() + " von " + maxStars(); }
    var bb = $("#btnBadges"); if (bb) { var nb = badgeList().filter(function (b) { return hasBadge(b.id); }).length; bb.querySelector(".cnt").textContent = nb; bb.title = LB.badges + ": " + nb + " von " + badgeList().length; }
    var sn = $("#btnSound"); if (sn) { sn.innerHTML = I[FX.on ? "sound" : "mute"]; sn.title = LB.ton + (FX.on ? " an – zum Ausschalten tippen" : " aus – zum Einschalten tippen"); sn.setAttribute("aria-pressed", FX.on ? "true" : "false"); }
  }

  // ---------------------------------------------------------------- Seiten
  var app, LOGO = M.icon && I[M.icon] ? M.icon : "flask";

  // ---------------------------------------------------------------- Bildkarte (Startseite mit C.MAP)

  function lineMap() {
    var MP = C.MAP, w = el("div", "lmap");

    var inner = w.firstChild, sv = inner.querySelector("svg"), vb = sv.viewBox.baseVal, W = vb.width, H = vb.height;

  var cur = -1, wasDone = {};
  function openStation(si, keepScroll) {

    var s = ST[si];
    app.innerHTML = "";
    var back = el("button", "back", "← " + LB.karte); back.onclick = home; app.appendChild(back);
    var hd = el("div", "sthead");
    hd.innerHTML = '<div class="badge">' + I[s.icon] + '</div><div><div class="t1">Station ' + s.nr + " · " + s.ort + "</div><h2>" + s.title + "</h2></div>";

    var sto = el("div", "card story blk");
    sto.innerHTML = '<div class="badge">' + I[LOGO] + '</div><div class="bd">' + sceneHtml(s.scene) + '<div class="kicker" style="color:var(--navy)">' + LB.stationAuftrag + '</div><p>' + s.story + "</p></div>";

  function renderBlocks(si, host) {
    var s = ST[si];
    host.innerHTML = "";
    var stop = false;
    for (var bi = 0; bi < s.blocks.length && !stop; bi++) {
      var b = s.blocks[bi];
      if (isBonus(b)) continue;
      if (b.t === "ex") {
        host.appendChild(exCard(b, si));

      } else if (b.t === "quiz") {

        for (var qi = 0; qi < b.qs.length; qi++) {
          var q = b.qs[qi];

          host.appendChild(exCard(qx, si));
          if (!exDone(q.id) && !preview) { stop = true; break; }
        }
      } else if (b.t === "cert") {
        host.appendChild(certCard());
      } else if (b.t === "anim") {
        host.appendChild(animCard(b));
      } else if (b.t === "video") {
        host.appendChild(videoCard(b));
      } else {
        host.appendChild(infoCard(b));

    }

  // ---------------------------------------------------------------- Infokarten
  // Szenenbild (optional) oben in der Auftragskarte: C.INTRO.scene bzw. Station.scene = Schlüssel aus FIGS
  function sceneHtml(key) { return key && F[key] ? '<div class="scene">' + F[key].svg + "</div>" : ""; }
  function figHtml(key) {
    var f = F[key]; if (!f) return "";
    return '<div class="figwrap" data-fig="' + key + '">' + f.svg + '</div><div class="swipe">↔ Abbildung seitlich wischen</div>';
  }
  function fixFigs(root) {

      var sv = w.querySelector("svg.fig"); if (!sv) return;

      sv.style.setProperty("--fw", nat + "px");
      sv.style.minWidth = Math.round(nat * 0.62) + "px";
      setTimeout(function () { if (w.scrollWidth > w.clientWidth + 2) w.classList.add("scroll"); }, 0);
      // Animierte Abbildung (Klasse "anim" oder SMIL): Knopf zum Neustarten
      if (!w.dataset.rp && sv.querySelector(ANIM_SEL)) {

  // Diagramm-Grundgerüst (SVG): Achsen, Gitter, Beschriftungen; liefert Umrechnung Daten <-> Bildkoordinaten
  function axes(o) {
    var W = o.w || 600, H = o.h || 340, L = 64, R = 18, T = 16, B = 54;
    var cat = !!o.cats;
    var xmin = cat ? -0.5 : o.xmin, xmax = cat ? o.cats.length - 0.5 : o.xmax;
    var X = function (x) { return L + (x - xmin) / (xmax - xmin) * (W - L - R); };
    var Y = function (y) { return H - B - (y - o.ymin) / (o.ymax - o.ymin) * (H - T - B); };
    var s = '<svg viewBox="0 0 ' + W + " " + H + '" xmlns="' + SVGNS + '" font-family="Calibri, Carlito, sans-serif">';
    for (var y = o.ymin; y <= o.ymax + 1e-9; y += o.ystep) {
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(y) + '" y2="' + Y(y) + '" stroke="#DDE8F5" stroke-width="1"/>';
      // ypow: y-Werte sind Zehnerpotenzen (logarithmische Achse), Beschriftung 10³, 10⁴ …
      s += '<text x="' + (L - 8) + '" y="' + (Y(y) + 5) + '" text-anchor="end" font-size="14" fill="#22313F">' + (o.ypow ? svgRich("10<sup>" + fmtNum(y) + "</sup>", 14) : fmtNum(y)) + "</text>";
    }
    if (cat) o.cats.forEach(function (c, i) { s += '<text x="' + X(i) + '" y="' + (H - B + 20) + '" text-anchor="middle" font-size="14" fill="#22313F">' + svgRich(c, 14) + "</text>"; });
    else for (var x = o.xmin; x <= o.xmax + 1e-9; x += o.xstep) {
      s += '<line x1="' + X(x) + '" x2="' + X(x) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="#EEF4FB" stroke-width="1"/>';
      s += '<text x="' + X(x) + '" y="' + (H - B + 20) + '" text-anchor="middle" font-size="14" fill="#22313F">' + fmtNum(x) + "</text>";
    }
    s += '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R + 4) + '" y2="' + (H - B) + '" stroke="#1F3A5F" stroke-width="2"/>';
    s += '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + L + '" y2="' + (T - 4) + '" stroke="#1F3A5F" stroke-width="2"/>';
    s += '<text x="' + ((L + W - R) / 2) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="15" font-weight="700" fill="#1F3A5F">' + svgRich(o.xlabel, 15) + "</text>";
    s += '<text transform="translate(18 ' + ((T + H - B) / 2) + ') rotate(-90)" text-anchor="middle" font-size="15" font-weight="700" fill="#1F3A5F">' + svgRich(o.ylabel, 15) + "</text>";
    return { svg: s, X: X, Y: Y, W: W, H: H, L: L, R: R, T: T, B: B, yInv: function (py) { return o.ymin + (H - B - py) / (H - T - B) * (o.ymax - o.ymin); } };
  }

  // Punkte einzeichnen: Messwerte als Punkte in ein Diagramm setzen (cats[] als x-Kategorien, sol[] Sollwerte, tol Toleranz)

  // Ionen-Werkstatt: Elektronen im Energiestufenmodell abgeben (−) oder aufnehmen (+), bis die Edelgaskonfiguration erreicht ist.

  TYPES.ionbuild = function (body, ex) {
    body.appendChild(el("p", "note", "„− e<sup>−</sup>“ gibt ein Elektron ab, „+ e<sup>−</sup>“ nimmt eines auf. Mit ↺ startest du wieder beim Atom."));
    var rows = [], lk = false;
    function trim(a) { a = a.slice(); while (a.length && !a[a.length - 1]) a.pop(); return a; }
    function same(a, b) { a = trim(a); b = trim(b); return a.length === b.length && a.every(function (x, i) { return x === b[i]; }); }
    function noble(a) { a = trim(a); var n = a.length; return n > 0 && a[n - 1] === (n === 1 ? 2 : 8); }
    function cap(n) { return n === 1 ? 2 : 8; }
    var GAP = [0, 52, 36, 28, 24];
    ex.atoms.forEach(function (a) {
      var st = { e: a.e.slice() };
      var r = el("div", "ibrow");
      r.innerHTML = '<div class="ibfig"></div><div class="ibside"><div class="ibname">' + a.name + ' <small>' + a.z + ' Protonen</small></div>' +
        '<div class="ibctl"><button type="button" class="btn ghost ibm">− e<sup>−</sup> abgeben</button><button type="button" class="btn ghost ibp">+ e<sup>−</sup> aufnehmen</button><button type="button" class="btn ghost ibr" title="zurück zum Atom" aria-label="zurück zum Atom">↺</button></div>' +
        '<div class="ibinfo"></div></div>';
      var fig = r.querySelector(".ibfig"), info = r.querySelector(".ibinfo");
      function draw(change) {
        var L = Math.max(trim(a.e).length, trim(st.e).length, 1), H = 30, ys = [], y = 0, k;
        for (k = 0; k < L; k++) { y += k ? GAP[k] : 0; ys.push(y); }
        H = ys[L - 1] + 54;
        var s = '<svg viewBox="0 0 330 ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Energiestufenmodell">';
        s += '<line x1="18" y1="' + (H - 8) + '" x2="18" y2="10" stroke="#1F3A5F" stroke-width="2"/><polygon points="18,4 13,14 23,14" fill="#1F3A5F"/>';
        s += '<text x="26" y="16" font-size="12" fill="#5B6B7C" font-family="Calibri, Carlito, sans-serif">Energie</text>';
        for (k = 0; k < L; k++) {
          var ly = H - 22 - ys[k];
          s += '<line x1="30" y1="' + ly + '" x2="262" y2="' + ly + '" stroke="#8DB0D8" stroke-width="3" stroke-linecap="round"/>';
          s += '<text x="270" y="' + (ly + 4) + '" font-size="13" font-style="italic" fill="#1F3A5F" font-family="Calibri, Carlito, sans-serif">n = ' + (k + 1) + "</text>";
          var n = st.e[k] || 0, x0 = 146 - (n - 1) * 9;
          for (var j = 0; j < n; j++) {
            var last = change === "+" && k === trim(st.e).length - 1 && j === n - 1;
            s += '<circle class="' + (last ? "ein" : "") + '" cx="' + (x0 + j * 18) + '" cy="' + (ly - 8) + '" r="5.5" fill="#2F5D8C"/>';
          }
          if (change && change.k === k) s += '<circle class="eout" cx="' + (x0 + n * 18) + '" cy="' + (ly - 8) + '" r="5.5" fill="#E0662B"/>';
        }
        fig.innerHTML = s + "</svg>";
        var tot = st.e.reduce(function (p, q) { return p + q; }, 0), q = a.z - tot, t = trim(st.e);
        info.innerHTML = "<span>" + tot + " Elektronen · " + (t.length ? t[t.length - 1] : 0) + " auf der höchsten besetzten Energiestufe</span><span class=\"ibq\">" +
          (q === 0 ? "ungeladenes Atom: " + fmt(String(a.sym)) : "Ion: " + ionHtml(String(a.sym), q) + " (Ladung " + Math.abs(q) + (q > 0 ? "+" : MINUS) + ")") + "</span>";
        r.classList.remove("good", "bad");
      }
      r.querySelector(".ibm").onclick = function () {
        if (lk) return; var t = trim(st.e); if (!t.length) return;
        var k = t.length - 1; st.e = t; st.e[k]--; draw({ k: k });
      };
      r.querySelector(".ibp").onclick = function () {
        if (lk) return; var t = trim(st.e), k = Math.max(t.length - 1, 0);
        if (t.reduce(function (p, q) { return p + q; }, 0) - a.z >= 8) return;
        if ((t[k] || 0) >= cap(k + 1)) k++;
        while (t.length <= k) t.push(0);
        t[k]++; st.e = t; draw("+");
      };
      r.querySelector(".ibr").onclick = function () { if (lk) return; st.e = a.e.slice(); draw(); };
      draw();
      body.appendChild(r);
      rows.push({ a: a, st: st, r: r, draw: draw });
    });
    return {
      check: function () {
        var msg = [], wrong = 0;
        rows.forEach(function (x) {
          if (same(x.st.e, x.a.sol)) { x.r.classList.add("good"); return; }
          wrong++; x.r.classList.add("bad");
          var n = Math.abs(x.st.e.reduce(function (p, q) { return p + q; }, 0) - x.a.z);
          if (same(x.st.e, x.a.e)) msg.push("<b>" + x.a.name + ":</b> Du hast noch nichts verändert.");

          else msg.push("<b>" + x.a.name + ":</b> Die höchste besetzte Energiestufe hat noch keine Edelgaskonfiguration.");
        });
        if (!wrong) return { ok: true, msg: "Alle Teilchen haben jetzt Edelgaskonfiguration – auf dem kürzesten Weg!" };
        return { ok: false, msg: msg.join("<br>") };
      },
      showSolution: function () { rows.forEach(function (x) { x.st.e = x.a.sol.slice(); x.draw(); x.r.classList.add("good"); }); },
      lock: function () { lk = true; rows.forEach(function (x) { x.r.querySelectorAll("button").forEach(function (b) { b.disabled = true; }); }); },
      fill: function (ok) { rows.forEach(function (x) { var t = x.a.e.slice(); t[t.length - 1]--; x.st.e = ok ? x.a.sol.slice() : t; x.draw(); }); }
    };
  };

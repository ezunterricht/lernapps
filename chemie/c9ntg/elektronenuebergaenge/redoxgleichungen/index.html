hlor-Atome bilden Cl<sub>2</sub>-Moleküle, also 2 Cl<sup>−</sup> → Cl<sub>2</sub> + 2 e<sup>−</sup>."}, {"x": 485, "y": 196, "r": 46, "label": "Elektronen auf der falschen Seite", "fb": "Bei einer Oxidation werden Elektronen abgegeben – sie gehören auf die rechte Seite."}, {"x": 115, "y": 196, "r": 46, "label": "Reduktion", "fb": "Das ist eine richtige Teilgleichung, aber eine Reduktion: Die Elektronen werden aufgenommen."}, {"x": 300, "y": 306, "r": 46, "label": "falsche Elektronenzahl", "fb": "Zwei Iodid-Ionen geben je ein Elektron ab – das sind zwei Elektronen, nicht eines."}], "doneMsg": "Alle vier Oxidationen gefunden!"}, {"fund": "uhr", "t": "merke", "title": "Merke", "bullets": ["<b>Oxidation</b> (an der Anode): Das Anion gibt so viele Elektronen ab, wie seine Ladungszahl angibt; die Elektronen stehen <b>rechts</b>, z. B. 2 Cl<sup>−</sup> → Cl<sub>2</sub> + 2 e<sup>−</sup>.", "<b>Reduktion</b> (an der Kathode): Das Kation nimmt so viele Elektronen auf, wie seine Ladungszahl angibt; die Elektronen stehen <b>links</b>, z. B. Na<sup>+</sup> + e<sup>−</sup> → Na.", "<b>HOFBrINCl:</b> H, O, F, Br, I, N und Cl bilden zweiatomige Moleküle."]}, {"t": "heft", "nr": 1, "title": "Teilgleichungen aufstellen"}, {"t": "game", "id": "1g", "kind": "domino", "title": "Dominokette an der Werkbank", "lead": "Ordne die sieben Karten zu einer geschlossenen Kette.", "pairs": [["Oxidation", "Elektronenabgabe – die Elektronen stehen rechts"], ["Reduktion", "Elektronenaufnahme – die Elektronen stehen links"], ["Anode", "Pluspol, hier werden die Anionen oxidiert"], ["Kathode", "Minuspol, hier werden die Kationen reduziert"], ["HOFBrINCl", "Elemente, deren Atome zweiatomige Moleküle bilden"], ["Teilgleichung", "beschreibt nur die Oxidation oder nur die Reduktion"], ["Ladungszahl", "gibt bei der Elektrolyse an, wie viele Elektronen ein Ion abgibt oder aufnimmt"]]}]}, {"id": "s2", "nr": 2, "ort": "Räderwerk", "title": "Elektronenbilanz ausgleichen", "icon": "key", "min": 4, "stempel": "A", "story": "Im Räderwerk müssen die Zähne der beiden Räder genau zusammenpassen. Auch Aluminium wird so hergestellt: Seit 1886 – entwickelt von Charles Martin Hall und Paul Héroult unabhängig voneinander – gewinnt man es durch Elektrolyse aus Aluminiumoxid.", "raum": {"fig": "fig_raum_raederwerk", "w": 1100, "h": 520, "spots": [{"key": "plan", "name": "Bauplan", "x": 155.0, "y": 66.0, "box": [70.0, 100.0, 170.0, 200.0], "lab": "o", "b": [0, 1]}, {"key": "brett", "name": "Auftragszettel", "x": 780.0, "y": 86.0, "box": [720.0, 120.0, 120.0, 150.0], "lab": "o", "b": [2]}, {"key": "getriebe", "name": "Getriebe", "x": 480.0, "y": 116.0, "box": [330.0, 150.0, 300.0, 254.0], "lab": "o", "b": [3]}, {"key": "tafel", "name": "Merktafel", "x": 970.0, "y": 250.0, "box": [880.0, 96.0, 180.0, 120.0], "lab": "u", "b": [4, 5]}]}, "blocks": [{"fund": "plan", "t": "info", "title": "Schritt 3: Elektronenbilanz ausgleichen", "lead": "Alle Elektronen, die an der Anode abgegeben werden, fließen durch die Leitung zur Kathode und werden dort aufgenommen. Es gehen keine verloren, und es kommen keine dazu.", "text": ["Deshalb müssen bei einer Redoxreaktion <b>gleich viele Elektronen abgegeben wie aufgenommen</b> werden: Die <b>Elektronenbilanz</b> muss ausgeglichen sein.", "Dazu multipliziert man die Teilgleichungen mit <b>möglichst kleinen Zahlen</b>: Die Elektronenzahlen beider Teilgleichungen werden auf ihr <b>kleinstes gemeinsames Vielfaches (kgV)</b> gebracht. Multipliziert werden <b>alle Teilchen</b> der Teilgleichung, nicht nur die Elektronen.", "Beispiel: Gibt eine Oxidation 2 Elektronen ab und nimmt eine Reduktion 3 Elektronen auf, ist das kgV 6. Die Oxidation wird mit 3 multipliziert, die Reduktion mit 2.", "<b>Schreibweise:</b> Den Faktor schreibt man mit einem <b>senkrechten Strich rechts neben die Teilgleichung</b>, z. B. Na<sup>+</sup> + e<sup>−</sup> → Na  | · 2. Darunter steht die multiplizierte Teilgleichung: 2 Na<sup>+</sup> + 2 e<sup>−</sup> → 2 Na."]}, {"t": "anim", "title": "Zahnräder im Takt: Natriumchlorid", "lead": "Sieh dir an, wie die Elektronenbilanz bei der Elektrolyse von Natriumchlorid ausgeglichen wird.", "dur": 3200, "frames": [{"fig": "fig_zr1", "text": "Die Oxidation gibt <b>2 Elektronen</b> ab, die Reduktion nimmt nur <b>1 Elektron</b> auf: Die Räder passen noch nicht."}, {"fig": "fig_zr2", "text": "Das kgV von 2 und 1 ist 2: Rechts neben die Teilgleichung der Reduktion schreibt man <b>| · 2</b>. Darunter steht die multiplizierte Teilgleichung – <b>alle Teilchen</b> mal 2."}, {"fig": "fig_zr3", "text": "Jetzt werden 2 Elektronen abgegeben und 2 aufgenommen: Die <b>Elektronenbilanz</b> ist ausgeglichen."}]}, {"fund": "brett", "t": "ex", "id": "2a", "type": "label", "op": "Ermittle", "task": "Auf dem Auftragszettel stehen die Teilgleichungen dreier Elektrolysen. Ermittle für jede Teilgleichung den Faktor, mit dem sie multipliziert werden muss, damit die Elektronenbilanz ausgeglichen ist. Lege ihn rechts neben den senkrechten Strich (Faktor 1: Die Teilgleichung bleibt, wie sie ist).", "scheme": "fig_faktoren", "slots": [{"id": "f1", "x": 410, "y": 68, "sol": "· 1"}, {"id": "f2", "x": 410, "y": 110, "sol": "· 2"}, {"id": "f3", "x": 410, "y": 204, "sol": "· 1"}, {"id": "f4", "x": 410, "y": 246, "sol": "· 1"}, {"id": "f5", "x": 410, "y": 340, "sol": "· 1"}, {"id": "f6", "x": 410, "y": 382, "sol": "· 4"}], "extra": ["· 2", "· 3", "· 4"]}, {"fund": "getriebe", "t": "ex", "id": "2b", "type": "label", "op": "Ermittle", "task": "Bei der Elektrolyse von Aluminiumoxid (Al<sup>3+</sup>, O<sup>2−</sup>) entstehen Aluminium und Sauerstoff. Ermittle die Faktoren für beide Teilgleichungen und die Zahl der Elektronen, die insgesamt übertragen werden. Lege die Faktoren rechts neben den senkrechten Strich und die Elektronenzahl unter das Getriebe.", "scheme": "fig_getriebe_al", "slots": [{"id": "fox", "x": 402, "y": 34, "sol": "· 3"}, {"id": "fred", "x": 402, "y": 82, "sol": "· 4"}, {"id": "n", "x": 380, "y": 330, "sol": "12 e<sup>−</sup>"}], "extra": ["· 2", "· 6", "7 e<sup>−</sup>", "24 e<sup>−</sup>"]}, {"fund": "tafel", "t": "merke", "title": "Merke", "bullets": ["Bei einer Redoxreaktion werden <b>gleich viele Elektronen abgegeben wie aufgenommen</b> (Elektronenbilanz).", "Die Teilgleichungen werden mit möglichst kleinen Zahlen multipliziert, sodass beide das <b>kgV der Elektronenzahlen</b> enthalten. Dabei werden alle Teilchen der Teilgleichung multipliziert.", "Der Faktor steht mit senkrechtem Strich <b>rechts neben der Teilgleichung</b>: Na<sup>+</sup> + e<sup>−</sup> → Na  | · 2."]}, {"t": "heft", "nr": 2, "title": "Elektronenbilanz ausgleichen"}, {"t": "ex", "id": "2p", "profi": true, "type": "mc", "op": "Beurteile", "task": "Ben schreibt für die Elektrolyse von Natriumchlorid: Na<sup>+</sup> + e<sup>−</sup> → Na und Cl<sup>−</sup> → Cl + e<sup>−</sup>. „Abgegeben und aufgenommen wird je ein Elektron – ausgleichen muss ich hier nichts.“ Beurteile Bens Aussage.", "options": [{"text": "Ben hat nicht recht: Chlor-Atome bilden Cl<sub>2</sub>-Moleküle. Die Oxidation lautet 2 Cl<sup>−</sup> → Cl<sub>2</sub> + 2 e<sup>−</sup>, deshalb muss die Reduktion mit 2 multipliziert werden.", "ok": true, "fb": "Richtig: HOFBrINCl ändert die Elektronenzahl der Oxidation."}, {"text": "Ben hat recht: Jedes Ion hat die Ladungszahl 1, also ist die Elektronenbilanz ausgeglichen.", "ok": false, "fb": "Die Ladungszahlen stimmen – aber in welcher Form entsteht Chlor?"}, {"text": "Ben hat nicht recht: Die Natrium-Ionen müssen zwei Elektronen aufnehmen.", "ok": false, "fb": "Ein Natrium-Ion hat die Ladungszahl 1 und nimmt ein Elektron auf."}]}]}, {"id": "s3", "nr": 3, "ort": "Montagetisch", "title": "Gesamtgleichung aufstellen", "icon": "puzzle", "min": 5, "stempel": "L", "story": "Am Montagetisch werden beide Räder zu einem Uhrwerk zusammengesetzt. Natrium entsteht so in großem Maßstab: Seit den 1920er-Jahren wird in Downs-Zellen eine Schmelze aus Natriumchlorid und Calciumchlorid bei etwa 600 °C elektrolysiert – das Natrium ist dabei flüssig.", "raum": {"fig": "fig_raum_montage", "w": 1100, "h": 520, "spots": [{"key": "schirm", "name": "Anleitung", "x": 165.0, "y": 156.0, "box": [80.0, 190.0, 170.0, 140.0], "lab": "o", "b": [0]}, {"key": "datenblatt", "name": "Datenblatt", "x": 405.0, "y": 66.0, "box": [330.0, 100.0, 150.0, 170.0], "lab": "o", "b": [1, 2]}, {"key": "tisch", "name": "Montagetisch", "x": 486.0, "y": 309.0, "box": [520.0, 274.0, 220.0, 70.0], "lab": "l", "b": [3, 4]}, {"key": "tresor", "name": "Tresor", "x": 905.0, "y": 170.0, "box": [830.0, 204.0, 150.0, 200.0], "lab": "o", "b": [5]}, {"key": "tafel", "name": "Merktafel", "x": 650.0, "y": 62.0, "box": [560.0, 96.0, 180.0, 110.0], "lab": "o", "b": [6, 7]}]}, "blocks": [{"fund": "schirm", "t": "anim", "title": "Schritt 4: Addieren und Elektronen streichen", "dur": 3200, "lead": "Die ausgeglichenen Teilgleichungen werden addiert. Sieh dir den Ablauf am Beispiel Natriumchlorid an.", "frames": [{"fig": "fig_add1", "text": "Die beiden Teilgleichungen stehen mit ausgeglichener Elektronenbilanz untereinander."}, {"fig": "fig_add2", "text": "Man <b>addiert</b> sie: Alle Teilchen von links kommen nach links, alle von rechts nach rechts."}, {"fig": "fig_add3", "text": "Links und rechts stehen <b>gleich viele Elektronen</b> – sie werden <b>gestrichen</b>. Ist noch ein Elektron übrig, wurde die Elektronenbilanz nicht richtig ausgeglichen."}]}, {"fund": "datenblatt", "t": "info", "title": "Schritt 5: Teilchenebene und Stoffebene", "fig": "fig_add4", "lead": "Zum Schluss gibt man die <b>Gesamtgleichung der Redoxreaktion</b> an – auf zwei Ebenen.", "text": ["<b>Teilchenebene:</b> Es stehen die reagierenden Teilchen: Ionen links, Atome und Moleküle rechts – ohne Elektronen.", "<b>Stoffebene:</b> Statt der Ionen steht die <b>Verhältnisformel des Salzes</b>. Je ein Na<sup>+</sup>- und ein Cl<sup>−</sup>-Ion bilden eine Formeleinheit NaCl; aus 2 Na<sup>+</sup> + 2 Cl<sup>−</sup> wird also 2 NaCl. Bei anderen Salzen zählt man genauso: Je ein Mg<sup>2+</sup>- und zwei Cl<sup>−</sup>-Ionen bilden eine Formeleinheit MgCl<sub>2</sub>; aus 2 Mg<sup>2+</sup> + 4 Cl<sup>−</sup> werden 2 MgCl<sub>2</sub>. Dazu kommen die <b>Aggregatzustände</b> der Stoffe."]}, {"t": "info", "title": "Aggregatzustände ergänzen", "fig": "fig_zustand", "lead": "Hinter jede Formel auf Stoffebene schreibt man den Aggregatzustand in Klammern.", "bullets": ["<b>Schmelze:</b> Das Salz ist flüssig (l). Bei den Schmelzflusselektrolysen in dieser Werkstatt (Natrium, Lithium, Magnesium, Aluminium) ist es so heiß, dass auch das entstehende <b>Metall flüssig (l)</b> ist.", "<b>Lösung:</b> Das Salz ist in Wasser gelöst (aq). Das Metall scheidet sich an der Kathode als <b>Feststoff (s)</b> ab.", "<b>Chlor</b> und <b>Sauerstoff</b> entstehen als <b>Gase (g)</b>."]}, {"fund": "tisch", "t": "ex", "id": "3a", "type": "equation", "op": "Stelle auf", "task": "Stelle für die Schmelzflusselektrolyse von Kaliumbromid (K<sup>+</sup>, Br<sup>−</sup>) die Gesamtgleichung der Redoxreaktion auf <b>Teilchenebene</b> auf. Deine Faktoren aus dem Räderwerk helfen.", "sides": ["Edukt-Teilchen", "Produkt-Teilchen"], "tiles": [{"id": "k", "f": "K<sup>+</sup>", "q": 1, "at": {"K": 1}}, {"id": "br", "f": "Br<sup>−</sup>", "q": -1, "at": {"Br": 1}}, {"id": "ka", "f": "K", "q": 0, "at": {"K": 1}}, {"id": "br2", "f": "Br<sub>2</sub>", "q": 0, "at": {"Br": 2}}, {"id": "e", "f": "e<sup>−</sup>", "q": -1, "at": {}, "why": "In der Gesamtgleichung stehen links und rechts gleich viele Elektronen – sie werden gestrichen."}, {"id": "kbr", "f": "KBr", "q": 0, "at": {"K": 1, "Br": 1}, "why": "Auf Teilchenebene stehen die Ionen, nicht die Verhältnisformel des Salzes."}], "sol": {"L": {"k": 2, "br": 2}, "R": {"ka": 2, "br2": 1}}, "solText": "2 K<sup>+</sup> + 2 Br<sup>−</sup> → 2 K + Br<sub>2</sub>", "hintAtom": "Denk an HOFBrINCl und an die Faktoren aus der Elektronenbilanz.", "hintFull": "Fast: Sind alle Koeffizienten so klein wie möglich?", "okMsg": "Richtig! 2 K<sup>+</sup> + 2 Br<sup>−</sup> → 2 K + Br<sub>2</sub>."}, {"t": "ex", "id": "3b", "type": "equation", "op": "Stelle auf", "task": "Bei der Elektrolyse von <b>Kupfer(II)-chlorid-Lösung</b> entstehen Kupfer und Chlor. Auf Teilchenebene gilt: Cu<sup>2+</sup> + 2 Cl<sup>−</sup> → Cu + Cl<sub>2</sub>. Stelle die Gesamtgleichung auf <b>Stoffebene</b> auf.", "sides": ["Edukte", "Produkte"], "tiles": [{"id": "cucl2", "f": "CuCl<sub>2</sub>(aq)", "q": 0, "at": {"Cu": 1, "Cl": 2}}, {"id": "cucl2l", "f": "CuCl<sub>2</sub>(l)", "q": 0, "at": {"Cu": 1, "Cl": 2}, "why": "Hier wird eine Lösung elektrolysiert, keine Schmelze."}, {"id": "cus", "f": "Cu(s)", "q": 0, "at": {"Cu": 1}}, {"id": "cul", "f": "Cu(l)", "q": 0, "at": {"Cu": 1}, "why": "Aus einer Lösung scheidet sich das Metall als Feststoff ab."}, {"id": "cl2", "f": "Cl<sub>2</sub>(g)", "q": 0, "at": {"Cl": 2}}, {"id": "cuion", "f": "Cu<sup>2+</sup>(aq)", "q": 2, "at": {"Cu": 1}, "why": "Auf Stoffebene steht die Verhältnisformel des Salzes statt der Ionen."}], "sol": {"L": {"cucl2": 1}, "R": {"cus": 1, "cl2": 1}}, "solText": "CuCl<sub>2</sub>(aq) → Cu(s) + Cl<sub>2</sub>(g)", "hintFull": "Fast: Prüfe die Koeffizienten.", "okMsg": "Richtig! CuCl<sub>2</sub>(aq) → Cu(s) + Cl<sub>2</sub>(g)."}, {"fund": "tresor", "t": "ex", "id": "3c", "type": "lock", "op": "Ermittle", "task": "Der Werkstatt-Tresor öffnet sich nur mit dem richtigen Code. Ermittle die Koeffizienten der Gesamtgleichung auf Stoffebene für die Elektrolyse von Aluminiumoxid.", "object": "Werkstatt-Tresor", "code": "243", "clues": ["Nutze deine Faktoren aus dem Räderwerk und stelle zuerst die Gesamtgleichung auf Teilchenebene auf.", "Je zwei Al<sup>3+</sup>-Ionen und drei O<sup>2−</sup>-Ionen bilden eine Formeleinheit Al<sub>2</sub>O<sub>3</sub>.", "Code = Koeffizienten in der Reihenfolge Al<sub>2</sub>O<sub>3</sub> → Al + O<sub>2</sub>."], "okMsg": "Klick – der Tresor ist offen: 2 Al<sub>2</sub>O<sub>3</sub> → 4 Al + 3 O<sub>2</sub>.", "reward": "Im Tresor liegt eine Notiz: In der Technik ist das Aluminiumoxid in geschmolzenem Kryolith gelöst (etwa 940 bis 980 °C), und der Sauerstoff reagiert sofort mit den Kohlenstoff-Anoden zu Kohlenstoffmonooxid und Kohlenstoffdioxid."}, {"fund": "tafel", "t": "merke", "title": "Merke", "bullets": ["<b>Schritt 4:</b> Die ausgeglichenen Teilgleichungen werden addiert; die Elektronen auf beiden Seiten werden gestrichen.", "<b>Schritt 5:</b> Die Gesamtgleichung wird auf <b>Teilchenebene</b> (Ionen, Atome, Moleküle) und auf <b>Stoffebene</b> (Verhältnisformel des Salzes, Aggregatzustände) angegeben, z. B. 2 NaCl(l) → Cl<sub>2</sub>(g) + 2 Na(l)."]}, {"t": "heft", "nr": 3, "title": "Gesamtgleichung aufstellen"}, {"t": "game", "id": "3f", "kind": "fehler", "title": "Fehlersuche im Werkstattprotokoll", "lead": "Ermittle die drei fachlich falschen Stellen im Protokoll.", "parts": ["Elektrolyse einer Kaliumiodid-Schmelze. Oxidation an der Anode: ", {"text": "2 I<sup>−</sup> → I<sub>2</sub> + 2 e<sup>−</sup>", "fb": "Das stimmt: Iod bildet I<sub>2</sub>-Moleküle, zwei Iodid-Ionen geben zwei Elektronen ab."}, ". Reduktion an der Kathode: ", {"text": "K<sup>+</sup> → K + e<sup>−</sup>", "err": true, "fix": "K<sup>+</sup> + e<sup>−</sup> → K", "fb": "Bei der Reduktion werden Elektronen aufgenommen – sie stehen links."}, ". Zum Ausgleichen wird die Reduktion mit ", {"text": "2", "fb": "Das stimmt: Zwei Elektronen werden abgegeben, ein Kalium-Ion nimmt eines auf."}, " multipliziert. Gesamtgleichung auf Teilchenebene: ", {"text": "2 K<sup>+</sup> + 2 I<sup>−</sup> → 2 K + I<sub>2</sub>", "fb": "Das stimmt."}, ". Auf Stoffebene steht links ", {"text": "K<sub>2</sub>I<sub>2</sub>(l)", "err": true, "fix": "2 KI(l)", "fb": "Die Verhältnisformel lautet KI; die Anzahl schreibt man als Koeffizient davor."}, ". In der Gesamtgleichung fehlen die Elektronen, weil ", {"text": "sie sich gegenseitig neutralisieren", "err": true, "fix": "links und rechts gleich viele stehen und gestrichen werden", "fb": "Gestrichen wird, we   // ---------------------------------------------------------------- Stationscodes (Wiedereinstieg ohne gespeicherten Fortschritt)
  // Optional (META codes). C.CODES [{si, code}] aus build.py (src/codes.py): Code am Ende jeder Station. Zusätzlich ist die Lösung jedes Codeschlosses

  // Eingabe auf der Startseite. Wiederhergestellte Übungen: [MAXP, 0, 3] (volle Punkte, Status 3 = per Code; zählt nicht als

  // Was ein Code bewirkt: mark = Übungen, die als erledigt gelten; del = gespeicherte Einträge hinter dem Zwischenstand (nur chronologisch)

    var zi = ZI.indexOf(cp.si) > -1, before = zi ? Math.min.apply(null, ZI) : cp.si;
    var up = cp.upto ? EXLIST.map(function (e) { return e.id; }).indexOf(cp.upto) : -1;
    function inCp(e, k) { return e.si < before || (e.si === cp.si && (up < 0 || k <= up)); }

    var del = { ex: [], px: [], mg: [] };
    if (!zi) {

      PXLIST.forEach(function (e) { if (S.px[e.id] && (e.si > cp.si || (e.si === cp.si && up > -1))) del.px.push(e.id); });

        eq[sd].forEach(function (e, i) {

    function upd() { bar.innerHTML = I.magnifier + "<b>" + LB.huntFound + ": " + nFound() + " / " + nT + "</b>" + '<span class="hdots">' + ex.targets.map(function (t) { return "<i" + (found[t.id] ? ' class="on"' : "") + "></i>"; }).join("") + "</span>"; }
    function svgAdd(markup) { var g = document.createElementNS(SVGNS, "g"); g.innerHTML = markup; ov.appendChild(g); return g; }
    function hitTarget(t, quiet) {
      if (found[t.id]) return;
      found[t.id] = 1;
      var k = nFound();
      svgAdd('<circle class="hring" cx="' + t.x + '" cy="' + t.y + '" r="' + t.r + '"/><circle cx="' + (t.x + t.r * 0.72) + '" cy="' + (t.y - t.r * 0.72) + '" r="13" fill="#1E7B4F" stroke="#fff" stroke-width="2.5"/><text x="' + (t.x + t.r * 0.72) + '" y="' + (t.y - t.r * 0.72 + 5) + '" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="' + KF + '">' + k + "</text>");
      // mark: Zeichen, das beim Treffer am Ziel erscheint (z. B. "*" für Chiralitätszentren), markDy: senkrechter Versatz, markSize: Schriftgröße
      if (ex.mark) svgAdd('<text class="hmark" x="' + t.x + '" y="' + (t.y + (ex.markDy || 0)) + '" text-anchor="middle" dominant-baseline="central" font-size="' + (ex.markSize || 34) + '" font-weight="700" fill="' + K.hotd + '" font-family="' + KF + '">' + ex.mark + "</text>");
      list.appendChild(el("li", "good", "<b>" + t.label + "</b>" + (t.fb ? " – " + t.fb : "")));
      upd();
      if (quiet) return;
      if (nFound() === nT) { done = true; ctl.award(ex.doneMsg || "Alle Stellen gefunden – gut ermittelt!"); }
      else { FX.ok(); ctl.fb("ok", "Gefunden: <b>" + t.label + "</b>. " + (t.fb || "") + " Noch " + (nT - nFound()) + "."); }
    }
    function hitDecoy(d, i) {
      var g = svgAdd('<g class="hx"><circle cx="' + d.x + '" cy="' + d.y + '" r="' + d.r + '"/><path d="M' + (d.x - 12) + "," + (d.y - 12) + " l24,24 M" + (d.x + 12) + "," + (d.y - 12) + ' l-24,24"/></g>');
      setTimeout(function () { g.remove(); }, 1500);
      FX.no();
      ctl.fb("no", "<b>" + (d.label || "Hier nicht") + ":</b> " + (d.fb || "An dieser Stelle besteht kein Risiko."));
      if (!tried[i]) { tried[i] = 1; ctl.miss(); }
    }
    function ripple(p) { var g = svgAdd('<circle class="hrip" cx="' + p.x + '" cy="' + p.y + '" r="10"/>'); setTimeout(function () { g.remove(); }, 700); }
    sv.addEventListener("click", function (e) {
      if (lk || done) return;
      var p = svgPoint(sv, e), r = sv.getBoundingClientRect(), vb = sv.viewBox.baseVal;
      var tol = r.width ? 12 * vb.width / r.width : 0;   // mindestens ca. 12 Bildschirmpixel Spielraum (Touch am Tablet)
      var d2 = function (o) { return Math.sqrt((o.x - p.x) * (o.x - p.x) + (o.y - p.y) * (o.y - p.y)); };
      var t = ex.targets.filter(function (t) { return d2(t) <= t.r + tol; }).sort(function (a, b) { return d2(a) - d2(b); })[0];
      if (t) { hitTarget(t); return; }
      var di = -1; (ex.decoys || []).forEach(function (d, i) { if (d2(d) <= d.r + tol && (di < 0 || d2(d) < d2(ex.decoys[di]))) di = i; });
      if (di > -1) { hitDecoy(ex.decoys[di], di); return; }
      ripple(p);
    });
    upd();
    return {
      auto: true, delay: 1800,
      check: function () { return null; },
      showSolution: function () { ex.targets.forEach(function (t) { hitTarget(t, true); }); },
      lock: function () { lk = true; },
      fill: function (ok) {
        if (!ok) { if (ex.decoys && ex.decoys.length) hitDecoy(ex.decoys[0], 0); return document.querySelector("#ex-" + ex.id + " .exfb").className; }
        ex.targets.forEach(function (t) { hitTarget(t); });
      }
    };
  };

  TYPES.hunt.ownFig = true;

  // ---------------------------------------------------------------- Spiegel-Check (Bild und Spiegelbild am Chiralitätszentrum)
  // ex.items[] = {id, name, subs: {U, P, F, B}, chiral: true/false, fb, hint}; subs = Substituenten an den vier Plätzen des
  // Tetraeders: U oben (in der Ebene), P unten links (in der Ebene), F Keil (vorne), B gestrichelt (hinten).
  // Links steht das Bild, rechts das Spiegelbild (Spiegelung an einer senkrechten Ebene = Zeichnung in gespiegeltem Rahmen „M“).
  // Drei Knöpfe drehen das Spiegelbild im Raum (echte Drehungen, keine Spiegelungen): 120° um die obere Bindung,
  // 180° um die senkrechte Achse (vorne ↔ hinten, Rahmen S ↔ M), umkippen (oben ↔ unten, vorne ↔ hinten).
  // Deckung = dieselbe Ansicht wie das Bild (Rahmen S, gleiche Substituenten an allen Plätzen) – die App erkennt sie selbst.
  // Chirales Molekül: keine Drehung führt zur Deckung → Knopf „nicht zur Deckung zu bringen“ (erst nach ex.minMoves (3) Drehungen).
  // Wertung wie Wimmelbild: Fehlgriffe (falscher „nicht möglich“-Knopf) kosten Punkte; „Lösung zeigen“ nach solAfter (3) Fehlgriffen.
  // ex.colors {Label: Farbe} überschreibt die Farben der Substituenten-Plättchen. Mischen entfällt (feste Geometrie).
  var MIR_POS = { U: [0, -78], P: [-70, 40], F: [68, 34], B: [36, 72] };
  var MIR_COL = { "H": "#FFFFFF", "OH": "#F7C0B4", "CH<sub>3</sub>": "#D3C8F2", "COOH": "#F6E27F", "Cl": "#B6E3A2", "Br": "#E9C79C", "C<sub>2</sub>H<sub>5</sub>": "#A9DCCF", "NH<sub>2</sub>": "#BFD9F5", "CHO": "#F5D7A6", "CH<sub>2</sub>OH": "#CDE7F2", "F": "#DDE8F5" };
  var MIR_FALLBACK = ["#E8D9F1", "#F2E2C9", "#D6EAFA", "#F9D5DD", "#DFF0D8"];
  TYPES.mirror = function (body, ex, ctl) {
    ctl.setCheck(false);
    var lk = false, done = false, minMoves = ex.minMoves == null ? 3 : ex.minMoves, items = ex.items, states = [], nsol = 0;
    var cols = {}, fallbackK = 0;
    function colorOf(lb) {
      if (ex.colors && (ex.colors[lb] || ex.colors[plain(lb)])) return ex.colors[lb] || ex.colors[plain(lb)];   // Schlüssel mit oder ohne Markup (CH3)
      if (MIR_COL[lb]) return MIR_COL[lb];
      if (!cols[lb]) cols[lb] = MIR_FALLBACK[(fallbackK++) % MIR_FALLBACK.length];
      return cols[lb];
    }
    // st.sub: Platz -> Instanz-ID (i0 … i3); st.lab: Instanz-ID -> Beschriftung. Gleiche Beschriftungen (z. B. zwei CH3) sind
    // verschiedene Instanzen, damit jedes Plättchen seinen Weg behält; Deckung wird über die Beschriftungen verglichen.
    function same(a, b) { return a.frame === "S" && ["U", "P", "F", "B"].every(function (k) { return a.lab[a.sub[k]] === b[k]; }); }
    var OPS = {
      rot120: function (st) { var s = st.sub, n = {}; n.U = s.U; if (st.frame === "S") { n.B = s.P; n.F = s.B; n.P = s.F; } else { n.F = s.P; n.B = s.F; n.P = s.B; } return { frame: st.frame, sub: n, lab: st.lab }; },
      rot180: function (st) { var s = st.sub; return { frame: st.frame === "S" ? "M" : "S", sub: { U: s.U, P: s.P, F: s.B, B: s.F }, lab: st.lab }; },
      flip: function (st) { var s = st.sub; return { frame: st.frame, sub: { U: s.P, P: s.U, F: s.B, B: s.F }, lab: st.lab }; }
    };
    var OPL = [["rot120", "↻ 120° um die obere Bindung"], ["rot180", "↻ 180° um die senkrechte Achse"], ["flip", "⤵ umkippen (oben ↔ unten)"]];
    function key(st) { return st.frame + st.lab[st.sub.U] + "|" + st.lab[st.sub.P] + "|" + st.lab[st.sub.F] + "|" + st.lab[st.sub.B]; }
    function solve(st, target) {   // Breitensuche über die drei Drehungen: Folge der Knöpfe bis zur Deckung, null wenn unmöglich
      var seen = {}, q = [[st, []]]; seen[key(st)] = 1;
      while (q.length) {
        var cur = q.shift();
        if (same(cur[0], target)) return cur[1];
        for (var o in OPS) { var nx = OPS[o](cur[0]); if (!seen[key(nx)]) { seen[key(nx)] = 1; q.push([nx, cur[1].concat([o])]); } }
      }
      return null;
    }
    // Bewegung als SVG-Attribut transform (robust in allen Browsern, auch ohne CSS-Transform auf SVG-Elementen), weich per Tween
    function tween(node, from, to, fmt) {
      var t0 = null, dur = (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) ? 0 : 500;
      if (node._tw) cancelAnimationFrame(node._tw);
      function step(ts) {
        if (t0 === null) t0 = ts;
        var u = dur ? Math.min(1, (ts - t0) / dur) : 1, e = u < 0.5 ? 2 * u * u : -1 + (4 - 2 * u) * u;
        node.setAttribute("transform", fmt(from.map(function (a, i) { return a + (to[i] - a) * e; })));
        if (u < 1) node._tw = requestAnimationFrame(step); else node._tw = null;
      }
      node._tw = requestAnimationFrame(step);
    }
    function pill(lb, x, y, id) {
      var n = plain(lb).length, w = Math.max(32, 14 + 11.5 * n), h = 28;
      return '<g class="mpill" transform="translate(' + x + ',' + y + ')" data-x="' + x + '" data-y="' + y + '"' + (id ? ' data-id="' + id + '"' : "") + '><rect x="' + (-w / 2) + '" y="' + (-h / 2) + '" width="' + w + '" height="' + h + '" rx="14" fill="' + colorOf(lb) + '" stroke="' + K.dk + '" stroke-width="1.8"/>' +
        '<text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="' + KF + '" font-size="16" font-weight="700" fill="' + K.dk + '">' + svgRich(lb, 16) + "</text></g>";
    }
    function bonds() {
      var P = MIR_POS, s = "";
      s += '<line x1="0" y1="0" x2="' + P.U[0] + '" y2="' + P.U[1] + '" stroke="' + K.dk + '" stroke-width="3"/>';
      s += '<line x1="0" y1="0" x2="' + P.P[0] + '" y2="' + P.P[1] + '" stroke="' + K.dk + '" stroke-width="3"/>';
      var fx = P.F[0], fy = P.F[1], L = Math.hypot(fx, fy), nx = -fy / L * 7, ny = fx / L * 7;
      s += '<polygon points="0,0 ' + (fx + nx) + "," + (fy + ny) + " " + (fx - nx) + "," + (fy - ny) + '" fill="' + K.dk + '"/>';
      var bx = P.B[0], by = P.B[1], L2 = Math.hypot(bx, by), mx = -by / L2, my = bx / L2;
      for (var t = 0.18; t <= 1.0; t += 0.14) { var hw = 1.5 + 6.5 * t, px = bx * t, py = by * t; s += '<line x1="' + (px + mx * hw) + '" y1="' + (py + my * hw) + '" x2="' + (px - mx * hw) + '" y2="' + (py - my * hw) + '" stroke="' + K.dk + '" stroke-width="2.6" stroke-linecap="round"/>'; }
      return s;
    }
    function molecule(st, cx, cy, cls) {
      var m = st.frame === "M" ? -1 : 1, s = '<g class="mol ' + cls + '" transform="translate(' + cx + "," + cy + ')">';
      s += '<g class="mbonds" transform="scale(' + m + ',1)" data-m="' + m + '">' + bonds() + "</g>";
      ["U", "P", "F", "B"].forEach(function (k) { var id = st.sub[k]; s += pill(st.lab ? st.lab[id] : id, MIR_POS[k][0] * m, MIR_POS[k][1], st.lab ? id : null); });
      s += '<circle cx="0" cy="0" r="14" fill="' + K.ink3 + '" stroke="' + K.dk + '" stroke-width="2"/><text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="' + KF + '" font-size="15" font-weight="700" fill="#fff">C</text></g>';
      return s;
    }
    function redraw(i) {
      var st = states[i], it = items[i], sv = st.svg, m = st.frame === "M" ? -1 : 1;
      var R = sv.querySelector(".mol.right"), bd = R.querySelector(".mbonds");
      var m0 = +bd.getAttribute("data-m") || 1;
      if (m0 !== m) { bd.setAttribute("data-m", m); tween(bd, [m0], [m], function (v) { return "scale(" + v[0].toFixed(3) + ",1)"; }); }
      var pills = R.querySelectorAll(".mpill");
      ["U", "P", "F", "B"].forEach(function (k) {   // das Plättchen der Instanz, die jetzt auf Platz k sitzt, dorthin bewegen
        var id = st.sub[k], p = null; for (var q = 0; q < pills.length; q++) if (pills[q].getAttribute("data-id") === id) p = pills[q];
        if (!p) return;
        var x0 = +p.getAttribute("data-x"), y0 = +p.getAttribute("data-y"), x1 = MIR_POS[k][0] * m, y1 = MIR_POS[k][1];
        if (x0 === x1 && y0 === y1) return;
        p.setAttribute("data-x", x1); p.setAttribute("data-y", y1);
        tween(p, [x0, y0], [x1, y1], function (v) { return "translate(" + v[0].toFixed(1) + "," + v[1].toFixed(1) + ")"; });
      });
      sv.querySelector(".mcnt").textContent = "Drehungen: " + st.moves;
      var hit = same(st, it.subs);
      sv.querySelector(".mmatch").style.display = hit ? "" : "none";
    }
    function build(i) {
      var it = items[i], st = { frame: "M", sub: { U: "i0", P: "i1", F: "i2", B: "i3" }, lab: { i0: it.subs.U, i1: it.subs.P, i2: it.subs.F, i3: it.subs.B }, moves: 0, solved: false, sol: false };
      states[i] = st;
      var w = el("div", "mirw"); w.dataset.i = i;
      w.innerHTML = '<div class="mirhead"><b>' + (i + 1) + ". " + it.name + "</b>" + (it.hint ? ' <span class="note">' + it.hint + "</span>" : "") + "</div>";
      var fw = el("div", "figwrap mirfig"); w.appendChild(fw);
      var s = '<svg class="fig mirsvg" viewBox="0 0 640 270" width="640" height="270" role="img" xmlns="http://www.w3.org/2000/svg"><title>Spiegel-Check: ' + plain(it.name) + ' – Bild links, Spiegelbild rechts</title>';
      s += '<defs><linearGradient id="mg' + ex.id + i + '" x1="0" x2="1"><stop offset="0" stop-color="' + K.lin1 + '"/><stop offset=".5" stop-color="' + K.hell + '"/><stop offset="1" stop-color="' + K.f19 + '"/></linearGradient></defs>';
      s += '<rect x="0" y="0" width="640" height="270" rx="14" fill="' + K.hell + '"/>';
      s += '<text x="160" y="28" text-anchor="middle" font-family="Caladea, Cambria, Georgia, serif" font-size="17" font-weight="700" fill="' + K.dk + '">Bild</text>';
      s += '<text x="480" y="28" text-anchor="middle" font-family="Caladea, Cambria, Georgia, serif" font-size="17" font-weight="700" fill="' + K.dk + '">Spiegelbild</text>';
      s += '<rect x="312" y="14" width="16" height="242" rx="4" fill="url(#mg' + ex.id + i + ')" stroke="' + K.grau + '" stroke-width="1.5"/>';
      s += '<line x1="318" y1="30" x2="318" y2="110" stroke="#fff" stroke-width="2" opacity=".8"/><line x1="322" y1="150" x2="322" y2="200" stroke="#fff" stroke-width="2" opacity=".6"/>';
      s += '<text x="320" y="265" text-anchor="middle" font-family="' + KF + '" font-size="12" fill="' + K.grau + '">Spiegel</text>';
      s += molecule({ frame: "S", sub: it.subs, lab: null }, 160, 150, "left");
      s += molecule(st, 480, 150, "right");
      s += '<text class="mcnt" x="480" y="248" text-anchor="middle" font-family="' + KF + '" font-size="13" fill="' + K.grau + '">Drehungen: 0</text>';
      s += '<g class="mmatch" style="display:none"><rect x="250" y="112" width="140" height="42" rx="21" fill="#1E7B4F" stroke="#fff" stroke-width="3"/><text x="320" y="139" text-anchor="middle" font-family="' + KF + '" font-size="18" font-weight="700" fill="#fff">Deckung!</text></g>';
      s += "</svg>";
      fw.innerHTML = s;
      var sv = fw.querySelector("svg"); sizeFig(sv); st.svg = sv;
      w.appendChild(el("div", "swipe", "↔ Bild seitlich wischen"));
      var bt = el("div", "btns mirbtns");
      OPL.forEach(function (o) {
        var b = el("button", "btn ghost mirop", o[1]); b.type = "button"; b.dataset.op = o[0];
        b.onclick = function () { move(i, o[0]); };
        bt.appendChild(b);
      });
      var bNo = el("button", "btn signal mirno", "Lässt sich nicht zur Deckung bringen"); bNo.type = "button";
      bNo.onclick = function () { claimNo(i); };
      bt.appendChild(bNo);
      w.appendChild(bt);
      var stt = el("p", "mirstat"); w.appendChild(stt);
      st.wrap = w; st.stat = stt;
      return w;
    }
    function finishItem(i, msg, cls) {
      var st = states[i], it = items[i];
      st.solved = true; nsol++;
      st.wrap.classList.add("solved", it.chiral ? "chiral" : "achiral");
      st.wrap.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
      st.stat.innerHTML = '<span class="mres ' + (it.chiral ? "chi" : "achi") + '">' + (it.chiral ? "chiral" : "achiral") + "</span> " + (it.fb || "");
      if (nsol === items.length) { done = true; if (!st.sol) ctl.award(ex.doneMsg || "Spiegel-Check abgeschlossen!"); }
      else if (cls) { FX.ok(); ctl.fb(cls, msg); }
    }
    function move(i, op) {
      var st = states[i]; if (lk || st.solved) return;
      var nx = OPS[op](st); st.frame = nx.frame; st.sub = nx.sub; st.moves++;
      redraw(i);
      if (same(st, items[i].subs)) {
        if (items[i].chiral) return;   // kann nicht vorkommen (Spiegelbild eines chiralen Moleküls erreicht nie die Deckung)
        finishItem(i, "<b>Deckung!</b> Bild und Spiegelbild sind dasselbe Molekül: " + items[i].name + " ist <b>achiral</b>.", "ok");
      }
    }
    function claimNo(i) {
      var st = states[i], it = items[i]; if (lk || st.solved) return;
      if (st.moves < minMoves) { ctl.fb("no", "Probiere erst mindestens " + minMoves + " Drehungen aus, bevor du dich festlegst."); return; }
      if (it.chiral) { finishItem(i, "<b>Richtig:</b> Keine Drehung bringt Bild und Spiegelbild zur Deckung – " + it.name + " ist <b>chiral</b>.", "ok"); }
      else { FX.no(); ctl.fb("no", "<b>Doch, es geht!</b> " + (it.wrongNo || "Dreh weiter – achte darauf, welche Substituenten gleich sind, und bringe sie an die passenden Plätze.")); ctl.miss(); }
    }
    body.appendChild(el("p", "note", ex.hint || "Das Spiegelbild (rechts) lässt sich mit den Knöpfen im Raum drehen. Bringe es, wenn möglich, in dieselbe Ansicht wie das Bild (links). Geht es nicht, tippe auf „Lässt sich nicht zur Deckung bringen“ – ein falscher Tipp kostet Punkte."));
    items.forEach(function (_, i) { body.appendChild(build(i)); });
    function solveItem(i, instant) {
      var st = states[i], it = items[i];
      if (st.solved) return;
      if (it.chiral) { st.moves = Math.max(st.moves, minMoves); st.sol = instant; finishItem(i, null, null); return; }
      var seq = solve(st, it.subs) || [];
      seq.forEach(function (o) { var nx = OPS[o](st); st.frame = nx.frame; st.sub = nx.sub; st.moves++; });
      redraw(i); st.sol = instant; finishItem(i, null, null);

    return {
      auto: true, delay: 1500,
      check: function () { return null; },
      showSolution: function () { items.forEach(function (_, i) { solveItem(i, true); }); },
      lock: function () { lk = true; body.querySelectorAll(".mirw button").forEach(function (b) { b.disabled = true; }); },
      // Test-Hilfen: ein falscher Schritt (achirales Molekül als „nicht möglich“ erklärt), dann alles per Knopfdruck lösen
      stepWrong: function () {
        var i = items.findIndex(function (it, k) { return !it.chiral && !states[k].solved; });

      },
      playAll: function () {

          (solve(st, it.subs) || []).forEach(function (o) { move(i, o); });

      fill: function (ok) { if (!ok) { this.stepWrong(); return; } this.playAll(); }
    };
  };
  TYPES.mirror.ownFig = true;

  // ---------------------------------------------------------------- Faltungs-Werkbank (vereinfachtes HP-Gittermodell in 2D)
  // ex.seq: Bausteinfolge aus "H" (wassermeidend) und "P" (wasserliebend); ex.emin: tiefste mögliche Energie (negativ, z. B. -3);
  // ex.sol: Knicke einer Faltung mit ex.emin (je innerer Baustein 0 = gerade, 1 = links, -1 = rechts); optional ex.names {H, P},
  // ex.okMsg, ex.hint. Bedienung: Baustein antippen = auswählen (erneut antippen = Knick weiterschalten gerade → ↺ → ↻);
  // Werkzeugleiste: Rest der Kette ab dem gewählten Baustein ↺ / ↻ um 90° drehen, gerade stellen, Rückgängig, Kette strecken,
  // beste bisher gefundene Faltung zurückholen; Tastatur (Fokus auf der Zeichnung): ← → Baustein wählen, L/R drehen, G gerade, Z rückgängig.
  // Energie = −(Zahl der Kontakte zweier wassermeidender Bausteine, die im Gitter nebeneinanderliegen, in der Kette aber nicht benachbart sind).
  // Prüfen: Überkreuzung = unvollständig (zählt nicht), Energie über dem Minimum = Fehlversuch (10/6/3), Minimum = gelöst.
  // „↺ Kette strecken“ (unter der Zeichnung, vor dem Lösen) bzw. „↺ Faltung neu abspielen“ (danach): setzt nur die Darstellung zurück, nie Punkte.

      stage.innerHTML = '<div class="bossw">' + (b.fig && F[b.fig] ? F[b.fig].svg : bossSvg()) + '</div><p class="note">' + b.qs.length + " Fragen, " + maxL + " Leben. Jede richtige Antwort ist ein Treffer, jede falsche kostet ein Leben.</p>";

    return {
      play: function (perfect) {
        start();
        for (var g = 0; g < 200 && stage._q; g++) {
          var q = stage._q, bo = stage._bo; stage._q = null;
          var btn = Array.prototype.slice.call(bo.querySelectorAll("button")).filter(function (x) { var o = q.options.filter(function (o) { return plain(o.text) === x.textContent; })[0]; return o && (perfect ? o.ok : !o.ok); })[0];
          btn.click();
          var w = stage.querySelector(".fb .btn"); if (w) w.click(); else next();
        }
        return S.mg[b.id];
      }
    };
  };

  // ---------------------------------------------------------------- Intro-Animation (INTRO.anim)
  // fig: Abbildung mit ia()-Bausteinen (figs_base), title/kicker: Text unter dem Bild (Standard: Untertitel/Spielrahmen),
  // textAt: Sekunde, ab der Text und Startknopf erscheinen, sounds: [[Sekunde, "stamp" | "flip" | "click" | "unlock" | "fanfare"], …].
  // Läuft beim ersten Start (S.iv), danach über „↺ Intro abspielen“ auf der Startseite. Überspringen jederzeit (Knopf, Esc).
  var introTimers = [];
  function introAnim() {
    var A = C.INTRO && C.INTRO.anim;
    if (!A || !F[A.fig]) return;
    introClose(true);
    var reduce = false; try { reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { }
    var at = reduce ? 0 : (A.textAt || 3.5);
    var ov = el("div", "intro-ov"); ov.id = "introOv";
    ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", A.title || M.untertitel || M.titel);
    ov.innerHTML = '<div class="intro-box"><button type="button" class="intro-skip">' + LB.introSkip + ' ›</button><div class="intro-fig">' + F[A.fig].svg + "</div>" +
      '<div class="intro-txt" style="animation-delay:' + at + 's"><div class="kicker">' + (A.kicker || M.rahmen || "") + "</div><h2>" + (A.title || M.untertitel || M.titel) + "</h2>" +
      '<button type="button" class="btn intro-go">' + LB.introGo + " →</button></div></div>";
    document.body.appendChild(ov);
    ov.querySelector(".intro-skip").onclick = function () { introClose(); };
    ov.querySelector(".intro-go").onclick = function () { FX.click(); introClose(); };
    if (!reduce) (A.sounds || []).forEach(function (x) { introTimers.push(setTimeout(function () { if (FX[x[1]]) FX[x[1]](); }, x[0] * 1000)); });
    introTimers.push(setTimeout(function () { var g = ov.querySelector(".intro-go"); if (g) try { g.focus({ preventScroll: true }); } catch (e) { } }, at * 1000 + 300));
    ov.querySelector(".intro-skip").focus();
  }
  function introClose(quiet) {
    introTimers.forEach(clearTimeout); introTimers = [];
    var ov = $("#introOv"); if (!ov) return;
    ov.remove();
    if (!quiet && !S.iv) { S.iv = 1; save(); }
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && $("#introOv")) introClose(); });

    var row = el("div", "btns");

    }
    inp.oninput = function () { if (noName()) return; S.name = inp.value.slice(0, 60); save(); draw(); };
    pr.onclick = function () { window.print(); };

    if (all && !S.cert) { S.cert = 1; save(); }
    return c;
  }

  // ---------------------------------------------------------------- Lehrkraft-Bereich
  function sha256(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var mp = Math.pow, maxWord = mp(2, 32), res = "", words = [], bl, hash = [], k = [], pc = 0, isC = {};
    for (var cand = 2; pc < 64; cand++) { if (!isC[cand]) { for (var i = 0; i < 313; i += cand) isC[i] = cand; hash[pc] = (mp(cand, .5) * maxWord) | 0; k[pc++] = (mp(cand, 1 / 3) * maxWord) | 0; } }
    hash = hash.slice(0, 8);
    ascii = unescape(encodeURIComponent(ascii)); bl = ascii.length * 8;
    ascii += "\x80"; while (ascii.length % 64 - 56) ascii += "\x00";
    for (i = 0; i < ascii.length; i++) { var j = ascii.charCodeAt(i); words[i >> 2] |= j << ((3 - i) % 4) * 8; }
    words[words.length] = ((bl / maxWord) | 0); words[words.length] = (bl);
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), oh = hash; hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oh[i]) | 0;
    }
    for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; res += ((b < 16) ? 0 : "") + b.toString(16); }
    return res;
  }
  function teacher() {
    var p = $("#tpanel");
    p.classList.toggle("on");
    if (!p.classList.contains("on")) return;
    p.innerHTML = '<div class="tl"><input type="password" id="tpw" placeholder="Passwort" autocomplete="off" aria-label="Passwort"> <button class="btn" id="tgo">Anmelden</button> <span id="tmsg" class="note"></span></div>';
    $("#tgo").onclick = function () {

        p.innerHTML = '<p><b>Lehrkraft-Bereich</b></p><div class="btns"><button class="btn" id="tprev">Alle Stationen und Aufgaben anzeigen (Vorschau)</button><button class="btn ghost" id="treset">Fortschritt auf diesem Gerät zurücksetzen</button><button class="btn ghost" id="tlock">Bereich sperren</button></div><p class="note">Die Vorschau zeigt jede Station vollständig – alle Aufgaben, Merke-Kästen und die Bonus-Runde –, ohne dass vorher etwas gelöst werden muss. Sie gilt nur für diese Sitzung; Punkte gibt es nur für tatsächlich bearbeitete Aufgaben.</p>' + codeTable();
        $("#tprev").onclick = function () { preview = true; try { sessionStorage.setItem(KEY + "_pv", "1"); } catch (e) { } home(); };
        $("#treset").onclick = function () { S = normS({}); save(); try { localStorage.removeItem(KEY); } catch (e) { } home(); $("#tmsg") && ($("#tmsg").textContent = ""); };
        $("#tlock").onclick = function () { preview = false; try { sessionStorage.removeItem(KEY + "_pv"); } catch (e) { } p.classList.remove("on"); p.innerHTML = ""; home(); };
      } else { $("#tmsg").textContent = "Falsches Passwort."; }
    };
  }

    FX.init();
    var li = ST.map(function (s) { return s.id; }).indexOf(S.loc);
    if (li > -1 && unlocked(li)) openStation(li); else home();
    if (!S.iv) introAnim();
    if (window.__TEST__) {
      window.__T = {
        KSI: KSI, ZI: ZI, unlocked: unlocked,
        S: function () { return S; }, points: points, maxPoints: maxPoints, EX: EXLIST, open: openStation, home: home, sha: sha256,

        raum: function (si) { var Z = ST[si].raum; return Z ? { open: rmOpen[si] == null ? null : rmOpen[si], flat: pvFlat, spots: Z.spots.map(function (sp, k) { return { k: k, key: sp.key, name: sp.name, kind: rmKind(si, sp), state: rmState(si, k), ex: [].concat.apply([], rmBlocks(si, sp).filter(rmIsEx).map(exIds)) }; }) } : null; },

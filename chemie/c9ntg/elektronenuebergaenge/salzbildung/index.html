, "title": "Vom Atom zum Ion"}, {"t": "game", "id": "2g", "kind": "memory", "title": "Memory: Atom und Ion", "lead": "Finde zu jedem Atom das Ion, das bei der Salzbildung daraus entsteht.", "pairs": [["Natrium-Atom", "Na<sup>+</sup>"], ["Chlor-Atom", "Cl<sup>−</sup>"], ["Magnesium-Atom", "Mg<sup>2+</sup>"], ["Sauerstoff-Atom", "O<sup>2−</sup>"], ["Kalium-Atom", "K<sup>+</sup>"], ["Schwefel-Atom", "S<sup>2−</sup>"]]}]}, {"id": "s3", "nr": 3, "ort": "Formelbüro", "title": "Elektronen wechseln den Besitzer", "icon": "pencil", "min": 6, "stempel": "N", "story": "Im Formelbüro wird aus dem Teilchengeschehen eine Gleichung. Denn ein Faktencheck braucht saubere Formeln.", "raum": {"fig": "fig_raum_formel", "w": 1100, "h": 520, "spots": [{"key": "schirm", "name": "Bildschirm", "x": 144.0, "y": 66.0, "box": [44.0, 100.0, 200.0, 124.0], "lab": "o", "b": [0, 1]}, {"key": "tafel", "name": "Gleichungstafel", "x": 417.0, "y": 62.0, "box": [292.0, 96.0, 250.0, 134.0], "lab": "o", "b": [2, 3]}, {"key": "ordner", "name": "Formelkarte", "x": 642.0, "y": 94.0, "box": [590.0, 128.0, 104.0, 72.0], "lab": "o", "b": [4]}, {"key": "block", "name": "Klemmbrett", "x": 983.0, "y": 102.0, "box": [935.0, 136.0, 96.0, 126.0], "lab": "o", "b": [5]}, {"key": "kartei", "name": "Merkkartei", "x": 815.0, "y": 96.0, "box": [760.0, 130.0, 110.0, 70.0], "lab": "o", "b": [6, 7]}]}, "blocks": [{"fund": "schirm", "t": "anim", "title": "Ein Elektron wechselt den Besitzer", "lead": "Sieh dir den Ablauf Schritt für Schritt an.", "dur": 3500, "frames": [{"fig": "fig_ue0", "text": "Ein Natrium-Atom (1 Elektron auf der 3. Energiestufe) trifft auf ein Chlor-Atom (7 Elektronen auf der 3. Energiestufe)."}, {"fig": "fig_ue1", "text": "Das Natrium-Atom gibt sein Elektron ab – es ist der <b>Elektronendonator</b>. Das Chlor-Atom nimmt das Elektron auf – es ist der <b>Elektronenakzeptor</b>."}, {"fig": "fig_ue2", "text": "Es sind ein Natrium-Kation und ein Chlorid-Anion entstanden, beide mit Edelgaskonfiguration."}]}, {"t": "info", "title": "Kurz erinnert: Oxidation und Reduktion", "bullets": ["<b>Oxidation</b> = Elektronenabgabe, <b>Reduktion</b> = Elektronenaufnahme.", "Laufen beide gekoppelt ab, gehen also Elektronen von einem Teilchen auf ein anderes über, ist das eine <b>Redoxreaktion</b>.", "In Teilgleichungen stehen die Elektronen als eigene Teilchen e<sup>−</sup>. Für die Gesamtgleichung bringt man die Elektronenzahl beider Teilgleichungen mit Faktoren auf die gleiche Zahl, addiert und streicht die Elektronen."]}, {"fund": "tafel", "t": "ex", "id": "3a", "type": "label", "op": "Formuliere", "task": "<b>Formuliere</b> an der Gleichungstafel die Teilgleichungen für die Salzbildung und gib den Faktor an, mit dem die Oxidation multipliziert werden muss: Ziehe die passenden Karten in die Felder.", "scheme": "fig_tafel", "slots": [{"id": "s1", "x": 415, "y": 50, "sol": "Na<sup>+</sup>"}, {"id": "s2", "x": 557, "y": 50, "sol": "e<sup>−</sup>"}, {"id": "s5", "x": 700, "y": 50, "sol": "2"}, {"id": "s3", "x": 240, "y": 118, "sol": "2 e<sup>−</sup>"}, {"id": "s4", "x": 415, "y": 118, "sol": "2 Cl<sup>−</sup>"}], "extra": ["Cl<sup>−</sup>", "Na<sup>2+</sup>", "2 Cl", "1"]}, {"t": "ex", "id": "3b", "type": "equation", "op": "Formuliere", "task": "<b>Formuliere</b> die Gesamtgleichung der Redoxreaktion auf der Teilchenebene. Tippe die Bausteine an, ordne sie den Edukten oder Produkten zu und stelle die Zahlen davor ein.", "tiles": [{"id": "na", "f": "Na", "q": 0, "at": {"Na": 1}}, {"id": "cl2", "f": "Cl<sub>2</sub>", "q": 0, "at": {"Cl": 2}}, {"id": "nap", "f": "Na<sup>+</sup>", "q": 1, "at": {"Na": 1}}, {"id": "clm", "f": "Cl<sup>−</sup>", "q": -1, "at": {"Cl": 1}}, {"id": "e", "f": "e<sup>−</sup>", "q": -1, "at": {}, "why": "In der Gesamtgleichung heben sich die Elektronen weg."}, {"id": "cl", "f": "Cl", "q": 0, "at": {"Cl": 1}, "why": "Chlor liegt als Cl<sub>2</sub>-Molekül vor – schreibe das Molekül."}, {"id": "nacl", "f": "NaCl", "q": 0, "at": {"Na": 1, "Cl": 1}, "why": "Auf der Teilchenebene schreibt man die Ionen, nicht die Verhältnisformel."}], "sol": {"L": {"na": 2, "cl2": 1}, "R": {"nap": 2, "clm": 2}}, "solText": "2 Na + Cl<sub>2</sub> → 2 Na<sup>+</sup> + 2 Cl<sup>−</sup>", "hintFull": "Die Bilanzen stimmen – aber hast du die Elektronen weggelassen und die Teilchen richtig gewählt?"}, {"fund": "ordner", "t": "info", "title": "Vom Teilchen zum Stoff", "text": ["Natriumchlorid ist aus Natrium-Kationen und Chlorid-Anionen aufgebaut. Nach außen ist ein Salz elektrisch neutral: Die Ladungen seiner Ionen gleichen sich aus.", "Die <b>Verhältnisformel</b> eines Salzes gibt das kleinste Zahlenverhältnis seiner Ionen an – ohne Ladungen.", "Auf der <b>Stoffebene</b> schreibt man die Gleichung mit der Verhältnisformel des Salzes und mit den Aggregatzuständen der Stoffe im Versuch."]}, {"fund": "block", "t": "ex", "id": "3c", "type": "gap", "op": "Stelle auf", "task": "<b>Stelle</b> die Gleichung auf der Stoffebene <b>auf</b>: Vervollständige die Notiz.", "text": "Im Natriumchlorid stehen Natrium-Kationen und Chlorid-Anionen im Zahlenverhältnis [[1]]. Verhältnisformel: [[2]]. Gleichung auf der Stoffebene: [[3]] Na (l) + Cl<sub>2</sub> (g) → [[4]] [[5]] (s)", "gaps": [{"sol": "1 : 1", "opts": ["1 : 1", "1 : 2", "2 : 1"]}, {"sol": "NaCl", "opts": ["NaCl", "NaCl<sub>2</sub>", "Na<sub>2</sub>Cl"]}, {"sol": "2", "opts": ["1", "2", "3"]}, {"sol": "2", "opts": ["1", "2", "3"]}, {"sol": "NaCl", "opts": ["NaCl", "NaCl<sub>2</sub>", "Na<sup>+</sup>Cl<sup>−</sup>"]}]}, {"fund": "kartei", "t": "merke", "title": "Merke: Die Salzbildung ist eine Redoxreaktion", "bullets": ["Oxidation: Na → Na<sup>+</sup> + e<sup>−</sup>  | · 2", "2 Na → 2 Na<sup>+</sup> + 2 e<sup>−</sup>", "Reduktion: Cl<sub>2</sub> + 2 e<sup>−</sup> → 2 Cl<sup>−</sup>", "Redoxreaktion: 2 Na + Cl<sub>2</sub> → 2 Na<sup>+</sup> + 2 Cl<sup>−</sup>", "Stoffebene: 2 Na (l) + Cl<sub>2</sub> (g) → 2 NaCl (s)", "Das Natrium-Atom ist der <b>Elektronendonator</b>, das Chlor-Atom der <b>Elektronenakzeptor</b>."]}, {"t": "heft", "nr": 3, "title": "Die Salzbildung als Redoxreaktion"}, {"t": "ex", "id": "3p", "profi": true, "type": "equation", "op": "Formuliere", "task": "Auch Magnesium reagiert mit Iod zu einem Salz, dem Magnesiumiodid. <b>Formuliere</b> die Gesamtgleichung der Redoxreaktion auf der Teilchenebene.", "tiles": [{"id": "mg", "f": "Mg", "q": 0, "at": {"Mg": 1}}, {"id": "i2", "f": "I<sub>2</sub>", "q": 0, "at": {"I": 2}}, {"id": "mgp", "f": "Mg<sup>2+</sup>", "q": 2, "at": {"Mg": 1}}, {"id": "im", "f": "I<sup>−</sup>", "q": -1, "at": {"I": 1}}, {"id": "e", "f": "e<sup>−</sup>", "q": -1, "at": {}, "why": "In der Gesamtgleichung heben sich die Elektronen weg."}, {"id": "mgi2", "f": "MgI<sub>2</sub>", "q": 0, "at": {"Mg": 1, "I": 2}, "why": "Auf der Teilchenebene schreibt man die Ionen."}], "sol": {"L": {"mg": 1, "i2": 1}, "R": {"mgp": 1, "im": 2}}, "solText": "Mg + I<sub>2</sub> → Mg<sup>2+</sup> + 2 I<sup>−</sup>"}]}, {"id": "s4", "nr": 4, "ort": "Archiv", "title": "Wer oxidiert wen?", "icon": "shelf", "min": 6, "stempel": "E", "story": "Im Archiv der Redaktion liegen Berichte über andere Salzbildungen. Hier klärst du, welche Rolle die Teilchen spielen – und knackst den Archivschrank.", "raum": {"fig": "fig_raum_archiv", "w": 1100, "h": 520, "spots": [{"key": "ordner", "name": "Begriffskarte", "x": 222.0, "y": 88.0, "box": [176.0, 122.0, 92.0, 78.0], "lab": "o", "b": [0]}, {"key": "zettel", "name": "Lückentext", "x": 88.0, "y": 300.0, "box": [40.0, 140.0, 96.0, 126.0], "lab": "u", "b": [1]}, {"key": "film", "name": "Archivfilm", "x": 398.0, "y": 66.0, "box": [320.0, 100.0, 156.0, 100.0], "lab": "o", "b": [2]}, {"key": "kartei", "name": "Karteikasten", "x": 570.0, "y": 96.0, "box": [520.0, 130.0, 100.0, 70.0], "lab": "o", "b": [3]}, {"key": "schrank", "name": "Archivschrank", "x": 765.0, "y": 70.0, "box": [680.0, 104.0, 170.0, 300.0], "lab": "o", "b": [4]}, {"key": "pinnwand", "name": "Pinnwand", "x": 980.0, "y": 66.0, "box": [900.0, 100.0, 160.0, 150.0], "lab": "o", "b": [5, 6]}]}, "blocks": [{"fund": "ordner", "t": "info", "title": "Oxidationsmittel und Reduktionsmittel", "bullets": ["Ein Teilchen, das einem anderen Teilchen Elektronen abnimmt, bewirkt dessen Oxidation. Es heißt <b>Oxidationsmittel</b>. Es ist der Elektronenakzeptor und wird dabei <b>selbst reduziert</b>.", "Ein Teilchen, das einem anderen Teilchen Elektronen gibt, bewirkt dessen Reduktion. Es heißt <b>Reduktionsmittel</b>. Es ist der Elektronendonator und wird dabei <b>selbst oxidiert</b>.", "Eine Redoxreaktion, die nach dem Start von selbst weiterläuft und dabei Energie abgibt, heißt <b>freiwillig ablaufende Redoxreaktion</b> – im Gegensatz zur Elektrolyse, die nur abläuft, solange elektrische Energie zugeführt wird (erzwungene Redoxreaktion)."]}, {"fund": "zettel", "t": "ex", "id": "4a", "type": "gap", "op": "Erläutere", "task": "<b>Erläutere</b> die Rollen von Natrium und Chlor bei der Salzbildung: Vervollständige den Lückentext.", "text": "Die Oxidation der [[1]]-Atome kann nur stattfinden, weil die [[2]]-Atome je ein Elektron aufnehmen. Chlor dient somit als [[3]] für Natrium. Die Chlor-Atome selbst werden [[4]]. Natrium dient als [[5]] für Chlor; die Natrium-Atome werden selbst [[6]]. Die Salzbildung verläuft [[7]] und läuft nach dem Start von selbst weiter. Man spricht deshalb von einer [[8]] ablaufenden Redoxreaktion, bei der Atome zu Ionen werden.", "gaps": [{"sol": "Natrium", "opts": ["Natrium", "Chlor"]}, {"sol": "Chlor", "opts": ["Natrium", "Chlor"]}, {"sol": "Oxidationsmittel", "opts": ["Oxidationsmittel", "Reduktionsmittel"]}, {"sol": "reduziert", "opts": ["oxidiert", "reduziert"]}, {"sol": "Reduktionsmittel", "opts": ["Oxidationsmittel", "Reduktionsmittel"]}, {"sol": "oxidiert", "opts": ["oxidiert", "reduziert"]}, {"sol": "exotherm", "opts": ["exotherm", "endotherm"]}, {"sol": "freiwillig", "opts": ["freiwillig", "erzwungen"]}]}, {"fund": "film", "t": "info", "title": "Archivbericht: Aluminium trifft Brom", "fig": "fig_albr", "side": true, "text": ["Auch das Metall <b>Aluminium</b> (III. Hauptgruppe) reagiert heftig mit dem Nichtmetall <b>Brom</b> (VII. Hauptgruppe): Ein Stück Aluminium glüht auf der rotbraunen Brom-Flüssigkeit hell auf. Brom besteht aus Br<sub>2</sub>-Molekülen.", "Dabei entsteht das Salz <b>Aluminiumbromid</b>."]}, {"fund": "kartei", "t": "ex", "id": "4b", "type": "select", "op": "Ermittle", "task": "<b>Ermittle</b> für die Bildung von Aluminiumbromid, welche Rolle die Atome spielen. Nutze dazu die Regel aus der Modellwerkstatt.", "cols": ["Rolle", "Elektronen", "entstehendes Ion", "wirkt als"], "colOpts": [["Elektronendonator", "Elektronenakzeptor"], ["gibt 3 e<sup>−</sup> ab", "gibt 1 e<sup>−</sup> ab", "nimmt 1 e<sup>−</sup> auf", "nimmt 3 e<sup>−</sup> auf"], ["Al<sup>3+</sup>", "Al<sup>+</sup>", "Br<sup>−</sup>", "Br<sup>3−</sup>"], ["Reduktionsmittel", "Oxidationsmittel"]], "rows": [{"label": "Aluminium-Atom", "sol": ["Elektronendonator", "gibt 3 e<sup>−</sup> ab", "Al<sup>3+</sup>", "Reduktionsmittel"]}, {"label": "Brom-Atom", "sol": ["Elektronenakzeptor", "nimmt 1 e<sup>−</sup> auf", "Br<sup>−</sup>", "Oxidationsmittel"]}]}, {"fund": "schrank", "t": "ex", "id": "4c", "type": "lock", "op": "Ermittle", "task": "Der Archivschrank hat ein Zahlenschloss. <b>Ermittle</b> die drei Ziffern aus der Redoxreaktion von Aluminium mit Brom.", "object": "Archivschrank", "code": "236", "clues": ["1. Ziffer: Faktor für die Teilgleichung der Oxidation Al → Al<sup>3+</sup> + 3 e<sup>−</sup>", "2. Ziffer: Faktor für die Teilgleichung der Reduktion Br<sub>2</sub> + 2 e<sup>−</sup> → 2 Br<sup>−</sup>", "3. Ziffer: Zahl der Elektronen, die dabei insgesamt übertragen werden"], "reward": "Geöffnet! Im Schrank liegt der Bericht mit der Gesamtgleichung: 2 Al + 3 Br<sub>2</sub> → 2 Al<sup>3+</sup> + 6 Br<sup>−</sup>."}, {"fund": "pinnwand", "t": "merke", "title": "Merke", "bullets": ["<b>Oxidationsmittel</b> = Elektronenakzeptor; es wird selbst reduziert (bei der Salzbildung: das Nichtmetall-Atom).", "<b>Reduktionsmittel</b> = Elektronendonator; es wird selbst oxidiert (bei der Salzbildung: das Metall-Atom).", "Die Salzbildung ist exotherm und läuft nach dem Start von selbst weiter: eine <b>freiwillig ablaufende Redoxreaktion</b>, bei der Atome zu Ionen werden."]}, {"t": "heft", "nr": 4, "title": "Oxidationsmittel und Reduktionsmittel"}, {"t": "ex", "id": "4p", "profi": true, "type": "mc", "op": "Erläutere", "task": "Calcium verbrennt in Sauerstoff zu Calciumoxid, einem Salz aus Calcium-Kationen Ca<sup>2+</sup> und Oxid-Anionen O<sup>2−</sup>. <b>Erläutere</b>, dass es sich um eine Redoxreaktion handelt.", "options": [{"text": "Die Ionen entstehen nur, wenn Calcium-Atome je 2 Elektronen abgeben (Oxidation) und Sauerstoff-Atome je 2 Elektronen aufnehmen (Reduktion) – Elektronen gehen über.", "ok": true, "fb": "Richtig: Ionenbildung aus den Elementen ist immer eine Elektronenübertragung, also eine Redoxreaktion."}, {"text": "Es ist eine Redoxreaktion, weil dabei Sauerstoff beteiligt ist.", "ok": false, "fb": "Entscheidend ist nicht der Sauerstoff, sondern der Übergang von Elektronen – auch die Salzbildung mit Chlor ist eine Redoxreaktion."}, {"text": "Die Calcium-Atome nehmen Elektronen auf und werden zu Kationen.", "ok": false, "fb": "Wer Elektronen aufnimmt, wird negativ geladen – Calcium-Atome geben Elektronen ab."}, {"text": "Es ist eine Redoxreaktion, weil Energie frei wird.", "ok": false, "fb": "Energie wird bei vielen Reaktionen frei; eine Redoxreaktion erkennt man am Elektronenübergang."}]}, {"t": "game", "id": "4t", "kind": "tabu", "title": "Tabu-Karte", "lead": "Erkläre den Begriff so, dass ihn jemand aus deiner Klasse errät.", "begriff": "Oxidationsmittel", "tabu": ["Akzeptor", "reduziert", "Chlor"], "stems": ["akzept", "reduz", "chlor"], "muster": "Ein Teilchen, das einem anderen Teilchen Elektronen wegnimmt. Dadurch gibt der Partner Elektronen ab, er wird also oxidiert. Das Teilchen selbst nimmt die Elektronen auf – bei der Salzbildung ist das das Nichtmetall-Atom.", "check": ["Ich habe gesagt, dass das Teilchen dem Partner Elektronen wegnimmt.", "Ich habe gesagt, dass der Partner dadurch oxidiert wird.", "Ich habe gesagt, dass das Teilchen selbst Elektronen aufnimmt."]}]}, {"id": "s5", "nr": 5, "ort": "Redaktion", "title": "Die Richtigstellung", "icon": "print", "min": 7, "stempel": "N", "story": "Zurück in der Redaktion: Jetzt wird die Falschmeldung richtiggestellt. Danach bekommst du deinen Presseausweis.", "raum": {"fig": "fig_raum_redaktion", "w": 1100, "h": 520, "spots": [{"key": "etiketten", "name": "Etikettenwand", "x": 100.0, "y": 70.0, "box": [30.0, 104.0, 140.0, 156.0], "lab": "o", "b": [0]}, {"key": "zeitung", "name": "Zeitungsseite", "x": 270.0, "y": 66.0, "box": [205.0, 100.0, 130.0, 176.0], "lab": "o", "b": [1]}, {"key": "foto", "name": "Küchenfoto", "x": 455.0, "y": 70.0, "box": [375.0, 104.0, 160.0, 124.0], "lab": "o", "b": [2]}, {"key": "schirm", "name": "Prüfbildschirm", "x": 660.0, "y": 66.0, "box": [585.0, 100.0, 150.0, 100.0], "lab": "o", "b": [3, 4]}, {"key": "ablage", "name": "Ablage", "x": 832.0, "y": 86.0, "box": [786.0, 120.0, 92.0, 80.0], "lab": "o", "b": [5, 6]}, {"key": "ausweis", "name": "Ausweis", "x": 998.0, "y": 70.0, "box": [950.0, 104.0, 96.0, 170.0], "lab": "o", "b": [7]}]}, "blocks": [{"fund": "etiketten", "t": "info", "title": "Was steht auf dem Etikett?", "bullets": ["Auf Mineralwasserflaschen steht zum Beispiel „Natrium (Na<sup>+</sup>) 25 mg/l“ oder „Chlorid (Cl<sup>−</sup>) 30 mg/l“. Die Formeln in Klammern verraten, welche Teilchen gemeint sind. Elementares Natrium würde mit Wasser sofort heftig reagieren.", "Auf seinem Weg durch das Gestein löst das Wasser <b>Salze</b> wie Natriumchlorid. Ihre Ionen sind dann im Wasser verteilt.", "Speisesalz, Kochsalz und Streusalz bestehen aus Natriumchlorid. Metalle wie Aluminium, Kupfer oder Eisen bestehen dagegen aus Metall-Atomen."]}, {"fund": "zeitung", "t": "ex", "id": "5a", "type": "label", "op": "Beurteile", "task": "<b>Beurteile</b> den Zeitungsartikel: Ziehe für jeden rot markierten Fehler die richtige Korrektur in das Feld mit derselben Nummer.", "scheme": "fig_zeitung", "slots": [{"id": "k1", "x": 612, "y": 90, "sol": "Natrium-Kationen"}, {"id": "k2", "x": 612, "y": 148, "sol": "Chlorid-Anionen"}, {"id": "k3", "x": 612, "y": 206, "sol": "harmlos"}, {"id": "k4", "x": 612, "y": 264, "sol": "gelösten Salzen"}], "extra": ["Natrium-Atome", "Chlor-Moleküle", "giftig"]}, {"fund": "foto", "t": "ex", "id": "5b", "type": "hunt", "op": "Ermittle", "task": "Ein Leser schickt ein Foto seiner Küche: „Wo steckt hier überall Natrium?“ <b>Ermittle</b> alle vier Stellen, an denen <b>Natrium-Kationen</b> vorkommen, und tippe sie an.", "fig": "fig_wb_kueche", "hint": "Überlege: Salz oder Metall? Ein Fehlgriff kostet Punkte.", "targets": [{"id": "flasche", "x": 524, "y": 252, "r": 36, "label": "Mineralwasser", "fb": "Im Mineralwasser sind Natrium-Kationen (und Chlorid-Anionen) aus gelösten Salzen."}, {"id": "packung", "x": 606, "y": 262, "r": 32, "label": "Packung Speisesalz", "fb": "Speisesalz ist Natriumchlorid – in der Packung stecken Natrium-Kationen und Chlorid-Anionen."}, {"id": "streuer", "x": 676, "y": 268, "r": 30, "label": "Salzstreuer", "fb": "Speisesalz ist Natriumchlorid – es ist aus Natrium-Kationen und Chlorid-Anionen aufgebaut."}, {"id": "eimer", "x": 452, "y": 362, "r": 36, "label": "Streusalz", "fb": "Streusalz ist ebenfalls Natriumchlorid – auch hier stecken Natrium-Kationen."}], "decoys": [{"x": 126, "y": 134, "r": 32, "label": "Alufolie", "fb": "Alufolie ist ein Metall: Sie besteht aus Aluminium-Atomen, nicht aus Ionen."}, {"x": 357, "y": 236, "r": 34, "label": "Kupfertopf", "fb": "Kupfer ist ein Metall aus Kupfer-Atomen – hier gibt es keine Natrium-Kationen."}, {"x": 406, "y": 162, "r": 30, "label": "Eisenpfanne", "fb": "Die Pfanne besteht aus Eisen-Atomen, einem Metall – keine Ionen."}], "doneMsg": "Alle vier gefunden: Natrium-Kationen stecken im Salz und im Mineralwasser – auf die Salzbildung aus Natrium und Chlor zutreffen.", "options": [{"text": "Sie ist exotherm.", "ok": true, "fb": "Richtig: Licht und Wärme werden abgegeben."}, {"text": "Sie ist eine freiwillig ablaufende Redoxreaktion.", "ok": true, "fb": "Richtig: Sie läuft nach dem Start von selbst weiter."}, {"text": "Sie ist eine erzwungene Redoxreaktion wie die Elektrolyse.", "ok": false, "fb": "Erzwungen ist die Elektrolyse – sie braucht dauernd elektrische Energie."}, {"text": "Dabei nehmen Natrium-Atome Elektronen auf.", "ok": false, "fb": "Natrium-Atome geben ein Elektron ab."}]}, {"id": "5d3", "op": "Beurteile", "task": "<b>Beurteile</b> die Aussage „Im Mineralwasser ist giftiges Chlor.“", "options": [{"text": "Falsch: Im Mineralwasser sind Chlorid-Anionen gelöst, keine Chlor-Moleküle; sie sind harmlos.", "ok": true, "fb": "Richtig."}, {"text": "Richtig: Chlor und Chlorid sind dasselbe.", "ok": false, "fb": "Chlorid-Anionen haben ein Elektron mehr und völlig andere Eigenschaften als Chlor-Moleküle."}, {"text": "Richtig, aber die Menge ist zu klein, um zu schaden.", "ok": false, "fb": "Es geht nicht um die Menge: Im Wasser sind gar keine Chlor-Moleküle, sondern Chlorid-Anionen."}]}]}, {"fund": "ablage", "t": "merke", "title": "Merke", "bullets": ["Im Mineralwasser sind keine Natrium-Atome und keine Chlor-Moleküle, sondern <b>Natrium-Kationen</b> und <b>Chlorid-Anionen</b> gelöst.", "Ionen haben völlig andere Eigenschaften als die Atome bzw. Moleküle der Elemente."]}, {"t": "heft", "nr": 5, "title": "Die Richtigstellung"}, {"fund": "ausweis", "t": "cert"}]}], "GLOSSAR": [["Salzbildung", "Reaktion eines Metalls mit einem Nichtmetall zu einem Salz; dabei werden Atome zu Ionen."], ["Kation", "positiv geladenes Ion, z. B. Natrium-Kation Na<sup>+</sup>"], ["Anion", "negativ geladenes Ion, z. B. Chlorid-Anion Cl<sup>−</sup>"], ["Edelgaskonfiguration", "Elektronenanordnung wie bei einem Edelgas-Atom: höchste besetzte Energiestufe voll (2 bzw. 8 Elektronen)."], ["Elektronendonato   // ---------------------------------------------------------------- Stationscodes (Wiedereinstieg ohne gespeicherten Fortschritt)
  // Optional (META codes). C.CODES [{si, code}] aus build.py (src/codes.py): Code am Ende jeder Station. Zusätzlich ist die Lösung jedes Codeschlosses

  // Eingabe auf der Startseite. Wiederhergestellte Übungen: [MAXP, 0, 3] (volle Punkte, Status 3 = per Code; zählt nicht als

  // Was ein Code bewirkt: mark = Übungen, die als erledigt gelten; del = gespeicherte Einträge hinter dem Zwischenstand (nur chronologisch)
  function cpPlan(cp) {

    var na = !!NA[cp.si], pre = na ? preOf(cp.si, {}) : null;

    var del = { ex: [], px: [], mg: [] };
    if (!zi) {

      PXLIST.forEach(function (e) { if (S.px[e.id] && (e.si > cp.si || (e.si === cp.si && up > -1))) del.px.push(e.id); });

    var nodes = {}; cm.nodes.forEach(function (n) { nodes[n.id] = n; });

    s += '<defs><marker id="ah-' + ex.id + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="' + DK + '"/></marker></defs>';

    var BW = 150, BH = 40;
    function nw(n) { return n.w || BW; }

      function edge(n, sx, sy) { var tx = Math.abs(sx) > 0 ? (nw(n) / 2 + 4) / Math.abs(sx) : 1e9, ty = Math.abs(sy) > 0 ? (nh(n) / 2 + 4) / Math.abs(sy) : 1e9; var t = Math.min(tx, ty); return [n.x + sx * t, n.y + sy * t]; }

      if (e.t) {

        if (Math.abs(dy) < 1) { s += '<text x="' + mx + '" y="' + (my - 9) + '" text-anchor="middle" font-size="14" font-style="italic" fill="' + DK + '" font-family="' + FONT + '">' + svgRich(e.t, 14) + "</text>"; return; }
        s += '<rect x="' + (mx - tl * 3.6 - 6) + '" y="' + (my - 11) + '" width="' + (tl * 7.2 + 12) + '" height="22" rx="8" fill="' + K.cmlab + '"/><text x="' + mx + '" y="' + (my + 5) + '" text-anchor="middle" font-size="14" font-style="italic" fill="' + DK + '" font-family="' + FONT + '">' + svgRich(e.t, 14) + "</text>";

      ls.forEach(function (t, k) { s += '<text x="' + n.x + '" y="' + (n.y + 5 + (k - (ls.length - 1) / 2) * 17) + '" text-anchor="middle" font-size="15" font-weight="700" fill="' + DK + '" font-family="' + FONT + '">' + svgRich(t, 15) + "</text>"; });
    });

    return {
      check: function () {
        var empty = 0, wrong = 0;
        sels.forEach(function (s) { s.classList.remove("good", "bad"); var v = selVal(s); if (!v) { empty++; return; } if (same(v, s._n.sol)) s.classList.add("good"); else { s.classList.add("bad"); wrong++; } });

      lock: function () { sels.forEach(function (s) { s.disabled = true; }); },
      fill: function (ok) { sels.forEach(function (s, k) { selSet(s, ok ? s._n.sol : sels[(k + 1) % sels.length]._n.sol); }); }
    };

    var GROW = "#F2A65A", GROW_D = "#B8661F", MEDC = "#F6EFC9";
    function tubeSvgB(state, k, animate) {

    function drawRack(animate) {

    function drawProt() {

    // ------------------------------------------------ Fertigungsstraße (gleiche Geometrie wie die Abbildung der Beschriftungsübung)
    var W = 208 * n + 106, H = 300, yBelt = 222;
    function xs(i) { return 52 + 208 * i; }
    function xm(k) { return 156 + 208 * (k - 1); }
    var SC = ["#C9B48A", "#97BC62", "#E8B931", "#D9782D", "#B98ACB", "#7FB7B0"];
    function scol(i) { return SC[i % SC.length]; }
    function T(x, y, s, fs, fill, wt, anchor) { return '<text x="' + x + '" y="' + y + '" text-anchor="' + (anchor || "middle") + '" font-family="' + KF + '" font-size="' + fs + '" font-weight="' + (wt || 400) + '" fill="' + (fill || "#22301F") + '">' + esc(uni(s)) + "</text>"; }   // SVG: Formeln als Unicode (NH₃), kein HTML
    function gear(cx, cy, r, col) {
      var s = "";
      for (var a = 0; a < 8; a++) { var t = a * Math.PI / 4; s += '<rect x="' + (cx - 3) + '" y="' + (cy - r - 4) + '" width="6" height="8" rx="1" fill="' + col + '" transform="rotate(' + (a * 45) + " " + cx + " " + cy + ')"/>'; }
      return s + '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + col + '"/><circle cx="' + cx + '" cy="' + cy + '" r="' + (r * 0.4) + '" fill="#fff"/>';
    }
    function drawBand(animate) {
      var s = STR[cur], show = !!diag[cur], b = show ? s.block : -1;
      var o = '<svg class="fig bandfig" viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H + '" role="img" xmlns="' + SVGNS + '"><title>Fertigungsstraße der Arginin-Herstellung</title>';
      o += '<rect width="' + W + '" height="' + H + '" rx="12" fill="#F4F1E8"/>';
      // Nährmedium oben links
      o += '<path d="M12,112 q4,-10 14,-10 h52 q10,0 14,10 v40 q0,8 -8,8 h-64 q-8,0 -8,-8 z" fill="#E8D9B0" stroke="#A8935F" stroke-width="2"/>' + T(52, 136, LBL.medium, 12, "#5C4521", 700);
      o += '<line x1="52" y1="162" x2="52" y2="176" stroke="#A8935F" stroke-width="2" stroke-dasharray="4 3"/>';
      // Gene (Baupläne) und Maschinen (Enzyme)
      for (var k = 1; k <= n; k++) {
        var x = xm(k), bad = show && k === b, idle = show && b > 0 && k > b;
        o += '<rect x="' + (x - 48) + '" y="10" width="96" height="54" rx="6" fill="#F5EEDC" stroke="' + (bad ? "#B42318" : "#A8935F") + '" stroke-width="' + (bad ? 3 : 2) + '"/>';
        o += '<path d="M' + (x - 34) + ',22 q8,8 16,0 t16,0 t16,0 t16,0" fill="none" stroke="#2C5F2D" stroke-width="2"/><path d="M' + (x - 34) + ',30 q8,-8 16,0 t16,0 t16,0 t16,0" fill="none" stroke="#97BC62" stroke-width="2"/>';
        o += T(x, 54, ex.genes[k - 1], 15, "#22301F", 700);
        if (bad) o += '<g>' + T(x + 52, 30, LBL.gene, 12.5, "#B42318", 700, "start") + "</g>";

        var fill = bad ? "#FDECEA" : idle ? "#EDEEE8" : "#EEF5E6", st = bad ? "#B42318" : idle ? "#A9B1A3" : "#2C5F2D";
        o += '<rect x="' + (x - 46) + '" y="112" width="92" height="66" rx="10" fill="' + fill + '" stroke="' + st + '" stroke-width="2.4"/>';
        o += gear(x - 22, 136, 10, bad ? "#E7A9A2" : idle ? "#C5CBC0" : "#97BC62");
        o += '<rect x="' + (x - 2) + '" y="126" width="38" height="20" rx="4" fill="#fff" stroke="' + st + '" stroke-width="1.4"/>';
        o += T(x, 168, ex.enzymes[k - 1], 14.5, bad ? "#B42318" : "#22301F", 700);
        if (bad) o += '<path d="M' + (x + 4) + ",128 l26,16 M" + (x + 30) + ",128 l-26,16" + '" stroke="#B42318" stroke-width="3.5" stroke-linecap="round"/>';
        if (idle) o += T(x + 17, 141, LBL.idle, 10.5, "#5B6A55", 700);
        o += '<rect class="bdhit" data-k="' + k + '" x="' + (x - 50) + '" y="8" width="100" height="174" rx="10" fill="transparent"/>';
        o += T(x, 262, "Schritt " + k, 12.5, "#5B6A55", 700);

      for (var r = 20; r < W - 12; r += 26) o += '<circle cx="' + r + '" cy="' + (yBelt + 8) + '" r="4" fill="#8E9AA3"/>';
      for (var c = 40; c < W - 20; c += 52) o += '<path d="M' + c + "," + (yBelt + 4) + " l6,4 l-6,4" + '" fill="none" stroke="#C9D1D6" stroke-width="1.6"/>';
      // Stoffe auf dem Band
      for (var i = 0; i <= n; i++) {
        var gone = show && b > 0 && i >= b;
        o += '<rect x="' + (xs(i) - 42) + '" y="186" width="84" height="30" rx="6" fill="' + (gone ? "#F1F1EC" : "#fff") + '" stroke="' + (gone ? "#A9B1A3" : scol(i)) + '" stroke-width="3"' + (gone ? ' stroke-dasharray="5 4"' : "") + "/>";
        o += T(xs(i), 206, SF[i], 14, gone ? "#5B6A55" : "#22301F", 700);
        if (gone && i === n) o += T(xs(i), 262, SF[i] + " " + LBL.missing, 12.5, "#B42318", 700);
      }
      // Anzeige Vermehrung (oben rechts)
      var gx = xs(n);
      o += '<rect x="' + (gx - 48) + '" y="10" width="96" height="86" rx="10" fill="#fff" stroke="#C9DDB4" stroke-width="2"/>';
      var colony = '<ellipse cx="' + gx + '" cy="44" rx="30" ry="12" fill="#F6EFC9" stroke="#7C8FA6" stroke-width="1.6"/>';
      var yes = colony + '<path d="M' + (gx - 22) + ',44 q5,-12 11,-3 q5,-11 11,-1 q5,-10 10,1 q4,-6 8,3 q-20,10 -40,0z" fill="' + GROW + '" stroke="' + GROW_D + '" stroke-width="1.2"/>' + T(gx, 80, LBL.yes, 13, "#1E7B4F", 700);
      var no = colony + T(gx, 80, LBL.no, 13, "#B42318", 700);
      var ask = colony + T(gx, 49, "?", 18, "#8A9A80", 700) + T(gx, 80, LBL.ask, 13, "#5B6A55", 700);
      // Stofffluss (nur nach richtiger Diagnose), SMIL: Bild wird bei jedem Zeichnen neu erzeugt -> Animation startet neu
      var flow = "", tEnd = 0;
      if (show) {
        var y = yBelt + 8, seg = 0.45, NTOK = 4;

          var last = b > 0 ? b - 1 : n;
          for (var q = 1; q <= last; q++) { pts.push(xm(q)); cols.push(scol(q)); pts.push(xs(q)); cols.push(scol(q)); }

          else { pts.push(xs(n) + 30); cols.push(scol(n)); }

          var kt = pts.map(function (p, j) { return (j / (pts.length - 1)).toFixed(3); }).join(";");

            '<set attributeName="opacity" to="1" begin="' + beg.toFixed(2) + 's"/>' +
            '<animate attributeName="cx" values="' + pts.join(";") + '" keyTimes="' + kt + '" dur="' + dur.toFixed(2) + 's" begin="' + beg.toFixed(2) + 's" fill="freeze"/>' +
            '<animate attributeName="fill" values="' + cols.join(";") + '" keyTimes="' + kt + '" calcMode="discrete" dur="' + dur.toFixed(2) + 's" begin="' + beg.toFixed(2) + 's" fill="freeze"/>' +
            (b > 0 ? "" : '<set attributeName="opacity" to="0" begin="' + (beg + dur).toFixed(2) + 's"/>') + "</circle>";
          else if (b > 0) flow += '<circle cx="' + pts[pts.length - 1] + '" cy="' + y + '" r="8" fill="' + cols[cols.length - 1] + '" stroke="#fff" stroke-width="1.5"/>';
        }
        if (b > 0) {
          flow += '<g opacity="' + (animate ? 0 : 1) + '">' + T(xm(b) - 82, yBelt + 34, SF[b - 1] + " " + LBL.stau, 12.5, "#A9541A", 700) + (animate ? '<set attributeName="opacity" to="1" begin="' + tEnd.toFixed(2) + 's"/>' : "") + "</g>";
          // Zusatz hinter der Unterbrechung: fällt auf das Band und läuft bis zum Ende
          var t2 = tEnd + 0.6, p2 = [xs(b)], c2 = [scol(b)];
          for (var q2 = b + 1; q2 <= n; q2++) { p2.push(xm(q2)); c2.push(scol(q2)); p2.push(xs(q2)); c2.push(scol(q2)); }
          p2.push(xs(n) + 30); c2.push(scol(n));
          var d2 = Math.max(0.6, seg * (p2.length - 1)), kt2 = p2.map(function (p, j) { return (j / (p2.length - 1)).toFixed(3); }).join(";");
          flow += '<g opacity="' + (animate ? 0 : 1) + '">' + T(xs(b), 170 - 0, LBL.add + ": " + SF[b], 12.5, "#1E7B4F", 700) + '<line x1="' + xs(b) + '" y1="174" x2="' + xs(b) + '" y2="184" stroke="#1E7B4F" stroke-width="2"/>' + (animate ? '<set attributeName="opacity" to="1" begin="' + (t2 - 0.4).toFixed(2) + 's"/>' : "") + "</g>";
          if (animate) {

              '<animate attributeName="cy" values="150;' + y + '" dur="0.5s" begin="' + t2.toFixed(2) + 's" fill="freeze"/>' +
              '<set attributeName="opacity" to="1" begin="' + t2.toFixed(2) + 's"/>' +
              '<animate attributeName="cx" values="' + p2.join(";") + '" keyTimes="' + kt2 + '" dur="' + d2.toFixed(2) + 's" begin="' + (t2 + 0.5).toFixed(2) + 's" fill="freeze"/>' +
              '<animate attributeName="fill" values="' + c2.join(";") + '" keyTimes="' + kt2 + '" calcMode="discrete" dur="' + d2.toFixed(2) + 's" begin="' + (t2 + 0.5).toFixed(2) + 's" fill="freeze"/>' +
              '<set attributeName="opacity" to="0" begin="' + (t2 + 0.5 + d2).toFixed(2) + 's"/></circle>';
          }
          var tY = t2 + 0.5 + d2;
          o += animate ? '<g>' + no + '<set attributeName="opacity" to="0" begin="' + tY.toFixed(2) + 's"/></g><g opacity="0">' + yes + T(gx, 93, LBL.withAdd, 11, "#1E7B4F", 700) + '<set attributeName="opacity" to="1" begin="' + tY.toFixed(2) + 's"/></g>'
                       : "<g>" + yes + T(gx, 93, LBL.withAdd, 11, "#1E7B4F", 700) + "</g>";
        } else {
          o += animate ? '<g>' + ask + '<set attributeName="opacity" to="0" begin="' + tEnd.toFixed(2) + 's"/></g><g opacity="0">' + yes + '<set attributeName="opacity" to="1" begin="' + tEnd.toFixed(2) + 's"/></g>' : yes;
        }
      } else o += ask;
      o += flow + "</svg>";
      stage.innerHTML = o;
      sizeFig(stage.querySelector("svg"));
      setTimeout(function () { if (stage.scrollWidth > stage.clientWidth + 2) stage.classList.add("scroll"); }, 0);
      stage.querySelectorAll(".bdhit").forEach(function (r) { r.addEventListener("click", function () { diagnose(+r.dataset.k); }); });
    }

    // ------------------------------------------------ Ablauf
    function select(i) {
      cur = i;
      tabs.querySelectorAll(".bdtab").forEach(function (b) { b.classList.toggle("sel", +b.dataset.i === i); b.classList.toggle("done", !!diag[+b.dataset.i]); });
      drawRack(false); drawProt(); drawBand(false);
      noneB.disabled = lk || !!diag[cur];
    }
    function culture() {
      if (lk || cult[cur]) return;
      cult[cur] = true; FX.click();
      drawRack(true); drawProt();
    }
    function diagnose(k) {
      if (lk || done || diag[cur]) return;
      var s = STR[cur];
      if (!cult[cur]) { ctl.fb("no", FB.needCult); return; }
      if (k === s.block) {
        diag[cur] = true; FX.ok();
        var o = { strain: s.label, Dat: s.dat || ("Bei " + s.label), enzym: k ? ex.enzymes[k - 1] : "", von: k ? SF[k - 1] : "", nach: k ? SF[k] : "", end: SF[n] };
        select(cur); drawBand(true);
        if (STR.every(function (x, i) { return diag[i]; })) { done = true; ctl.award((k ? sub(FB.okStep, o) + " " : "") + (ex.doneMsg || FB.done)); }
        else ctl.fb("ok", k ? "Richtig. " + sub(FB.okStep, o) : sub(FB.okNone, o));
        return;
      }
      // Fehldiagnose: Begründung aus dem Versuchsprotokoll
      var msg, mname = minIdx > -1 ? MED[minIdx].label : SF[0];
      if (k === 0) msg = sub(FB.noneWrong, { medium: mname });
      else if (k < s.block) msg = sub(FB.early, { enzym: ex.enzymes[k - 1], stoff: SF[k] });
      else msg = s.block === 0 ? sub(FB.lateMin, { enzym: ex.enzymes[k - 1], medium: mname }) : sub(FB.late, { enzym: ex.enzymes[k - 1], stoff: SF[s.block] });
      FX.no(); ctl.fb("no", msg);
      var key = cur + ":" + k;
      if (!tried[key]) { tried[key] = 1; ctl.miss(); }
    }
    select(0);
    return {
      auto: true, delay: 2600,
      check: function () { return null; },
      showSolution: function () { STR.forEach(function (s, i) { cult[i] = true; diag[i] = true; }); select(STR.length - 1); },
      lock: function () { lk = true; goB.disabled = true; noneB.disabled = true; },
      stepWrong: function () { culture(); var s = STR[cur]; diagnose(s.block === 0 ? 1 : 0); return document.querySelector("#ex-" + ex.id + " .exfb").className; },
      playAll: function () { STR.forEach(function (s, i) { if (diag[i]) return; select(i); goB.click(); var h = s.block ? stage.querySelector('.bdhit[data-k="' + s.block + '"]') : null; if (h) h.dispatchEvent(new MouseEvent("click", { bubbles: true })); else noneB.click(); }); },
      fill: function () { }
    };
  };
  TYPES.band.ownFig = true;

  // ---------------------------------------------------------------- Stellpult (Typ pult; zuerst in Bio 1.8 Genregulation als „Mischpult“)
  // Bausteine auf Stellen einer Abbildung setzen, dann starten: Ein Pegel zeigt die Wirkung nach einem einfachen Modell,
  // jeder Durchlauf muss einen Auftrag erfüllen. Der Pegel erscheint erst nach dem Start (keine Live-Vorschau, erst überlegen).
  // Beispiele: Transkriptionsfaktoren an Enhancer und Silencer, Enzym mit Aktivator und Hemmstoff, Stellgrößen eines Gleichgewichts.
  // ex.fig = Grundbild (ownFig); ex.sites[] = {id, x, y, r, kind (passender Baustein), label, on (Abbildungsschlüssel der Ebene, gleiche Größe wie fig)};
  // ex.pieces[] = {kind, label, n (Vorrat), icon (Abbildungsschlüssel), no (Rückmeldung an falscher Stelle)};
  // ex.model = {base, max, need [kinds: fehlt einer → Pegel 0], add {kind: Stufen}, min (kleinster Pegel, wenn need erfüllt; Standard 1)};
  // ex.levels[] = Namen der Pegelstufen 0 … max; ex.orders[] = {text, level, count {kind: Anzahl} (optional, genau), sol {siteId: kind}, fb};
  // ex.labels {play, clear, order, of, meter, wait, hint, replay, empty, noFit, result, miss} – Wortlaut passend zum Spielrahmen;
  // optional ex.doneMsg, ex.solAfter. Falsche Stelle und nicht erfüllter Auftrag = Fehlgriff (10/6/3).
  TYPES.pult = function (body, ex, ctl) {
    ctl.setCheck(false);
    var LBL = Object.assign({ play: "▶ Starten", clear: "Alle Bausteine lösen", order: "Auftrag", of: "von", meter: "Pegel",
      wait: "– noch nicht gestartet –", hint: "Baustein antippen, dann eine Stelle im Bild antippen (am PC auch ziehen). Einen gesetzten Baustein antippen, um ihn wieder zu lösen.",
      replay: "Durchläufe neu abspielen", empty: "Vorrat leer", noFit: "Dieser Baustein passt hier nicht.", result: "Ergebnis:", miss: "Das passt noch nicht zum Auftrag." },
      fwort("pult", {}), ex.labels || {});
    var M = ex.model, NL = M.max, SITES = ex.sites, PIECES = ex.pieces, ORD = ex.orders;
    var occ = {}, cur = 0, lk = false, done = false, tried = {}, timer = null;
    var P = picker();
    var head = el("div", "plorder"); body.appendChild(head);
    body.appendChild(el("p", "note", LBL.hint));
    var pool = el("div", "pool plpool"); body.appendChild(pool);
    var fw = el("div", "figwrap plfig"); fw.innerHTML = figSvg(ex.fig); body.appendChild(fw);
    body.appendChild(el("div", "swipe", "↔ Abbildung seitlich wischen"));
    var sv = fw.querySelector("svg"); sizeFig(sv);
    setTimeout(function () { if (fw.scrollWidth > fw.clientWidth + 2) fw.classList.add("scroll"); }, 0);
    var layers = {}, hits = {};
    SITES.forEach(function (s) {
      var gl = document.createElementNS(SVGNS, "g"); gl.setAttribute("class", "pllayer"); gl.style.display = "none";
      gl.innerHTML = figSvg(s.on); sv.appendChild(gl); layers[s.id] = gl;
    });
    SITES.forEach(function (s) {
      var h = document.createElementNS(SVGNS, "circle");
      h.setAttribute("cx", s.x); h.setAttribute("cy", s.y); h.setAttribute("r", s.r || 26); h.setAttribute("class", "plhit");
      h.setAttribute("tabindex", "0"); h.setAttribute("role", "button"); h.setAttribute("aria-label", strip(s.label || s.id));
      sv.appendChild(h); hits[s.id] = h;
      h.addEventListener("click", function (e) { e.stopPropagation(); if (lk) return; if (P.sel) put(P.sel.dataset.kind, s); else if (occ[s.id]) release(s.id); });
      h.addEventListener("dragover", function (e) { e.preventDefault(); h.classList.add("hot"); });
      h.addEventListener("dragleave", function () { h.classList.remove("hot"); });
      h.addEventListener("drop", function (e) { e.preventDefault(); h.classList.remove("hot"); if (P.sel && !lk) put(P.sel.dataset.kind, s); });
      h.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); h.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
    });
    var chips = {};
    shuffle(PIECES, ex.id).forEach(function (p) {
      var ch = P.chip((p.icon ? figSvg(p.icon) : "") + "<span>" + p.label + '</span><b class="plnum"></b>', "p-" + p.kind);
      ch.dataset.kind = p.kind; chips[p.kind] = ch; pool.appendChild(ch);
    });
    var panel = el("div", "plpanel"); body.appendChild(panel);
    var meter = el("div", "plmeter"); panel.appendChild(meter);
    var btns = el("div", "plbtns"); panel.appendChild(btns);
    var bPlay = el("button", "btn signal", LBL.play); bPlay.type = "button"; btns.appendChild(bPlay);
    var bClr = el("button", "btn ghost", LBL.clear); bClr.type = "button"; btns.appendChild(bClr);
    var rb = replayBar(LBL.replay, function () { demo(); }); rb.hidden = true; body.appendChild(rb);
    function piece(kind) { return PIECES.filter(function (p) { return p.kind === kind; })[0]; }
    function used(kind) { return SITES.filter(function (s) { return occ[s.id] === kind; }).length; }
    function counts() { var c = {}; PIECES.forEach(function (p) { c[p.kind] = used(p.kind); }); return c; }
    function level() {

  };

  // ---------------------------------------------------------------- Wimmelbild
  // fig: Abbildung; targets[] (id, x, y, r in Bildkoordinaten, label, fb) = gesuchte Stellen; decoys[] (x, y, r, label, fb) = Fallen,
  // die ein Fehlgriff sind. Wertung wie sonst: ohne Fehlgriff 10, mit einem 6, sonst 3 Punkte; „Lösung zeigen“ nach solAfter (3) Fehlgriffen.

    function hitDecoy(d, i) {

  TYPES.hunt.ownFig = true;

  // ---------------------------------------------------------------- Spiegel-Check (Bild und Spiegelbild am Chiralitätszentrum)

      var pills = R.querySelectorAll(".mpill");

    function build(i) {
      var it = items[i], st = { frame: "M", sub: { U: "i0", P: "i1", F: "i2", B: "i3" }, lab: { i0: it.subs.U, i1: it.subs.P, i2: it.subs.F, i3: it.subs.B }, moves: 0, solved: false, sol: false };

      s += '<defs><linearGradient id="mg' + ex.id + i + '" x1="0" x2="1"><stop offset="0" stop-color="' + K.lin1 + '"/><stop offset=".5" stop-color="' + K.hell + '"/><stop offset="1" stop-color="' + K.f19 + '"/></linearGradient></defs>';
      s += '<rect x="0" y="0" width="640" height="270" rx="14" fill="' + K.hell + '"/>';
      s += '<text x="160" y="28" text-anchor="middle" font-family="Caladea, Cambria, Georgia, serif" font-size="17" font-weight="700" fill="' + K.dk + '">Bild</text>';

      s += '<g class="mmatch" style="display:none"><rect x="250" y="112" width="140" height="42" rx="21" fill="#1E7B4F" stroke="#fff" stroke-width="3"/><text x="320" y="139" text-anchor="middle" font-family="' + KF + '" font-size="18" font-weight="700" fill="#fff">Deckung!</text></g>';

  // ---------------------------------------------------------------- Faltungs-Werkbank (vereinfachtes HP-Gittermodell in 2D)

  TYPES.fold = function (body, ex, ctl) {

    var meter = el("div", "foldmeter"); body.appendChild(meter);

      '<button type="button" class="btn ghost" data-a="R" title="Rest der Kette um 90° im Uhrzeigersinn drehen">↻ drehen</button>' +
      '<button type="button" class="btn ghost" data-a="S" title="An diesem Baustein gerade weiterführen">⟶ gerade</button>' +
      '<span class="fsep"></span>' +
      '<button type="button" class="btn ghost" data-a="U" title="Letzten Schritt zurücknehmen">↶ Rückgängig</button>' +
      '<button type="button" class="btn ghost" data-a="B" title="Beste bisher gefundene Faltung wiederherstellen">★ Beste Faltung</button>';
    body.appendChild(tools);
    var fw = el("div", "figwrap foldw player"); fw.dataset.k = "0"; fw.tabIndex = 0; body.appendChild(fw);
    fw.setAttribute("aria-label", "Faltungs-Werkbank: Pfeiltasten links und rechts wählen einen Baustein, L und R drehen, G gerade, Z rückgängig");

    function pos(t) {

      h += '<rect width="' + W + '" height="' + H + '" rx="16" fill="#F4F8EE"/>';
      for (var gx = 0; gx <= n; gx++) for (var gy = 0; gy <= n; gy++) h += '<circle cx="' + (gx * G + G / 2) + '" cy="' + (gy * G + G / 2) + '" r="2" fill="#C9DDB4"/>';
      s.con.forEach(function (c) { h += '<line class="fcon" x1="' + X(p[c[0]]) + '" y1="' + Y(p[c[0]]) + '" x2="' + X(p[c[1]]) + '" y2="' + Y(p[c[1]]) + '"/>'; });
      for (var i = 0; i < n - 1; i++) h += '<line x1="' + X(p[i]) + '" y1="' + Y(p[i]) + '" x2="' + X(p[i + 1]) + '" y2="' + Y(p[i + 1]) + '" stroke="' + (sel > 0 && !lk && i >= sel ? "#6FA544" : "#2C5F2D") + '" stroke-width="6" stroke-linecap="round"/>';

            '<circle cx="' + X([tx, ty]) + '" cy="' + Y([tx, ty]) + '" r="13"/><circle class="hit" cx="' + X([tx, ty]) + '" cy="' + Y([tx, ty]) + '" r="19" fill="transparent"/></g>';
        });

          (inner && !lk ? '<circle cx="' + X(c) + '" cy="' + Y(c) + '" r="19" fill="transparent"/>' : "") +
          '<circle cx="' + X(c) + '" cy="' + Y(c) + '" r="14" fill="' + (seq[i] === "H" ? "#8C6A3F" : "#FFFFFF") + '" stroke="' + (bad ? "#B42318" : seq[i] === "H" ? "#4E3A20" : "#4F7A2A") + '" stroke-width="' + (bad ? 4 : 2.5) + '"/>' +
          '<text x="' + X(c) + '" y="' + (Y(c) + 5) + '" text-anchor="middle" font-size="13" font-weight="700" fill="' + (seq[i] === "H" ? "#fff" : "#2C5F2D") + '">' + (i + 1) + "</text></g>";
      });

        : "<b>Energie: " + en(E) + "</b><span>Kontakte wassermeidender Bausteine: " + s.con.length + "</span><span>Ziel: Energieminimum " + en(ex.emin) + "</span>" +
          '<span class="fbar">' + Array.apply(null, Array(-ex.emin)).map(function (x, k) { return "<i" + (k < -E ? ' class="on"' : "") + "></i>"; }).join("") + "</span>";

    function btn(a) { return tools.querySelector('[data-a="' + a + '"]'); }
    function upTools() {

      btn("L").disabled = !has || v === 1; btn("R").disabled = !has || v === -1; btn("S").disabled = !has || v === 0;

  // ---------------------------------------------------------------- Minispiele (Block t: "game")

  function gameCard(b, si) {

    var bd = c.querySelector(".bd"), body = el("div", "gbody"); bd.appendChild(body);

  // ---------------------------------------------------------------- weitere Minispiele

  // Fehlersuche: Stellen antippen, die fachlich falsch sind; richtige Stellen anzutippen ist ein Fehlgriff
  GAMES.fehler = function (body, b, finish, result) {
    var need = b.parts.filter(function (p) { return p && p.err; }).length, found, miss, over;

      found = 0; miss = 0; over = false; res.innerHTML = ""; box.innerHTML = ""; msg("", "");
      b.parts.forEach(function (p) {
        if (typeof p === "string") { box.appendChild(el("span", null, p)); return; }

  // Dominokette: Jede Karte trägt links eine Erklärung und rechts einen Begriff; an das offene Ende passt genau eine Karte

    function start() {

          if (answered) return; answered = true;
          bo.querySelectorAll("button").forEach(function (x) { x.disabled = true; });
          if (o.ok) {
            bt.classList.add("good"); hp--; queue.shift(); FX.hit();
            fig.classList.remove("hit"); void fig.offsetWidth; fig.classList.add("hit");
            fb.className = "fb ok"; fb.innerHTML = "Treffer! " + (o.fb || "");
            stage.querySelector(".hp i").style.width = Math.round(100 * hp / b.qs.length) + "%";
            tmr = setTimeout(next, o.fb ? 1500 : 900);
          } else {
            bt.classList.add("bad"); lives--; queue.push(queue.shift()); FX.no();

    function win() {

    return {
      play: function (perfect) {

      }

  };

  // ---------------------------------------------------------------- Intro-Animation (INTRO.anim)

  // ---------------------------------------------------------------- Lehrkraft-Bereich
  function sha256(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var mp = Math.pow, maxWord = mp(2, 32), res = "", words = [], bl, hash = [], k = [], pc = 0, isC = {};
    for (var cand = 2; pc < 64; cand++) { if (!isC[cand]) { for (var i = 0; i < 313; i += cand) isC[i] = cand; hash[pc] = (mp(cand, .5) * maxWord) | 0; k[pc++] = (mp(cand, 1 / 3) * maxWord) | 0; } }
    hash = hash.slice(0, 8);
    ascii = unescape(encodeURIComponent(ascii)); bl = ascii.length * 8;
    ascii += "\x80"; while (ascii.length % 64 - 56) ascii += "\x00";
    for (i = 0; i < ascii.length; i++) { var j = ascii.charCodeAt(i); words[i >> 2] |= j << ((3 - i) % 4) * 8; }
    words[words.length] = ((bl / maxWord) | 0); words[words.length] = (bl);
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), oh = hash; hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oh[i]) | 0;
    }
    for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; res += ((b < 16) ? 0 : "") + b.toString(16); }
    return res;
  }
